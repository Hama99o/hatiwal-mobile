appId: com.hatiwal.app
---
# Deleting an account, then getting it back — the full round trip.
#
# `profile.deleteAccountMessage` promises: "scheduled for deletion and hidden
# right away, then permanently deleted after 30 days. You can restore it by
# logging back in within 30 days." That promise had no test. If logging back in
# does NOT restore, the app has told the user something false about their own
# data, on the one screen where being wrong is unrecoverable.
#
# SELF-CONTAINED BY DESIGN: it signs up its own throwaway account rather than
# deleting a shared fixture. Deleting buyer@hatiwal.test would break the ~130
# flows that log in as them until someone re-seeded, which is exactly the kind of
# cross-flow damage a destructive test must not do.
#
# The email is generated per run: re-running with a fixed address would hit
# "email already taken" on the second pass and look like a signup bug.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml

- evalScript: ${output.email = 'qadelete_' + Date.now() + '@hatiwal.test'}

# ── Create the throwaway account ────────────────────────────────────────────
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Buy and sell locally in Afghanistan"
- tapOn:
    id: "register-firstname-input"
- inputText: "Delete"
- tapOn:
    id: "register-lastname-input"
- inputText: "Metest"
- tapOn:
    id: "register-phone-input"
- inputText: "0700999123"
- tapOn:
    id: "register-email-input"
- inputText: ${output.email}
- tapOn:
    id: "register-password-input"
- inputText: "Password123!"
# "Confirm Password" is the LAST field on the register form, so it is below the
# fold once the keyboard is up from the fields above it. `tapOn` does not scroll.
- scrollUntilVisible:
    element:
      id: "register-confirm-password-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "register-confirm-password-input"
- inputText: "Password123!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bazaar"
    timeout: 60000

# ── Delete it ───────────────────────────────────────────────────────────────
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Anchor on Sign Out first: it is the last control the other profile flows prove
# reachable, and "Delete account" is immediately below it.
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
    # 20s, and reached via sign-out-button just above it. The row is a plain Pressable at
    # Profile.tsx:1198 with no testID, sitting BELOW Sign Out (1174) on a profile screen
    # that is over a thousand lines tall — the flows that reach Sign Out allow 20s, this
    # one allowed 15 and failed with "Element not found: Text matching regex: Delete
    # account" on a row that exists.
    timeout: 20000
- tapOn: "Delete account"
- waitForAnimationToEnd
- assertVisible: "Delete your account?"
# The confirm button carries the same label as the row that opened the dialog,
# so target it inside the dialog rather than by text alone.
- tapOn:
    text: "Delete account"
    index: 1
- waitForAnimationToEnd

# Signed out, and told so.
- extendedWaitUntil:
    visible: "Your account has been deleted."
    timeout: 30000
- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

# ── The promise: logging back in restores it ────────────────────────────────
- tapOn: "Login"
- waitForAnimationToEnd
- tapOn:
    id: "login-email-input"
- inputText: ${output.email}
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd

# Back in, with the same account — not a fresh signup, not a dead end.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000
- assertNotVisible: "Login"
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- assertVisible: "Delete Metest"
