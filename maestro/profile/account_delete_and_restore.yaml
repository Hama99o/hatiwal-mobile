appId: com.hatiwal.app
---
# Deleting an account, then getting it back — the full round trip.
#
# `profile.deleteAccountMessage` promises: "scheduled for deletion and hidden
# right away, then permanently deleted after 30 days. You can restore it by
# logging back in within 30 days." That promise had no test. If logging back in
# does NOT restore, the app has told the user something false about their own
# data, on the one screen where being wrong is unrecoverable.
#
# SELF-CONTAINED BY DESIGN: it signs up its own throwaway account rather than
# deleting a shared fixture. Deleting buyer@hatiwal.test would break the ~130
# flows that log in as them until someone re-seeded, which is exactly the kind of
# cross-flow damage a destructive test must not do.
#
# The email is generated per run: re-running with a fixed address would hit
# "email already taken" on the second pass and look like a signup bug.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml

- evalScript: ${output.email = 'qadelete_' + Date.now() + '@hatiwal.test'}

# ── Create the throwaway account ────────────────────────────────────────────
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Buy and sell locally in Afghanistan"
- tapOn: "First Name"
- inputText: "Delete"
- tapOn: "Last Name"
- inputText: "Metest"
- tapOn: "Phone Number"
- inputText: "0700999123"
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Confirm Password"
- inputText: "Password123!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
- tapOn:
    id: "register-submit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bazaar"
    timeout: 60000

# ── Delete it ───────────────────────────────────────────────────────────────
- tapOn: "Me"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
    timeout: 15000
- tapOn: "Delete account"
- waitForAnimationToEnd
- assertVisible: "Delete your account?"
# The confirm button carries the same label as the row that opened the dialog,
# so target it inside the dialog rather than by text alone.
- tapOn:
    text: "Delete account"
    index: 1
- waitForAnimationToEnd

# Signed out, and told so.
- extendedWaitUntil:
    visible: "Your account has been deleted."
    timeout: 30000
- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

# ── The promise: logging back in restores it ────────────────────────────────
- tapOn: "Login"
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- waitForAnimationToEnd

# Back in, with the same account — not a fresh signup, not a dead end.
- extendedWaitUntil:
    visible: "Me"
    timeout: 60000
- assertNotVisible: "Login"
- tapOn: "Me"
- waitForAnimationToEnd
- assertVisible: "Delete Metest"
