appId: com.hatiwal.app
---
# Edit profile: bio over limit shows validation error, cannot save

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Edit Profile"
- waitForAnimationToEnd

- tapOn: "Bio"
- eraseText
# 501 characters — over the 500 char limit
- inputText: ""

# The PROFILE form's button is `profile.edit.saveButton` = "Save Changes".
# `common.save` ("Save") is the LISTING edit button — a different screen.
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Changes"
- waitForAnimationToEnd
- assertVisible: "Bio is too long"
