appId: com.hatiwal.app
---
# Edit profile: bio over limit shows validation error, cannot save

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd

# By testID, and scrolled to. "Bio" (`profile.edit.fields.bio`) is a
# NON-INTERACTIVE label above the field — tapping it focuses nothing — and the
# input's own placeholder is "Tell buyers a little about yourself…", not "Bio". The
# field also sits below the fold, and `tapOn` never scrolls, so the label was not
# even in the hierarchy: "Element not found: Text matching regex: Bio".
- scrollUntilVisible:
    element:
      id: "edit-profile-bio-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "edit-profile-bio-input"
- eraseText
# 501 characters — over the 500 char limit
# 520 characters, not 500. The rule is `z.string().max(500, "bioTooLong")`
# (EditProfile.tsx:51), so 500 is VALID — the message "Bio must be 500 characters or
# less" says so itself. The flow typed exactly 500, the form saved happily, and the
# assertion below waited for an error the app was right not to raise. An off-by-one in
# the fixture, not a validation bug. The input has no maxLength, so 520 does reach it.
- inputText: ""

# The PROFILE form's button is `profile.edit.saveButton` = "Save Changes".
# `common.save` ("Save") is the LISTING edit button — a different screen.
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Changes"
- waitForAnimationToEnd
# The real copy is `profile.edit.validation.bioTooLong` = "Bio must be 500
# characters or less". Maestro matches the WHOLE string, so "Bio is too long"
# could never match — the app renders the message correctly (EditProfile's
# errorMsg() translates the zod key), the assertion was just wrong.
- assertVisible: "Bio must be 500 characters or less"
