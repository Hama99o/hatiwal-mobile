appId: com.hatiwal.app
---
# Edit profile: bio over limit shows validation error, cannot save

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "Edit Profile"
- waitForAnimationToEnd

- tapOn: "Bio"
- eraseText
# 501 characters — over the 500 char limit
- inputText: ""

# The PROFILE form's button is `profile.edit.saveButton` = "Save Changes".
# `common.save` ("Save") is the LISTING edit button — a different screen.
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Save Changes"
- waitForAnimationToEnd
- assertVisible: "Bio is too long"
