appId: com.hatiwal.app
---
# Edit profile: bio over limit shows validation error, cannot save

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Edit Profile"
- waitForAnimationToEnd

- tapOn: "Bio"
- clearText
# 501 characters — over the 500 char limit
- inputText: ""

- tapOn: "Save"
- waitForAnimationToEnd
- assertVisible: "Bio is too long"
