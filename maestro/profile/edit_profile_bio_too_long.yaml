appId: com.hatiwal.app
---
# Edit profile: bio over limit shows validation error, cannot save

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "Edit Profile"
- waitForAnimationToEnd

# By testID, and scrolled to. "Bio" (`profile.edit.fields.bio`) is a
# NON-INTERACTIVE label above the field — tapping it focuses nothing — and the
# input's own placeholder is "Tell buyers a little about yourself…", not "Bio". The
# field also sits below the fold, and `tapOn` never scrolls, so the label was not
# even in the hierarchy: "Element not found: Text matching regex: Bio".
- scrollUntilVisible:
    element:
      id: "edit-profile-bio-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "edit-profile-bio-input"
- eraseText
# 501 characters — over the 500 char limit
- inputText: ""

# The PROFILE form's button is `profile.edit.saveButton` = "Save Changes".
# `common.save` ("Save") is the LISTING edit button — a different screen.
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Changes"
- waitForAnimationToEnd
# The real copy is `profile.edit.validation.bioTooLong` = "Bio must be 500
# characters or less". Maestro matches the WHOLE string, so "Bio is too long"
# could never match — the app renders the message correctly (EditProfile's
# errorMsg() translates the zod key), the assertion was just wrong.
- assertVisible: "Bio must be 500 characters or less"
