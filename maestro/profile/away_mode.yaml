appId: com.hatiwal.app  # was com.hatiwal.mobile — no such package; the flow died in 5s
---
# Away Mode — Seller sets / clears away_until from Edit Profile
# Happy path: toggle on + set date → save → AwayBanner appears on seller profile

- launchApp
- runFlow:
    file: ../_helpers/login.yaml

# Navigate to Edit Profile
# NOT `tapOn: "Profile"`: the profile TAB is labelled t("sidebar.profile") -> "Me"
# (and "Login" for a guest). `profile.title` = "Profile" is a dead key, rendered
# nowhere. The testID is stable across both locale and auth state.
- tapOn:
    id: "profile-tab"
- tapOn: "Edit Profile"

# ── Toggle Away Mode ON ───────────────────────────────────────────────
# `scrollTo` is not a Maestro command — the selector form is
# `scrollUntilVisible` with an `element:` wrapper.
- scrollUntilVisible:
    element:
      text: "I'm away (temporarily unavailable)"
    direction: DOWN
    timeout: 15000
- tapOn: "I'm away (temporarily unavailable)"

# Away until date field appears
- assertVisible: "Away until (YYYY-MM-DD)"
# By testID. "Away until (YYYY-MM-DD)" is `profile.away.untilLabel` — the LABEL
# above the field, not the field, so tapping it focuses nothing and the inputText
# that follows goes nowhere. The input's own placeholder is just "YYYY-MM-DD".
- scrollUntilVisible:
    element:
      id: "edit-profile-away-until-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "edit-profile-away-until-input"
- inputText: "2030-12-31"

# Save
- tapOn: "Save Changes"
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 15000

# ── Verify AwayBanner appears on public profile ───────────────────────
# Navigate to own profile, then to public profile via a listing
# The buyer feed tab is labelled "Bazaar" (sidebar.browse). Maestro text
# matching is an anchored regex, so "Browse" never matched it.
- tapOn:
    id: "browse-tab"
# Find a listing from current user and open it to see seller card
# (In a real flow, we'd navigate to a known seller's listing)
# Verify Away banner on seller public profile screen
# NOT `tapOn: "Profile"`: the profile TAB is labelled t("sidebar.profile") -> "Me"
# (and "Login" for a guest). `profile.title` = "Profile" is a dead key, rendered
# nowhere. The testID is stable across both locale and auth state.
- tapOn:
    id: "profile-tab"
# The rendered string is `profile.away.toggle` = "I'm away (temporarily
# unavailable)"; "I'm away" alone is `seller.away.toggleLabel`, a dead key. This
# assertion passed for the wrong reason — a dead string is trivially absent — so
# it proved nothing about the banner. Maestro matches the FULL string, hence .*
- assertNotVisible: "I'm away.*"

# ── Toggle Away Mode OFF (clear) ─────────────────────────────────────
- tapOn: "Edit Profile"
# `scrollTo` is not a Maestro command — the selector form is
# `scrollUntilVisible` with an `element:` wrapper.
- scrollUntilVisible:
    element:
      text: "I'm away (temporarily unavailable)"
    direction: DOWN
    timeout: 15000
- tapOn: "I'm away (temporarily unavailable)"

# Confirm the date field disappears
- assertNotVisible: "Away until (YYYY-MM-DD)"

- tapOn: "Save Changes"
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 15000
