appId: com.hatiwal.app  # was com.hatiwal.mobile — no such package; the flow died in 5s
---
# Away Mode — Seller sets / clears away_until from Edit Profile
# Happy path: toggle on + set date → save → AwayBanner appears on seller profile

- launchApp
- runFlow:
    file: ../_helpers/login.yaml

# Navigate to Edit Profile
# NOT `tapOn: "Profile"`: the profile TAB is labelled t("sidebar.profile") -> "Me"
# (and "Login" for a guest). `profile.title` = "Profile" is a dead key, rendered
# nowhere. The testID is stable across both locale and auth state.
- tapOn:
    id: "profile-tab"
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
# UP, and no centerElement. `profile-edit-button` sits in the PERSONAL INFO
# header row near the TOP of Profile, so:
#   - `direction: DOWN` scrolls AWAY from it whenever Profile is parked below it
#     (Profile retains its scroll offset across visits within a session), and
#   - `centerElement: true` demands the scroll bring it to the MIDDLE, which is
#     impossible for an element that near the top: there is not enough content
#     above it to push it down. Maestro then burns the full timeout and fails on
#     an element that is plainly on screen. Same trap documented at length in
#     mapqa/_body_form.yaml, which cost the Pashto cells three iterations.
# It is why this step was ORDER-DEPENDENT: edit_profile and
# edit_profile_validation passed while edit_profile_all_fields and
# edit_profile_province failed on the byte-identical block.
# UP is correct from any starting offset, and 40 percent accepts the partially
# visible row.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: UP
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "profile-edit-button"

# ── Toggle Away Mode ON ───────────────────────────────────────────────
# `scrollTo` is not a Maestro command — the selector form is
# `scrollUntilVisible` with an `element:` wrapper.
#
# Tap the ROW, not the label. The label was a bare Text inside a plain View, so
# tapping it toggled nothing and the "Away until" field below — rendered only while
# the toggle is on — never appeared. EditProfile now wraps the row in a Pressable
# (edit-profile-away-row), the way ListingForm does for negotiable, so a flow and a
# thumb land on the same target. No rebuild needed: the debug APK pulls its JS
# from Metro (adb reverse 8081 -> 3008), so a .tsx change is live on next launch.
- scrollUntilVisible:
    element:
      id: "edit-profile-away-row"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "edit-profile-away-row"

# Away until date field appears
# Parentheses ESCAPED. The app really does render "Away until (YYYY-MM-DD)" — it is
# profile.away.untilLabel, telling the user the expected date format — but matching is a
# regex, where ( ) are grouping. Unescaped, the pattern asks for "Away until YYYY-MM-DD"
# with no brackets, which nothing renders. Same class as the "$450" that could never
# match: a literal that reads correctly and behaves as syntax.
- assertVisible: "Away until \\(YYYY-MM-DD\\)"
# By testID. "Away until (YYYY-MM-DD)" is `profile.away.untilLabel` — the LABEL
# above the field, not the field, so tapping it focuses nothing and the inputText
# that follows goes nowhere. The input's own placeholder is just "YYYY-MM-DD".
- scrollUntilVisible:
    element:
      id: "edit-profile-away-until-input"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "edit-profile-away-until-input"
- inputText: "2030-12-31"

# Save
- tapOn: "Save Changes"
# NOT the toast. EditProfile raises toast.success(...) and calls
# router.replace("/(main)/(tabs)/profile") in the very next statement, so the
# message renders on a screen being torn down and no amount of polling can catch
# it — edit_profile went red this way while the app was working. Saving lands us
# back on Profile, where the away banner is gated on user.isAway && user.awayUntil
# (Profile.tsx:753). That is the stronger check: it proves the write reached the
# API and came back, which the toast never did.
- extendedWaitUntil:
    visible: "You're marked away until .*"
    timeout: 20000

# ── Verify AwayBanner appears on public profile ───────────────────────
# Navigate to own profile, then to public profile via a listing
# The buyer feed tab is labelled "Bazaar" (sidebar.browse). Maestro text
# matching is an anchored regex, so "Browse" never matched it.
- tapOn:
    id: "browse-tab"
# Find a listing from current user and open it to see seller card
# (In a real flow, we'd navigate to a known seller's listing)
# Verify Away banner on seller public profile screen
# NOT `tapOn: "Profile"`: the profile TAB is labelled t("sidebar.profile") -> "Me"
# (and "Login" for a guest). `profile.title` = "Profile" is a dead key, rendered
# nowhere. The testID is stable across both locale and auth state.
- tapOn:
    id: "profile-tab"
# The rendered string is `profile.away.toggle` = "I'm away (temporarily
# unavailable)"; "I'm away" alone is `seller.away.toggleLabel`, a dead key. This
# assertion passed for the wrong reason — a dead string is trivially absent — so
# it proved nothing about the banner. Maestro matches the FULL string, hence .*
- assertNotVisible: "I'm away.*"

# ── Toggle Away Mode OFF (clear) ─────────────────────────────────────
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
# UP + partial visibility, for the reason spelled out at the first
# occurrence of this block above: this button is too near the top of
# Profile for centerElement to ever satisfy, and DOWN scrolls away
# from it.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: UP
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
# `scrollTo` is not a Maestro command — the selector form is
# `scrollUntilVisible` with an `element:` wrapper.
#
# Tap the ROW, not the label. The label was a bare Text inside a plain View, so
# tapping it toggled nothing and the "Away until" field below — rendered only while
# the toggle is on — never appeared. EditProfile now wraps the row in a Pressable
# (edit-profile-away-row), the way ListingForm does for negotiable, so a flow and a
# thumb land on the same target. No rebuild needed: the debug APK pulls its JS
# from Metro (adb reverse 8081 -> 3008), so a .tsx change is live on next launch.
- scrollUntilVisible:
    element:
      id: "edit-profile-away-row"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "edit-profile-away-row"

# Confirm the date field disappears
- assertNotVisible: "Away until \\(YYYY-MM-DD\\)"

- tapOn: "Save Changes"
# Same reason as the first save: assert the durable consequence, not the toast.
# Away is OFF now, so the banner must be GONE from the profile we land back on.
- extendedWaitUntil:
    notVisible: "You're marked away until .*"
    timeout: 20000
