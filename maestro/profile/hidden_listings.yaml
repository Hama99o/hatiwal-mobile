appId: com.hatiwal.app
---
# Hidden Listings management — E2E flow (TASK-H528)
# Covers:
#   1. Happy path: navigate from Profile > Activity > Hidden Listings
#   2. Screen renders with header "Hidden Listings"
#   3. Empty state renders when nothing has been hidden
#
# Prerequisites: logged in as buyer@hatiwal.test (no hidden listings by default).

- runFlow: ../_helpers/login.yaml

# Navigate to the Profile tab
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# scrollUntilVisible, not a bare `- scroll`: one gesture is a guess, and the
# Activity section sits well down a long profile screen — the row was never brought
# into view, so the tap failed with "Element not found: Hidden Listings" against a
# row that exists. By testID too, since the label is translated.
- scrollUntilVisible:
    element:
      id: "profile-row-hidden-listings"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-row-hidden-listings"
- waitForAnimationToEnd

# ── Screen renders ───────────────────────────────────────────────────────────
- assertVisible: "Hidden Listings"

# ── Empty state ──────────────────────────────────────────────────────────────
- assertVisible: "No hidden listings"

# Navigate back to Profile
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

---
appId: com.hatiwal.app
---
# Hidden Listings — hide from Browse, then restore from the management screen.
# End-to-end round trip across the two surfaces the feature touches.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Hide the first card from Browse
- longPressOn:
    index: 0
    id: "listing-card"
- waitForAnimationToEnd
- tapOn: "Not interested"
- waitForAnimationToEnd
- assertVisible: "Undo"

# Navigate to the Hidden Listings management screen
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "profile-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "profile-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Same as above — the row needs scrolling to, not one blind gesture.
- scrollUntilVisible:
    element:
      id: "profile-row-hidden-listings"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-row-hidden-listings"
- waitForAnimationToEnd
- assertVisible: "Hidden Listings"

# The hidden listing should now appear here with a Restore action
- assertVisible: "Restore"

# Restore it
- tapOn: "Restore"
- waitForAnimationToEnd
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
# `.*` on BOTH sides. Maestro anchors the regex at both ends, so a trailing `.*`
# alone only matches when the asserted text is a PREFIX of the real copy — and
# this text sits in the MIDDLE of it. My first pass at these appended one `.*`
# to all of them, which fixed the prefixes and left these three unmatchable.
- assertVisible: ".*restored.*"

# Go back to Browse — the listing is visible again
- tapOn:
    id: "back_button"
- waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
