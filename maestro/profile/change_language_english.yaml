appId: com.hatiwal.app
---
# Switch back to English from an RTL language — LTR layout restored

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- runFlow: ../_helpers/open_language_picker.yaml
# Only when English is ALREADY active: switch to Pashto first, so that tapping
# English below is a real change. Since e57f35a tapping the active language does
# nothing (no overlay, no restart), and a flow that always did both switches ran
# past the rig's 600s cap (run-605, rig_fail — both switches had worked). When
# the app is in another language this costs one restart instead of two.
- runFlow:
    when:
      visible:
        id: "language-option-en"
        selected: true
    commands:
      - tapOn:
          id: "language-option-ps"
      - waitForAnimationToEnd
      - runFlow: ../_helpers/await_language_restart.yaml
      - runFlow: ../_helpers/goto_profile_tab.yaml
      - runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
- runFlow: ../_helpers/await_language_restart.yaml
# The language switch flips direction and RELOADS the app (applyLanguageFromUser ->
# forceRTL -> reloadApp), so it comes back on the Bazaar feed. The assertions below are
# profile rows, so return there explicitly — waiting for `browse-tab`, as the helper does,
# only proves the app is back, not which screen is showing.
- runFlow: ../_helpers/goto_profile_tab.yaml
# Layout is LTR again
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"
- assertVisible: "Bazaar"
