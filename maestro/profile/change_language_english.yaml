appId: com.hatiwal.app
---
# Switch back to English from an RTL language — LTR layout restored

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# First switch to Pashto
- scrollUntilVisible:
    element:
      text: "Language"
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*پښتو.*"
- waitForAnimationToEnd
# Now switch back to English — text may be in Pashto but English option exists
- scrollUntilVisible:
    element:
      text: "English"
    optional: true
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*(English|انګلیسي|انگلیسی).*"
- waitForAnimationToEnd
# Layout is LTR again
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"
- assertVisible: "Bazaar"
