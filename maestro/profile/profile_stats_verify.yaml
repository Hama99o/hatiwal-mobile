appId: com.hatiwal.app
---
# Profile stats: listings count, joined date visible on own profile

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# SCROLL TO IT — it is below the fold on a 360dp Profile screen, not missing.
# Verified present: profile.json:58 has "activeListings": "Active Listings".
# The stats block renders below the fold, so the assertion fired against a screen
# that had it, just not on view.
# NORMALISE TO THE TOP FIRST, THEN COME DOWN. Guarded, so an already-visible
# target costs nothing.
#
# The note above is right that the stats sit UNDER the avatar/mode blocks — but
# that only tells you which way to scroll if you know where the screen already is,
# and you do not. Profile KEEPS ITS SCROLL POSITION between flows (the tab
# navigator leaves it mounted and the app is not restarted), so this flow can
# arrive anywhere the previous one left it.
#
# run-560 arrived at the BOTTOM: the hierarchy is ACTIVITY, Recently Viewed,
# Hidden Listings, PRIVACY, Blocked Users, My Reports, Privacy Policy, Sign Out,
# Delete account. "Active Listings" was ABOVE all of it, so scrolling DOWN walked
# away from the target and spent the full 20s budget reaching the end of the page.
#
# Same arrival problem view_profile hit on this same screen, and the same fix:
# scroll UP to a known TOP anchor first — `Switch to .*` is the mode toggle, which
# renders above the stats — and only then scroll DOWN to the target. That works
# from either end.
- runFlow:
    when:
      notVisible: "Active Listings"
    commands:
      - scrollUntilVisible:
          element:
            text: "Switch to .*"
          direction: UP
          timeout: 20000
          optional: true
      - scrollUntilVisible:
          element:
            text: "Active Listings"
          direction: DOWN
          timeout: 20000
          centerElement: false
      - waitForAnimationToEnd
# Stats section visible
# The stat label is "Active Listings", not a bare "Listings".
- assertVisible: "Active Listings"
- assertVisible: "Joined"

# Member since includes year
# NOT "2024". Two independent reasons that literal could never match:
#   1. member_since is created_at.strftime("%B %Y") (user_serializer.rb) — one
#      node reading "August 2026", so an anchored full-string match on the bare
#      year fails even in the right year.
#   2. It is a hardcoded year in a flow meant to run for years. The seed creates
#      users at seed time, so the year is always "now", never a fixed value.
# Matching the SHAPE instead. Character class, not \d, so it stays valid YAML.
- assertVisible: ".*20[0-9][0-9].*"

# Listings count is a non-negative number (assert section label is there)
# The stat label is "Active Listings", not a bare "Listings".
- assertVisible: "Active Listings"
