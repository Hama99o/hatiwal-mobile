appId: com.hatiwal.app
---
# Recently Viewed — open from Profile, verify list renders and empty state

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/skip_onboarding.yaml
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"

# Navigate to Profile tab
# NOT `tapOn: "Profile"`: the profile TAB is labelled t("sidebar.profile") -> "Me"
# (and "Login" for a guest). `profile.title` = "Profile" is a dead key, rendered
# nowhere. The testID is stable across both locale and auth state.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Scroll down to find the "Recently Viewed" row in the Activity section
- scrollUntilVisible:
    element: "Recently Viewed"
    direction: DOWN
- tapOn: "Recently Viewed"
- waitForAnimationToEnd

# Verify the screen title is shown in the native header
- assertVisible: "Recently Viewed"

# Verify the list renders (may show empty state if no views yet)
# The screen shows either a list of listings or the empty state
- waitForAnimationToEnd

# If empty state is shown, verify browse CTA inline (no runFlow needed)
- runFlow:
    when:
      visible: "Nothing viewed yet"
    commands:
      - assertVisible: "Browse Listings"

# Go back to Profile
- back
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"
