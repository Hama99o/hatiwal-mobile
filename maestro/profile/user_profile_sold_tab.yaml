appId: com.hatiwal.app
---
# Seller public profile — Active/Sold tab showcase
# Tests: happy path, tab switching, sold empty state, RTL label check

- runFlow: ../_helpers/login.yaml

# Navigate to a public seller profile (tap a listing, then tap seller name)
# The buyer feed tab is labelled "Bazaar" (sidebar.browse). Maestro text
# matching is an anchored regex, so "Browse" never matched it.
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Tap the seller identity row to open their public profile
# The seller row sits below the photo, the price, the description and the views
# chart, so it is off-screen on arrival — and `tapOn` does not scroll to reach
# its target. None of the ten flows that tap this had a scroll; on a tablet the
# hero alone takes 60% of the viewport, which makes it certain.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    # `seller-name` / `seller-identity` do not exist. The seller row on the listing
    # detail screen carries testID="seller-profile-link" (ListingDetail.tsx), which
    # is what the other seven flows already use.
    id: "seller-profile-link"
- waitForAnimationToEnd

# ── Active tab (default) ─────────────────────────────────────────────────────
- assertVisible: "Active"
- assertVisible: "Sold"

# Active tab should be selected by default
- assertVisible:
    text: "Active"

# ── Switch to Sold tab ───────────────────────────────────────────────────────
- tapOn: "Sold"
- waitForAnimationToEnd

# Should show either a sold listing card or the empty state
# Maestro has no `visible()` in its JS sandbox. This was
# `assertTrue: condition: ${visible(a) || visible(b)}` and died with
# "JsEvaluationException: TypeError: undefined is not a function" — which the .log
# never shows; only the .xml carries it, so the flow read as an unexplained fail.
# The comment above claiming this was the documented way to branch was wrong for
# 2.7.0. Text matching is an anchored regex, so plain alternation does the same
# job natively: either alternative has to match the whole node text.
- assertVisible: "No sold items yet|Old Phone"

# ── Switch back to Active tab ─────────────────────────────────────────────────
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Search listings..."
