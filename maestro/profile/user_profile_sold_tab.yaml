appId: com.hatiwal.app
---
# Seller public profile — Active/Sold tab showcase
# Tests: happy path, tab switching, sold empty state, RTL label check

- runFlow: ../_helpers/login.yaml

# Navigate to a public seller profile (tap a listing, then tap seller name)
# The buyer feed tab is labelled "Bazaar" (sidebar.browse). Maestro text
# matching is an anchored regex, so "Browse" never matched it.
- tapOn: "Bazaar"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Tap the seller identity row to open their public profile
- tapOn:
    id: "seller-identity"
- waitForAnimationToEnd

# ── Active tab (default) ─────────────────────────────────────────────────────
- assertVisible: "Active"
- assertVisible: "Sold"

# Active tab should be selected by default
- assertVisible:
    text: "Active"

# ── Switch to Sold tab ───────────────────────────────────────────────────────
- tapOn: "Sold"
- waitForAnimationToEnd

# Should show either a sold listing card or the empty state
- assertTrue:
    condition: ${visible("No sold items yet") || visible("Old Phone")}

# ── Switch back to Active tab ─────────────────────────────────────────────────
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Search listings..."
