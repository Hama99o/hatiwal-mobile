appId: com.hatiwal.app
---
# TASK-TX02 — Sold/Bought trust stats on the public seller profile.
#
# CI seed guarantee: db/seeds/e2e.rb attaches a `sold` Transaction between
# seller@hatiwal.test (seller) and buyer@hatiwal.test (buyer) on the seeded
# "Xiaomi Redmi Note 11 128GB" sold listing — so seller.sold_count >= 1 and
# the combined trust badge is guaranteed non-empty in every Maestro run.
# seller.bought_count is 0 (seller has no purchase history), so the badge
# shows the "sold" half only — no dangling "0 bought".
#
# Review fix: the stats-row "Items Sold" cell was REMOVED — it duplicated
# the exact same number already shown by the trust badge below it. The
# stats row now shows only Active Listings + Joined.
#
# Review fix (E2E MAJOR — this flow could never pass against the live
# screen): navigate via the seller's own listing card + the UserIdentity
# "seller-profile-link" testID, mirroring
# maestro/browse/seller_response_rate_badge.yaml — "Contact Seller"/"Seller"
# text taps never open a listing or the profile at all. Assert the badge via
# its own stable testID (not localized copy), and drop the "Active Listings"
# text assert — that string is the LOADING/ERROR header only; the loaded
# header shows the seller's own name instead.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the seller's listing, then their public profile via the seller card —
# the seller card leads to the SAME aggregate seller profile regardless of
# which listing you came from.
- tapOn:
    index: 0
    id: "listing-card"
- waitForAnimationToEnd
# The seller row sits below the photo, the price, the description and the views
# chart, so it is off-screen on arrival — and `tapOn` does not scroll to reach
# its target. None of the ten flows that tap this had a scroll; on a tablet the
# hero alone takes 60% of the viewport, which makes it certain.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-profile-link"
- waitForAnimationToEnd

# Seller profile page opens
- assertVisible: "Active Listings"
- assertVisible: "Joined"
- assertNotVisible: "Items Sold"

# The combined trust badge — locale-independent testID (asserting on the
# rendered "N sold" copy would break the moment the label runs through ps/fa).
- assertVisible:
    id: "transaction-stats-badge"

# Back to listing detail
- back
- waitForAnimationToEnd
- assertVisible: "Contact Seller"
