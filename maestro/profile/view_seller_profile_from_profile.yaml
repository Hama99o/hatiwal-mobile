appId: com.hatiwal.app
---
# User's own profile page — verify stats, quick actions, listings section

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"
# Profile header shows name and avatar
- assertVisible: "Ahmad Karimi"
# Stats row
- assertVisible: "Saved Items"
# Quick actions
- assertVisible: "Saved Items"
- assertVisible: "Browse Listings"
# Tap My Listings shortcut (this is a profile quick action link, not the tab)
- tapOn: "My Shop"
- waitForAnimationToEnd
# Back to profile
- back
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"
