appId: com.hatiwal.app
---
# Switch to Pashto — RTL layout, Pashto strings visible

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Language"
# Profile renders `profile.language` = "Language". Nothing in the app uppercases
# section titles, so "LANGUAGE" matched nothing.
#
# SCROLL TO "Language" ITSELF, NOT TO "Appearance" (fixed 2026-09-06, run-503).
# `profile.theme` = "Appearance" renders at Profile.tsx:847, ABOVE
# `profile.language` = "Language" at Profile.tsx:924. scrollUntilVisible stops
# the moment its target appears, so scrolling to "Appearance" parked the list
# with Language still below the fold and the assert underneath could never pass
# — it failed on a clean rig with api_errors=0 while change_language_dari and
# change_language_english passed in the same pass. Dari always scrolled to
# "Language" directly; this flow was the odd one out.
- assertVisible: "Language"
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
# App now in Pashto/RTL — check label that exists in ps locale
# The switch RESTARTS the app (forceRTL + reloadApp) and it comes back on its
# INITIAL route — the Bazaar feed, not Profile where the switch was made. So the
# language NAME, which only exists on the Profile language row, is not on screen
# at all: polling for it just burned the flow's whole budget (8m9s) before failing.
#
# Assert the locale-specific TAB label instead. It is in the tab bar wherever the
# app lands, and it changes with the locale — which is the thing being proved.
# `sidebar.profile` is "Me" / "زه" (ps) / "من" (fa), so it also distinguishes
# Pashto from Dari, which "بازار" (identical in both) would not.
- extendedWaitUntil:
    visible: "زه"
    timeout: 40000
# Bazaar tab still navigable (Pashto tab label is "بازار")
- tapOn:
    text: "بازار"
    optional: true
- waitForAnimationToEnd
