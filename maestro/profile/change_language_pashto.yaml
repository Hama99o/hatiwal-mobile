appId: com.hatiwal.app
---
# Switch to Pashto — RTL layout, Pashto strings visible

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Appearance"
# Profile renders `profile.language` = "Language". Nothing in the app uppercases
# section titles, so "LANGUAGE" matched nothing.
- assertVisible: "Language"
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*پښتو.*"
- waitForAnimationToEnd
# App now in Pashto/RTL — check label that exists in ps locale
- assertVisible: "پښتو"
# Bazaar tab still navigable (Pashto tab label is "بازار")
- tapOn:
    text: "بازار"
    optional: true
- waitForAnimationToEnd
