appId: com.hatiwal.app
---
# Profile screen — error state: first load with empty cache under airplane mode
# triggers isError correctly in TanStack Query v5 (cached data would keep
# status:'success' on refetch failure — so we must fail the very first fetch).
#
# retry:1 is configured in app/_layout.tsx — TQ retries once before settling to
# error, so we use retryTimes/waitForAnimationToEnd to let the retry complete.

- runFlow: ../_helpers/login.yaml

# Enable airplane mode BEFORE opening Profile so the cache is cold.
# The first fetch will fail (with one TQ retry), then isError becomes true.
- setAirplaneMode: enabled
- waitForAnimationToEnd

# Open Profile — first fetch attempts, retries once (retry:1), then fails
- tapOn: "Me"
# Allow extra time for the retry + exponential backoff to complete
- waitForAnimationToEnd
- waitForAnimationToEnd

# Error state must be visible — errorTitle and errorDescription from common.json
- assertVisible: "Something went wrong"
- assertVisible: "We couldn't load the data. Check your connection and try again."
- assertVisible: "Retry"

# Re-enable network and tap Retry — should refetch and return to happy path
- setAirplaneMode: disabled
- waitForAnimationToEnd
- tapOn: "Retry"
- waitForAnimationToEnd

# Happy path restored after retry
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"
