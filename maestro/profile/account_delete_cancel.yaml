appId: com.hatiwal.app
---
# Deleting an account — the CANCEL path.
#
# Account deletion had ZERO e2e coverage (`grep -c deactivate maestro/` was 0)
# despite being the most destructive action in the app: `authAPI.deleteAccount()`
# schedules the account for permanent deletion and signs the user out. An
# untested confirm dialog on an irreversible action is the worst possible place
# to have no test.
#
# This is the safe half — it must NOT delete anything — so it can run against the
# shared buyer account. The destructive half lives in
# account_delete_and_restore.yaml, which creates its own throwaway account.

- runFlow: ../_helpers/login.yaml

- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# The control sits at the very bottom of Profile, below sign-out — which is
# exactly why `centerElement: true` could never work here and has now cost eight
# runs. Maestro scrolls until the element is CENTRED, and an element at the END of
# a scroll container cannot be centred: there is nothing below it to scroll past,
# so the constraint is unsatisfiable and the scroll burns its whole timeout on a
# control that is already on screen. run-529's end-of-flow screenshot shows
# "Delete account" plainly visible, centred horizontally, above the tab bar.
#
# Commit 66c3093 names this: "a field near the end of a form cannot be centred,
# which is how CENTERELEM findings are manufactured."
#
# The three Sign Out flows are the control group and keep their centerElement:
# auth/logout, auth/logout_cancel and auth/login_deep are 4/4 each, because
# "Sign Out" has "Delete account" BELOW it and so can be centred. Only the last
# element in the container is affected, so this is a one-flow change.
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
    timeout: 15000
- tapOn: "Delete account"
- waitForAnimationToEnd

# The dialog must state what actually happens — this is a 30-day soft delete
# with a restore window, not an instant wipe, and a user agreeing to the wrong
# thing is the failure mode a confirm dialog exists to prevent.
- assertVisible: "Delete your account?"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
# `.*` on BOTH sides. Maestro anchors the regex at both ends, so a trailing `.*`
# alone only matches when the asserted text is a PREFIX of the real copy — and
# this text sits in the MIDDLE of it. My first pass at these appended one `.*`
# to all of them, which fixed the prefixes and left these three unmatchable.
- assertVisible: ".*restore it by logging back in.*"

# Back out.
- tapOn: "Cancel"
- waitForAnimationToEnd

# Still signed in, still on Profile, nothing happened. "Me" present AND "Login"
# absent is the same signed-in proof the login helper uses — asserting "Me"
# alone would pass for a guest.
- assertVisible:
    id: "profile-tab"
- assertNotVisible: "Login"
- assertNotVisible: "Your account has been deleted."
