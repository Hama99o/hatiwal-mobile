appId: com.hatiwal.app
---
# Edit profile — change first name, save, verify updated on profile screen

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Tap Edit (in Personal Info section)
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
# DOWN, and no centerElement.
#
# The defect here was ONLY `centerElement: true`, never the direction. Profile
# renders hero -> stats grid -> quick actions -> PERSONAL INFO card, so from
# the cold start every flow gets (login.yaml does stopApp + launchApp) this
# button is BELOW the fold and DOWN is correct. Flipping it to UP made the
# scroll travel away from the target and produced `No visible element found:
# id: profile-edit-button` — a worse failure than the one it replaced.
#
#   - `centerElement: true` demands the scroll bring it to the MIDDLE, which is
#     impossible for an element that near the top: there is not enough content
#     above it to push it down. Maestro then burns the full timeout and fails on
#     an element that is plainly on screen. Same trap documented at length in
#     mapqa/_body_form.yaml, which cost the Pashto cells three iterations.
# It is why this step was ORDER-DEPENDENT: edit_profile and
# edit_profile_validation passed while edit_profile_all_fields and
# edit_profile_province failed on the byte-identical block.
# 40 percent accepts the partially visible row, which is what the impossible
# centring was really failing on.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
# By testID: "Edit" is `common.edit`, translated, and the profile screen also
# carries "Edit Profile" on the AVATAR — which opens the photo picker rather than
# navigating. This id is the one control that goes to the edit screen.
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- assertVisible: "Edit Profile"
# Change first name
- tapOn:
    id: "edit-profile-firstname-input"
- eraseText
- inputText: "Ahmad Updated"
# Save
- tapOn:
    id: "edit-profile-save-button"
- waitForAnimationToEnd
# NOT the toast, even with polling. EditProfile.tsx:267 raises it and then replaces the
# screen in the next statement —
#     toast.success(t("profile.edit.saved"));
#     router.replace("/(main)/(tabs)/profile")
# — so the message is on a dying screen and extendedWaitUntil has nothing to find. The
# comment above the replace says "after a short delay so the toast is visible"; there is
# no delay in the code. delete_listing failed the same way for the same reason.
#
# The durable consequence is asserted immediately below, and it is the stronger check
# anyway: we land back on the profile with the new name showing.
# Back on Profile — name updated
# The profile renders "firstname lastname" as ONE Text, so after changing only the
# first name the node reads "Ahmad Updated Karimi" — and Maestro anchors the whole
# string, so the bare first name could never match. The save itself was always
# fine: `PUT /users/me` returned 200 with firstname "Ahmad Updated".
- assertVisible: "Ahmad Updated .*"
