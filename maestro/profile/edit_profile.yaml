appId: com.hatiwal.app
---
# Edit profile — change first name, save, verify updated on profile screen

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Tap Edit (in Personal Info section)
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Profile"
# Change first name
- tapOn: "First Name"
- eraseText
- inputText: "Ahmad Updated"
# Save
- tapOn: "Save Changes"
- waitForAnimationToEnd
# Success toast
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 15000
# Back on Profile — name updated
- assertVisible: "Ahmad Updated"
