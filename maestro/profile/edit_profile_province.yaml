appId: com.hatiwal.app
---
# LOCATION IS DERIVED FROM THE PIN — there is no city input and no province picker.
#
# Owner, 2026-09-02: "in user edit input should be removed for province and
# address, we should only select the map so it will be good, because we can have
# one address and a different province, so fix this logic".
#
# His screenshot showed why: the City field read "Qarabagh, Kabul Province,
# Afghanistan" while the province picker below it said "پروان" (Parwan). Two
# independently editable sources for one fact, with nothing reconciling them — and
# in an app whose premise is meeting nearby, a province that disagrees with the
# coordinates is worse than no province at all.
#
# This flow replaces the one that drove that picker. What is worth asserting now:
#   1. neither manual control exists any more
#   2. confirming a pin fills BOTH city and province, read-only
#   3. the derived values survive a save and a reload
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# DOWN, and no centerElement — the edit button sits below the fold (Profile
# renders hero -> stats -> quick actions -> personal info) and centring a control
# with too little content above it can never satisfy.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
# Settle wait — EditProfile dismisses the keyboard on drag, and the keyboard
# sliding out reflows the form while it goes (see contact_visibility / run-438).
- waitForAnimationToEnd
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "edit-profile-firstname-input"
    timeout: 30000

# ── 1. the manual controls are gone ────────────────────────────────────────
- assertNotVisible:
    id: "edit-profile-city-input"
- assertNotVisible:
    id: "edit-profile-province-picker"

# ── 2. the pin fills both ──────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "edit-profile-location-row"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
# Settle wait — EditProfile dismisses the keyboard on drag, and the keyboard
# sliding out reflows the form while it goes (see contact_visibility / run-438).
- waitForAnimationToEnd
- tapOn:
    id: "edit-profile-location-row"
- extendedWaitUntil:
    visible:
      id: "location-confirm"
    timeout: 60000
- assertVisible:
    id: "map-canvas"
# MapLibre paints geometry first and SDF text a beat later, so one settle can
# return in the gap between the two.
- waitForAnimationToEnd:
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    id: "location-confirm"
- waitForAnimationToEnd

# Both derived rows must now be present. They are read-only Text, not inputs —
# a disabled input looks editable and invites a tap that does nothing.
- extendedWaitUntil:
    visible:
      id: "edit-profile-derived-province"
    timeout: 20000
# SCROLL to the city line rather than asserting it is already on screen.
#
# Both derived lines render in the same block, but at 360dp the viewport is only
# ~400dp tall and the second line falls below the fold — this failed with
# `Assertion is false: id: edit-profile-derived-city is visible` while the
# province line directly above it was found. Not an app defect: the value is
# rendered, it is simply one line further down a short screen.
- scrollUntilVisible:
    element:
      id: "edit-profile-derived-city"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- takeScreenshot: edit_profile_province-derived

# ── 3. they survive a save + reload ────────────────────────────────────────
# BY testID. This screen's button reads "Save Changes"
# (profile.edit.saveButton), and Maestro's text match is anchored — so `text:
# "Save"` never matches it. It also swaps to "Saving…" mid-submit, so the text is
# not a stable handle even in English. Found at 360dp, but it would have failed at
# any width; the small-screen run simply got there first.
- scrollUntilVisible:
    element:
      id: "edit-profile-save-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
# Settle wait — EditProfile dismisses the keyboard on drag, and the keyboard
# sliding out reflows the form while it goes (see contact_visibility / run-438).
- waitForAnimationToEnd
- tapOn:
    id: "edit-profile-save-button"
- waitForAnimationToEnd
- launchApp:
    stopApp: true
- runFlow: ../_helpers/open_bundle.yaml
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 120000
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
# Settle wait — EditProfile dismisses the keyboard on drag, and the keyboard
# sliding out reflows the form while it goes (see contact_visibility / run-438).
- waitForAnimationToEnd
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "edit-profile-derived-province"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "edit-profile-derived-city"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
