appId: com.hatiwal.app
---
# The profile's PROVINCE field — edge cases for a plain optional text input.
#
# This replaces edit_profile_province_picker_deep.yaml, which drove a picker sheet
# that does not exist. `ProvincePickerSheet.tsx` is imported by nothing (recorded
# as UI-030), and EditProfile renders province as an ordinary TextInput whose
# placeholder is the word "Province" — which is why `tapOn: "Province"` appeared to
# work and then the expected list of Kabul/Kandahar never came.
#
# What is actually worth testing here, given `province: z.string().optional()`:
#   - a typed value persists across a save and a reload
#   - clearing it is allowed (it is optional, so empty must not block saving)
#   - a long value is accepted rather than silently truncated or rejected

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Edit Profile"
    direction: DOWN
    timeout: 20000
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd

# ── A typed province persists ────────────────────────────────────────────────
# By testID, not the placeholder. "Province" is `profile.edit.fields.province`,
# so the text selector only worked while the app happened to be in English.
# Province is a PICKER now, not a free-text field (UI-041): typed provinces
# arrived as "Kabul"/"kabul"/typos and nothing could filter by them. Tap the row,
# search, take the first match.
- scrollUntilVisible:
    element:
      id: "edit-profile-province-picker"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "edit-profile-province-picker"
- waitForAnimationToEnd
- tapOn:
    id: "province-search-input"
- inputText: "Kandahar"
- waitForAnimationToEnd
- tapOn:
    id: "province-option"
    index: 0
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 20000

# Reopen and confirm it was stored, not just echoed in the form.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Edit Profile"
    direction: DOWN
    timeout: 20000
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Kandahar"
    direction: DOWN
    timeout: 20000

# ── Clearing it is allowed — the field is optional ───────────────────────────
# A required-field error here would be a real bug: nothing in the schema demands
# a province, and a seller who moves should be able to remove it.
- tapOn: "Kandahar"
- eraseText
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 20000
