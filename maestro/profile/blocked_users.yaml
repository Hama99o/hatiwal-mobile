appId: com.hatiwal.app
---
# Blocked Users management — E2E flow
# Covers:
#   1. Happy path: navigate from Profile > Privacy > Blocked Users
#   2. Screen renders with header "Blocked Users"
#   3. Empty state renders when no users are blocked
#   4. Unblock action: tap Unblock (by testID), confirm dialog appears, confirm unblocks user
#
# Prerequisites: logged in as buyer@hatiwal.test (no blocked users by default).

- runFlow: ../_helpers/login.yaml

# Navigate to Profile tab
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"

# Scroll down to Privacy section
- scroll

# Tap "Blocked Users" row
# "Blocked Users" (profile.blockedUsers) is a SETTINGS ROW far down the profile
# screen — below the stats, quick actions and the mode toggle — and `tapOn` never
# scrolls to its target. It failed with "Element not found: Text matching regex:
# Blocked Users" on a row that is simply below the fold.
- scrollUntilVisible:
    element:
      text: "Blocked Users"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Blocked Users"
- waitForAnimationToEnd

# ── Screen renders ──────────────────────────────────────────────────────────────
# The screen header should say "Blocked Users"
- assertVisible: "Blocked Users"

# ── Empty state ─────────────────────────────────────────────────────────────────
# When no one has been blocked the empty state should be visible
- assertVisible: "No blocked users"

# Navigate back to Profile — BackButton renders testID="back_button"
- tapOn:
    id: "back_button"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
# Scroll UP first. The mode toggle sits just under the avatar at the TOP of
# Profile, and by this point the screen is scrolled down — either because this
# flow scrolled to the Appearance card, or because returning from a pushed screen
# restores the position it left. The hierarchy at failure showed Profile rendered
# correctly from "Messages" down to "PRIVACY", with the toggle simply off the top.
- scrollUntilVisible:
    element:
      text: "Switch to .*"
    direction: UP
    timeout: 20000
- assertVisible: "Switch to .*"

---
# Blocked Users — unblock flow (requires a blocked user to exist)
# This section is run separately against a test account that has a blocked user.
# Prerequisites: the blocked user must have id=1 in the test database so
# testID="unblock_button_1" is present on the row.

appId: com.hatiwal.app
---
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scroll
# "Blocked Users" (profile.blockedUsers) is a SETTINGS ROW far down the profile
# screen — below the stats, quick actions and the mode toggle — and `tapOn` never
# scrolls to its target. It failed with "Element not found: Text matching regex:
# Blocked Users" on a row that is simply below the fold.
- scrollUntilVisible:
    element:
      text: "Blocked Users"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Blocked Users"
- waitForAnimationToEnd

# Confirm the blocked user's row is visible by its testID (avoids fragile text matching)
- assertVisible:
    id: "unblock_button_1"

# Tap the row-level Unblock button by its testID so the tap is unambiguous even
# when the row label text ("Unblock") also appears on the screen.
- tapOn:
    id: "unblock_button_1"
- waitForAnimationToEnd

# Assert the confirmAlert dialog is visible
- assertVisible: "Unblock user?"

# Tap the dialog's confirm button using its unique label "Yes, unblock".
# This text is distinct from the row button label ("Unblock") so Maestro's
# substring match cannot accidentally hit the row button or the dialog title.
- tapOn:
    text: "Yes, unblock"
- waitForAnimationToEnd

# Success toast should appear
# Transient toast, kept optional. There is no "Block User" action on the Blocked
# Users management screen, so the durable proof here is the row leaving the
# list — which the steps below already assert.
  # lint: optional-ok — a toast, and it may have faded before this step
  # runs. The durable check follows: the flow waits on the state the
  # unblock actually produced, which cannot race.
- assertVisible:
    text: "User unblocked"
    optional: true
