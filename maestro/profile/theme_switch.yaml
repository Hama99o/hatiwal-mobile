appId: com.hatiwal.app
---
# Profile — switch between light, dark, and system theme

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- assertVisible: "Appearance"
# Switch to Dark theme
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Dark"
    direction: DOWN
    timeout: 20000
- tapOn: "Dark"
- waitForAnimationToEnd
# Switch to Light theme
- tapOn: "Light"
- waitForAnimationToEnd
# Switch back to System
- tapOn: "System"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"
