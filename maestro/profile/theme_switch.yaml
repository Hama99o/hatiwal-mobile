appId: com.hatiwal.app
---
# Profile — switch between light, dark, and system theme

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
# "Appearance" (profile.theme) sits in the Preferences card near the BOTTOM of the
# profile screen — below the stats, the quick actions, the pending-reviews nudge
# and PERSONAL INFO — so asserting it on arrival fails on a screen that is
# perfectly correct. The scroll below is the stronger proof anyway: it lands on a
# control INSIDE that card.
# Switch to Dark theme
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "theme-option-dark"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd
# SCROLL TO IT — it is below the fold on a 360dp Profile screen, not missing.
# Verified present: Profile.tsx:872 renders testID={`theme-option-${value}`}, so
# `theme-option-light` is a real id — run-493 reported it "not found" because the
# Appearance row sits under the avatar and mode blocks.
# Guarded, so an already-visible target costs nothing. DOWN, because the Profile
# screen puts this section under the avatar / mode / appearance blocks.
- runFlow:
    when:
      notVisible:
        id: "theme-option-light"
    commands:
      - scrollUntilVisible:
          element:
            id: "theme-option-light"
          direction: DOWN
          timeout: 20000
          centerElement: false
      - waitForAnimationToEnd
# Switch to Light theme
- tapOn:
    id: "theme-option-light"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd
# Switch back to System
# Scroll first. The Appearance card is near the BOTTOM of Profile — below the
# stats, quick actions, pending-reviews nudge and PERSONAL INFO — and `tapOn`
# never scrolls. These reset taps at the end of a flow LACKED the scroll their
# opening tap had, and browse_dark failed on `Element not found:
# theme-option-system` for exactly that reason.
- scrollUntilVisible:
    element:
      id: "theme-option-system"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "theme-option-system"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
# Scroll UP first. The mode toggle sits just under the avatar at the TOP of
# Profile, and by this point the screen is scrolled down — either because this
# flow scrolled to the Appearance card, or because returning from a pushed screen
# restores the position it left. The hierarchy at failure showed Profile rendered
# correctly from "Messages" down to "PRIVACY", with the toggle simply off the top.
- scrollUntilVisible:
    element:
      text: "Switch to .*"
    direction: UP
    timeout: 20000
- assertVisible: "Switch to .*"
