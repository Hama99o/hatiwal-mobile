appId: com.hatiwal.app
---
# Language persists: switch to Pashto, navigate all tabs, Pashto strings everywhere

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "Language"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd

# Bazaar tab — English label "Bazaar" must NOT appear (Pashto shows "بازار")
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- assertNotVisible: "Bazaar"

# Saved tab
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertNotVisible: "Saved"

# Chats tab — English label "Chats" must NOT appear (Pashto shows "چټونه")
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertNotVisible: "Chats"

# Profile tab — English label "Me" must NOT appear (Pashto shows "زه")
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- assertNotVisible: "Me"

# Background + reopen → still Pashto
- launchApp:
    clearState: false
- waitForAnimationToEnd
- assertNotVisible: "Bazaar"

# Reset to English
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "ژبه"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
