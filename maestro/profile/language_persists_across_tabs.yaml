appId: com.hatiwal.app
---
# Language persists: switch to Pashto, navigate all tabs, Pashto strings everywhere

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# NOT a bare `tapOn: "Language"`: that row is in the Preferences card near the
# bottom of Profile and `tapOn` never scrolls, so it failed with `Element not
# found: Language` on a screen that renders it perfectly. The helper scrolls to
# the row and expands the collapsed option list, and it is idempotent — safe when
# a later step opens the picker again.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd

# Bazaar tab — English label "Bazaar" must NOT appear (Pashto shows "بازار")
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- assertNotVisible: "Bazaar"

# Saved tab
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertNotVisible: "Saved"

# Chats tab — English label "Chats" must NOT appear (Pashto shows "چټونه")
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertNotVisible: "Chats"

# Profile tab — English label "Me" must NOT appear (Pashto shows "زه")
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- assertNotVisible: "Me"

# Background + reopen → still Pashto
- launchApp:
    clearState: false
# Wait for the tab bar, not just for animations. A warm relaunch remounts the tree
# and re-bootstraps auth; `waitForAnimationToEnd` returns well before that, so a
# tab tap fires into a screen still coming up and silently does nothing.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000
- waitForAnimationToEnd
- assertNotVisible: "Bazaar"

# Reset to English
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "ژبه"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
