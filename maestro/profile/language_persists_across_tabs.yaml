appId: com.hatiwal.app
---
# Language persists: switch to Pashto, navigate all tabs, Pashto strings everywhere

- runFlow: ../_helpers/login.yaml
- tapOn: "Profile"
- waitForAnimationToEnd
- tapOn: "Language"
- waitForAnimationToEnd
- tapOn: "پښتو"
- waitForAnimationToEnd

# Browse tab
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- assertNotVisible: "Browse"

# Saved tab
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertNotVisible: "Saved"

# Chat tab
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertNotVisible: "Chats"

# Profile tab
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- assertNotVisible: "Profile"

# Background + reopen → still Pashto
- launchApp:
    clearState: false
- waitForAnimationToEnd
- assertNotVisible: "Browse"

# Reset to English
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "ژبه"
- waitForAnimationToEnd
- tapOn: "English"
- waitForAnimationToEnd
