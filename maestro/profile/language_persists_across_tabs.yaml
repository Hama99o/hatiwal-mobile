appId: com.hatiwal.app
---
# Language persists: switch to Pashto, navigate all tabs, Pashto strings everywhere

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Language"
- waitForAnimationToEnd
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*پښتو.*"
- waitForAnimationToEnd

# Bazaar tab — English label "Bazaar" must NOT appear (Pashto shows "بازار")
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- assertNotVisible: "Bazaar"

# Saved tab
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertNotVisible: "Saved"

# Chats tab — English label "Chats" must NOT appear (Pashto shows "چټونه")
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertNotVisible: "Chats"

# Profile tab — English label "Me" must NOT appear (Pashto shows "زه")
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- assertNotVisible: "Me"

# Background + reopen → still Pashto
- launchApp:
    clearState: false
- waitForAnimationToEnd
- assertNotVisible: "Bazaar"

# Reset to English
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "ژبه"
- waitForAnimationToEnd
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*(English|انګلیسي|انگلیسی).*"
- waitForAnimationToEnd
