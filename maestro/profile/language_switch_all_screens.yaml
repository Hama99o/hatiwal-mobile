appId: com.hatiwal.app
---
# Language switch: EN → PS (Pashto) — key strings appear in Pashto on Bazaar + Profile

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Open language settings
# NOT a bare `tapOn: "Language"`: that row is in the Preferences card near the
# bottom of Profile and `tapOn` never scrolls, so it failed with `Element not
# found: Language` on a screen that renders it perfectly. The helper scrolls to
# the row and expands the collapsed option list, and it is idempotent — safe when
# a later step opens the picker again.
- runFlow: ../_helpers/open_language_picker.yaml
- assertVisible: "English"
- assertVisible: "پښتو"
- assertVisible: "دری"

# Switch to Pashto
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd

# Profile SCREEN HEADER in Pashto (profile.title key — unchanged)
# Switching to an RTL language flips I18nManager, and RN can only apply that with
# a JS RELOAD — applyLanguageFromUser calls reloadApp() when the direction changes.
# `waitForAnimationToEnd` does not wait for an app restart, so a bare assertVisible
# here raced the reload and failed on a screen that was about to be correct.
# Poll instead: same assertion, no timing dependency.
- extendedWaitUntil:
    visible: "پروفایل"
    timeout: 40000

# Navigate to Bazaar tab using new Pashto tab label "بازار"
- tapOn: "زه"
- waitForAnimationToEnd
# Bazaar tab label in Pashto is "بازار" — use testID to navigate
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Back to profile, switch to Dari
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn: "ژبه"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-fa"
- waitForAnimationToEnd
# Profile SCREEN HEADER in Dari (profile.title key — unchanged)
- assertVisible: "پروفایل"

# Navigate profile tab using new Dari tab label "من"
- tapOn: "من"
- waitForAnimationToEnd
- tapOn: "زبان"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"
