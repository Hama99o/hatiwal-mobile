appId: com.hatiwal.app
---
# Edit profile: update first name, last name, bio, phone, province — all saved

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- assertVisible: "Edit Profile"

# Clear and update first name
- tapOn:
    id: "edit-profile-firstname-input"
- eraseText
- inputText: "UpdatedFirst"

# Clear and update last name
- tapOn:
    id: "edit-profile-lastname-input"
- eraseText
- inputText: "UpdatedLast"

# Clear and update bio. By testID: "Bio" is a NON-INTERACTIVE label above the
# field (the input's placeholder is "Tell buyers a little about yourself…"), and it
# sits below the fold where `tapOn` cannot reach it.
- scrollUntilVisible:
    element:
      id: "edit-profile-bio-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "edit-profile-bio-input"
- eraseText
- inputText: "I sell quality items in Kabul."

# Clear and update phone
# `auth.phone` = "Phone Number" — anchored matching needs the full label.
- tapOn:
    id: "edit-profile-phone-input"
- eraseText
- inputText: "+93700000001"

# Province is a plain TEXT INPUT whose placeholder is the word "Province" — not a
# picker. ProvincePickerSheet.tsx exists but is imported by nothing (UI-030), so
# the sheet this flow used to wait for never opened.
# Province is a PICKER now, not a free-text field (UI-041): typed provinces
# arrived as "Kabul"/"kabul"/typos and nothing could filter by them. Tap the row,
# search, take the first match.
- scrollUntilVisible:
    element:
      id: "edit-profile-province-picker"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "edit-profile-province-picker"
- waitForAnimationToEnd
# The sheet did not open and the flow failed on "Element not found: province-search-input"
# — the testID is there (ProvincePickerSheet.tsx:111), so the TAP was lost. This flow
# types into several fields first, and scrollUntilVisible stops as soon as its target is
# in the hierarchy, which can still be behind the keyboard: Maestro then reports the tap
# completed while the touch lands on the IME.
#
# Retry once rather than dismiss the keyboard — hideKeyboard is Back on this pushed screen
# and would leave EditProfile entirely (send_message_offline and price_drop_after_edit both
# lost their screen to it). A second tap, with the sheet as the gate, costs nothing when
# the first one worked.
- runFlow:
    when:
      notVisible:
        id: "province-search-input"
    commands:
      - tapOn:
          id: "edit-profile-province-picker"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "province-search-input"
    timeout: 20000
- tapOn:
    id: "province-search-input"
- inputText: "Herat"
- waitForAnimationToEnd
- tapOn:
    id: "province-option"
    index: 0
- waitForAnimationToEnd

# `profile.edit.saveButton` = "Save Changes"; a bare "Save" is anchored and
# matches nothing.
- scrollUntilVisible:
    element:
      text: "Save Changes"
    direction: DOWN
    timeout: 20000
- tapOn: "Save Changes"
- waitForAnimationToEnd
# `profile.edit.saved` = "Profile saved".
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Profile saved"
    timeout: 15000

# Verify data persisted
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- assertVisible: "UpdatedFirst"
- assertVisible: "UpdatedLast"
- assertVisible: "I sell quality items in Kabul."
- assertVisible: "+93700000001"
- assertVisible: "Kabul"
