appId: com.hatiwal.app
---
# Edit profile: update first name, last name, bio, phone, province — all saved

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
# DOWN, and no centerElement.
#
# The defect here was ONLY `centerElement: true`, never the direction. Profile
# renders hero -> stats grid -> quick actions -> PERSONAL INFO card, so from
# the cold start every flow gets (login.yaml does stopApp + launchApp) this
# button is BELOW the fold and DOWN is correct. Flipping it to UP made the
# scroll travel away from the target and produced `No visible element found:
# id: profile-edit-button` — a worse failure than the one it replaced.
#
#   - `centerElement: true` demands the scroll bring it to the MIDDLE, which is
#     impossible for an element that near the top: there is not enough content
#     above it to push it down. Maestro then burns the full timeout and fails on
#     an element that is plainly on screen. Same trap documented at length in
#     mapqa/_body_form.yaml, which cost the Pashto cells three iterations.
# It is why this step was ORDER-DEPENDENT: edit_profile and
# edit_profile_validation passed while edit_profile_all_fields and
# edit_profile_province failed on the byte-identical block.
# 40 percent accepts the partially visible row, which is what the impossible
# centring was really failing on.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- assertVisible: "Edit Profile"

# Clear and update first name
- tapOn:
    id: "edit-profile-firstname-input"
- eraseText
- inputText: "UpdatedFirst"

# Clear and update last name
# PUT THE KEYBOARD AWAY BEFORE TAPPING, even though Last Name is the very next
# field. At 360dp the IME covers about half the window, so this field sits behind
# it — and Maestro taps an element's BOUNDS, reporting COMPLETED while the touch
# lands on the keys. run-431 and run-437 both show the result: focus never left
# First Name, so the erase+input overwrote it and the screenshot has
# "UpdatedLast" in the FIRST NAME box.
#
# A `scrollUntilVisible` here did NOT work and could not have: it is a no-op when
# the target is already "visible", and Maestro's visibility ignores the IME
# entirely, so it scrolled zero pixels and the app's on-drag dismissal never
# fired. The drag has to be unconditional — see the helper.
- runFlow: ../_helpers/dismiss_keyboard_by_drag.yaml
- tapOn:
    id: "edit-profile-lastname-input"
- eraseText
- inputText: "UpdatedLast"
# NO IME DISMISSAL HERE, and specifically NOT an Enter keypress.
#
# On THIS screen Enter SUBMITS THE FORM. Proven from the run-427 timeline:
#   02:36:19  Press Enter key        (right after inputText "UpdatedLast")
#   02:36:23  PUT /api/v1/users/me   <- the save
# and the database afterwards held firstname="UpdatedFirst",
# lastname="UpdatedLast" but bio="E2E test account." — the SEEDED bio. So the
# save captured the form exactly as of the keypress, before the bio was typed.
# `saveMutation.onSuccess` then does `router.replace(...)` to Profile, so every
# later command ran against a stale hierarchy and reported COMPLETED until a
# scroll finally failed on the settled Profile screen, several steps from the
# cause. contact_visibility failed the same way at 411dp; its earlier 360dp pass
# was luck, not evidence.
#
# `hideKeyboard` is not the answer either — that is a Back press, and it popped
# this same screen once already.
#
# So the IME stays UP and the scrolls do the work: scrollUntilVisible moves the
# ScrollView regardless of the keyboard, and a visibilityPercentage that keeps
# the field clear of both edges keeps it tappable. The 360dp failure this was
# originally added for was `centerElement: true`, removed separately — that was
# the real cause, and dismissing the keyboard was never needed to fix it.
#
# An Enter keypress REMAINS CORRECT on a search field (conversations-search,
# green at both widths), where there is no form to submit. The rule is about
# FORMS, not about the key.

# Clear and update bio. By testID: "Bio" is a NON-INTERACTIVE label above the
# field (the input's placeholder is "Tell buyers a little about yourself…"), and it
# sits below the fold where `tapOn` cannot reach it.
- scrollUntilVisible:
    element:
      id: "edit-profile-bio-input"
    direction: DOWN
    # NO centerElement. It failed at 360dp exactly as flow_lint's CENTERELEM rule
    # predicts — "cannot be satisfied when the target has too little content
    # below it; fails at 360dp while passing at 411dp" — timing out after 20s
    # with `No visible element found: id: edit-profile-bio-input` on a field that
    # was rendering perfectly. Centring needs room on BOTH sides, and with the
    # keyboard covering the lower half of a 400dp window there is none below.
    #
    # 60, not the house 40: the note further down this file is right that
    # "visible" is not "tappable" — a scroll that stops the instant the field
    # enters the screen can leave it under the gesture bar, where the nav bar
    # eats the tap. 60% keeps enough of the field clear of both edges to be hit,
    # and the IME is down by now anyway.
    visibilityPercentage: 60
    timeout: 20000
# Keyboard away again — Last Name has just been typed, so the IME is back up and
# Bio is below it.
- runFlow: ../_helpers/dismiss_keyboard_by_drag.yaml
- tapOn:
    id: "edit-profile-bio-input"
- eraseText
- inputText: "I sell quality items in Kabul."

# Clear and update phone
# `auth.phone` = "Phone Number" — anchored matching needs the full label.
# SCROLL BACK UP to the phone input.
#
# This used to tap it directly, which worked while phone and bio were adjacent in
# the Contact section. They are not any more: the WhatsApp number, its "same as
# my phone" shortcut, the two visibility switches and their explanatory note now
# sit BETWEEN them (owner request, 2026-09-02), so after the scroll down to the
# bio the phone input is well above the fold and the tap failed with
# `Element not found: Id matching regex: edit-profile-phone-input`.
#
# A flow that taps without scrolling is asserting that two fields are neighbours.
# That is an assumption about layout, and layout changes.
# Keyboard away before hunting upwards: with the IME up, the drag that
# scrollUntilVisible issues starts inside the focused Bio Textarea, which
# consumes it (the failure mapqa/_body_form.yaml documents).
- runFlow: ../_helpers/dismiss_keyboard_by_drag.yaml
- scrollUntilVisible:
    element:
      id: "edit-profile-phone-input"
    direction: UP
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "edit-profile-phone-input"
- eraseText
- inputText: "+93700000001"

# Province is a plain TEXT INPUT whose placeholder is the word "Province" — not a
# picker. ProvincePickerSheet.tsx exists but is imported by nothing (UI-030), so
# the sheet this flow used to wait for never opened.
# Province is a PICKER now, not a free-text field (UI-041): typed provinces
# arrived as "Kabul"/"kabul"/typos and nothing could filter by them. Tap the row,
# search, take the first match.
# centerElement, because "visible" is not the same as "tappable". Without it the
# scroll stops the instant the row enters the screen, which left this trigger at
# bounds [87,2251][993,2366] on a 1080x2400 device — centre y~2308, inside the
# gesture/nav bar's bottom ~130px. Maestro taps the centre, the nav bar eats the
# touch, and the sheet never opens. A probe with a single clean tap and no guard at
# all sat 20s waiting for a sheet that never came, while the hierarchy showed the
# trigger present, clickable and enabled. The picker was never at fault.
# THE PROVINCE PICKER IS GONE — the pin is the only source of location now.
#
# Owner, 2026-09-02: "in user edit input should be removed for province and
# address, we should only select the map… because we can have one address and a
# different province". His screenshot had City reading "Qarabagh, Kabul Province,
# Afghanistan" next to a province of "پروان" (Parwan) — two editable sources for
# one fact, contradicting each other.
#
# City and province are now DERIVED from the confirmed pin and shown read-only,
# so there is nothing here to type into or choose from. maestro/profile/
# edit_profile_province.yaml covers the derivation.

# `profile.edit.saveButton` = "Save Changes"; a bare "Save" is anchored and
# matches nothing.
# BY testID, and no centerElement. The button is `profile.edit.saveButton`
# ("Save Changes"), it swaps to "Saving…" mid-submit, and it sits in a STICKY
# FOOTER — so there is no content below it to centre against and
# `centerElement: true` can never satisfy. Failed as
# `No visible element found: "Save Changes"` on a button pinned to the bottom
# of the screen the whole time.
- scrollUntilVisible:
    element:
      id: "edit-profile-save-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "edit-profile-save-button"
- waitForAnimationToEnd
# NOT the toast. EditProfile's onSuccess raises toast.success(...) and then calls
# router.replace("/(main)/(tabs)/profile") in the next statement (EditProfile.tsx
# 267-269), so the message renders on a screen being torn down and no amount of
# polling can catch it. That replace happens ONLY in onSuccess, so landing back on
# Profile is itself proof the save went through — and unlike the toast it is still
# true a second later.
# SCROLL, do not just wait. Returning from the save lands on Profile at its own
# scroll offset, and the edit button is below the fold from the top (hero ->
# stats -> quick actions -> personal info). An `extendedWaitUntil: visible` polls
# forever for something that will never come into view on its own — it failed
# here with `Assertion is false: id: profile-edit-button is visible` while the
# identical scroll 15 lines below succeeded.
#
# Waiting is for something that will ARRIVE. Scrolling is for something that is
# already there.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000

# Verify data persisted
# The edit-screen button by testID. `tapOn: "Edit Profile"` hit the AVATAR, whose
# accessibilityLabel is that exact string — so instead of navigating it opened the
# Android photo PICKER, which then sat over the app and poisoned every later flow
# (away_mode, edit_profile_all_fields, edit_profile_province all failed underneath
# it). Profile.tsx warns about the collision in a comment; this is the id it means.
# Partial visibility, for the reason spelled out at the first occurrence
# of this block above: centerElement can never satisfy on this button.
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "profile-edit-button"
- waitForAnimationToEnd
- assertVisible: "UpdatedFirst"
- assertVisible: "UpdatedLast"
- assertVisible: "I sell quality items in Kabul."
- assertVisible: "+93700000001"
- assertVisible: "Kabul"
