appId: com.hatiwal.app
---
# Profile screen — happy path: avatar, name, mode toggle, settings sections, sign out

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Profile tab is rendered
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
# SCROLL BACK TO THE TOP FIRST. Profile KEEPS the scroll position the PREVIOUS
# FLOW left it at — the app is not restarted between flows — so a flow that only
# taps profile-tab can land at the BOTTOM of a screen it never scrolled itself.
# The comment above assumes this label "needs no scroll"; that holds only when
# Profile happens to be at the top.
#
# run-529's end-of-flow screenshot for view_profile is Profile showing Activity /
# Privacy / Sign Out / Delete account, with the mode row off the top — and still
# in dark mode, left by theme_switch earlier in the same suite.
#
# Kept-scroll at a NEW SCOPE: state carried BETWEEN flows, not within one.
# seller_mode_toggle has this identical opening and PASSES, which is how we know
# the flow is not wrong — it simply ran before anything scrolled Profile down.
# Guarded, so an already-visible target costs nothing.
- runFlow:
    when:
      notVisible: "Switch to .*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Switch to .*"
          direction: UP
          timeout: 20000
- assertVisible: "Switch to .*"

# Settings sections present
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Language"
    direction: DOWN
    timeout: 20000
# SCROLL TARGET FIXED 2026-09-08. This scrolled to "Appearance" and then asserted
# "Language" two steps down. They are different rows and Appearance is the one
# ABOVE: `profile.theme` = "Appearance" at Profile.tsx:847, `profile.language` =
# "Language" at Profile.tsx:924. scrollUntilVisible stops the instant its target
# appears, so the list parked with Language still below the fold and the assert
# could never pass. Reproducible across BOTH clean cycles (run-507, run-518).
# Identical defect to change_language_pashto, fixed in 6210d59.
# "Appearance" (profile.theme) sits in the Preferences card near the BOTTOM of the
# profile screen — below the stats, the quick actions, the pending-reviews nudge
# and PERSONAL INFO — so asserting it on arrival fails on a screen that is
# perfectly correct. The scroll below is the stronger proof anyway: it lands on a
# control INSIDE that card.
- assertVisible: "Language"

# Sign out is present (subdued ghost button at the bottom)
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"

# Edit Profile link visible
- assertVisible: "Edit Profile"
