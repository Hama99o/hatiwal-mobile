appId: com.hatiwal.app
---
# TASK-TX02 — Sold/Bought stat is HIDDEN (not shown as "0") when the count
# is zero. newbuyer@hatiwal.test is the deliberate no-history fixture
# (db/seeds/e2e.rb) — bought_count is 0.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/skip_onboarding.yaml
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Email"
- inputText: "newbuyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- assertVisible: "Bazaar"
- tapOn: "Me"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"

# "Items Bought" stat cell must be entirely absent (not "0 Items Bought") —
# only "Saved Items" shows in the buyer stats row.
- assertNotVisible: "Items Bought"
- assertVisible: "Saved Items"
