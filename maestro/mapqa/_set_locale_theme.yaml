appId: com.hatiwal.app
---
# NO `env:` BLOCK IN THIS FILE — DELIBERATELY, AND IT IS NOT COSMETIC.
#
# In this Maestro version a sub-flow's own `env:` default WINS over the
# `runFlow: env:` values the caller passes, silently. Proven with a probe: a
# sub-flow declaring `V: DEFAULT_WINS` and called with `env: {V: OVERRIDE_WINS}`
# wrote `envprobe-withdefault-DEFAULT_WINS.png`, while the identical sub-flow
# with NO env block wrote `envprobe-nodefault-OVERRIDE_WINS.png`.
#
# That is what broke the first matrix run: every cell inherited `LOCALE: en` /
# `THEME: light` / `CELL: en-light` from these defaults, so ps_dark and fa_dark
# both set English + light and then overwrote each other's screenshots. The
# QA_HANDBOOK already records this for `--env`; it applies to runFlow: env: too.
#
# Every variable below therefore comes from the CALLER and is required.
# Put the app into a known (locale, theme) cell.
#
# EVERY handle here is a testID, deliberately. This helper has to work FROM
# Pashto and Dari — which is exactly when an English selector cannot — and the
# theme/language rows are all translated. `ensure_english.yaml` cannot be reused:
# it only ever moves TOWARDS English.
#
# Both stores persist to AsyncStorage BEFORE calling reloadApp(), and both reload
# only when the value actually CHANGED. So rather than guess whether a restart
# happened (await_theme_restart.yaml waits for a listing-card, which does not
# exist on Profile, so it fails outright on a no-op tap), each switch is followed
# by ONE explicit cold start. Deterministic, and it cannot lose the choice.

# ── Theme ───────────────────────────────────────────────────────────────────
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "theme-option-${THEME}"
    direction: DOWN
    centerElement: true
    timeout: 25000
- tapOn:
    id: "theme-option-${THEME}"
- waitForAnimationToEnd:
    timeout: 15000
- launchApp:
    stopApp: true
- runFlow: ../_helpers/open_bundle.yaml
- extendedWaitUntil:
    visible:
      id: "browse-tab"
    timeout: 120000

# ── Language ────────────────────────────────────────────────────────────────
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The option list is collapsed on mount and its row is below the fold.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-${LOCALE}"
- waitForAnimationToEnd:
    timeout: 15000
- launchApp:
    stopApp: true
- runFlow: ../_helpers/open_bundle.yaml
- extendedWaitUntil:
    visible:
      id: "browse-tab"
    timeout: 120000
- waitForAnimationToEnd
