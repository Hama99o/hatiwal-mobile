appId: com.hatiwal.app
---
# Create listing: add multiple photos, verify Cover label on first, reorder, delete one

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# Photos section visible
- assertVisible: "Photos"
- assertVisible: "Add Photos"
- assertVisible: "Add at least one photo to attract buyers."

# Tap Add Photos
- tapOn: "Add Photos"
- waitForAnimationToEnd
# Sheet opens with Gallery / Camera options
- assertVisible: "Gallery"
- assertVisible: "Camera"
# Pick from Gallery. The helper carries the five tolerant picker steps, including
# Android's CONFIRM button ("Add (N)") — without it the picker never returns and no
# photo reaches the form. The bare `tapOn: index: 0/1/2` this replaces had no
# selector at all: it matched every element on screen, so none of the three photos
# was ever selected and every assertion below it failed.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

# First photo added, "Cover" label visible
- assertVisible: "Cover"

# Add a second photo
- tapOn: "Add Photos"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

# Add a third photo
- tapOn: "Add Photos"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

# Reorder hint visible when 2+ photos
- assertVisible: "Tap another photo to swap positions"

# Tap second photo to set as cover (reorder)
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-form-photo-thumb"
    index: 1
- waitForAnimationToEnd
# Cover label now on what was second photo
- assertVisible: "Cover"

# Photos section still shows 3 items
- assertVisible: "Add Photos"
