appId: com.hatiwal.app
---
# Edit listing: add a new photo, verify it appears in the photo strip

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
# Edit is NOT on the card any more. TASK-L863 replaced the button wall with ONE
# primary action plus a "More" overflow sheet, and Edit lives inside that sheet
# (useListingLifecycle moreActions, key "edit"). Scrolling My Shop for a bare "Edit"
# could only ever fail — publish_success says the same thing in its own comment.
# FILTER TO ACTIVE FIRST, then take index 0.
#
# This flow edits a PUBLISHED listing — its whole ending is the "Save" button
# that only a published listing has (`common.save`; a draft shows
# `listing.form.saveDraft` = "Save Draft" instead). But it took index 0 of My
# Listings unfiltered, and index 0 is whatever was touched MOST RECENTLY.
#
# So any flow that creates a draft before this one puts that draft at the top and
# this one edits it: the form then shows "Save Draft", the anchored `text: "Save"`
# correctly does not match it, and the failure reads as a missing button. That is
# exactly what run-459 did — `create_listing` (which ends on Save Draft) ran
# immediately before it in the same pass, and the hierarchy at the failing step
# had "Save Draft" and no standalone "Save".
#
# The Active tab makes the flow state its own precondition instead of inheriting
# whatever ran before it, which is what `index: 0` really means.
- tapOn:
    id: "my-listings-status-active"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "seller-listing-card"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-card-more-action"
    index: 0
- waitForAnimationToEnd
# By the sheet item's id, not the label: `common.edit` is translated.
- tapOn:
    id: "listing-action-edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# Photos section
# By testID. FieldLabel renders a required field's label plus a nested
# `<Text> *</Text>`, so the node reads "Photos *" and an anchored regex on the bare
# word cannot match it.
- assertVisible:
    id: "listing-form-field-photos"
- tapOn: "Add Photos"
- waitForAnimationToEnd
- assertVisible: "Gallery"
# The five tolerant picker steps live in the helper, including Android's CONFIRM
# button. A bare `tapOn: index: N` has no selector — it matches every element on
# screen — so it never selected a photo, and the flow then failed on whatever it
# asserted about the photo afterwards.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- waitForAnimationToEnd

# Photo added — Cover label visible
- assertVisible: "Cover"

# Save changes
# "Save", not "Save Changes". No such string exists in the locale files: editing a
# PUBLISHED listing submits through `common.save` = "Save" (ListingForm.tsx, the
# onSavePublished button). The only near neighbours are listing.form.saveDraft
# ("Save Draft") and the toast listing.form.saved ("Changes saved") — which this flow
# asserts afterwards, and which is probably where "Save Changes" came from.
# SCROLL to it first. This file's own header records the rule — "below the fold:
# `tapOn` never scrolls to its target" — and this step was the one place that did
# not follow it. Adding a photo GROWS the form (a thumbnail row appears above the
# fields), which pushes the submit button off screen, so the tap failed with
# `Element not found: Text matching regex: Save` on a button that had not moved
# anywhere the user could not reach.
#
# visibilityPercentage 40 rather than the default 100: the button sits in a
# sticky footer whose top edge can sit under the keyboard's shadow, and demanding
# it be FULLY visible is how the same class of step failed elsewhere tonight.
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
- tapOn: "Save"
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST from toast.success in
# ListingForm.tsx and it lives a few seconds. A plain assert races that window and
# loses under load — which is how create_listing_draft_restore failed here, with the
# draft itself created correctly. extendedWaitUntil polls, so it can only ever wait
# longer, never less.
# ("Offer accepted"/"Offer declined" are NOT converted: those strings are also the
# offer bubble's own outcome label, so they are durable rather than transient.)
- extendedWaitUntil:
    visible: "Changes saved"
    timeout: 15000
