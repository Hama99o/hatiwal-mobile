appId: com.hatiwal.app
---
# Gallery: open listing with multiple photos, swipe between images, verify dots

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# ...but nothing here actually OPENED one. The flow had no tapOn at all, so it
# asserted "Contact Seller" — a DETAIL-screen button — while still on the Bazaar
# feed, and the failure screenshot is exactly that: the feed, with the button
# nowhere on it. Removing the `tapOn: "Contact Seller"` was right (it opened the
# FirstMessageSheet over the button being asserted); removing the card tap with it
# was not.
#
# index 0 by testID: the first cards in the seeded feed carry photos — the seed
# attaches three to each of the seller's active listings — which is what a gallery
# swipe needs.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd

# Open a listing that has multiple photos (seller@hatiwal.test has listings with photos)
# The assertion IS the check — "we are on the listing detail". The tap that used
# to precede it opened the FirstMessageSheet, whose own title is "Message Seller"
# (listing.detail.messageSeller), so the sheet covered the very button being
# asserted and every step after it acted on a covered screen.
- assertVisible: "Contact Seller"

# Swipe left on the photo to see second image
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

# Swipe left again to see third image (if exists)
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd

# Swipe right to go back to first image
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd

# Back to Bazaar
- back
- waitForAnimationToEnd
- assertVisible: "Bazaar"
