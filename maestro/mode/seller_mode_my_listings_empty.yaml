appId: com.hatiwal.app
---
# New seller with no listings: My Listings shows empty state with "Post a listing" CTA

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
# goto_login, not a bare `tapOn: "Sign In"`. skip_onboarding lands on GUEST
# BROWSE, which has no Sign In button — the login screen is reached through the
# last tab, which reads "Login" for a guest. That is why this failed with
# `Element not found: Text matching regex: Sign In` after only 119s: it never got
# to a login form at all. goto_login runs skip_onboarding itself, so it replaces
# both steps.
- runFlow: ../_helpers/goto_login.yaml
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn:
    id: "login-email-input"
# Use a fresh buyer account with no listings
- inputText: "new_seller@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd

# Switch to seller mode
# The real switch is the profile toggle. `mode-switcher-banner` belongs to
# ModeSwitcherBanner.tsx, which nothing imports (UI-025), so this tap never landed.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Switch to .*"
    timeout: 30000
- tapOn:
    id: "mode-toggle-button"
- waitForAnimationToEnd
# Maestro anchors at both ends, so a bare "Switch" cannot match
# "Switch to Seller Mode" / "Switch to Buyer Mode".
- tapOn: "Switch.*"
- waitForAnimationToEnd

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Empty state
# The SELLER's own empty shop says `listing.emptyAll.title` — deliberately
# different copy from a visitor's view of an empty profile.
- assertVisible: "You haven't posted anything yet"
- assertVisible: "Post a listing"
