appId: com.hatiwal.app
---
# Switch to seller mode: tab bar shows "My Shop" instead of "Bazaar"

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"

# Switch to seller mode via banner
- tapOn:
    id: "mode-switcher-banner"
- waitForAnimationToEnd
- assertVisible: "Switch to Seller Mode"
# Maestro anchors at both ends, so a bare "Switch" cannot match
# "Switch to Seller Mode" / "Switch to Buyer Mode".
- tapOn: "Switch.*"
- waitForAnimationToEnd

# Tab bar changed — My Shop visible, Bazaar hidden or de-emphasized
- assertVisible: "My Shop"

# Switch back to buyer mode
- tapOn:
    id: "mode-switcher-banner"
- waitForAnimationToEnd
- tapOn: "Switch to Buyer Mode"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
