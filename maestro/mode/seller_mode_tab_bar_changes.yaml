appId: com.hatiwal.app
---
# THE TAB BAR IS THE MODE INDICATOR.
#
# app/(main)/(tabs)/_layout.tsx makes mode visible entirely through the tabs:
#   buyer  → Bazaar · Categories · Saved · Chats · Me
#   seller → My Shop · Chats · Me          (categories and saved are href: null)
# The FIRST tab keeps its route and testID (`browse-tab`) in both modes and only
# changes its label and icon, which is exactly the trap that made a dozen flows
# fail earlier: "Bazaar" and "My Shop" are the same tab.
#
# This flow used to switch modes by tapping `mode-switcher-banner`.
# ModeSwitcherBanner.tsx is imported by nothing (UI-025), so that tap could never
# work, and it asserted "Buyer Mode" — `profile.buyerMode`, referenced only inside
# that dead component and therefore rendered nowhere.
#
# The real switch is the toggle on the profile screen (`mode-toggle-button`), and
# the real, checkable consequence is which tabs exist. That is what this asserts.

- runFlow: ../_helpers/login.yaml

# ── Buyer mode: the buyer-only tabs are present ─────────────────────────────
- assertVisible:
    id: "browse-tab"
- assertVisible: "Bazaar"
- assertVisible:
    id: "categories-tab"
- assertVisible:
    id: "saved-tab"

# ── Switch to seller mode via the real control ──────────────────────────────
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Switch to .*"
    timeout: 30000
- tapOn:
    id: "mode-toggle-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Switch to Buyer Mode"
    timeout: 20000

# ── Seller mode: the first tab is relabelled, and two tabs are GONE ─────────
# The absences matter as much as the label: browsing by category and saving other
# people's listings are buyer activities, and leaving them visible in seller mode
# would send a seller to screens that are not about their shop.
- assertVisible:
    id: "browse-tab"
- assertVisible: "My Shop"
- assertNotVisible: "Bazaar"
- assertNotVisible:
    id: "categories-tab"
- assertNotVisible:
    id: "saved-tab"
# Chats and Me stay in both modes.
- assertVisible:
    id: "chat-tab"
- assertVisible:
    id: "profile-tab"

# ── Back to buyer mode, and the tabs come back ──────────────────────────────
- tapOn:
    id: "mode-toggle-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Switch to Seller Mode"
    timeout: 20000
- assertVisible: "Bazaar"
- assertNotVisible: "My Shop"
- assertVisible:
    id: "categories-tab"
- assertVisible:
    id: "saved-tab"
