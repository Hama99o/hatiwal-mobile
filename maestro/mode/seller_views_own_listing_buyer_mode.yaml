appId: com.hatiwal.app
---
# Seller switches to buyer mode → browses → finds own listing →
# "Contact Seller" is hidden or disabled (can't message yourself)

- runFlow: ../_helpers/login_seller.yaml
# Already in seller mode — switch to buyer mode via banner
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- tapOn: "Switch to Buyer.*"
- waitForAnimationToEnd
# NOT "Buyer Mode": `profile.buyerMode` is referenced only inside
# ModeSwitcherBanner.tsx, which nothing imports (UI-025), so it renders nowhere.
# The toggle offering SELLER mode is the proof we are in buyer mode.
- extendedWaitUntil:
    visible: "Switch to Seller Mode"
    timeout: 20000
# Browse as buyer
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Search for own listing (seeded seller listing)
# Search for a TITLE, not the word "seller". Browse search matches listing titles, and
# no title contains "seller" — so the feed came back empty and the card tap failed with
# "Element not found: listing-card". The flow needs one of THIS seller's own listings, and
# it has to find it the way a buyer would.
#
# "Men Winter Jacket XL Black" is seeded to seller@hatiwal.test, active, and left active
# by the other flows that use it (the offer flows answer "Not now" to the reserve
# prompt). Not the Toyota or the Lenovo: those get reserved and sold by lifecycle flows.
- tapOn: "Search listings..."
- inputText: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# "Contact Seller" should NOT appear for your own listing
- assertNotVisible: "Contact Seller"
# "Edit" or seller actions should also not appear in buyer mode
- assertNotVisible: "Edit Listing"
