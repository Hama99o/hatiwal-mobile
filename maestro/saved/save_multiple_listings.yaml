appId: com.hatiwal.app
---
# Save multiple listings: save 3 → all appear in Saved tab

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Save first 3 listings
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 0
- waitForAnimationToEnd
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 1
- waitForAnimationToEnd
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 2
- waitForAnimationToEnd

# Go to Saved tab
- tapOn: "Saved"
- waitForAnimationToEnd
- assertNotVisible: "No saved listings"

# At least 3 items visible
- assertVisible:
# The app gives EVERY feed card the same id ("listing-card"); there is no
# "listing-card-N". Maestro selects the Nth match with `index`.
    id: "listing-card"
    index: 0
- assertVisible:
# The app gives EVERY feed card the same id ("listing-card"); there is no
# "listing-card-N". Maestro selects the Nth match with `index`.
    id: "listing-card"
    index: 1
- assertVisible:
# The app gives EVERY feed card the same id ("listing-card"); there is no
# "listing-card-N". Maestro selects the Nth match with `index`.
    id: "listing-card"
    index: 2
