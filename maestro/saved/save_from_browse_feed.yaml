appId: com.hatiwal.app
---
# Save listing from browse feed: heart icon → listing appears in Saved tab

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Tap the heart/save icon on the first listing card
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 0
- waitForAnimationToEnd

# Go to Saved tab
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
# At least one listing now saved
# The empty state is `saved.empty` = "No saved items yet".
- assertNotVisible: "No saved items yet"
