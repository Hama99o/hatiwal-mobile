appId: com.hatiwal.app
---
# Buyer saves a listing → seller marks it sold →
# Buyer checks saved tab → listing shows "Sold" badge

# ── Buyer saves the listing ───────────────────────────────────────────────────
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Open first active listing
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Save it
- tapOn:
    # The heart on listing detail is `save-toggle-button` — added when this
    # class of failure was traced (its label is localized AND flips on isSaved,
    # so a testID is the only stable handle). `save-button` never existed.
    id: "save-toggle-button"
- waitForAnimationToEnd
# Note the listing title for later assertion
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Seller marks it sold ──────────────────────────────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, so this flow can ruin it without touching a fixture
# anything else asserts on. It used to act on "whichever listing comes first".
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "QA Disposable saved_listing_goes_sold"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable saved_listing_goes_sold"
      timeout: 30000
# With the search working (the API used to drop it — UI-031), the list holds
# exactly ONE card, so its own action button is unambiguous and there is no need
# to open the detail at all. Tapping the title did not navigate anyway: after
# typing, the first tap outside the field goes to dismissing the IME, so the flow
# stayed on the list and then looked for the DETAIL's `lifecycle-primary-action`.
# Verified by screenshot — header "1 listing", one card, still on My Shop.
- tapOn:
    id: "seller-card-primary-action"
    index: 0
- waitForAnimationToEnd
# The SECOND transition, reserved -> sold, also on the card: the flow never left
# the list, so the detail's `lifecycle-primary-action` is not on screen. After the
# first tap the same card re-renders with its label changed to "Mark as Sold".
- tapOn:
    id: "seller-card-primary-action"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Sold"

# ── Buyer checks saved tab — listing shows Sold ───────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertVisible: "Sold"
