appId: com.hatiwal.app
---
# Buyer saves a listing → seller marks it sold →
# Buyer checks saved tab → listing shows "Sold" badge

# ── Buyer saves the listing ───────────────────────────────────────────────────
- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Open first active listing
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Save it
- tapOn:
    # The heart on listing detail is `save-toggle-button` — added when this
    # class of failure was traced (its label is localized AND flips on isSaved,
    # so a testID is the only stable handle). `save-button` never existed.
    id: "save-toggle-button"
- waitForAnimationToEnd
# Note the listing title for later assertion
- tapOn: "Bazaar"
- waitForAnimationToEnd

# ── Seller marks it sold ──────────────────────────────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, so this flow can ruin it without touching a fixture
# anything else asserts on. It used to act on "whichever listing comes first".
- tapOn: "Search my listings..."
- eraseText
- inputText: "QA Disposable saved_listing_goes_sold"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable saved_listing_goes_sold"
      timeout: 30000
# Open THIS listing's own detail. A bare `tapOn: index: 0` has no selector at all —
# it matches every element on screen — and a text tap on "Mark as Reserved" would
# hit whichever card carries that button first, not the searched one.
- tapOn: "QA Disposable saved_listing_goes_sold"
- waitForAnimationToEnd
# active -> reserved, then reserved -> sold, both through the primary action, whose
# label changes with the status it is about to leave.
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- assertVisible: "Sold"

# ── Buyer checks saved tab — listing shows Sold ───────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Sold"
