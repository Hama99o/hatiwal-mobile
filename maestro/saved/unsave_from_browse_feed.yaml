appId: com.hatiwal.app
---
# Unsave listing from browse feed: tap saved (filled) heart → listing removed from Saved

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Save the first listing
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 0
- waitForAnimationToEnd

# Unsave immediately (tap same heart again)
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 0
- waitForAnimationToEnd

# Go to Saved — listing should be gone
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "No saved listings"
