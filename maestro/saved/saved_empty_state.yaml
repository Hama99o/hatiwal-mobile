appId: com.hatiwal.app
---
# Empty saved state — shows message and browse button

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
# goto_login, not skip_onboarding. Skipping onboarding alone lands on guest
# BAZAAR — goto_login.yaml says so in its own header — and this flow then expects
# the login screen, so `auth.subtitle` was never on screen and the wait timed out
# before a single credential was typed. goto_login does the skip AND the extra hop
# to Login, and skip_onboarding is a no-op once past that stage.
- runFlow: ../_helpers/goto_login.yaml
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
# Wait for the INPUT this flow is about to tap, not the marketing subtitle. Both
# failures on record (run-162, run-185) are this step timing out at 60s on
# auth.subtitle — copy that does render on Login (Login.tsx:319), but sits under the
# logo and proves nothing the flow needs. login-email-input is the actual
# precondition, and it is what the next step taps.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: "newbuyer@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
# Wait for the app to actually be signed IN before reaching for a tab. Signing in
# navigates, and the tab bar does not exist on the login screen — tapping saved-tab
# in the same breath is a race this flow had no reason to take.
- extendedWaitUntil:
    visible:
      id: "saved-tab"
    timeout: 30000
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertVisible: "No saved items yet"
- assertVisible: "Browse listings"
# Tap browse button — goes to Bazaar
- tapOn: "Browse listings"
- assertVisible: "Bazaar"
