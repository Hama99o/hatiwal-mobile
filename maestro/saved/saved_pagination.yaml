appId: com.hatiwal.app
---
# Saved listings — scroll loads more, tap opens detail

- runFlow: ../_helpers/login.yaml
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Saved"
# Scroll to trigger pagination (if more than 1 page)
- scroll
- scroll
- waitForAnimationToEnd
# Tap the first saved listing to open detail
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Contact Seller"
# Go back
- back
- waitForAnimationToEnd
- assertVisible: "Saved"
