appId: com.hatiwal.app
env:
  EMAIL: buyer@hatiwal.test
  PASSWORD: Password123!
---
# DIAGNOSTIC ONLY — not part of any feature suite.
# Signs in, opens the profile tab, and asserts the mode toggle by testID with no
# scroll. The point is the FAILURE: Maestro dumps the full screen hierarchy next
# to the screenshot, which says whether the testID reached the view at all and
# what screen we are actually on.
- launchApp
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "Email"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      # Dismiss the IME before submitting. The keyboard covers the lower half of a
      # form, and Maestro still reports the tap COMPLETED — it finds the element in
      # the hierarchy and taps its bounds, while the touch lands on the keyboard. On
      # the login screen that swallowed EVERY sign-in in the suite: no request ever
      # reached the API and the flow blamed a missing tab bar 60s later.
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn: "Sign In"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Allow Hatiwal to send you notifications?"
    timeout: 15000
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- takeScreenshot: profile-top
- assertVisible:
    id: "mode-toggle-button"
