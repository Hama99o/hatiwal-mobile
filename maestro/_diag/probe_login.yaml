appId: com.hatiwal.app
---
# Isolate the sign-in request: does it leave the device at all?
- launchApp
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "buyer@hatiwal.test"
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "Password123!"
- takeScreenshot: /tmp/probe-before-submit
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
- takeScreenshot: /tmp/probe-after-submit
