appId: com.hatiwal.app
---
# "USE MY LOCATION" IN THE BROWSE FILTER — the permission prompt, the grant, and
# the map actually moving.
#
# This is the case the product cares about most: a buyer taps "Use My Location"
# and expects the map to go where they are. Three things have to happen in order,
# and only the first two are usually tested:
#   1. the OS permission dialog APPEARS (it must ask — it must not silently fail)
#   2. granting it is accepted
#   3. the coordinates actually change, and confirming carries them into the filter
#
# NO SHELL PRECONDITION NEEDED — and this took three wrong attempts to see.
#
# Maestro GRANTS ALL RUNTIME PERMISSIONS on `launchApp` by default. So the app
# already had location permission before the flow ran, `requestForegroundPermissions`
# returned granted without asking, and the flow sat waiting 30s for a dialog that
# was never coming. `dumpsys package` showed granted=true after every run.
#
# Neither of my first two fixes could work, because both act BEFORE the launch that
# then grants:
#   * `clearState: true`        — clears data, not permissions
#   * `qa.sh perm revoke`       — also marks the permission USER-FIXED, so Android
#                                 would never show the dialog even if it stuck
#   * `qa.sh perm reset`        — right idea (never-asked), still undone by launch
#
# `permissions: all: deny` on launchApp is the only control that holds, which is
# why it lives in the helper this flow uses (must SEE the dialog).

- runFlow:
    file: ../_helpers/login_fresh_deny_permissions.yaml
    env:
      EMAIL: buyer@hatiwal.test
      PASSWORD: Password123!

- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Set location & range"
- waitForAnimationToEnd
- assertVisible:
    id: "location-use-my-location"

# ── 1. It must ASK ──────────────────────────────────────────────────────────
- tapOn:
    id: "location-use-my-location"
- extendedWaitUntil:
    visible: "While using the app"
    timeout: 30000

# ── 2. Granting is accepted ─────────────────────────────────────────────────
- tapOn: "While using the app"
- waitForAnimationToEnd

# ── 3. It resolves, and says nothing about failing ──────────────────────────
# The spinner replaces the button label while acquiring, so wait for the button
# to come back before judging the outcome.
- extendedWaitUntil:
    visible: "Use My Location"
    timeout: 60000
# None of the failure banners may be showing. These are the real regressions:
# a silent no-op, or an error where a fix was available.
- assertNotVisible: "Couldn't determine your location. Please try again."
- assertNotVisible: "Location access is blocked. Allow location access in Settings, then try again."
- assertNotVisible: "Location request timed out. Please try again."

# ── The chosen point carries into the filter ────────────────────────────────
- tapOn:
    id: "location-confirm"
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 30000
- assertVisible: "Bazaar"
