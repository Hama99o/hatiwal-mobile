appId: com.hatiwal.app
---
# THE BROWSE FILTER MAP — its default state, with no location permission.
#
# `launchApp: clearState: true` runs `pm clear`, which REVOKES runtime
# permissions, so this flow starts from a genuinely permission-less app. That is
# the precondition it needs, and it is why it does not have to shell out to adb.
#
# What must be true with no permission:
#   - the map opens on KABUL (DEFAULT_CENTER) rather than nowhere
#   - it does NOT silently prompt just for opening (getCurrentLocationIfPermitted
#     never prompts — that is the whole reason it exists)
#   - the range control is usable, so a buyer with location off is not stuck
#   - confirming still applies a location filter

# clearState + sign in. The helper also scrolls to "Sign In", which the
# keyboard hides on a small screen after typing the password.
- runFlow:
    file: ../_helpers/login_fresh.yaml
    env:
      EMAIL: buyer@hatiwal.test
      PASSWORD: Password123!

# ── Open the filter, then the map ───────────────────────────────────────────

# Buyer mode, explicitly. These flows use login_fresh.yaml, which is deliberately
# mode-NEUTRAL because map_location_outside_afghanistan signs in as the seller —
# so the guard cannot live in that helper and belongs here. (login.yaml, the
# ordinary buyer login, now carries it for its own 142 flows.)
- runFlow: ../_helpers/ensure_buyer_mode.yaml

- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- assertVisible: "Set location & range"
- tapOn: "Set location & range"
- waitForAnimationToEnd

# The picker is open: its own controls prove it, not a screenshot.
- assertVisible:
    id: "location-use-my-location"
- assertVisible:
    id: "location-confirm"
- assertVisible: "Search radius"

# NO permission prompt from merely opening the map. If this ever regresses, every
# buyer who opens the filter gets an OS dialog they did not ask for.
- assertNotVisible: "While using the app"
- assertNotVisible: "Allow Hatiwal to access this device's location?"

# ── The range control works without any location permission ─────────────────
- tapOn:
    id: "location-radius-25"
- waitForAnimationToEnd
# The chip itself renders "25 km", which is on screen whether or not it is
# SELECTED — so asserting it here would prove nothing. "Within 25 km" belongs to
# the filter sheet's location row and only appears once the choice is confirmed,
# which is what the read-back at the end of this flow checks.
- assertVisible: "25 km"

# ── Confirming applies the filter, AND it is Kabul ──────────────────────────
- tapOn:
    id: "location-confirm"
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 30000

# The picker closes back to the FILTER SHEET, not to the feed — the sheet is
# still covering the screen, so the tab bar is not visible yet. (Asserting
# "Bazaar" here failed for exactly that reason.) Which is convenient: the
# location row is right there, so the stored value can be read without reopening
# anything.
#
# This is what actually proves "the default is Kabul". Browse stores
# `label ?? "<lat>, <lon>"` to 3 decimals, so with no permission the row shows
# either a reverse-geocoded Kabul name or literally "34.555, 69.207"
# (DEFAULT_CENTER). Both are Kabul; which one depends on whether Nominatim
# answered, so the regex accepts either rather than making the test depend on a
# network round-trip.
- assertVisible: "Within 25 km"
# Kabul in EITHER script. The label is whatever Nominatim returns for
# accept-language, and utils/geocoding.ts now asks for the app's language first
# (it used to always ask for Pashto, so an English UI got
# "لسمه ناحیه, کابل, کابل ښاروالی" — that was a real bug this flow found). The
# coordinate fallback covers Nominatim not answering at all.
- assertVisible: "(.*Kabul.*|.*کابل.*|.*34\\.555.*)"

# And the sheet closes onto a filtered feed. Waiting for the button to GO is the
# reliable gate — `waitForAnimationToEnd` returns while the sheet is still
# sliding, and the tab bar underneath is not visible until it has gone.
- tapOn: "Show results"
- extendedWaitUntil:
    notVisible: "Show results"
    timeout: 30000
- assertVisible: "Bazaar"
# The filter really is applied, not merely dismissed.
- assertVisible: "1 filter active"
