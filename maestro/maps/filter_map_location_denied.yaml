appId: com.hatiwal.app
---
# DENYING location must leave the filter usable.
#
# The failure mode this guards against is not a crash — it is a dead end: the
# buyer says no, and the map is then stuck with no way to pick anywhere. What the
# app should do (and does) is show a persistent inline banner explaining the
# state, keep the map on Kabul, and leave the range control working, so a buyer
# who never grants location can still filter by area manually.
#
# The banner is deliberately PERSISTENT rather than a toast: a transient alert can
# be missed, and then the button looks broken.

# Permissions are DENIED at launch by the helper (`permissions: all: deny`), which
# is the only way to make the dialog appear: Maestro grants all runtime permissions
# on launchApp by default, so without this the app already has location and never
# asks. See the helper for why clearState and `pm reset-permissions` cannot
# substitute — both act before the launch that grants.
- runFlow:
    file: ../_helpers/login_fresh_deny_permissions.yaml
    env:
      EMAIL: buyer@hatiwal.test
      PASSWORD: Password123!

# Seller mode has no "Bazaar" tab, and mode persists on the USER across flows
# and devices — so a buyer flow has to assert its own mode first.
- runFlow: ../_helpers/ensure_buyer_mode.yaml

- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Set location & range"
- waitForAnimationToEnd

# ── Say no ──────────────────────────────────────────────────────────────────
- tapOn:
    id: "location-use-my-location"
- extendedWaitUntil:
    visible: "While using the app"
    timeout: 30000
# The Android dialog's refuse option. Wording varies by version, so both are
# accepted and the assertion below is the real gate.
- tapOn:
    text: "Don.t allow"
    optional: true
- tapOn:
    text: "Deny"
    optional: true
- waitForAnimationToEnd

# ── The refusal is EXPLAINED, not swallowed ─────────────────────────────────
- extendedWaitUntil:
    visible: "Location access is blocked. Allow location access in Settings, then try again."
    timeout: 30000

# ── And the map is still usable by hand ────────────────────────────────────
# This is the part that matters: denying location must not strand the buyer.
- tapOn:
    id: "location-radius-10"
- waitForAnimationToEnd
# "Within N km" is the FILTER ROW's wording, not the picker's — the chip reads
# "10 km". Checked after confirming, below.
- assertVisible: "10 km"
- tapOn:
    id: "location-confirm"
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 30000

# Back on the FILTER SHEET (the picker closes to it, not to the feed). The range
# chosen by hand — with location DENIED — is there. That is the whole point of
# this flow: refusing location must not cost the buyer the feature.
- assertVisible: "Within 10 km"

- tapOn: "Show results"
- extendedWaitUntil:
    notVisible: "Show results"
    timeout: 30000
- assertVisible: "Bazaar"
