appId: com.hatiwal.app
---
# A DEVICE OUTSIDE AFGHANISTAN MUST NOT BE BLOCKED.
#
# This is the case that is easy to get wrong, because the place SEARCH is
# deliberately scoped to Afghanistan (`countrycodes=af` in utils/geocoding.ts).
# It would be a natural mistake to scope the whole feature that way — and then a
# seller travelling, or anyone whose GPS resolves abroad, could not set a location
# at all.
#
# Verified in the code before writing this: LocationRangePicker applies no bounds,
# reverseGeocode sends no country filter, and hatiwal-api validates only sane
# latitude ranges (-90..90 on saved_search) with no Afghanistan constraint. This
# flow is what keeps that true.
#
# PRECONDITION — the device must actually be abroad:
#
#     QA_GEO_LAT=48.8566 QA_GEO_LON=2.3522 \
#       ./qa/qa.sh flow maps/map_location_outside_afghanistan
#
# Pass the coordinates as ENV, not via `qa.sh geo` beforehand: the per-flow
# preflight in lib/flows.sh re-sends the fix before every flow (because
# `adb emu geo fix` is one-shot and goes stale), so a fix set by hand would be
# overwritten with Kabul a second later. Overriding the variables makes the
# preflight itself send Paris.
#
# Running it with the default Kabul fix still passes, but proves nothing — the
# geo step is the test.

# clearState + sign in. The helper also scrolls to "Sign In", which the
# keyboard hides on a small screen after typing the password.
- runFlow:
    file: ../_helpers/login_fresh.yaml
    env:
      EMAIL: seller@hatiwal.test
      PASSWORD: Password123!

# ── Use the (foreign) current location in the LISTING map ───────────────────
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Switch to Seller Mode"
    commands:
      - tapOn: "Switch to Seller Mode"
      - waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Abroad Location Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "700"

- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd

# NO permission dialog is expected here: Maestro grants all runtime permissions on
# launchApp, so the app already has location. That is fine — the subject of THIS
# flow is the foreign coordinate, not the prompt (see filter_map_use_my_location
# for the prompt itself). Asserting a dialog here just made it fail on a dialog
# that had no reason to appear.
- tapOn:
    id: "location-use-my-location"
# The label is replaced by a spinner while acquiring; wait for it to come back.
- extendedWaitUntil:
    visible: "Use My Location"
    timeout: 60000

# ── THE POINT: a foreign fix is a SUCCESS, not an error ─────────────────────
# No failure banner, and in particular nothing that reads like a refusal. If the
# feature were ever scoped to Afghanistan, this is where it would show.
- assertNotVisible: "Couldn't determine your location. Please try again."
- assertNotVisible: "Location access is blocked. Allow location access in Settings, then try again."
- assertNotVisible: "Location isn't available on this device."

# ── And it can be confirmed and saved ───────────────────────────────────────
# reverseGeocode may return no label for a point with no nearby named feature —
# that is fine and must NOT block confirming. The row losing its prompt is the
# proof the pin took.
- tapOn:
    id: "location-confirm"
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 60000
- assertNotVisible: "Tap to set exact location on map"

- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Abroad Location Item"
- assertVisible: "Draft"
