appId: com.hatiwal.app
---
# Enter the HATIWAL bundle from the expo-dev-client launcher.
#
# Needed because the QA build must be a DEBUG build (src/api/http.ts throws if a
# non-__DEV__ build points at a local API), and debug + expo-dev-client always
# opens a launcher instead of the app. `launchApp: clearState: true` — used by
# 190 of 213 flows — wipes the remembered server, so this runs on nearly every flow.
#
# The URL is typed explicitly, never picked from the discovered list. The
# launcher auto-discovers 10.0.2.2:8081, and 10.0.2.2 addresses the host
# DIRECTLY (adb reverse does not intercept it) — so when another Expo project
# holds host :8081, its bundle loads into this APK. That really happened: the dev
# menu read "Madares" and the app died on a native module Hatiwal does not use.
#
# 10.0.2.2:3008 = this host's Hatiwal Metro, from inside the emulator. It does
# not depend on WiFi vs hotspot, unlike a LAN IP.

# ── Wait for SOMETHING to render before deciding which state we are in ──────
# `when: visible` below polls only briefly and then commits to a verdict. After
# `launchApp: clearState: true` the launcher needs longer than that to draw, so
# the check ran against a blank screen, concluded "not the launcher", and SKIPPED
# THE ENTIRE enter-the-bundle block — leaving the app parked on the launcher for
# the rest of the flow. Every later step then failed against the launcher's UI,
# reported as "Element not found: Email", which looks like a login-screen bug and
# is not one. Measured in run-058: the conditional was evaluated 7s after launch
# and the flow burned 4m35s on the launcher.
#
# This gate matches EITHER the launcher or an app that is already up, so it exits
# almost immediately in both cases rather than costing a fixed delay. Optional:
# if nothing matches, behaviour is exactly as it was before this wait existed.
- extendedWaitUntil:
    visible:
      text: "Development Build|Continue|Performance monitor|Welcome to Hatiwal|هاتیوال ته ښه راغلاست|Bazaar|Me|Email|My Shop|Login|زما هټۍ|دکان من"
    timeout: 120000
    optional: true

- runFlow:
    when:
      visible: "Development Build"
    commands:
      # The launcher has SEVERAL shapes depending on what it remembers, so every
      # step here is optional and the real success gate is the launcher
      # disappearing (asserted below). A hard `tapOn: "Connect"` used to fail the
      # whole flow with "Element not found: Connect" whenever the launcher showed
      # a remembered-server row instead of the URL field.
      #
      # ── DEEP LINK FIRST, because driving the launcher's UI cannot work ──
      #
      # `hatiwal://expo-development-client/?url=…` is the dev client's own
      # entry point: it loads that bundle directly and never renders the
      # launcher's server picker. One step, no keyboard, no layout dependency.
      #
      # WHY IT HAD TO REPLACE THE TAPS. When the launcher does not auto-discover
      # the server it falls back to a manual URL field, PRE-FILLED with the last
      # server used — so "10.0.2.2:3008" is on screen as INPUT TEXT and the
      # "already listed" fast path below matches it, taps the FIELD, and only
      # raises the keyboard. Connect then sits under the IME on a 360dp screen,
      # and none of the three ways out work there: the header tap does not
      # dismiss the Android IME (verified by screenshot, twice), `pressKey:
      # Enter` does not submit this field (noted below), and `hideKeyboard` is
      # Back — which on the LAUNCHER closes the activity and exits the app.
      #
      # Cost of getting this wrong: 18 flows in run-480 and every single-flow
      # retry after it, each reported as `Assertion is false: "Development
      # Build" is not visible`, which reads as an app that will not boot.
      #
      # The taps below are KEPT as a fallback for a dev-client build that does
      # not register the scheme; they are all optional, so when the deep link
      # works they match nothing.
      - openLink: "hatiwal://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A3008"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible: "Development Build"
          timeout: 120000
          optional: true

      # Fast path: our own server is already listed — just open it.
      - runFlow:
          when:
            visible: "10.0.2.2:3008"
          commands:
            - tapOn: "10.0.2.2:3008"
            - waitForAnimationToEnd
      # Otherwise type it in. With discovered servers present the URL field is
      # collapsed behind this row; with none, the field is already on screen.
      - runFlow:
          when:
            notVisible: "10.0.2.2:3008"
          commands:
            - tapOn:
                text: "New development server"
                optional: true
            - waitForAnimationToEnd
            - tapOn:
                text: "http://localhost:8081"
                optional: true
            - inputText: "http://10.0.2.2:3008"
            # DISMISS THE KEYBOARD BY TAPPING THE HEADER — never with Back.
            #
            # Connect is BEHIND THE KEYBOARD on a small screen: on a 360dp device
            # (720x1280) the URL field sits at the bottom of the visible area and
            # Connect is entirely covered, and `pressKey: Enter` does not submit
            # there either — so the app never left the launcher and every flow on
            # that form factor failed with `"Development Build" is not visible`.
            #
            # My first fix used `hideKeyboard`, and that was WORSE. hideKeyboard is
            # Back on Android, and it is only safe while the IME is definitely up.
            # On the paths where it was not — the remembered-server fast path, or a
            # field that never took focus — the Back reached the launcher and EXITED
            # THE APP. Flows then ran for five minutes against the Android home
            # screen and failed on `"Me" is visible`, which reads as a broken login.
            # A screenshot of the app drawer is what showed it.
            #
            # Tapping the launcher's own header dismisses the IME with no key event
            # at all, so there is nothing to reach the app. Optional, because the
            # header is not present on every launcher shape.
            - tapOn:
                text: "Development Build"
                optional: true
            - waitForAnimationToEnd
            - tapOn:
                text: "Connect"
                optional: true
            - waitForAnimationToEnd
      # ── WHICHEVER BRANCH RAN, DISMISS THE IME AND PRESS CONNECT ─────────
      #
      # The launcher PRE-FILLS its URL field with the last server it used, so
      # "10.0.2.2:3008" can be on screen as INPUT TEXT rather than as a
      # discovered server row. The fast path above then matches that text and
      # taps the FIELD — which only focuses it and raises the keyboard — while
      # the `notVisible` branch is skipped for the same reason. Connect is never
      # pressed and the app never leaves the launcher.
      #
      # That is exactly what happened once Metro's container was restarted and
      # the launcher stopped auto-discovering the server: 18 consecutive failures
      # in run-480, then again in runs 482 and 483, every one reported as
      # `Assertion is false: "Development Build" is not visible` — which reads as
      # an app that will not boot. A screenshot showed the truth: the URL sitting
      # in the field with the keyboard over the Connect button.
      #
      # Both steps are optional and idempotent: if a branch already connected the
      # launcher is gone and neither matches. The header tap is the IME dismissal
      # that cannot exit the app — see the long note above on why hideKeyboard
      # (Back) and pressKey Enter are both unusable here.
      - tapOn:
          text: "Development Build"
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          text: "Connect"
          optional: true
      - waitForAnimationToEnd
      # Metro transforms the bundle on first request — this can take a while.
      - extendedWaitUntil:
          notVisible: "Development Build"
          timeout: 180000

# Leaving the launcher is NOT the same as the app being ready: Metro then shows
# a "Bundling nn%" banner, and anything checked during that window sees nothing
# and silently skips. Wait for the bundle to finish before touching the UI.
- extendedWaitUntil:
    notVisible:
      text: "Bundling.*"
    timeout: 180000
- waitForAnimationToEnd

# ── POSITIVE gate: wait until JS is actually rendering ──────────────────────
# Absence of the "Bundling" banner does NOT mean the app is up. The banner is
# itself rendered by JS, so before the first render there is nothing to see and
# the notVisible check above passes INSTANTLY on a blank screen. The tablet made
# this obvious: after the launcher exits it sits blank and white for 30s+ while
# Metro transforms the bundle, so the whole helper — including the 30s dev-menu
# wait below — burned down against an empty screen, and the flow then failed on
# "Element not found: Email" with nothing wrong with the app (run-056; the
# faster phone won the same race and passed).
#
# So wait for the first thing that PROVES JS is running: either the dev-menu
# sheet ("Continue") / panel that covers the app, or the app's own root. Costs
# nothing when the app is already up — it exits on the first match.
- extendedWaitUntil:
    visible:
      text: "Continue|Performance monitor|Welcome to Hatiwal|هاتیوال ته ښه راغلاست|Bazaar|Me|Email|My Shop|Login|زما هټۍ|دکان من"
    timeout: 180000
    optional: true

# WHY "My Shop" AND "Login" ARE IN THAT LIST (run-269).
#
# The alternation is "any marker that proves the app itself is up". It listed
# `Bazaar|Me|Email` — the buyer feed's tab, the authenticated profile tab, and the
# login form. It did NOT cover the app's real fourth shape: a GUEST in SELLER
# mode, whose tab bar reads "My Shop" · "Login" and contains none of the three.
# That state is not exotic — it is what every account looks like straight after
# `db:seed:reset_e2e`, because recreating the users revokes their tokens while
# the mode store (persisted under `hatiwal-mode`) survives (see qa/UI_FINDINGS.md
# UI-050, which is the app-side half of this).
#
# The cost was a silent 3 minutes: the gate is `optional`, so it simply waited
# out its full 180s timeout on a screen that was perfectly ready, on the first
# flow of every post-seed batch. Widening the alternation cannot weaken anything
# — an optional wait that matches sooner is strictly better, and the real
# starting-state gates are the ones below.

# ── Known starting state ───────────────────────────────────────────────
# Two things stand between "bundle loaded" and "the flow can assert anything":
#
# 1. The dev-build developer-menu sheet covers the screen on first launch.
#    It is a debug-build artifact, not part of the product.
# 2. The app can come up in Pashto. Every flow asserts ENGLISH strings
#    ("Welcome to Hatiwal", "Bazaar", …), and CLAUDE.md sets English as the
#    default language, so pin it here rather than in 213 flows.
# `when: visible` is a SINGLE-SHOT check. The dev-menu sheet animates in a beat
# after the bundle finishes, so a bare conditional evaluates too early and
# silently skips while the sheet then covers the whole screen. Wait for it (but
# tolerate it never coming) before dismissing.
#
# 10s, not 30s: the gate above already proved JS is rendering, and the sheet is
# part of that first render — so this only has to absorb the animation, not a
# bundle transform. The timeout is paid in full on every flow where the sheet
# does not appear, 213 flows deep, so the difference is ~70 minutes a suite.
- extendedWaitUntil:
    visible: "This is the developer menu"
    timeout: 10000
    optional: true
- tapOn:
    # lint: anchored-ok — the Expo dev-client button, matched exactly, not our "Continue with Google"
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Dismissing the intro sheet can leave the FULL dev-menu panel open on top of
# the app (it shows "Connected to: http://10.0.2.2:3008" and the tools list).
# Back closes it; "Go home" must NOT be used — that returns to the launcher.
- runFlow:
    when:
      visible: "Performance monitor"
    commands:
      # Dismiss the dev-menu sheet with its own "x" close control (top-right).
      #
      # NOT `pressKey: Back`. If the visibility check races with the sheet
      # closing, Back reaches the app instead — and from a root screen Back
      # EXITS to the Android launcher. That happened: a flow ran for 2m36s and
      # ended on the home screen with no crash in logcat, which reads as a
      # mysterious app failure. A backdrop tap can never exit the app.
      # The panel starts at ~5% of the screen height, so a "backdrop" tap at 6%
      # lands ON its header and does nothing — that left the panel covering the
      # app for the rest of the flow. The close button sits at the top-right.
      #
      # TARGETED BY ITS ACCESSIBILITY LABEL, not by a percentage point.
      # A `point:` tap is FORM-FACTOR DEPENDENT and that broke the tablet: the
      # close control sits a fixed ~68px in from the right edge, which is 93.7%
      # of a 1080-wide phone but 96.1% of a 2560-wide tablet — so the old
      # "90%,10%" tap landed on empty header space, did nothing, and the panel
      # covered the app for the whole flow. The flow then failed on
      # "Element not found: Email" with the app loaded and healthy behind it,
      # which reads as an app bug and is not one (run-054: identical flow, phone
      # passed, tablet failed). The panel is its own window, so its "Close" is
      # the only match on screen. Verified on both emulators.
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd
      # If the panel somehow survived, fall back to the point tap.
      - runFlow:
          when:
            visible: "Performance monitor"
          commands:
            - tapOn:
                point: "96%,10%"
            - waitForAnimationToEnd

# Pin the language to English ONLY when it is actually wrong.
#
# Tapping "English" unconditionally is expensive AND harmful: a language change
# calls reloadApp() (src/lib/reloadApp.ts -> react-native-restart) to re-lay-out
# for RTL, restarting the whole app. In dev that remount produces the red box
# "Looks like you have configured linking in multiple places" (two
# ContextNavigators briefly mounted), which covers the screen and makes every
# later step fail for the wrong reason.
#
# Switch only when the UI is genuinely in Pashto, detected by its own heading.
# Most flows then pay nothing at all.
- runFlow:
    when:
      visible: "هاتیوال ته ښه راغلاست"
    commands:
      # The option is labelled in the CURRENT language, and here the app is in
      # PASHTO (that is what the gate above detected), so English reads
      # "انګلیسي" — not "English". The regex covers every form, since a later
      # flow may leave the app in Dari instead.
      - tapOn:
          id: "language-switcher-en"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible:
            text: "Bundling.*"
          timeout: 180000
      - waitForAnimationToEnd
      # The language change calls reloadApp() (react-native-restart). In a DEBUG
      # build that remount reliably raises a LogBox console error ("Looks like you
      # have configured linking in multiple places"), which then covers the whole
      # screen and makes every later step fail for an unrelated reason.
      #
      # Dismissed here ONLY because it is understood, dev-only, and caused by this
      # helper's own language switch — it is recorded as a finding in
      # qa/UI_FINDINGS.md (UI-007), not swept away. The classifier still flags
      # red boxes that appear during the flow body itself.
      - tapOn:
          # lint: anchored-ok — the dev-client error overlay's button, not our "Dismissed" status
          text: "Dismiss"
          optional: true
      - waitForAnimationToEnd

# ── Blank-screen recovery: DELIBERATELY NOT HERE ────────────────────────────
# `clearState: true` can leave the dev client on a blank white screen, and one
# warm `launchApp` fixes it. That recovery must NOT live in this helper, because
# Maestro's `launchApp` GRANTS ALL RUNTIME PERMISSIONS by default — only
# `permissions: {all: deny}` overrides it, and there is no "leave them alone"
# option.
#
# Putting it here granted location to every flow that runs open_bundle, which
# broke the two flows whose whole subject is the permission PROMPT:
# filter_map_location_denied and filter_map_use_my_location both went from green
# to `Assertion is false: "While using the app" is visible` — the OS dialog never
# appeared because the permission had already been handed over by this helper.
#
# So the recovery lives in the individual flows that need it (the guest_* ones,
# which do not care about permissions). See maestro/auth/guest_browse.yaml.
