appId: com.hatiwal.app
---
# Ensure the app is in BUYER mode.
#
# Mode is persisted on the USER, not just locally, so it leaks between flows and
# even between devices: a flow that switches the buyer to seller mode leaves the
# buyer in seller mode for everything after it. Seller mode has NO "Bazaar" tab —
# the tabs become My Shop / Chats / Me — so a buyer flow then fails with "Element
# not found: Bazaar" while being perfectly signed in. Verified from a screenshot:
# Ahmad Karimi (the buyer) sitting in a green seller-mode profile.
#
# A separate helper rather than part of login_fresh, because seller flows use the
# same login and must NOT be forced into buyer mode — baking it in broke the one
# map flow that signs in as the seller.
#
# ── WHY THIS FILE IS TESTID-ONLY ────────────────────────────────────────────
# The previous version tapped tabs and the toggle BY LABEL, and it failed in a
# way that pointed at the flows instead of at itself. Two faults compounded:
#
#   1. `when: visible: "Switch to Buyer Mode"` is a SHORT POLL. Before the
#      profile screen had rendered it simply returned false, the switch was
#      skipped, and the helper carried on in SELLER mode believing it was in
#      buyer mode. (My first fix for this scrolled to the toggle, on the wrong
#      theory that it sat below the fold — see the gate below for why that made
#      things worse. The real repair is waiting for the screen, not scrolling.)
#   2. Its own last step was then `tapOn: "Bazaar"` — a tab that does not exist
#      in seller mode. So the helper's own failure surfaced as "Element not
#      found: Bazaar", which reads like a broken buyer flow.
#
# That accounted for ~20 flows across chat, gallery, mode, report and pagination.
# The lesson is narrow: to DETECT a mode you must not target a control whose
# label is the very thing that changes with it. Every handle below is a testID —
# `mode-toggle-button` (Profile.tsx) and the tab ids from
# app/(main)/(tabs)/_layout.tsx, honoured in FloatingTabBar.tsx.

- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Gate on the label with a mode-agnostic regex, then act on the testID. This is
# BOTH steps of the check in one: the label proves the profile screen has
# rendered, and it is the toggle's own text, so the toggle is on screen.
#
# It replaced a `scrollUntilVisible` on the testID, which was wrong twice over.
# The toggle sits just under the avatar and name, NOT below the fold — I had
# inferred "below the fold" from its line number in a 1152-line file, and a line
# number says nothing about vertical position on screen. And because
# scrollUntilVisible only ever scrolls DOWN, it scrolled the toggle AWAY and then
# could not find it: "No visible element found: id: mode-toggle-button", in flows
# where a bare assertVisible on the same id passed.
- extendedWaitUntil:
    visible: "Switch to .*"
    timeout: 30000

# The label tells us the mode, but the TAP targets the testID. Pressing the
# toggle switches to whichever mode we are not in, so it is pressed only when it
# offers buyer mode.
- runFlow:
    when:
      visible: "Switch to Buyer Mode"
    commands:
      - tapOn:
          id: "mode-toggle-button"
      - waitForAnimationToEnd

# Now it must OFFER seller mode — i.e. we are in buyer mode. This is the real
# assertion of the helper, and it is the label (not the testID), because the
# testID is present in both modes.
- extendedWaitUntil:
    visible: "Switch to Seller Mode"
    timeout: 20000

# ── Return to the feed ──────────────────────────────────────────────────────
# MUST leave the app where it was found. Checking the mode requires opening the
# profile tab, and without coming back the app sits on Profile — so a flow that
# then taps a Browse control fails with "Element not found: Filters" while
# `assertVisible: "Bazaar"` still passes, because that is only the TAB LABEL.
# That regression hit flows which had been green minutes earlier
# (filter_by_category, filter_active_sellers), and the tab label passing is
# exactly what made it confusing.
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
