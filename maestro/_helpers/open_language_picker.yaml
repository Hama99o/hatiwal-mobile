appId: com.hatiwal.app
---
# Open the language picker on the Profile screen.
#
# WHY THIS EXISTS. All 8 rtl/ flows failed with `Element not found: .*پښتو.*` or
# `.*دری.*` because they tapped a language option DIRECTLY after landing on
# Profile. The option list is collapsed on mount (`languageOpen` starts false) and
# the row that expands it sits below the fold, so the options were never in the
# tree. The failure named the language, which read like a missing translation.
#
# Call this with the Profile screen already open. Afterwards the three options are
# on screen and can be tapped by `language-option-en` / `-ps` / `-fa`.
#
# Everything here is targeted by testID on purpose: the row's label is translated,
# and these flows run FROM Pashto and Dari, which is precisely when an English
# selector cannot work.

# The Preferences card is below the profile header, stats and quick actions.
# BE ON PROFILE FIRST.
#
# A language switch that flips direction RESTARTS the app (forceRTL + reloadApp),
# and it comes back on its INITIAL route — not on Profile, where it was when the
# switch was made. change_language_english switched to Pashto and then called this
# helper again: it scrolled a screen that has no language row at all, timed out,
# and failed with `No visible element found: id: language-row` after burning
# 8m19s. Every caller that switches language twice has the same shape, so the
# recovery belongs here rather than in each flow.
- runFlow:
    when:
      notVisible:
        id: "language-row"
    commands:
      - tapOn:
          id: "profile-tab"
      - waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "language-row"
    direction: DOWN
    timeout: 20000
    # centerElement HERE and almost nowhere else. Without it this row settles at
    # the very bottom of the viewport, under the FloatingTabBar that overlays that
    # edge, and Maestro taps an element's CENTRE — so the tap hit the tab bar and
    # the picker never opened. Two seller flows spent ~7 minutes each on that.
    #
    # It is NOT safe to apply broadly, which I learned by doing it to 161 sites and
    # breaking the Sign Out scroll: "Sign Out" and "Delete account" are the LAST
    # rows on Profile, so the list cannot scroll far enough to centre them and
    # `centerElement` times out on an element that is plainly on screen. Use it only
    # for a target with content BELOW it.
    centerElement: true

# The row is a toggle. If a previous step already expanded it, tapping again
# would CLOSE it — so only tap when the options are not already showing.
- runFlow:
    when:
      notVisible:
        id: "language-option-en"
    commands:
      - tapOn:
          id: "language-row"
      - waitForAnimationToEnd

# The gate: the option list is really open.
- extendedWaitUntil:
    visible:
      id: "language-option-en"
    timeout: 10000
