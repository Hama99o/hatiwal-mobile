appId: com.hatiwal.app
---
# Waits out the app RESTART that a theme switch causes (theme.store.ts:17-28 calls
# reloadApp() -> RNRestart.restart(), "reload for a clean apply"). The app comes
# back on its INITIAL route — the Bazaar feed — NOT on the screen the switch was
# made from, so callers must navigate explicitly afterwards.
#
# This used to wait only on `browse-tab`, which was TOOTHLESS: the tab bar is on
# screen BEFORE the restart as well, so the condition was already true and the wait
# returned instantly. The flow then tapped into an app that was about to be torn
# down, the restart discarded the navigation, and the flow carried on against the
# feed. That is what failed change_language_english ("No visible element found:
# Sign Out" — hunting the Profile screen's Sign Out through the Bazaar feed),
# profile_dark and theme_persists_after_navigate. The callers that stay on the feed
# never noticed, and change_language_pashto/dari only escaped because they go on to
# wait for Pashto text, which genuinely cannot exist until the restart is done.
#
# A listing card is the marker because it is FALSE BEFORE and TRUE AFTER: the
# switch is made from the Profile screen, which renders no ListingCard, and the
# feed we come back to is built from them. Waiting on it also proves the restarted
# app has finished booting and fetching, which is the actual precondition.
- extendedWaitUntil:
    visible:
      id: "browse-tab"
    timeout: 60000# ...but the marker is each mode's SEARCH BAR, not a listing card.
#
# A card is only false-before/true-after when the landing screen HAS content, and
# it does not always have any. run-380's contact_visibility died here after the
# full 45s: the failure screenshot shows the app on My Shop in SELLER mode
# reading "0 listings" over the "You haven't posted anything yet" empty state, so
# `seller-listing-card` was unreachable by construction — the wait could never
# have passed, however long it ran, and the flow's own subject (the WhatsApp
# field and the two visibility switches) was never reached.
#
# That mattered twice over, because `login.yaml` calls `ensure_english` BEFORE
# `ensure_buyer_mode`: the per-flow mode repair sits BEHIND this wait, so a
# leaked `seller_mode = true` (left by an earlier flow that failed between its
# two toggle presses) could not be repaired by the helper written to repair it.
# The order cannot simply be swapped — `ensure_buyer_mode` gates on the English
# label "Switch to Seller Mode" — so the barrier itself has to tolerate seller
# mode and an empty shop.
#
# Both ids below are rendered by their screen's HEADER, so they survive an empty
# list, cover either initial route, and are still absent on the Profile screen
# the switch is made from — which is the property that made a card better than
# `browse-tab` in the first place. Anchored-regex alternation matches either.
- extendedWaitUntil:
    visible:
      id: "(browse-search-bar|my-listings-search-input)"
    timeout: 45000
- waitForAnimationToEnd
