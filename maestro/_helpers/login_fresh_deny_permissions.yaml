appId: com.hatiwal.app
env:
  EMAIL: buyer@hatiwal.test
  PASSWORD: Password123!
---
# Sign in fresh, with runtime permissions DENIED at launch.
#
# THE POINT: Maestro GRANTS ALL RUNTIME PERMISSIONS on `launchApp` by default. That
# is why a flow could never see the location dialog — the app already had permission
# before it ran, so requestForegroundPermissionsAsync returned granted without
# asking, and `dumpsys package` showed granted=true after every flow no matter what
# was done beforehand. Neither `clearState` nor `pm reset-permissions` beforehand can
# beat it: the grant happens at launch, after both.
#
# `permissions: all: deny` is the control that actually works, and it belongs in the
# flow rather than a shell step for exactly that reason.
#
# Use this for flows whose subject is the PROMPT (or a refusal). Use
# login_fresh.yaml when the flow wants permissions already granted.

- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: open_bundle.yaml
- runFlow: goto_login.yaml

- tapOn:
    id: "login-email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}

# The keyboard hides "Sign In" on a small screen — scroll rather than tap blind.
# BY TESTID, not by the label. `auth.loginButton` is "Sign In" only in English, and
# login.yaml already targets `login-submit` for this exact reason. The testID also
# removes the ambiguity with any other "Sign In" text on the screen.
- scrollUntilVisible:
    element:
      id: "login-submit"
    direction: DOWN
    timeout: 15000
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn:
    id: "login-submit"

# ── Dismiss the NOTIFICATION prompt FIRST ───────────────────────────────────
# ORDER MATTERS, and getting it wrong cost two runs. On this path — and only this
# path, because permissions were denied — the app asks for notification permission
# immediately after login, with its own themed modal ("Allow Hatiwal to send you
# notifications?") that covers the whole screen INCLUDING the tab bar.
#
# So this must come before the signed-in assertion below: with the modal up,
# `"Me" is visible` fails even though login succeeded perfectly. Answering "Don't
# allow" keeps device state minimal — flows using this helper are about location,
# not notifications.
- extendedWaitUntil:
    visible: "Allow Hatiwal to send you notifications?"
    timeout: 30000
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- waitForAnimationToEnd

# ── Now prove we are signed in ──────────────────────────────────────────────
# "Me" present AND "Login" absent. Asserting "Bazaar" would not do — guests see it.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000
- assertNotVisible: "Login"
