appId: com.hatiwal.app
env:
  # Overridden per caller: `runFlow: {file: ../_helpers/open_listing_by_title.yaml,
  # env: {TITLE: "Wool Socks Bulk Pack - 12 Pairs"}}`. A default keeps the helper
  # runnable on its own while debugging.
  TITLE: "Men Winter Jacket XL Black"
---
# Open a listing from the BAZAAR FEED by its exact title, without scrolling.
#
# WHY THIS EXISTS. Flows used to reach a seeded listing with
# `scrollUntilVisible: {text: <title>, direction: DOWN}`, which is a race against
# the size of the feed — and it is a race the suite keeps losing as fixtures
# accumulate. In run-489, SIX flows failed with "No visible element found:
# <title>" while every one of those listings was present and active in the
# database and the feed rendered normally in the screenshots:
#
#   offer_counter_flow, offer_send_and_accept, offer_send_and_decline
#       -> "Men Winter Jacket XL Black"   (id 1947, active)
#   reserve_after_accept                -> "Traditional Kandahari Carpet 3x5"
#   reserve_after_buyer_accepts_counter -> "Wool Socks Bulk Pack - 12 Pairs"
#
# offer_counter_flow's timeout had ALREADY been raised from 8s to 20s for this
# exact symptom, with a note explaining that a scroll running out of TIME looks
# identical to a missing element. The seed now leaves 98 listings, so every added
# fixture lengthens the scroll and the next bump only postpones the failure.
# Search is O(1) in feed size.
#
# NO PRECONDITION — this helper puts itself on the Bazaar feed.
#
# It used to say "PRECONDITION: the caller is already on the Bazaar feed", and
# that footgun bit immediately on rollout: listing_detail_save_unsave calls this
# straight after `login.yaml`, and login.yaml ENDS ON THE PROFILE SCREEN — its
# last steps are `ensure_english` and `ensure_buyer_mode`, both of which work the
# profile's mode toggle. So `browse-search-input` was not on screen at all.
#
# That also corrects this file's own diagnosis of those flows. Their
# "No visible element found: <listing title>" was blamed on the feed growing too
# long for `scrollUntilVisible` — true for some callers, but for the
# straight-after-login ones the flow was simply standing on the WRONG SCREEN, and
# no scroll timeout would ever have fixed it.
#
# A helper that silently requires a screen its callers do not guarantee is worse
# than one that costs a tap, so: reach the feed, then insist on the search input
# rather than failing three steps later on a card that was never going to render.
- runFlow:
    when:
      notVisible:
        id: "browse-search-input"
    commands:
      - tapOn:
          id: "browse-tab"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "browse-search-input"
    timeout: 20000

- tapOn:
    id: "browse-search-input"
# LET THE FIELD TAKE FOCUS BEFORE TYPING.
#
# `tapOn` returns before the input is focused, and `inputText` then types into
# nothing for a few characters. Measured in run-495: two flows lost ~11 LEADING
# characters each — "Honda CG 125 Motorbike 2021" arrived as "5 Motorbike 2021",
# and "Sony 55 inch 4K Smart TV" as "nch 4K Smart TV". Both still matched by
# luck, because the search does partial matching and the tail was distinctive;
# a shorter title would have matched the wrong listing or nothing at all.
- waitForAnimationToEnd
- inputText: "${TITLE}"
- waitForAnimationToEnd

# PUT THE KEYBOARD AWAY BEFORE TAPPING ANYTHING.
#
# This is the defect that made reserved_buyer and listing_conversations fail in
# run-490, and the end-of-flow screenshot is unambiguous: the app still on the
# BROWSE screen, one result card rendered, and the IME covering the lower half of
# it. The card tap landed on the keyboard, Maestro reported it COMPLETED — a tap
# on a covered element always is — the app never navigated, and the flow then
# failed on a detail-screen button that was never going to be there.
#
# `hideKeyboard` is Android's Back, which is why this file's siblings warn about
# it. It is SAFE HERE and nowhere else in this helper: we have just typed, so the
# IME is definitely up, and the first Back with an IME up closes the IME without
# reaching the app. flow_lint's HIDEKEY rule encodes exactly that condition —
# typing before it.
#
# The search filters live as you type (the screenshot shows the result while the
# field still has focus), so dismissing costs no results.
# CORRECTED 2026-09-05: this was `hideKeyboard`, and that EXITED THE APP.
# hideKeyboard is Android's Back. It is safe only while the IME is definitely up,
# and after `inputText` on this screen it often is NOT — the field can lose focus
# on its own. Back then reaches the app and pops out of it. The proof is
# browse/listing_detail_held_units_transparency's failure screenshot from
# run-494: the ANDROID HOME SCREEN, on a flow that had passed twice before this
# change. The repo already carried that warning and I rolled the mistake into ten
# flows anyway.
#
# The margin drag sends NO key event, so it cannot reach the app whether or not
# the IME is up. That is the whole reason _helpers/dismiss_keyboard_by_drag.yaml
# exists.
- runFlow: dismiss_keyboard_by_drag.yaml
- waitForAnimationToEnd

# WAIT ON THE CARD, NOT ON THE TITLE — and this is the whole correctness argument
# for the helper.
#
# The title is now also the SEARCH INPUT's own text, so `visible: "${TITLE}"`
# would be satisfied by the field the caller just typed into, EVEN IF THE SEARCH
# RETURNED NOTHING. That turns an empty result set into a green wait followed by a
# tap on whatever card happens to be there — a false pass, which is worse than the
# failure it replaces. Waiting for `listing-card` proves a RESULT exists.
#
# (This is the same trap that swallowed 18 flows tonight on the dev-client
# launcher, whose URL field was pre-filled with the very string the flow was
# looking for. flow_lint's SEARCHTAP rule encodes it.)
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000

# index 0 is the match because the query is the EXACT FULL TITLE, so the result
# list is this one listing. By testID rather than by text, for the reason above.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd

# Prove we opened the intended listing before the caller acts on it. On the DETAIL
# screen there is no search field, so the title can only be the listing's own —
# and a wrong listing fails HERE rather than three steps later on a button that
# merely looks missing.
- assertVisible: "${TITLE}"
