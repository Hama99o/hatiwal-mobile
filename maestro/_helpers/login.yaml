appId: com.hatiwal.app
env:
  # Maestro evaluates ${...} as JAVASCRIPT, so the bash-style default this file
  # used to carry — ${EMAIL:-"buyer@hatiwal.test"} — did not mean "or default".
  # It evaluated to the number NaN, and every flow typed "NaN" into both the
  # email and password fields, then failed with "Invalid login credentials".
  # An `env:` block is Maestro's real default mechanism; --env still overrides it.
  EMAIL: buyer@hatiwal.test
  PASSWORD: Password123!
---
# Be logged in as the buyer. Included by ~190 flows, so its cost and its
# fragility are multiplied by 190 — this file is where both are controlled.
#
# WARM LAUNCH — deliberately no `clearState: true`.
# clearState wipes three things at once and each one cost us a fragile UI dance
# on EVERY flow:
#   1. the dev-client's remembered Metro server  -> launcher, type URL, Connect
#   2. the "developer menu" intro dismissal      -> sheet covering the screen
#   3. all app state, making the app first-run    -> onboarding carousel
# Together that was ~60s and ~10 brittle steps per flow (~3h across 213 flows).
# A warm launch keeps all of it settled and starts most flows already signed in.
#
# TRADE-OFF: less isolation between flows. State carries over, so a flow that
# genuinely needs a clean slate (onboarding, first-run, empty-state) must clear
# it itself with `launchApp: clearState: true` and then run open_bundle.yaml.
- launchApp

# Each of these no-ops when the app is already past that stage.
- runFlow: open_bundle.yaml
- runFlow: goto_login.yaml

# Sign in only if the login form is actually on screen; a warm app is usually
# already authenticated from the previous flow.
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "Email"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      - tapOn: "Sign In"
      - waitForAnimationToEnd

# Prove we are actually SIGNED IN, not merely on a screen.
#
# "Bazaar" is the wrong assertion: guests see it too, so this helper could
# report success while the app was still a guest — a false pass, which is worse
# than a failure because it hides everything downstream.
#
# The last tab is the tell: `app/(main)/(tabs)/_layout.tsx` titles it
# t("sidebar.profile") -> "Me" when authenticated, and t("auth.login") ->
# "Login" when not. So "Me" present AND "Login" absent means signed in.
# ── Dismiss the notification prompt BEFORE checking we are signed in ────────
# The app asks for notification permission right after a first successful login,
# with its own themed modal ("Allow Hatiwal to send you notifications?") that
# covers the whole screen INCLUDING the tab bar. So the signed-in assertion below
# fails on "Me" even though login worked perfectly.
#
# This was the single biggest failure class in the suite — 41 flows — and it
# appears whenever the APK has just been reinstalled, because the permission is
# then unasked. Answering "Don't allow" keeps device state minimal; no flow here
# tests notifications.
- extendedWaitUntil:
    visible: "Allow Hatiwal to send you notifications?"
    timeout: 20000
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Me"
    timeout: 60000
- assertNotVisible: "Login"

# ── And in BUYER mode ───────────────────────────────────────────────────────
# This is the buyer login helper — 142 flows include it — so it owes the same
# guarantee login_seller.yaml has always given for the seller side.
#
# Mode is persisted on the USER, not just locally, so it survives clearState AND
# crosses devices: any flow that switches this account to seller mode leaves every
# later buyer flow in seller mode. Seller mode has no "Bazaar" tab at all — the
# tabs become My Shop / Chats / Me — so a buyer flow then fails with "Element not
# found: Bazaar" or `"Bazaar" is visible` while being perfectly signed in.
# Confirmed by screenshot more than once: Ahmad Karimi (the buyer) on a green
# seller-mode profile.
- runFlow: ensure_buyer_mode.yaml
