appId: com.hatiwal.app
env:
  # Maestro evaluates ${...} as JAVASCRIPT, so the bash-style default this file
  # used to carry — ${EMAIL:-"buyer@hatiwal.test"} — did not mean "or default".
  # It evaluated to the number NaN, and every flow typed "NaN" into both the
  # email and password fields, then failed with "Invalid login credentials".
  # An `env:` block is Maestro's real default mechanism; --env still overrides it.
  EMAIL: buyer@hatiwal.test
  PASSWORD: Password123!
---
# Be logged in as the buyer. Included by ~190 flows, so its cost and its
# fragility are multiplied by 190 — this file is where both are controlled.
#
# WARM LAUNCH — deliberately no `clearState: true`.
# clearState wipes three things at once and each one cost us a fragile UI dance
# on EVERY flow:
#   1. the dev-client's remembered Metro server  -> launcher, type URL, Connect
#   2. the "developer menu" intro dismissal      -> sheet covering the screen
#   3. all app state, making the app first-run    -> onboarding carousel
# Together that was ~60s and ~10 brittle steps per flow (~3h across 213 flows).
# A warm launch keeps all of it settled and starts most flows already signed in.
#
# TRADE-OFF: less isolation between flows. State carries over, so a flow that
# genuinely needs a clean slate (onboarding, first-run, empty-state) must clear
# it itself with `launchApp: clearState: true` and then run open_bundle.yaml.
# STOP the app before launching it.
#
# A bare `launchApp` does not guarantee a fresh process: if the app is still
# running, Android brings the existing activity forward and ALL JS state survives
# — an open bottom sheet, applied browse filters, a half-finished form. Flows then
# inherit whatever the previous flow left behind, which is exactly how a run
# produces failures that have nothing to do with the flow being tested:
#
#   - listing_detail_report  → "profile-tab is visible" false, because the FILTERS
#     sheet from an earlier flow was still covering the tab bar (screenshotted).
#   - listing_detail_*       → assertions failing against a feed still filtered to
#     "Electronics 5000-∞" by a flow that ran minutes earlier.
#   - listing_detail_multi_quantity → landed on `login-email-input`, i.e. logged
#     out mid-suite.
#
# `stopApp` kills the process, so the next launch is a genuine cold start. It does
# NOT clear stored credentials the way `clearState: true` would, so the login below
# still short-circuits when a session is already valid. Costs a few seconds per
# flow; buys results that do not depend on execution order.
- stopApp
- launchApp

# Each of these no-ops when the app is already past that stage.
- runFlow: open_bundle.yaml

# A warm launch keeps the PREVIOUS flow's navigation. If that flow ended on a pushed
# screen — a listing form, a conversation, a gallery — there is no tab bar, and every
# step below that reaches for one fails on a screen this helper never expected. It cost
# chat/offer_counter_flow a run: the hierarchy at its failure was the Create Listing form
# ("Save Draft", "Publish", "Title *"), and the mode label ensure_buyer_mode waits for
# only exists on Profile.
#
# A cold restart rather than pressing Back: backing out of a half-filled listing form
# raises a discard confirm, and guessing how many backs and which dialog is in the way is
# exactly the brittleness the warm launch exists to avoid. stopApp keeps clearState off,
# so the session survives and the app simply comes back on its initial route.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - launchApp:
          stopApp: true
      - runFlow: open_bundle.yaml

# ── Wrong account? Sign out first. ──────────────────────────────────────────
# THE MIRROR OF login_seller.yaml's GUARD, which this file never had — and it is
# included by ~190 flows, so its absence was the widest failure cause in the suite.
#
# The sign-in below only fires when the login FORM is on screen. A warm app is
# usually already authenticated, and if the previous flow used login_seller.yaml
# it is authenticated AS THE SELLER — so a buyer flow silently ran as Omar Noori.
# Everything that depends on not owning the listing then quietly disappears:
#
#   report_listing   "Report" is behind `!isOwnListing`, so the More sheet held
#                    only Share and Close. The hierarchy proved it: three
#                    elements, no Report.
#   report_user /    you cannot report or block yourself.
#   block_user
#   Contact Seller   hidden on your own listing (`canContact` needs !isOwnListing).
#
# None of that reports as "wrong account" — it reports as a missing button, which
# is why it kept being read as a stale selector.
#
# "Omar Noori" is seller@hatiwal.test; the buyer is "Ahmad Karimi" (db/seeds/e2e.rb).

# THE WHOLE CHECK BELOW IS GATED ON `profile-tab` BEING VISIBLE — SO WAIT FOR IT.
#
# Without this the gate is evaluated the instant the app comes up, and a tab bar
# that has not mounted yet reads as "no profile-tab", which skips the ENTIRE
# wrong-account check. The flow then runs as whoever the previous flow left
# signed in — and the comment above spells out exactly what that looks like:
# "it reports as a missing button, which is why it kept being read as a stale
# selector."
#
# That is measured, not theoretical. run-497's seller pass and run-496's chat
# pass produced a whole family of it: reserved_buyer, listing_conversations and
# reserve_after_accept each log in via THIS helper as the buyer, open a
# seller-owned listing, and fail on "Make an Offer" not existing. The API says
# those listings are status=active, negotiable=true, seller="Omar Noori", and
# listingAvailability.ts says a non-owner buyer MUST get the Message/Offer row —
# so the only branch that can render instead is `isOwnListing`, i.e. the app was
# the OWNER. reserve_after_accept's screenshot is that branch: a lone Ban pill
# where the action row belongs.
#
# Same bug shape as the two already fixed in goto_login.yaml this session (a
# `when:` clause racing a screen that is still mounting), and the same shape of
# fix: give the thing a chance to exist before deciding it does not.
#
# `optional: true` — a signed-OUT app sits on the login screen with no tab bar at
# all, and that is a legitimate state the sign-in block below handles. This must
# give the bar a chance, never demand it.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible:
        id: "profile-tab"
    commands:
      - tapOn:
          id: "profile-tab"
      - waitForAnimationToEnd
      # BACK TO THE TOP OF PROFILE BEFORE READING THE NAME.
      #
      # The Profile screen KEEPS ITS SCROLL POSITION: the tab navigator leaves it
      # mounted, so a warm launch inherits wherever the last flow left it. The header
      # — and `profile-display-name`, which the guard below reads — is then off screen,
      # the guard concludes "not the expected user" about the RIGHT user, and the
      # helper goes hunting Sign Out for no reason. Observed exactly that on
      # 2026-08-28 while verifying QA-BUG4: Omar Noori's own profile, arrived at
      # scrolled to PERSONAL INFO, and login_seller.yaml then failed its OWN
      # `"Switch to .*"` gate — because that gate does not scroll either, and the
      # pointless sign-out scroll had pushed the mode toggle off the top.
      #
      # `optional`, and legitimately so: on a signed-OUT app this element does not
      # exist at all, which is a valid state the guard below already handles. It is
      # not masking a miss — the very next step re-reads the same element.
      - scrollUntilVisible:
          element:
            id: "profile-display-name"
          direction: UP
          timeout: 10000
          optional: true
      # Sign out unless we are ALREADY the intended account.
      #
      # This used to trigger on ONE known-wrong identity, so any OTHER account
      # sailed through. Flows that REGISTER leave a throwaway signed in
      # (account_delete_and_restore leaves "Delete Metest"), and every later flow
      # then ran as a stranger: edit_profile saved firstname "Ahmad Updated" onto
      # that account, the API returned 200, the profile rendered "Ahmad Updated
      # Metest", and the flow failed asserting "Ahmad Updated" — a green backend
      # and a red flow with nothing pointing at the real cause.
      #
      # Cost, accepted deliberately: two flows override EMAIL (maps/
      # map_location_outside_afghanistan uses the seller). For those this signs the
      # correct account out and straight back in — slower, same end state. The
      # alternative was interpolating ${EXPECT_NAME} into the condition, and
      # Maestro evaluates ${} as JavaScript; getting that wrong breaks the guard
      # for all ~190 callers at once, which is not worth saving two sign-ins.
      #
      # Inverted: anything that is not the expected user gets signed out. Every
      # step is `optional`, so a signed-OUT app (no name, no sign-out button) is a
      # no-op instead of a failure.
      - runFlow:
          when:
            # Scoped to the profile header's own name node. Guarding on the name appearing
            # ANYWHERE on this screen silently skipped the sign-out whenever the OTHER
            # party's name also rendered here (reviews, recent chats): meetup_decline ran
            # its whole second leg still signed in as the buyer, so Accept/Decline — gated
            # on `!isMine` — never rendered and the flow blamed a missing button.
            notVisible:
              id: "profile-display-name"
              text: ".*Ahmad Karimi.*"
          commands:
            - scrollUntilVisible:
                element:
                  id: "sign-out-button"
                direction: DOWN
                timeout: 10000
                optional: true
            # ...then act ONLY if the button is really there. `optional: true` on the TAP was
            # the hole: a sign-out that failed to land said nothing and the flow carried on as
            # the WRONG USER. safety_tips_listing_detail ran as the seller and its screenshot
            # proves it — "Expires in 30 days" is the ExpiryBadge, which ListingDetail renders
            # only when isOwnListing, and Contact Seller is correctly hidden on your own
            # listing. The flow then failed asserting it, blaming the app.
            #
            # Gating on the button being PRESENT keeps the signed-out case a clean no-op while
            # making a failed sign-out impossible to miss.
            - runFlow:
                when:
                  visible:
                    id: "sign-out-button"
                commands:
                  - tapOn:
                      id: "sign-out-button"
                  - waitForAnimationToEnd
                  # CONFIRM THE DIALOG BY RESOURCE-ID, NEVER BY ITS LABEL.
                  #
                  # handleLogout (Profile.tsx) raises a confirmAlert -> React Native
                  # `Alert.alert`, whose confirm button is `t("profile.logout")` — the SAME
                  # translated word as the row that opened it. This step used to be
                  # `tapOn: {text: "Sign Out", optional: true}`, which was wrong twice over:
                  #
                  #   * ENGLISH ONLY. In Pashto that button reads "وتل", so the step matched
                  #     nothing — and being `optional`, it reported nothing either. The dialog
                  #     stayed open; a native Alert is its own window, so the app's own views
                  #     drop out of Maestro's hierarchy and the NEXT step failed on
                  #     `id: profile-tab` — a tab bar that was present and merely covered.
                  #     Screenshot: run-266 rtl/listing_detail_rtl, the Pashto dialog
                  #     (`ایا ډاډه یاست چې وتل غواړئ؟`) still on screen. A clean A/B on the
                  #     same step in the same run: with the app back in English the identical
                  #     line logged `Tap on (Optional) "Sign Out" COMPLETED`.
                  #   * NOT OPTIONAL AT ALL. Reaching this line means the sign-out row WAS
                  #     tapped, so the dialog must be up. A miss has to fail HERE, loudly,
                  #     instead of three steps later on an unrelated selector.
                  #
                  # `android:id/button1` is the platform's positive button — React Native maps
                  # a 2-button Android alert as [0]=negative, [1]=positive, and handleLogout
                  # passes [Cancel, Sign Out]. It is identical in all three locales and exists
                  # only inside the dialog, so it cannot collide with the "Sign Out" row
                  # sitting behind the scrim. The tap itself lives in confirm_dialog.yaml,
                  # which several flows already use for exactly this reason.
                  #
                  # The explicit wait is for the host, not the app: on a loaded rig the alert
                  # can take longer to reach the hierarchy than tapOn's default lookup, and a
                  # failure here should say "the dialog never appeared", not "tap failed".
                  - extendedWaitUntil:
                      visible:
                        id: "android:id/button1"
                      timeout: 15000
                  - runFlow: confirm_dialog.yaml
            # Whether or not a sign-out happened, let the screen settle before the
            # sign-in block below inspects it.
            - waitForAnimationToEnd

- runFlow: goto_login.yaml

# Sign in only if the login form is actually on screen; a warm app is usually
# already authenticated from the previous flow.
- runFlow:
    # The GUARD has to be locale-independent too. Giving the inputs testIDs was
    # only half the job: this condition still read the translated PLACEHOLDER
    # "Email", so in Pashto or Dari it was false, the whole sign-in block was
    # skipped, and the gate below then waited 60s for a tab bar that could never
    # appear. Nine flows burned ~7m30s each on that.
    when:
      visible:
        id: "login-email-input"
    commands:
      # testIDs, not the translated labels. Every handle on the login screen used
      # to be English copy, so a locale left behind by an rtl flow made signing in
      # impossible — and signing in is the only route back to a language picker.
      - tapOn:
          id: "login-email-input"
      - inputText: ${EMAIL}
      - tapOn:
          id: "login-password-input"
      - inputText: ${PASSWORD}
      # HIDE THE KEYBOARD BEFORE SUBMITTING. The IME is up from the password
      # field and covers the lower half of the login screen, including this
      # button. Maestro still reports `Tap on "Sign In"... COMPLETED`, because the
      # element IS in the hierarchy and it taps its bounds — the touch just lands
      # on the keyboard instead. Nothing is submitted, no request appears in the
      # Rails log, and the screen keeps whatever "Error" was there before, so it
      # reads as a failed login rather than an unpressed button.
      #
      # Confirmed from a failing flow's hierarchy dump, which held
      # `key_pos_password_header_numbers` and the symbol row "! @ # $ % ^ & * ( )"
      # alongside the filled form.
      #
      # `hideKeyboard` is Back on Android, which is safe HERE precisely because an
      # IME is up to consume it — with no keyboard it would close a modal or exit
      # the app, which is how it broke create_listing_map_pin once.
      - hideKeyboard
      - waitForAnimationToEnd
      - tapOn:
          id: "login-submit"
      - waitForAnimationToEnd

# ── One retry on a transient network failure ────────────────────────────────
# The login screen renders an inline "Error" (common.error) when the sign-in
# request fails, leaving the form filled. A single tap has no second chance, and
# the first requests after a fresh emulator boot are unreliable: on a rig doctor
# had just declared green — including a TCP probe from the app's own UID to
# 10.0.2.2:3007 — the app still logged `[UniversalList] fetch error, [AxiosError:
# Network Error]` and no sign_in POST reached Rails at all. The flow then spent
# 60s waiting for a tab bar that could never appear.
#
# Tapping Sign In again is exactly what a person does, and it is BOUNDED at one:
# wrong credentials still fail twice, so this cannot turn a real auth failure
# green. Gated on the error being on screen, so it costs nothing normally.
#
# THE GATE MUST TRACK THE APP'S COPY. Login.tsx used to fall back to
# `t("common.error")` — the bare word "Error" — for a transport failure, which is
# what this gate was written against. It now routes through apiErrorMessage, so the
# same failure renders `common.errorNetwork`: "No connection. Check your internet
# and try again." A gate on "Error" alone would silently stop firing and this retry
# would protect nothing, for all ~200 flows that include this helper. Matching both
# strings, anchored, so a bare "Error" from any other path still counts.
- runFlow:
    when:
      visible: "(No connection.*|Error)"
    commands:
      - tapOn:
          id: "login-submit"
      - waitForAnimationToEnd

# Prove we are actually SIGNED IN, not merely on a screen.
#
# "Bazaar" is the wrong assertion: guests see it too, so this helper could
# report success while the app was still a guest — a false pass, which is worse
# than a failure because it hides everything downstream.
#
# The last tab is the tell: `app/(main)/(tabs)/_layout.tsx` titles it
# t("sidebar.profile") -> "Me" when authenticated, and t("auth.login") ->
# "Login" when not. So "Me" present AND "Login" absent means signed in.
# ── Dismiss the notification prompt BEFORE checking we are signed in ────────
# The app asks for notification permission right after a first successful login,
# with its own themed modal ("Allow Hatiwal to send you notifications?") that
# covers the whole screen INCLUDING the tab bar. So the signed-in assertion below
# fails on "Me" even though login worked perfectly.
#
# This was the single biggest failure class in the suite — 41 flows — and it
# appears whenever the APK has just been reinstalled, because the permission is
# then unasked. Answering "Don't allow" keeps device state minimal; no flow here
# tests notifications.
- extendedWaitUntil:
    visible: "Allow Hatiwal to send you notifications?"
    timeout: 20000
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- waitForAnimationToEnd

# The profile TAB, by testID — the proof that the tab bar mounted, i.e. that login
# actually landed. It used to gate on the text "Me", which is `sidebar.profile`:
# a TRANSLATED label. Every flow that runs in Pashto or Dari passes through this
# same gate, and the testID is identical in all three locales.
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000
- assertNotVisible: "Login"

# ── And in BUYER mode ───────────────────────────────────────────────────────
# This is the buyer login helper — 142 flows include it — so it owes the same
# guarantee login_seller.yaml has always given for the seller side.
#
# Mode is persisted on the USER, not just locally, so it survives clearState AND
# crosses devices: any flow that switches this account to seller mode leaves every
# later buyer flow in seller mode. Seller mode has no "Bazaar" tab at all — the
# tabs become My Shop / Chats / Me — so a buyer flow then fails with "Element not
# found: Bazaar" or `"Bazaar" is visible` while being perfectly signed in.
# Confirmed by screenshot more than once: Ahmad Karimi (the buyer) on a green
# seller-mode profile.
# BEFORE the mode check, not after: ensure_buyer_mode detects the mode from the
# toggle's LABEL ("Switch to Buyer Mode"), which only reads that way in English.
# In Pashto its 30s gate on "Switch to .*" cannot match, so a leaked locale broke
# the mode guard too.
- runFlow: ensure_english.yaml

- runFlow: ensure_buyer_mode.yaml
