appId: com.hatiwal.app
---
# Reach the LOGIN screen from a first-run app.
#
# The real first-run path is:
#   onboarding carousel --Skip--> guest Bazaar --Login tab--> login screen
# Skipping onboarding alone lands on guest browse, which is what the guest_*
# flows want — so the extra hop to Login lives here rather than in
# skip_onboarding.yaml.
- runFlow: skip_onboarding.yaml
# The guest tab, by testID. Its label is `auth.login` — translated — so in Pashto
# or Dari this optional tap silently did nothing, the app never reached the login
# screen, and every caller then failed at its auth gate. `profile-tab` is the same
# control in all three locales (it reads "Login" for a guest, "Me" once signed in).
- tapOn:
    id: "profile-tab"
    optional: true
- waitForAnimationToEnd
# That tap is `optional`, so a miss is SILENT — and the caller then fails on the
# first field with `Element not found: Text matching regex: Email`, which reads as
# a broken form when the truth is the app never left guest Bazaar.
# create_listing_multi_quantity burned 4m23s that way in cycle 6. So: retry the tab
# if the login screen is not up, then wait for the screen's own marker before
# handing control back.
- runFlow:
    when:
      notVisible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "profile-tab"
          optional: true
      - waitForAnimationToEnd
# NO *HARD* WAIT for the form here. This helper is also called on a WARM, already
# authenticated app, where the login screen correctly never appears — asserting it
# made listing_actions_sheet fail at 104s on `login-email-input is visible` for an
# app that was simply already signed in. The retry above is what fixes the silent
# miss.
#
# CORRECTED 2026-09-05: this note used to end "callers that genuinely need the
# form (login.yaml) already gate their sign-in on it being on screen, and fail
# with a clear message if it is not." The first half is true; the second is not,
# and the difference is the whole bug. login.yaml's gate is
# `when: visible: {id: login-email-input}` — when that is false it SKIPS the
# sign-in block SILENTLY and returns success. The flow then carries on
# unauthenticated and dies somewhere unrelated: on `profile-tab`, on
# `"Switch to .*"`, on a conversation row a guest can never see.
#
# Measured in run-495/496, not theorised. The end-of-flow screenshots are
# unambiguous — the login screen with an EMPTY form and NO error banner, i.e.
# nothing was ever typed. (A genuine network failure looks different: fields
# FILLED, red "No connection" banner. See the discriminator table at the end of
# qa/PENDING_RIG_FIXES.md.) And the backend was never at fault: every
# POST /api/v1/auth/sign_in that a flow actually submitted returned 200 in
# ~950ms.
#
# login.yaml's own header records this identical failure SHAPE from a different
# cause — the guard once read the translated placeholder "Email", so it was false
# in Pashto and Dari and "nine flows burned ~7m30s each on that". That was the
# locale cause. This is the timing cause, left behind.
- waitForAnimationToEnd

# So: give the form a CHANCE to appear, without ever demanding it.
#
# This is deliberately NOT the hard wait described above. Two guards keep it from
# repeating that mistake:
#   1. it only runs when `profile-display-name` (Profile.tsx:684) is absent, so an
#      authenticated app — which lands on Profile — skips it outright and pays
#      nothing. That matters at ~250 flows per cycle.
#   2. `optional: true`, so "no form ever appeared" stays a legitimate outcome
#      rather than a failure.
- runFlow:
    when:
      notVisible:
        id: "profile-display-name"
    commands:
      - extendedWaitUntil:
          visible:
            id: "login-email-input"
          timeout: 15000
          optional: true
