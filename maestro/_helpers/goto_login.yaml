appId: com.hatiwal.app
---
# Reach the LOGIN screen from a first-run app.
#
# The real first-run path is:
#   onboarding carousel --Skip--> guest Bazaar --Login tab--> login screen
# Skipping onboarding alone lands on guest browse, which is what the guest_*
# flows want — so the extra hop to Login lives here rather than in
# skip_onboarding.yaml.
- runFlow: skip_onboarding.yaml
# The guest tab, by testID. Its label is `auth.login` — translated — so in Pashto
# or Dari this optional tap silently did nothing, the app never reached the login
# screen, and every caller then failed at its auth gate. `profile-tab` is the same
# control in all three locales (it reads "Login" for a guest, "Me" once signed in).
- tapOn:
    id: "profile-tab"
    optional: true
- waitForAnimationToEnd
# That tap is `optional`, so a miss is SILENT — and the caller then fails on the
# first field with `Element not found: Text matching regex: Email`, which reads as
# a broken form when the truth is the app never left guest Bazaar.
# create_listing_multi_quantity burned 4m23s that way in cycle 6. So: retry the tab
# if the login screen is not up, then wait for the screen's own marker before
# handing control back.
- runFlow:
    when:
      notVisible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "profile-tab"
          optional: true
      - waitForAnimationToEnd
# NO hard wait for the form here. This helper is also called on a WARM, already
# authenticated app, where the login screen correctly never appears — asserting it
# made listing_actions_sheet fail at 104s on `login-email-input is visible` for an
# app that was simply already signed in. The retry above is what fixes the silent
# miss; callers that genuinely need the form (login.yaml) already gate their
# sign-in on it being on screen, and fail with a clear message if it is not.
- waitForAnimationToEnd
