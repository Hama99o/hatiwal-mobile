appId: com.hatiwal.app
---
# Conversations list: scroll to bottom loads next page, pull-to-refresh works

- runFlow: ../_helpers/login.yaml
- tapOn: "Chats"
- waitForAnimationToEnd
- assertVisible: "Messages"

# Scroll through conversation list
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd

# Pull-to-refresh
- swipe:
    direction: DOWN
    duration: 800
- waitForAnimationToEnd
- assertVisible: "Messages"
