appId: com.hatiwal.app
---
# My Listings: scroll to bottom loads next page, pull-to-refresh reloads

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"

# Scroll through the list
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd

# Pull-to-refresh
- swipe:
    direction: DOWN
    duration: 800
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
