appId: com.hatiwal.app
---
# Bazaar feed: scroll to bottom triggers next page, pull-to-refresh reloads

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Scroll down three times to trigger pagination
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd

# More cards should have loaded — feed is not empty
- assertVisible: "Bazaar"

# Pull-to-refresh: swipe down from top of list
- swipe:
    direction: DOWN
    duration: 800
- waitForAnimationToEnd

# Feed still shows after refresh
- assertVisible: "Bazaar"
