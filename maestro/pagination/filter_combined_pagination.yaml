appId: com.hatiwal.app
---
# Category filter applied → scroll to paginate → filter still active on page 2

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Apply category filter
# NOT "Filter" (`common.filter`, a dead key). The control renders "Filters", and
# Maestro matches the full string, so "Filter" never matched it. The testID from
# BrowseHeader.tsx is immune to both the plural and the locale.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# The filter sheet's confirm button is `browse.filters.apply` = "Show results".
- tapOn: "Show results"
- waitForAnimationToEnd
# Filter chip visible — confirms filter is active
- assertVisible: "Electronics"
# Scroll to bottom to trigger page 2
# `scroll` takes no arguments in Maestro — a bare `- scroll` scrolls down.
# The `direction`/`duration` map made this flow unparseable, so the
# combined filter+pagination path was never actually tested.
- scroll
- waitForAnimationToEnd
# `scroll` takes no arguments in Maestro — a bare `- scroll` scrolls down.
# The `direction`/`duration` map made this flow unparseable, so the
# combined filter+pagination path was never actually tested.
- scroll
- waitForAnimationToEnd
# Filter chip still present — category filter survived pagination
- assertVisible: "Electronics"
# Results are still filtered (not all categories showing)
- assertNotVisible: "All Categories"
