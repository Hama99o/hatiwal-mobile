appId: com.hatiwal.app
---
# Block user: their listings disappear from browse feed

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Open a listing from seller@hatiwal.test
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# The seller ROW, by testID — not the section heading above it. "Seller"
# (listing.detail.seller) is real copy, which is why this looked right: it is the
# heading on ListingDetail:674, and tapping a heading does nothing, so the flow
# stayed on the detail screen and failed on the profile assertion afterwards. The
# tappable thing is the UserIdentity row, which shows the seller's NAME. ("Seller
# Name", used by two of these flows, is placeholder text the app never rendered.)
# scrollUntilVisible, because `tapOn` never scrolls to its target and the seller
# row sits BELOW THE FOLD on listing detail — the hierarchy at failure held
# save-toggle-button, more-options-button, price, location and view count, and
# stopped at the posted date. `Element not found: seller-profile-link` therefore
# meant "off screen", not "missing testID".
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-profile-link"
- waitForAnimationToEnd
# NOT "Seller Profile" — that is only the LOADING/ERROR header. Once the profile
# loads, HeaderBar shows the person's NAME instead (UserProfile.tsx), so asserting
# the static title is a race the loaded screen always wins. "Active Listings" is a
# literal stat label in ProfileHeader and is there for every profile.
- assertVisible: "Active Listings"

# Block user
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Block User"
- waitForAnimationToEnd
# `chat.block.blockConfirmTitle` = "Block this user?".
- assertVisible: "Block this user?"
# `chat.block.blockUser` = "Block User".
- tapOn: "Block User"
- waitForAnimationToEnd
# A TOAST, not a persistent element — it is gone within a few seconds, and the
# `waitForAnimationToEnd` before this can outlast it, so asserting it is a race
# the toast usually loses. `optional` keeps the check without letting it decide
# the flow; the DURABLE proof follows: the action flips to "Unblock User".
- assertVisible:
    text: "User blocked"
    optional: true
- extendedWaitUntil:
    visible: "Unblock User"
    timeout: 15000

# Back to Bazaar — blocked user's listings gone
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Confirm by checking listing count changed (or just that Bazaar loaded)
- assertVisible: "Bazaar"

# ── UNBLOCK, so the block does not leak into every later flow ───────────────
# A block is persisted on the USER, so leaving it set hides the seller's listings
# from the buyer for the rest of the cycle — every later browse and chat flow then
# fails, nowhere near this one, until the next re-seed. report/block_user.yaml has
# always unblocked at the end; these two did not.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Blocked Users"
    direction: DOWN
    timeout: 20000
- tapOn: "Blocked Users"
- waitForAnimationToEnd
# The row's button is `profile.blocked.unblockAction` = "Unblock", by testID
# (`unblock_button_<id>`), and it opens a confirmAlert whose confirm button is
# `profile.blocked.unblockConfirm` = "Yes, unblock" — tapping only the first leaves
# the dialog open and the block in place.
- runFlow:
    when:
      visible:
        id: "unblock_button_\\d+"
    commands:
      - tapOn:
          id: "unblock_button_\\d+"
          index: 0
      - waitForAnimationToEnd
      - tapOn: "Yes, unblock"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "User unblocked"
          timeout: 20000
