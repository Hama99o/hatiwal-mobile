appId: com.hatiwal.app
---
# Block user: their listings disappear from browse feed

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd

# Open a listing from seller@hatiwal.test
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- tapOn: "Seller Name"
- waitForAnimationToEnd
# "Active Listings" is only the LOADING/ERROR header. Once the profile loads,
# HeaderBar shows the person's NAME instead (UserProfile.tsx), so asserting the
# static title is a race the loaded screen always wins. "Active Listings" is a
# literal stat label in ProfileHeader and is there for every profile.
- assertVisible: "Active Listings"

# Block user
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Block User"
- waitForAnimationToEnd
- assertVisible: "Are you sure you want to block"
- tapOn: "Block"
- waitForAnimationToEnd
- assertVisible: "User blocked"

# Back to Bazaar — blocked user's listings gone
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Confirm by checking listing count changed (or just that Bazaar loaded)
- assertVisible: "Bazaar"
