appId: com.hatiwal.app
---
# Block a user from their public profile page

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
# SEARCH, DO NOT SCROLL. This used to be `scrollUntilVisible` on the title with
# centerElement and a 15s timeout, and it failed at this very step in run-532 —
# as did report_listing_no_reason and block_user, which carried the identical
# opening. All three died on "No visible element found: Wool Blanket Handmade King Size".
#
# The fixture was never missing: verified over HTTP at feed position 15 of 69
# browsable listings, status active, and the buyer holds ZERO blocks (the
# "block_user_hides_listings poisoned the feed" theory was checked and killed).
#
# THE CONTROL, from the SAME RUN and the same feature: report_user_then_block
# opens its listing by SEARCHING (browse-search-input + inputText) and got all
# the way to the "Unblock User" assertion — i.e. past the opening — while the
# three scrolling flows all died at it. Same box, same load, same moment. The
# only difference in the opening is scroll versus search.
#
# Scrolling is also O(feed size) and the feed keeps growing: ~14% of it is
# "QA Disposable ..." debris left by write-flows, and it sorts newest-first, so
# every run pushes the real fixtures further down. Searching is O(1) in feed size.
#
# Nothing is lost by converting: this flow asserts nothing on the feed CARD — it
# scrolled only in order to tap through to the detail screen.
- runFlow:
    file: ../_helpers/open_listing_by_title.yaml
    env:
      TITLE: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
# The seller ROW, by testID — not the section heading above it. "Seller"
# (listing.detail.seller) is real copy, which is why this looked right: it is the
# heading on ListingDetail:674, and tapping a heading does nothing, so the flow
# stayed on the detail screen and failed on the profile assertion afterwards. The
# tappable thing is the UserIdentity row, which shows the seller's NAME. ("Seller
# Name", used by two of these flows, is placeholder text the app never rendered.)
# scrollUntilVisible, because `tapOn` never scrolls to its target and the seller
# row sits BELOW THE FOLD on listing detail — the hierarchy at failure held
# save-toggle-button, more-options-button, price, location and view count, and
# stopped at the posted date. `Element not found: seller-profile-link` therefore
# meant "off screen", not "missing testID".
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "seller-profile-link"
- waitForAnimationToEnd
# NOT "Seller Profile" — that is only the LOADING/ERROR header. Once the profile
# loads, HeaderBar shows the person's NAME instead (UserProfile.tsx), so asserting
# the static title is a race the loaded screen always wins. "Active Listings" is a
# literal stat label in ProfileHeader and is there for every profile.
- assertVisible: "Active Listings"
# Block user
# OPEN THE ⋮ MENU FIRST. On UserProfile, Block/Unblock/Report live in ActionMenu
# behind `more-menu` — they are not on the screen itself, so tapping them
# directly reported `Element not found: Text matching regex: Block User` on a
# profile that was rendering perfectly.
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Block User"
- waitForAnimationToEnd
- assertVisible: "Block this user?"
# Maestro matches the FULL string as a regex, and the real copy continues
# "…and their listings will be hidden." (profile.blockConfirmMessage), so the
# bare prefix never matched. `.*` makes it a prefix match on purpose.
- assertVisible: "Blocked users cannot contact you.*"
- tapOn: "Block User"
- waitForAnimationToEnd
# WAIT FOR THE MUTATION TO SETTLE FIRST, then reopen the menu. blockMutation's
# onSuccess does setIsBlocked(true) AND setMenuVisible(false), so reopening the
# menu while the request is still in flight means the success handler CLOSES the
# menu a moment later and "Unblock User" never appears. The toast is the signal
# that it landed, so it is waited for rather than treated as optional — and there
# is deliberately no `waitForAnimationToEnd` before it, which is what used to eat
# the toast.
- extendedWaitUntil:
    visible: "User blocked"
    timeout: 20000
# ...and then wait for the toast to CLEAR before touching the header. It is an
# overlay: while it is up, a tap aimed at `more-menu` can land on the toast
# instead, so the menu never opens and the next step polls a screen with no menu
# on it for 15s. That is how this failed on `"Unblock User" is visible` even with
# the mutation settled.
- extendedWaitUntil:
    notVisible: "User blocked"
    timeout: 20000
# The profile shows NO persistent blocked state (UI-035) — `isBlocked` feeds only
# ActionMenu — so the flipped menu item is the app's one lasting signal.
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Unblock User"
    timeout: 15000
# Do NOT close the menu here. The flipped item is both the proof the block landed
# (UI-035: the profile itself shows no blocked state) and where the unblock lives,
# so both happen from this one open menu. My first version tapped "Cancel" and
# then asserted "Unblock User" — which had just been closed along with the menu.

# Unblock from the menu that is already open.
- tapOn: "Unblock User"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "User unblocked"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "User unblocked"
    timeout: 20000

# The item has flipped back. unblockMutation.onSuccess closes the menu too, so
# this needs its own reopen — then CLOSE it, because an open ActionMenu is a modal
# covering the tab bar (`Element not found: browse-tab`).
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Block User"
    timeout: 15000
- tapOn: "Cancel"
- waitForAnimationToEnd
