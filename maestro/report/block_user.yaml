appId: com.hatiwal.app
---
# Block a user from their public profile page

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
# The seller ROW, by testID — not the section heading above it. "Seller"
# (listing.detail.seller) is real copy, which is why this looked right: it is the
# heading on ListingDetail:674, and tapping a heading does nothing, so the flow
# stayed on the detail screen and failed on the profile assertion afterwards. The
# tappable thing is the UserIdentity row, which shows the seller's NAME. ("Seller
# Name", used by two of these flows, is placeholder text the app never rendered.)
# scrollUntilVisible, because `tapOn` never scrolls to its target and the seller
# row sits BELOW THE FOLD on listing detail — the hierarchy at failure held
# save-toggle-button, more-options-button, price, location and view count, and
# stopped at the posted date. `Element not found: seller-profile-link` therefore
# meant "off screen", not "missing testID".
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-profile-link"
- waitForAnimationToEnd
# NOT "Seller Profile" — that is only the LOADING/ERROR header. Once the profile
# loads, HeaderBar shows the person's NAME instead (UserProfile.tsx), so asserting
# the static title is a race the loaded screen always wins. "Active Listings" is a
# literal stat label in ProfileHeader and is there for every profile.
- assertVisible: "Active Listings"
# Block user
# OPEN THE ⋮ MENU FIRST. On UserProfile, Block/Unblock/Report live in ActionMenu
# behind `more-menu` — they are not on the screen itself, so tapping them
# directly reported `Element not found: Text matching regex: Block User` on a
# profile that was rendering perfectly.
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Block User"
- waitForAnimationToEnd
- assertVisible: "Block this user?"
# Maestro matches the FULL string as a regex, and the real copy continues
# "…and their listings will be hidden." (profile.blockConfirmMessage), so the
# bare prefix never matched. `.*` makes it a prefix match on purpose.
- assertVisible: "Blocked users cannot contact you.*"
- tapOn: "Block User"
- waitForAnimationToEnd
# A TOAST, not a persistent element — it is gone within a few seconds, and the
# `waitForAnimationToEnd` before this can outlast it, so asserting it is a race
# the toast usually loses. `optional` keeps the check without letting it decide
# the flow; the DURABLE proof follows: the action flips to "Unblock User".
- assertVisible:
    text: "User blocked"
    optional: true
- extendedWaitUntil:
    visible: "Unblock User"
    timeout: 15000
# Profile now shows "Unblock User" option
- assertVisible: "Unblock User"
# Unblock
- tapOn: "Unblock User"
- waitForAnimationToEnd
# Toast again — the durable proof is the action flipping back to "Block User".
- assertVisible:
    text: "User unblocked"
    optional: true
- extendedWaitUntil:
    visible: "Block User"
    timeout: 15000
