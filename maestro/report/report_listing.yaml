appId: com.hatiwal.app
---
# Report a listing — bottom sheet, select reason, submit, toast shown

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards. The comment above it said "open a
# listing detail" the whole time.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
# Tap report
# "Report" lives inside the MORE sheet (ListingDetail:1037), not on the detail
# screen — so tapping it directly could never work. `more-options-button` is the
# icon-only overlay control that opens the sheet.
- tapOn:
    id: "more-options-button"
- waitForAnimationToEnd
- tapOn: "Report"
- waitForAnimationToEnd
# Bottom sheet opens
- assertVisible: "Why are you reporting this?"
- assertVisible: "Spam"
- assertVisible: "Fraud or scam"
- assertVisible: "Prohibited item"
# Select a reason
- tapOn: "Spam"
# Add optional description
- tapOn: "Describe the issue in more detail..."
- inputText: "This listing is spam"
# Submit
- tapOn: "Submit Report"
- waitForAnimationToEnd
# Success toast
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Report submitted. Thank you."
    timeout: 15000
