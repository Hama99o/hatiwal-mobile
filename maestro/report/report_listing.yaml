appId: com.hatiwal.app
---
# Report a listing — bottom sheet, select reason, submit, toast shown

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards. The comment above it said "open a
# listing detail" the whole time.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
# Tap report
# "Report" lives inside the MORE sheet (ListingDetail:1037), not on the detail
# screen — so tapping it directly could never work. `more-options-button` is the
# icon-only overlay control that opens the sheet.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "more-options-button"
    timeout: 20000
- tapOn:
    id: "more-options-button"
- waitForAnimationToEnd
- tapOn: "Report"
- waitForAnimationToEnd
# Bottom sheet opens
- assertVisible: "Why are you reporting this?"
- assertVisible: "Spam"
- assertVisible: "Fraud or scam"
- assertVisible: "Prohibited item"
# Select a reason
- tapOn: "Spam"
# Add optional description
- tapOn: "Describe the issue in more detail..."
- inputText: "This listing is spam"
# Submit
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Submit Report"
- waitForAnimationToEnd
# Success toast
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
# Either answer is correct, and that is deliberate. A Report row is UNIQUE per
# reporter+target (report.rb, message: :already_reported) and nothing clears it
# between cycles, so this flow's FIRST run creates
# reporter=buyer -> Listing(Wool Blanket) and every run after it gets
# report.errors.duplicate instead of report.success. Asserting only success made the
# flow pass exactly once per seeded database. report_participant had the same bug and
# failed the moment its row existed.
- extendedWaitUntil:
    visible: "Report submitted. Thank you.|You have already reported this."
    timeout: 15000

# ── Reporting the same listing twice is refused ─────────
# Coverage moved here rather than lost: the duplicate rule was only checked for USER
# reports (report_participant) and never for listings. Strict, because by this point
# a report definitely exists — either this run made it or an earlier one did.
- tapOn:
    id: "more-options-button"
- waitForAnimationToEnd
- tapOn: "Report"
- waitForAnimationToEnd
- assertVisible: "Why are you reporting this?"
- tapOn: "Spam"
- waitForAnimationToEnd
- tapOn: "Submit Report"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*already reported.*"
    timeout: 15000
