appId: com.hatiwal.app
---
# Report a user from their seller profile

- runFlow: ../_helpers/login.yaml
- waitForAnimationToEnd
# Open a listing and tap on the seller's name
- tapOn: "Contact Seller"
- waitForAnimationToEnd
- scrollUntilVisible:
    text: "Seller"
- tapOn: "Seller"
- waitForAnimationToEnd
# On seller profile page — tap Report User
- tapOn: "Report User"
- waitForAnimationToEnd
- assertVisible: "Why are you reporting this?"
- tapOn: "Fraud or scam"
- tapOn: "Submit Report"
- waitForAnimationToEnd
- assertVisible: "Report submitted. Thank you."
