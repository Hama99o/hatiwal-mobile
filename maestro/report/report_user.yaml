appId: com.hatiwal.app
---
# Report a user from their seller profile — happy path (decline block)

- runFlow: ../_helpers/login.yaml
- waitForAnimationToEnd
# Open a listing and tap on the seller's name
- tapOn: "Contact Seller"
- waitForAnimationToEnd
- scrollUntilVisible:
    text: "Seller"
- tapOn: "Seller"
- waitForAnimationToEnd
# On seller profile page — tap Report User
- tapOn: "Report User"
- waitForAnimationToEnd
- assertVisible: "Why are you reporting this?"
- tapOn: "Fraud or scam"
- tapOn: "Submit Report"
- waitForAnimationToEnd
# Success toast appears
- assertVisible: "Report submitted. Thank you."
- waitForAnimationToEnd
# Block follow-up dialog appears — decline it
- assertVisible: "Block this user?"
- tapOn: "Not now"
- waitForAnimationToEnd
# Sheet is closed; no block toast
