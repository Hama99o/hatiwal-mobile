appId: com.hatiwal.app
---
# Blocked user: "Contact Seller" button disabled or shows blocked message

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Open a listing
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Get seller name for reference
# The seller ROW, by testID — not the section heading above it. "Seller"
# (listing.detail.seller) is real copy, which is why this looked right: it is the
# heading on ListingDetail:674, and tapping a heading does nothing, so the flow
# stayed on the detail screen and failed on the profile assertion afterwards. The
# tappable thing is the UserIdentity row, which shows the seller's NAME. ("Seller
# Name", used by two of these flows, is placeholder text the app never rendered.)
# scrollUntilVisible, because `tapOn` never scrolls to its target and the seller
# row sits BELOW THE FOLD on listing detail — the hierarchy at failure held
# save-toggle-button, more-options-button, price, location and view count, and
# stopped at the posted date. `Element not found: seller-profile-link` therefore
# meant "off screen", not "missing testID".
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "seller-profile-link"
- waitForAnimationToEnd

# Block from seller profile
# OPEN THE ⋮ MENU FIRST. On UserProfile, Block/Unblock/Report live in ActionMenu
# behind `more-menu`, so tapping them directly reported `Element not found: Text
# matching regex: Block User` on a profile that was rendering perfectly. Exactly
# ONE tap: with the menu already open, `more-menu` sits behind the modal and is
# not in the tree, so a second tap fails with `Element not found: more-menu`.
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Block User"
- waitForAnimationToEnd
# `chat.block.blockUser` = "Block User".
- tapOn: "Block User"
- waitForAnimationToEnd
# WAIT FOR THE MUTATION TO SETTLE FIRST, then reopen the menu. blockMutation's
# onSuccess does setIsBlocked(true) AND setMenuVisible(false), so reopening the
# menu while the request is still in flight means the success handler CLOSES the
# menu a moment later and "Unblock User" never appears. The toast is the signal
# that it landed, so it is waited for rather than treated as optional — and there
# is deliberately no `waitForAnimationToEnd` before it, which is what used to eat
# the toast.
- extendedWaitUntil:
    visible: "User blocked"
    timeout: 20000
# ...and then wait for the toast to CLEAR before touching the header. It is an
# overlay: while it is up, a tap aimed at `more-menu` can land on the toast
# instead, so the menu never opens and the next step polls a screen with no menu
# on it for 15s. That is how this failed on `"Unblock User" is visible` even with
# the mutation settled.
- extendedWaitUntil:
    notVisible: "User blocked"
    timeout: 20000
# The profile shows NO persistent blocked state (UI-035) — `isBlocked` feeds only
# ActionMenu — so the flipped menu item is the app's one lasting signal.
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Unblock User"
    timeout: 15000
# CLOSE IT. An open ActionMenu is a modal: it covers the tab bar, so the next tab
# tap fails with `Element not found: browse-tab` — which is how
# block_user_hides_listings failed.
- tapOn: "Cancel"
- waitForAnimationToEnd

# ── What blocking actually does to messaging ────────────────────────────────
# The old steps here could not work, and their premise was wrong twice over:
#
#   `- back` then `assertVisible: "Bazaar"` — one back lands on the LISTING
#   DETAIL, which is outside app/(main)/(tabs), so there is no tab bar and no
#   "Bazaar" label to see.
#
#   then `tapOn: listing-card` and `assertNotVisible: "Contact Seller"` — a
#   detail screen has no cards, and once back on the feed the blocked seller's
#   listings are HIDDEN, so index 0 is somebody else's listing, where Contact
#   Seller is present and correct. The assertion would fail on healthy behaviour.
#
# Hiding the listings IS how blocking prevents contact: with the listing gone from
# the feed there is no route to the composer. So that is what this asserts —
# the seller's own listing absent, and the feed still working (someone else's card
# present, not an empty screen, which would pass for the wrong reason).
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- assertNotVisible: "Wool Blanket Handmade King Size"

# ── UNBLOCK, so the block does not leak into every later flow ───────────────
# A block is persisted on the USER, so leaving it set hides the seller's listings
# from the buyer for the rest of the cycle — every later browse and chat flow then
# fails, nowhere near this one, until the next re-seed. report/block_user.yaml has
# always unblocked at the end; these two did not.
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "profile-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "profile-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Blocked Users"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Blocked Users"
- waitForAnimationToEnd
# The row's button is `profile.blocked.unblockAction` = "Unblock", by testID
# (`unblock_button_<id>`), and it opens a confirmAlert whose confirm button is
# `profile.blocked.unblockConfirm` = "Yes, unblock" — tapping only the first leaves
# the dialog open and the block in place.
- runFlow:
    when:
      visible:
        id: "unblock_button_\\d+"
    commands:
      - tapOn:
          id: "unblock_button_\\d+"
          index: 0
      - waitForAnimationToEnd
      - tapOn: "Yes, unblock"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "User unblocked"
          timeout: 20000
