appId: com.hatiwal.app
---
# Blocked user: "Contact Seller" button disabled or shows blocked message

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Open a listing
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Get seller name for reference
- tapOn: "Seller Name"
- waitForAnimationToEnd

# Block from seller profile
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Block User"
- waitForAnimationToEnd
# `chat.block.blockUser` = "Block User".
- tapOn: "Block User"
- waitForAnimationToEnd
- assertVisible: "User blocked"

# Navigate back to listing detail
- back
- waitForAnimationToEnd

# Message button either disabled or shows "Can't message blocked user"
- assertVisible: "Bazaar"
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# "Contact Seller" disabled for blocked user
- assertNotVisible: "Contact Seller"

# ── UNBLOCK, so the block does not leak into every later flow ───────────────
# A block is persisted on the USER, so leaving it set hides the seller's listings
# from the buyer for the rest of the cycle — every later browse and chat flow then
# fails, nowhere near this one, until the next re-seed. report/block_user.yaml has
# always unblocked at the end; these two did not.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Blocked Users"
    direction: DOWN
    timeout: 20000
- tapOn: "Blocked Users"
- waitForAnimationToEnd
# The row's button is `profile.blocked.unblockAction` = "Unblock", by testID
# (`unblock_button_<id>`), and it opens a confirmAlert whose confirm button is
# `profile.blocked.unblockConfirm` = "Yes, unblock" — tapping only the first leaves
# the dialog open and the block in place.
- runFlow:
    when:
      visible:
        id: "unblock_button_\\d+"
    commands:
      - tapOn:
          id: "unblock_button_\\d+"
          index: 0
      - waitForAnimationToEnd
      - tapOn: "Yes, unblock"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "User unblocked"
          timeout: 20000
