appId: com.hatiwal.app
---
# Report a user then confirm the block follow-up (TASK-R612)
# Uses the distinct confirm label "Yes, block them" to make the tap unambiguous.

- runFlow: ../_helpers/login.yaml
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards. The comment above it said "open a
# listing detail" the whole time.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
- tapOn: "Contact Seller"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Seller"
- tapOn: "Seller"
- waitForAnimationToEnd
# On seller profile — open the Report sheet
- tapOn: "Report User"
- waitForAnimationToEnd
- assertVisible: "Why are you reporting this?"
# Select a reason and submit
- tapOn: "Fraud or scam"
- tapOn: "Submit Report"
- waitForAnimationToEnd
# Report success toast appears
- assertVisible: "Report submitted. Thank you."
- waitForAnimationToEnd
# Block follow-up dialog appears
- assertVisible: "Block this user?"
- assertVisible: "Yes, block them"
- assertVisible: "Not now"
# Confirm the block
- tapOn: "Yes, block them"
- waitForAnimationToEnd
# Block success toast appears
- assertVisible: "User blocked successfully."
