appId: com.hatiwal.app
---
# Report a user from their public profile page.
# Flow: Bazaar → open a listing → tap the seller card → seller profile →
#       open the 3-dot "Actions" menu → Report User → submit a report.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the first listing in the feed
# A DISTINCT report target, deliberately. Report uniqueness is scoped
# `%i[reporter_id reportable_type]` on reportable_id (report.rb) — the REASON is not
# part of the key — so one reporter can hold only ONE live report per user. Four
# flows used to report seller@hatiwal.test: chat/report_participant (feature 6) got
# there first and the three report/* flows (feature 10) were all answered with
# report.errors.duplicate in the same cycle. Clearing reports between cycles does not
# help with that; each flow needs its own target.
# Honda CG 125 Motorbike 2021 is owned by user 37 (omar@hatiwal.com), reported by nothing else.
# Searching rather than scrolling: it does not depend on where the listing lands in
# a recency-sorted, paginating feed. Tapped by CARD testID, because the title is by
# then sitting in the search box — higher in the hierarchy than the results — so a
# text match would land on the input instead.
- tapOn:
    id: "browse-search-input"
- inputText: "Honda CG 125 Motorbike 2021"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd

# Navigate to the seller's public profile via the seller card
# The seller row sits below the photo, the price, the description and the views
# chart, so it is off-screen on arrival — and `tapOn` does not scroll to reach
# its target. None of the ten flows that tap this had a scroll; on a tablet the
# hero alone takes 60% of the viewport, which makes it certain.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-profile-link"
- waitForAnimationToEnd
# The loaded profile shows stat labels (the header title is the dynamic
# seller name, so we assert on a stable stat label instead).
- assertVisible: "Active Listings"

# OPEN THE ⋮ MENU FIRST. On UserProfile, Block/Unblock/Report live in ActionMenu
# behind `more-menu` — they are not on the screen itself, so tapping them
# directly reported `Element not found: Text matching regex: Block User` on a
# profile that was rendering perfectly.
- tapOn:
    id: "more-menu"
- waitForAnimationToEnd
- tapOn: "Report User"
- waitForAnimationToEnd
- assertVisible: "Why are you reporting this?"

# Select a reason and submit
- tapOn: "Spam"
- tapOn: "Submit Report"
- waitForAnimationToEnd
# NOT the success toast: for a USER report, ReportSheet.onSuccess fires the toast
# and then presents the "also block this user?" confirmAlert, a native modal that
# COVERS it — so the toast is out of the accessibility tree before anything can
# poll for it. The alert is the better proof: it only appears on a 201, it is
# durable, and it is what the user actually sees next. (report_listing asserts
# the same toast and passes: a Listing report just closes the sheet.)
