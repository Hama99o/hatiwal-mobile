appId: com.hatiwal.app
---
# REV2 — happy path: right after a seller records a sale with a real buyer
# (TASK-TX01's BuyerPickerSheet), the double-blind ReviewPromptSheet opens
# automatically inviting the seller to rate the buyer.
#
# Self-contained: marks the seeded "Lenovo ThinkPad Laptop Core i5 8GB"
# listing sold with buyer@hatiwal.test / "Ahmad Karimi" (the ONE seeded
# buyer-conversation fixture — see ../seller/mark_sold_with_buyer.yaml, which
# covers the TASK-TX01 mechanic itself and dismisses this same prompt via
# "Not now"). Do not run both flows in the same suite pass without an E2E DB
# reset in between — they share this one fixture.
#
# Covers:
#   - Submit is disabled until a star rating is picked (validation/error gate)
#   - Tapping a star enables Submit; an optional comment can be added
#   - Submitting calls the review API and shows the double-blind PENDING
#     confirmation (only the seller has reviewed so far — the buyer hasn't)
#   - "Got it" dismisses the sheet back to the listing detail

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

- tapOn: "Active"
- waitForAnimationToEnd

# SEARCH, do not scroll. This is a SEEDED listing among many the seller owns, so 8s
# of scrolling cannot reach it — "No visible element found" for a listing that is
# present and active. Same fix as multi_quantity_partial_sale.
- tapOn: "Search my listings..."
- inputText: "Lenovo ThinkPad Laptop Core i5 8GB"
# NO hideKeyboard here. Back is not reliably consumed by the IME on a search screen —
# the screen handles it, clearing the query and remounting the list:
# rate_buyer_after_sale's screenshot shows the filter back on "All 37", the search box
# empty and the list "Refreshing…". It is also unnecessary, because the first search
# result sits directly under the search box, above where the keyboard covers.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Lenovo ThinkPad Laptop Core i5 8GB"
    timeout: 20000

# By CARD testID, not the title. The title is sitting in the search box from the step
# above, and that input is higher in the hierarchy than the results — so an anchored
# text match lands on the SEARCH FIELD, the tap does nothing, and the flow carries on
# believing it navigated. Proven three times with screenshots (composer_draft,
# full_marketplace_cycle, create_listing_with_condition).
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd

- tapOn: "Mark as Sold"
- waitForAnimationToEnd

- assertVisible: "Who bought this item?"
- tapOn: "Ahmad Karimi"
- waitForAnimationToEnd
- tapOn: "Confirm sold"
- waitForAnimationToEnd

# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a

# single check right after an action is a race — and any wait in front of it

# loses that race, turning a successful action red. Polling keeps the check at

# full strength while removing the timing dependency.

- extendedWaitUntil:

    visible: "Listing marked as sold"

    timeout: 15000

# The double-blind ReviewPromptSheet opened automatically —
# "How was Ahmad Karimi as a buyer?" (buyer's full name from the seeded conversation).
- assertVisible: "How was Ahmad Karimi as a buyer?"

# Submit is disabled until a star is picked
- assertVisible: "Your rating"
- tapOn: "Submit review"
- assertVisible: "How was Ahmad Karimi as a buyer?"

# Pick a 5-star rating
- tapOn:
    id: "star-rating-5"
- waitForAnimationToEnd

# Optional comment
- tapOn: "Share how the meetup and deal went…"
- inputText: "Smooth meetup, paid in cash as agreed."

- tapOn: "Submit review"
- waitForAnimationToEnd

# Double-blind — the buyer hasn't reviewed back yet, so this stays PENDING
# (never shows the buyer's side, never claims the review is public yet).
- assertVisible: "Review saved"
- assertNotVisible: "Thanks! Your review is posted."

- tapOn: "Got it"
- waitForAnimationToEnd

# Back on the (now Sold) listing detail
- assertVisible: "Sold"
