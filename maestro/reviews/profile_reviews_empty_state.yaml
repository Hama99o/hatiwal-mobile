appId: com.hatiwal.app
env:
  EMAIL: newbuyer@hatiwal.test
  PASSWORD: Password123!
---
# REV2 — empty state: a fresh account with no sold transactions and no
# reviews at all. Uses newbuyer@hatiwal.test (no listings, no conversations,
# no transactions — see maestro/README.md) so this flow is independent of
# rate_buyer_after_sale.yaml / pending_reviews_nudge.yaml and always sees a
# clean slate regardless of run order.
#
# Covers:
#   - RatingDisplay shows "No reviews yet" instead of a misleading 0.0 score
#   - The "Rate your recent deals" nudge never renders when there is nothing
#     pending (no false-positive nudge)

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/skip_onboarding.yaml
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Sign In"
- assertVisible: "Bazaar"

- tapOn: "Me"
- waitForAnimationToEnd

# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"
- assertVisible: "No reviews yet"
- assertNotVisible: "Rate your recent deals"
