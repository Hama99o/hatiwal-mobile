appId: com.hatiwal.app
---
# Multi-quantity — docs/SPIKE_LISTING_QUANTITY.md, Tier 1.
#
# The behaviour this flow exists to protect is the one that would have broken
# the feed: selling SOME of a batch must leave the listing ACTIVE with the rest
# still browsable. Retiring it on the first sale is the failure mode the whole
# `record_units_sold!` / `sold_out` split in the API exists to prevent, and no
# unit test catches it end to end — the listing has to actually still be there
# on the next screen.
#
# Fixture: "Phone Case Silicone Clear - Wholesale" (seller@hatiwal.test, 15
# units, one seeded conversation with buyer@hatiwal.test — see
# hatiwal-api/db/seeds/e2e.rb). It is the ONLY multi-unit fixture, so every
# other flow keeps exercising the single-item majority case.
#
# NOTE: shares the seeded buyer-conversation with nothing else, but it DOES
# mutate stock (15 → 12). Re-running without an E2E DB reset starts from 12,
# which still passes every assertion below except the literal "15" in the
# pre-sale stock pill — so reset between suite passes.

# LOGIN — deliberately explicit rather than either shared helper.
#
# BOTH REASONS BELOW ARE NOW OUT OF DATE (2026-08-25). Left in place because the
# mechanism still works and this flow was not re-verified when they stopped being
# true — but do not act on them:
#
#   * "login_seller.yaml is still on the pre-rig shape (clearState: true with no
#     open_bundle)" — it is not. It warm-launches (`launchApp` + open_bundle.yaml).
#   * "login.yaml ... signs in only if the login form is on screen, so the flow
#     silently runs as whoever was signed in last" — that hole is closed. BOTH
#     helpers now sign out anything that is not the expected account, rather than
#     recognising one known-wrong identity, so an inherited session is no longer a
#     way to run as the wrong user.
#
# So the original justification for duplicating the login inline no longer holds,
# and this flow could use login_seller.yaml — dropping ~60s of clearState and
# inheriting future helper fixes instead of drifting from them. Not done here
# because it is a behavioural change to a flow that has never had a clean phone
# verdict; do it with a run to compare against.
#
# This flow asserts a specific seller's stock, so identity cannot be inherited:
# clear state and sign in as the seller outright. Costs ~60s, buys certainty.
- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- tapOn:
    id: "login-email-input"
- inputText: "seller@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000
- assertNotVisible: "Login"

# Seller mode.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Switch to Seller Mode"
    commands:
      - tapOn: "Switch to Seller Mode"
      - waitForAnimationToEnd
- assertVisible: "Switch to Buyer Mode"

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

- tapOn: "Active"
- waitForAnimationToEnd

# SEARCH, do not scroll to it. This fixture is a SEEDED listing among many the
# seller owns, so it is not near the top and an 8s scroll budget cannot reach it —
# "No visible element found" for a listing that is present and active.
# listing_conversations learned this the expensive way: its comment records spending
# 463s driving infinite scroll and still not finding a listing that was there.
#
# The 8s scrolls in the other seller flows are fine and are left alone: they look for
# listings the flow just created, or "QA Disposable ..." fixtures, which are at the
# top of My Shop.
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "Phone Case Silicone Clear - Wholesale"
# NO hideKeyboard here. Back is not reliably consumed by the IME on a search screen —
# the screen handles it, clearing the query and remounting the list:
# rate_buyer_after_sale's screenshot shows the filter back on "All 37", the search box
# empty and the list "Refreshing…". It is also unnecessary, because the first search
# result sits directly under the search box, above where the keyboard covers.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Phone Case Silicone Clear - Wholesale"
    timeout: 20000

# By CARD testID, not the title. The title is sitting in the search box from the step
# above, and that input is higher in the hierarchy than the results — so an anchored
# text match lands on the SEARCH FIELD, the tap does nothing, and the flow carries on
# believing it navigated. Proven three times with screenshots (composer_draft,
# full_marketplace_cycle, create_listing_with_condition).
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd

# ── The seller's own view states the batch, not just "active" ────────────────
# "N of M left" phrasing here (not the buyer's bare "N in stock"): the seller
# needs to see progress through the batch.
- assertVisible:
    id: "stock-badge-owner"

# The price says which number it is — a bare "400" on a 15-unit listing reads as
# the price of the whole box.
- assertVisible: "each"

# ── Sell 3 of the 15 ────────────────────────────────────────────────────────
# The action row sits below the description and the 7-day views chart, so it is
# off-screen on arrival — `tapOn` does not scroll to find its target. Anchored on
# the testID rather than the word "More": the label is `listing.actions.more`,
# which is localized, and the button also contains an icon.
# 20s, not 10s — every sibling flow uses 20s for this same scroll and this one
# was the outlier. It failed in run-269 with `No visible element found: id:
# lifecycle-more-action` at load average 7.7-8.9 of 16, on a screen it had just
# asserted the top of (stock badge, "each"). The action row sits below the
# description, the 7-day views chart and the location map, so this is a long
# scroll on a loaded device, not a missing control.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 20000

# SF-M1 (run-266's F3, reproduced twice in run-269): "Mark as Sold" is NOT in the
# More sheet for a live, non-expired listing — `useListingLifecycle` pushes
# `key: "sold"` into `moreActions` only `if (isLive && isExpired)`. It is the
# one-tap PRIMARY now. Tapping the label with the sheet open matched nothing
# (the sheet owns its own window, so the primary button behind it is not even in
# the hierarchy), and the buyer picker never opened.
#
# The old premise is gone, so it is replaced with the assertion of the new one —
# and the new one is stronger, because SF-M1's actual claim is NON-DUPLICATION.
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- assertVisible:
    id: "listing-actions-sheet"
- assertNotVisible:
    id: "listing-action-sold"
- tapOn:
    id: "listing-actions-backdrop"
- waitForAnimationToEnd

# One tap on the primary action goes straight to the sold copy.
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd

- assertVisible: "Who bought this item?"

# The quantity field is NOT offered until a real buyer is chosen — a sale to
# someone not on Hatiwal records no transaction for a quantity to attach to.
- assertNotVisible:
    id: "buyer-picker-quantity"

- tapOn: "Ahmad Karimi"
- waitForAnimationToEnd

# Pre-filled with ONE unit, not the whole remainder — selling out is a
# deliberate typed choice (see `quantity`'s own doc in BuyerPickerSheet.tsx).
- assertVisible:
    id: "buyer-picker-quantity"
# And the final-price field says out loud that it is per item.
- assertVisible: "The price for one item"

# Sell three of them. SF-M9 (FlowApp #298): the field is now the shared
# QuantityStepper, not a raw Input — tap the tap-to-edit VALUE to swap in the
# numeric Input (this REPLACES the pre-filled "1" via `selectTextOnFocus`,
# hardcoded on the stepper's own internal Input — the same run-018 insert-vs-
# replace protection the raw Input used to need explicitly), type "3", then
# commit with Enter.
#
# NOT hideKeyboard — it is Back on Android, and
# multi_quantity_offplatform_sale.yaml documents it closing the SHEET rather
# than the IME on this exact sheet. And NOT a tap on the sheet's header title
# either, which is what this used to do: run-268 proved from a hierarchy dump
# that tapping a plain `<Text>` does not blur a focused TextInput on Android, so
# `commitEdit` never ran and the sheet still held 1 while the field read 3.
# `pressKey: Enter` is the stepper's own documented commit (`onSubmitEditing`).
- tapOn:
    id: "buyer-picker-quantity-value"
- eraseText
- inputText: "3"
# COMMIT THE TYPED VALUE WITH ENTER, NOT BY TAPPING THE HEADER.
#
# run-268, proven from the failing step's own hierarchy dump: after the tap and
# `inputText`, the stepper was still in EDIT mode — the node on screen was
# `buyer-picker-quantity-input` (an EditText holding "3") and
# `buyer-picker-quantity-value` did not exist at all. Tapping the sheet's plain
# `<Text>` header dismisses nothing and does not blur a focused TextInput on
# Android, so `QuantityStepper.commitEdit` (wired to onBlur/onSubmitEditing)
# never ran: the field still read 3 while the SHEET still held 1.
#
# `pressKey: Enter` is the component's own documented commit path
# (`onSubmitEditing`), it is what the numeric keypad's ✓ key sends, and unlike
# `hideKeyboard` (which is Back on Android) it cannot close the sheet — the
# hazard the previous note in this file was working around.
- pressKey: Enter
- waitForAnimationToEnd
# Prove the field holds exactly 3 BEFORE confirming — this is the assertion that
# would have caught run-018 at the point of failure instead of after the sale.
# ON THE NUMBER'S OWN NODE (`-value-text`), NOT the control (`-value`).
#
# run-268, from a hierarchy dump after a committed edit: `…-value` is the
# Pressable, which Android renders as a Button whose contentDescription is its
# a11y label ("Quantity") and whose own text is EMPTY — the number lives on an
# unnamed child TextView. So `{id: …-value, text: "N"}` can never match. The
# component now also puts `…-value-text` on that Text, so the value has a handle;
# `…-value` stays the TAP target and keeps the accessibility props.
- assertVisible:
    id: "buyer-picker-quantity-value-text"
    text: "3"

- tapOn: "Confirm sold"
- waitForAnimationToEnd

# QA-BUG2 (FlowApp #300) — history note, kept rather than deleted: this flow
# used to skip the success toast assertion entirely, because REV2's review
# sheet opened in the SAME tick as the sale and covered/raced the toast on
# Android (run-019). That deletion is exactly how SF-M5 later got built with
# its whole "Marked sold · Undo" toast pattern never having been proven
# reachable in this flow. The fix (useListingLifecycle.ts) now makes the
# review sheet WAIT for the toast's own ~4s lifecycle to finish before it
# opens, so the two no longer race — restoring the toast assertion below,
# `optional: true` per the house rule (general toast-observability flakiness
# on this host is a separate, already-known issue) while the review prompt
# stays the real, blocking, durable assertion — it only appears when the sale
# recorded a real buyer.
#
# run-267 AMENDMENT — `optional: true` REMOVED, and two lines added below it.
# The caveat it was hedging against ("general toast-observability flakiness on
# this host") did not survive contact with a device: on 2026-08-28 this exact
# non-optional assertion passed on the same emulator in
# ./mark_sold_with_buyer.yaml (PASS, 196s), ./undo_mark_sold.yaml and
# ./sell_without_reserving.yaml — three times, including twice on the
# named-buyer path this flow uses. An `optional` assertion cannot fail, so
# while it stood, the toast SF-M5's Undo hangs on was still unguarded here in
# practice — a softer version of the deletion the note above is about. The
# assertion and its history stay; only the escape hatch is gone.
# TOAST WINDOW (run-268): `waitForAnimationToEnd` after a confirm waits out the
# toast's ENTIRE in-sit-out animation — measured at 4.6s against a ~4s toast — so
# anything asserted after it is a coin flip, and the Undo action had already gone.
# Assert the ACTION first with `extendedWaitUntil` (it polls, so it catches the
# toast as it appears, and it is stronger than the text: a toast that fired
# without its action fails it), then the text in the same frame.
- extendedWaitUntil:
    visible: "Undo"
    timeout: 20000
- assertVisible: "Listing marked as sold"
# And the Undo has to be REACHABLE, not merely present: the absence check is the
# load-bearing half, because "Undo is in the hierarchy" stayed true throughout
# QA-BUG2 — what was false was that any touch could get to it past the review
# sheet's own native-window backdrop.
- assertNotVisible: "How was Ahmad Karimi as a buyer?"
- extendedWaitUntil:
    visible: "How was Ahmad Karimi as a buyer?"
    timeout: 30000
- tapOn: "Not now"
- waitForAnimationToEnd

# ── THE INVARIANT: 12 left, and the listing is still live ───────────────────
# Not "Sold". A partial sale must never retire a listing that still has stock.
- scrollUntilVisible:
    element:
      id: "stock-badge-owner"
    direction: UP
    timeout: 10000
- assertVisible: "Active"
- assertVisible:
    id: "stock-badge-owner"

# And it is still in the seller's Active tab, not archived out of it.
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
# SEARCH, do not scroll. My Shop holds the whole seeded catalogue plus seven
# disposable fixtures, so finding one title by scrolling was a race against an 8s
# budget on a tablet-height list — and it lost. The seller's search box filters
# server-side (that parameter was being dropped by /my/listings until it was
# fixed), which turns this into one exact step.
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "Phone Case Silicone Clear - Wholesale"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Phone Case Silicone Clear - Wholesale"
    timeout: 30000
