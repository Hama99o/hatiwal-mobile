appId: com.hatiwal.app
---
# Multi-quantity — docs/SPIKE_LISTING_QUANTITY.md, Tier 1.
#
# The behaviour this flow exists to protect is the one that would have broken
# the feed: selling SOME of a batch must leave the listing ACTIVE with the rest
# still browsable. Retiring it on the first sale is the failure mode the whole
# `record_units_sold!` / `sold_out` split in the API exists to prevent, and no
# unit test catches it end to end — the listing has to actually still be there
# on the next screen.
#
# Fixture: "Phone Case Silicone Clear - Wholesale" (seller@hatiwal.test, 15
# units, one seeded conversation with buyer@hatiwal.test — see
# hatiwal-api/db/seeds/e2e.rb). It is the ONLY multi-unit fixture, so every
# other flow keeps exercising the single-item majority case.
#
# NOTE: shares the seeded buyer-conversation with nothing else, but it DOES
# mutate stock (15 → 12). Re-running without an E2E DB reset starts from 12,
# which still passes every assertion below except the literal "15" in the
# pre-sale stock pill — so reset between suite passes.

# LOGIN — deliberately explicit rather than either shared helper.
#
# BOTH REASONS BELOW ARE NOW OUT OF DATE (2026-08-25). Left in place because the
# mechanism still works and this flow was not re-verified when they stopped being
# true — but do not act on them:
#
#   * "login_seller.yaml is still on the pre-rig shape (clearState: true with no
#     open_bundle)" — it is not. It warm-launches (`launchApp` + open_bundle.yaml).
#   * "login.yaml ... signs in only if the login form is on screen, so the flow
#     silently runs as whoever was signed in last" — that hole is closed. BOTH
#     helpers now sign out anything that is not the expected account, rather than
#     recognising one known-wrong identity, so an inherited session is no longer a
#     way to run as the wrong user.
#
# So the original justification for duplicating the login inline no longer holds,
# and this flow could use login_seller.yaml — dropping ~60s of clearState and
# inheriting future helper fixes instead of drifting from them. Not done here
# because it is a behavioural change to a flow that has never had a clean phone
# verdict; do it with a run to compare against.
#
# This flow asserts a specific seller's stock, so identity cannot be inherited:
# clear state and sign in as the seller outright. Costs ~60s, buys certainty.
- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- tapOn:
    id: "login-email-input"
- inputText: "seller@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000
- assertNotVisible: "Login"

# Seller mode.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Switch to Seller Mode"
    commands:
      - tapOn: "Switch to Seller Mode"
      - waitForAnimationToEnd
- assertVisible: "Switch to Buyer Mode"

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

- tapOn: "Active"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Phone Case Silicone Clear - Wholesale"
    direction: DOWN
    timeout: 8000

- tapOn: "Phone Case Silicone Clear - Wholesale"
- waitForAnimationToEnd

# ── The seller's own view states the batch, not just "active" ────────────────
# "N of M left" phrasing here (not the buyer's bare "N in stock"): the seller
# needs to see progress through the batch.
- assertVisible:
    id: "stock-badge-owner"

# The price says which number it is — a bare "400" on a 15-unit listing reads as
# the price of the whole box.
- assertVisible: "each"

# ── Sell 3 of the 15 ────────────────────────────────────────────────────────
# The action row sits below the description and the 7-day views chart, so it is
# off-screen on arrival — `tapOn` does not scroll to find its target. Anchored on
# the testID rather than the word "More": the label is `listing.actions.more`,
# which is localized, and the button also contains an icon.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Mark as Sold"
- waitForAnimationToEnd

- assertVisible: "Who bought this item?"

# The quantity field is NOT offered until a real buyer is chosen — a sale to
# someone not on Hatiwal records no transaction for a quantity to attach to.
- assertNotVisible:
    id: "buyer-picker-quantity"

- tapOn: "Ahmad Karimi"
- waitForAnimationToEnd

# Pre-filled with the whole remainder, so "I sold the lot" stays one tap.
- assertVisible:
    id: "buyer-picker-quantity"
# The remainder is stated, so the number is never typed blind.
- assertVisible: "15 available"
# And the final-price field says out loud that it is per item.
- assertVisible: "The price for one item"

# Sell three of them.
# Tapping selects the pre-filled value (selectTextOnFocus), so this REPLACES
# the 15 rather than appending to it. run-018 proved the danger: without that,
# "3" became "153", the clamp made it 15, and the whole batch sold.
- tapOn:
    id: "buyer-picker-quantity"
- inputText: "3"
- hideKeyboard
# Prove the field holds exactly 3 BEFORE confirming — this is the assertion that
# would have caught run-018 at the point of failure instead of after the sale.
- assertVisible:
    id: "buyer-picker-quantity"
    text: "3"

- tapOn: "Confirm sold"
- waitForAnimationToEnd

# NOT the success toast. REV2's review sheet opens the instant a sale records a
# buyer and covers the toast, so asserting the toast is a race the sheet usually
# wins (run-019 failed on exactly that, while the sale had gone through
# perfectly). The review prompt IS the durable proof: it only appears when the
# sale recorded a real buyer.
- extendedWaitUntil:
    visible: "How was Ahmad Karimi as a buyer?"
    timeout: 30000
- tapOn: "Not now"
- waitForAnimationToEnd

# ── THE INVARIANT: 12 left, and the listing is still live ───────────────────
# Not "Sold". A partial sale must never retire a listing that still has stock.
- scrollUntilVisible:
    element:
      id: "stock-badge-owner"
    direction: UP
    timeout: 10000
- assertVisible: "Active"
- assertVisible:
    id: "stock-badge-owner"

# And it is still in the seller's Active tab, not archived out of it.
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
# SEARCH, do not scroll. My Shop holds the whole seeded catalogue plus seven
# disposable fixtures, so finding one title by scrolling was a race against an 8s
# budget on a tablet-height list — and it lost. The seller's search box filters
# server-side (that parameter was being dropped by /my/listings until it was
# fixed), which turns this into one exact step.
- tapOn: "Search my listings..."
- eraseText
- inputText: "Phone Case Silicone Clear - Wholesale"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Phone Case Silicone Clear - Wholesale"
    timeout: 30000
