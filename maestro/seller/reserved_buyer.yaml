appId: com.hatiwal.app
---
# TASK-R418 — "Reserved for {buyer}" card on the seller's OWN listing detail,
# with the agreed price and a one-tap Message CTA into that buyer's existing
# conversation.
#
# SF-M1/SF-M2 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md) removed Reserve
# from every listing surface — there is no more "Mark as Reserved" primary
# action to negotiate a price from directly (`seller-card-primary-action` on
# an active listing now opens the SOLD flow, "Who bought this item?", not a
# pick-a-buyer reserve sheet). A hold placed from the chat composer's "+" menu
# always confirms at the listing's ASKING price (docs/SELL_FLOW_REDESIGN.md
# §4.4.2: "finalPrice defaults to the listing's asking price... on the manual
# path") — so it cannot reproduce a NEGOTIATED price on its own. The one
# still-current path to a reserve at a price that differs from asking is the
# same accept-a-lower-offer mechanism ../chat/reserve_after_accept.yaml
# already proves: buyer sends an offer, seller accepts it, and the resulting
# one-tap confirm reserves at the AGREED (offer) price. This flow reuses that
# exact mechanism to get to "reserved at a negotiated price", then goes on to
# check what reserve_after_accept.yaml does not: the owner detail's
# SaleBuyerCard and its Message CTA.
#
# Reuses the seeded "QA Disposable reserved_buyer" listing (asking price AFN
# 1,400) + its buyer@hatiwal.test / "Ahmad Karimi" conversation (see
# ../listings/lifecycle_reactivate.yaml, which shares this SAME fixture to
# round-trip a hold — both leave it exactly as found: active, no hold — and
# ../seller/mark_sold_with_buyer.yaml, which sells a DIFFERENT disposable to
# Sold). This flow only RESERVES it (non-terminal), but still mutates shared
# listing state — do not run this in the same suite pass as
# lifecycle_reactivate.yaml without an E2E DB reset in between
# (`bundle exec rails db:seed:reset_e2e`), since both places-then-releases /
# places a hold on the same fixture.
#
# Covers:
#   - Buyer offers below asking -> seller accepts -> one-tap reserve confirm
#     at the AGREED (not asking) price
#   - Owner detail shows the SaleBuyerCard: "Reserved for Ahmad Karimi",
#     the buyer's name via the shared UserIdentity row, and the agreed price
#     line (since it differs from the listing's asking price)
#   - CYCLE-4 design-review fix: the identity row + Message control are now
#     ONE collapsed row (tapped via testID, not the old full-width
#     "Message {name}" button text) — the Message control lands directly in
#     the existing conversation thread (not a generic conversations list)

# ── Step 1: buyer sends a below-asking offer on the disposable listing ──────
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn:
    id: "browse-search-input"
- inputText: "QA Disposable reserved_buyer"
- waitForAnimationToEnd
# DISMISS THE IME BEFORE TAPPING THE RESULT. run-490 failed this flow on a
# detail-screen button that was never reached: the end-of-flow screenshot shows
# the app still on BROWSE with the keyboard covering the result card. The tap
# landed on the keyboard and Maestro reported it COMPLETED, because a tap on a
# covered element always is. Safe here specifically because we have just typed,
# so the IME is up and Back closes it without reaching the app (flow_lint HIDEKEY).
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd

# "Make an Offer" is a sibling of "Contact Seller" directly on the listing
# detail page -- no need to open the thread first (mirrors
# ../chat/reserve_after_accept.yaml's own verified selector notes).
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
- tapOn:
    id: "offer-amount-input"
- inputText: "1000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
- assertVisible: ".*1,000.*"

# ── Step 2: the real listing owner accepts the offer ────────────────────────
# Pop back to the tab bar FIRST, while still the buyer — see the identical
# note in listing_detail_held_units_transparency.yaml.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "QA Disposable reserved_buyer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Sanity check: this is still an active, owned listing before any response --
# SF-M2's pinned header pill is ALWAYS "Mark Sold" for the owner of a Live
# listing, never "Reserve" (that button does not exist here any more).
- assertVisible: "Mark Sold"

- tapOn: ".*Accept.*"
- waitForAnimationToEnd
- assertVisible: "Offer accepted"

# ── Step 3: one-tap reserve confirm fires -- no pick-a-buyer list, agreed
#    price carried over from the accepted offer, not the asking price ───────
- assertVisible: ".*Reserve for.*Ahmad Karimi.*"
- assertVisible: ".*Ahmad Karimi.*"
- assertVisible: ".*1,000.*"
- assertNotVisible: ".*Who's buying this item.*"

- tapOn: "Confirm reserve"
- waitForAnimationToEnd

# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
#
# This confirm fires through reserveAfterAccept.ts, whose OWN success toast is
# "Listing reserved for {{buyerName}}" (chat.offer.reserveAfterAcceptSuccess) —
# NOT "Listing marked as reserved" (listing.reserveSuccess / SF-M1's now-DEAD
# standalone reserve mutation, deleted from every listing surface). The name
# is bidi-isolate wrapped (wrapBidiIsolate), so match loosely, same convention
# as place_and_release_hold.yaml's own toast check.
- extendedWaitUntil:
    visible: ".*reserved.*"
    timeout: 15000

# ── SaleBuyerCard on the owner detail screen ──────────────────────────────
# OPEN THE DETAIL. This flow reserved from CHAT, so it never visited My Shop —
# the two assertions below are about the OWNER DETAIL specifically:
# "Reserved for Ahmad Karimi" appears on the My Shop CARD too, while
# "Agreed price" (listing.finalPrice) exists only on the owner detail.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "QA Disposable reserved_buyer"
# `hideKeyboard` REMOVED (run-270, qa/flow_lint HIDEKEY). The shared search
# helper above already settles the field, so there is no IME guaranteed to be
# up here — and with no keyboard to consume it, `hideKeyboard` is a plain Back
# press that pops the screen. The reason it was here (an IME reclaiming focus
# over a later toast) is gone too: clearing via the ✕ leaves the field
# unfocused.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "QA Disposable reserved_buyer"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- assertVisible: "Reserved for Ahmad Karimi"
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Reserved for Ahmad Karimi"
- assertVisible: "Agreed price"

# Buyer identity via the shared UserIdentity row (avatar + name)
- assertVisible: "Ahmad Karimi"

# ── One-tap Message CTA — lands directly in the existing thread ──────────
# CYCLE-4: the identity + Message control collapsed into one row, sized to
# content, so the control is tapped by its stable testID rather than the
# (now-shortened) button copy.
- tapOn:
    id: "sale-buyer-message-button"
- waitForAnimationToEnd

# Conversation thread screen, not a generic list — the composer + the offer
# just accepted are both visible.
- assertVisible: "Type a message..."
- assertVisible: "Offer accepted"
