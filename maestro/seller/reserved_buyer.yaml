appId: com.hatiwal.app
---
# TASK-R418 — "Reserved for {buyer}" card on the seller's OWN listing detail,
# with the agreed price and a one-tap Message CTA into that buyer's existing
# conversation.
#
# Reuses the seeded "QA Disposable reserved_buyer" listing + its
# buyer@hatiwal.test / "Ahmad Karimi" conversation (see
# ../seller/mark_sold_with_buyer.yaml and ../reviews/rate_buyer_after_sale.yaml,
# which share this SAME fixture to sell the listing straight to Sold). This
# flow only RESERVES it (non-terminal), but still mutates shared listing
# state — do not run this in the same suite pass as those two flows without
# an E2E DB reset in between (`bundle exec rails db:seed:reset_e2e`).
#
# Covers:
#   - BuyerPickerSheet → pick "Ahmad Karimi" → set a negotiated final price
#     that differs from the asking price → confirm reserve
#   - Owner detail shows the SaleBuyerCard: "Reserved for Ahmad Karimi",
#     the buyer's name via the shared UserIdentity row, and the agreed price
#     line (since it differs from the listing's asking price)
#   - CYCLE-4 design-review fix: the identity row + Message control are now
#     ONE collapsed row (tapped via testID, not the old full-width
#     "Message {name}" button text) — the Message control lands directly in
#     the existing conversation thread (not a generic conversations list)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, so this flow can ruin it without touching a fixture
# anything else asserts on. It used to act on "whichever listing comes first".
- tapOn: "Search my listings..."
- eraseText
- inputText: "QA Disposable reserved_buyer"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable reserved_buyer"
      timeout: 30000

- scrollUntilVisible:
    element:
      text: "QA Disposable reserved_buyer"
    direction: DOWN
    timeout: 8000

# By CARD testID, not the title. The title is sitting in the search box from the step
# above, and that input is higher in the hierarchy than the results — so an anchored
# text match lands on the SEARCH FIELD, the tap does nothing, and the flow carries on
# believing it navigated. Proven three times with screenshots (composer_draft,
# full_marketplace_cycle, create_listing_with_condition).
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd

# With the search working (the API used to drop it — UI-031), the list holds
# exactly ONE card, so its own action button is unambiguous and there is no need
# to open the detail at all. Tapping the title did not navigate anyway: after
# typing, the first tap outside the field goes to dismissing the IME, so the flow
# stayed on the list and then looked for the DETAIL's `lifecycle-primary-action`.
# Verified by screenshot — header "1 listing", one card, still on My Shop.
- tapOn:
    id: "seller-card-primary-action"
    index: 0
- waitForAnimationToEnd

# BuyerPickerSheet opens with the seeded conversation
- assertVisible: "Who's buying this item?"
- assertVisible: "Ahmad Karimi"

- tapOn: "Ahmad Karimi"
- waitForAnimationToEnd

# Negotiate a lower final price than the 38,000 AFN asking price so the
# SaleBuyerCard's agreed-price line has something real to show.
- tapOn:
    id: "buyer-picker-final-price"
- inputText: "32000"

- tapOn: "Confirm reserve"
- waitForAnimationToEnd

# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a

# single check right after an action is a race — and any wait in front of it

# loses that race, turning a successful action red. Polling keeps the check at

# full strength while removing the timing dependency.

- extendedWaitUntil:

    visible: "Listing marked as reserved"

    timeout: 15000

# ── SaleBuyerCard on the owner detail screen ──────────────────────────────
# OPEN THE DETAIL FIRST. This flow reserves from the CARD in My Shop, so it never
# left the list — and the two assertions below are about different screens:
# "Reserved for Ahmad Karimi" appears on the card too (so it passed), while
# "Agreed price" (listing.finalPrice) exists only on the owner detail. The flow
# failed on the second while the reserve had worked perfectly: the hierarchy showed
# the card reading "Reserved for Ahmad Karimi" with its action already flipped to
# "Mark as Sold".
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Reserved for Ahmad Karimi"
- assertVisible: "Agreed price"

# Buyer identity via the shared UserIdentity row (avatar + name)
- assertVisible: "Ahmad Karimi"

# ── One-tap Message CTA — lands directly in the existing thread ──────────
# CYCLE-4: the identity + Message control collapsed into one row, sized to
# content, so the control is tapped by its stable testID rather than the
# (now-shortened) button copy.
- tapOn:
    id: "sale-buyer-message-button"
- waitForAnimationToEnd

# Conversation thread screen, not a generic list — the composer + the
# seeded first message from this buyer are both visible.
- assertVisible: "Type a message..."
# The picker shows `conv.lastMessageBody` — the LAST message, not the first. For the
# disposable listing these flows use, db/seeds/e2e.rb seeds:
#     buyer:  "Is this still available? I can collect today."
#     seller: "Yes — when suits you?"        <- so this is what renders
# The old assertion, "Hi, is this laptop still available?", belongs to a different
# fixture entirely (RESPONSE_BADGE_CONVOS) and was never this conversation's text —
# not before the seller reply was added to the fixture, and not after.
- assertVisible: "Yes — when suits you?"
