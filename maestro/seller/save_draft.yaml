appId: com.hatiwal.app
---
# TASK-V395 — "Save draft" is genuinely saveable and never silent.
#
# The Rails Listing model (app/models/listing.rb) only validates
# title/price/currency/category — a draft is allowed to have zero photos
# and no map pin. Before this fix, the client wrongly required a pin
# (and "Save draft" had no onInvalid handler), so a seller who hadn't
# dropped a pin yet got NOTHING when tapping "Save Draft".
#
# Three scenarios:
#   1. Title + price + category, NO photos, NO map pin → Save Draft
#      succeeds and lands on the new listing's own owner detail.
#   2. Title left blank → Save Draft is NEVER a silent no-op: a toast
#      names exactly the missing field(s), and photos/location are never
#      listed as draft blockers.
#   3. That same pin-less draft survives an edit round trip — reopening it
#      still shows "Tap to set exact location on map" — and Publish from
#      there still fully requires a photo AND a map pin (Publish is
#      unchanged by this fix).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── 1) A pin-less, photo-less draft is genuinely saveable ───────────────────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Draft No Pin No Photo Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "4200"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# No photo added, location picker never opened.
- assertVisible: "Tap to set exact location on map"

- tapOn: "Save Draft"
- waitForAnimationToEnd

# Never silent — lands on the new listing's own owner detail, marked Draft.
- assertVisible: "Draft"
- assertVisible: "Draft No Pin No Photo Item"
- assertNotVisible: "Create Listing"

# ── 2) A blocked draft is NEVER a silent no-op ───────────────────────────────

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# Title intentionally left blank.
# Scroll to the price field again — see the note above.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "3000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

- tapOn: "Save Draft"
- waitForAnimationToEnd

# Toast names exactly the missing field — and the form auto-scrolled back to
# the inline Title error, visible without the seller scrolling manually.
- assertVisible: "Add Title to save this draft"
- assertVisible: "Title is required (max 150 characters)"

# Photos/location are never listed or flagged as draft blockers.
- assertNotVisible: "Add at least one photo before publishing"
- assertNotVisible: "Location is required — buyers filter listings by area"

# Never created — still on the create form.
- assertVisible: "Create Listing"

# ── 3) The pin-less draft round trip: edit still shows no pin; Publish   ────
# ──    from there still fully requires a photo AND a map pin.           ────

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Draft No Pin No Photo Item"
- waitForAnimationToEnd

# Edit lives in the "More" overflow sheet (TASK-L863) — a draft owner detail
# renders only the primary "Publish" button plus "More".
- tapOn: "More"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# Reopening the pin-less draft still shows the "tap to set" placeholder —
# never a stale error and never a fabricated location.
- assertVisible: "Tap to set exact location on map"
- assertNotVisible: "Location is required — buyers filter listings by area"

# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

# Publish is unchanged — still fully gated on photos AND the map pin.
- assertVisible: "Add Photos, Location to publish this listing"
- assertVisible: "Add at least one photo before publishing"
- assertVisible: "Location is required — buyers filter listings by area"
- assertNotVisible: "Your listing is live!"
- assertVisible: "Edit Listing"
