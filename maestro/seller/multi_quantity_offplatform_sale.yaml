appId: com.hatiwal.app
---
# Selling SOME of a batch to a buyer who is not on Hatiwal.
#
# Reported from a device with screenshots: a listing with 50 in stock, one sale marked
# through "Sold to someone not on Hatiwal", and the listing came back "Sold — 0 of 50
# left". The seller lost 49 units and there is no undo, no payment system, and nothing
# on screen that said it would happen.
#
# Three deliberate decisions lined up to do that:
#   * BuyerPickerSheet HID the "How many did you sell?" field unless a registered buyer
#     was chosen, so on this path the seller could not state a count;
#   * the sheet then sent no quantity at all;
#   * the API reads a MISSING quantity as the whole remaining stock
#     (my/listings_controller.rb: `txn&.quantity || available_units`).
# Each is defensible alone. Together they made the common Afghan sale — cash, in person,
# to someone without the app — destroy the seller's inventory.
#
# multi_quantity_partial_sale covers the registered-buyer path on the Phone Case. This
# flow owns its own fixture ("QA Disposable offplatform_units", 8 units, reset every
# seed) because both flows MUTATE stock, and sharing one batch means whichever runs
# second asserts against a stock it did not set.
- runFlow:
    file: ../_helpers/login_seller.yaml

- runFlow: ../_helpers/pop_to_tab_bar.yaml
# browse-tab, NOT my-listings-tab. In SELLER mode the first tab IS the seller's
# listings — it is labelled "My Shop" and keeps the browse-tab testID, while the
# my-listings route is declared with `href: null` and never renders a button. Tapping
# my-listings-tab here failed with "Element not found" on a tab that exists in the
# layout but not in the bar.
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000

# Open the disposable batch. By title: index 0 of My Listings is whatever was touched
# most recently, which other flows change.
- scrollUntilVisible:
    element:
      text: "QA Disposable offplatform_units"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "QA Disposable offplatform_units"
- waitForAnimationToEnd

# Pre-sale stock, from the seller's own badge ("N of M left", not the buyer's "N in
# stock"). If this reads anything but 8 the seed did not reset — stop here rather than
# assert a sale against an unknown starting point.
- extendedWaitUntil:
    visible:
      id: "stock-badge-owner"
    timeout: 20000
# "8 in stock", NOT "8 of 8 left". The owner badge deliberately switches phrasing only
# once a sale has happened — MyListingDetail.tsx: "'15 of 15 left' is noise before the
# first sale ... switch to the progress phrasing only once it says something (QA
# run-017)". So the pre-sale badge is the bare count, and the "N of M left" form below is
# what proves the sale landed.
- assertVisible: ".*8 in stock.*"

# Scroll to it: the owner detail screen runs photos -> badges -> stats -> views chart ->
# location, and the lifecycle action row is below the fold. `tapOn` never scrolls, so
# this failed with "Element not found" on a control that was simply further down. Centred,
# as multi_quantity_partial_sale does for the same control.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Mark as Sold"
- waitForAnimationToEnd
- assertVisible: "Who bought this item?"

# Nothing selected yet: the count is not asked for, because there is nothing to attach
# it to. This was true before the fix and stays true.
- assertNotVisible:
    id: "buyer-picker-quantity"

# The off-platform path. THIS is the fix: the count must be askable here.
- tapOn:
    id: "buyer-row-skip"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "buyer-picker-quantity"
    timeout: 15000
# The final price stays hidden — no buyer means no transaction for a price to hang off.
- assertNotVisible:
    id: "buyer-picker-final-price"

# Sell 3 of the 8. SF-M9 (FlowApp #298): the field is now the shared
# QuantityStepper, not a raw Input — tap the tap-to-edit VALUE to swap in the
# numeric Input, type into THAT, then commit.
#
# NO hideKeyboard to commit. It is Back on Android, and here it closed the SHEET
# rather than the IME: the hierarchy at the next step had no "Who bought this
# item?", no buyer-picker-* and not even the detail screen's stock badge.
# Tapping the sheet's own header title instead — a plain, always-on-screen Text
# OUTSIDE the scrollable field — dismisses the IME/commits the edit with no key
# event at all, the same safe pattern open_bundle.yaml's own "DISMISS THE
# KEYBOARD BY TAPPING THE HEADER" note documents.
- tapOn:
    id: "buyer-picker-quantity-value"
- eraseText
- inputText: "3"
- tapOn: "Who bought this item?"
# Prove the field holds exactly 3 BEFORE confirming.
- assertVisible:
    id: "buyer-picker-quantity-value"
    text: "3"
- tapOn: "Confirm sold"
- waitForAnimationToEnd

# The whole point: 5 left, and the listing is STILL ACTIVE and browsable. Before the fix
# this read "0 of 8 left" with a Sold badge.
- extendedWaitUntil:
    visible:
      id: "stock-badge-owner"
    timeout: 20000
- assertVisible: ".*5 of 8 left.*"
- assertVisible: "Active"
- assertNotVisible: "Sold"
