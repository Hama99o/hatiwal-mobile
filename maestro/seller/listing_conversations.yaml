appId: com.hatiwal.app
---
# TASK-Q847 — the seller's per-listing "conversations about this listing"
# screen (ListingConversations.tsx, reached from My Shop's "N chats" link).
#
# Regression guard for the bug this task fixed: the screen used to render a
# raw, unformatted "75000|AFN" for an offer's last-message preview instead of
# the shared, locale-formatted "Offer: 75,000 AFN" every other conversation
# surface (the main inbox) already used. Also verifies real pagination/error
# states are wired (UniversalList), not a single unpaginated fetch, and that
# tapping a row still opens the real conversation thread.
#
# Uses "Men Winter Jacket XL Black" (active, seller-owned) — the same fixture
# offer_send_and_accept.yaml already uses to create a fresh offer via the
# real "Make an Offer" flow, so this test is self-contained and never
# depends on pre-seeded conversation data.

# ── 1) Buyer sends an offer, creating a conversation on this listing ───────

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# SEARCH, do not scroll. The Bazaar feed paginates at 20, so reaching a specific
# title meant driving infinite scroll — this flow spent 463s doing that and still
# did not find a listing that is present and active.
- tapOn: "Search listings..."
- eraseText
- inputText: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
# THE SCROLL CANNOT BE RELIED ON TO DISMISS THE IME, and that is what broke this
# flow in run-490.
#
# The note that used to sit here said no dismissal was needed because
# `scrollUntilVisible` performs a scroll gesture and a scroll dismisses the
# keyboard. Both halves are true; the conclusion is not. scrollUntilVisible is a
# NO-OP when the target is ALREADY VISIBLE — and after a search that filters to
# one result, it always is. No gesture happens, the IME stays up, and the tap
# below lands on the keyboard. Maestro reports that tap COMPLETED, because a tap
# on a covered element always is, so the flow sails on and fails later at
# "Make an Offer" on a screen it never left. The end-of-flow screenshot shows
# exactly that: BROWSE, one result card, keyboard over it.
#
# The search already filters to a single result, so the scroll earned nothing.
# Dropped entirely rather than kept as insurance — a scroll that never runs is
# not insurance, it is the thing that hid the problem.
#
# Dismissal is by DRAG, not `hideKeyboard`. The old note is right that Back is
# dangerous here: if a scroll HAD dismissed the IME, Back reaches the app and
# exits it — that really happened, and the failure screenshot was the Android app
# drawer. A margin drag moves the screen whether or not the IME is up and sends no
# key event at all, so it is correct in both states.
- extendedWaitUntil:
    visible: "Men Winter Jacket XL Black"
    timeout: 30000
- runFlow: ../_helpers/dismiss_keyboard_by_drag.yaml
# By CARD testID, not the title. The title is sitting in the search box from the step
# above, and that input is higher in the hierarchy than the results — so an anchored
# text match lands on the SEARCH FIELD, the tap does nothing, and the flow carries on
# believing it navigated. Proven three times with screenshots (composer_draft,
# full_marketplace_cycle, create_listing_with_condition).
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd

- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
- tapOn:
    id: "offer-amount-input"
- inputText: "75000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*75,000"

# ── 2) Seller opens the listing's own conversations screen from My Shop ────

- runFlow: ../_helpers/login_seller.yaml
# No tab bar on a pushed screen, so this tap used to fail with "Element not
# found" on a testID that exists — audit_structure flags it. The helper pops
# back until the bar is there, and does nothing when it already is.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Men Winter Jacket XL Black"
    direction: DOWN
    # 20s, not 8s: this is a scroll down the whole feed to one seeded title, and 8s ran
    # out on a loaded device — offer_send_and_accept and offer_send_and_decline both
    # reported "No visible element found" with the title present in the hierarchy,
    # which is what a scroll running out of TIME rather than out of list looks like.
    timeout: 20000

- tapOn:
    text: ".*chats.*"
- waitForAnimationToEnd

# ── 3) Formatted offer preview — never the raw "75000|AFN" metadata ────────

- assertVisible: ".*Offer.*75,000.*"
- assertNotVisible: "75000|AFN"

# ── 4) Tap the row — opens the real conversation thread ────────────────────

- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Type a message..."

# ── 5) Back to the listing conversations screen ─────────────────────────────

- back
- waitForAnimationToEnd
- assertVisible: "Messages"
