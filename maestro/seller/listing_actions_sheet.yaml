appId: com.hatiwal.app
---
# TASK-L863 — one primary action + a "More" overflow sheet replaces the old
# 6-button wall on every seller listing card / owner-detail screen.
#
# Covers:
#   1. A draft's owner detail shows exactly two controls — the primary
#      "Publish" button (tapped directly, no sheet needed) and "More".
#      Publishing works straight from the primary button.
#   2. Once active, the My Shop card also shows exactly two controls —
#      "Mark as Reserved" (primary) and "More".
#   3. Delete is reachable from the "More" sheet, still goes through the
#      destructive confirmAlert copy, and still fires a success toast —
#      never a raw Alert.alert (a no-op on web, but this flow runs on
#      device/simulator so a silent no-op would just hang here).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── 1) Create a draft ────────────────────────────────────────────────────────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# A PHOTO FIRST. This flow is about the actions sheet, but it publishes to get
# there — and publishing needs at least one photo (Listing#photo_required_to_publish,
# and now the app's own pre-check). Without it the flow was really testing the photo
# rule: Publish 422'd and the flow failed on a toast that could never appear.
#
# Photos before the text fields, per create_listing_full_publish: filling the form
# first raises the keyboard over `photos-add-button`, and Maestro then reports
# "no visible element" for a button that is merely covered.
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Listing Actions Sheet Test Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "5000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
- assertVisible: "Listing Actions Sheet Test Item"

# ── 2) Draft owner detail — exactly two controls: primary Publish + More ────
# No sheet needed for the primary action itself.

- assertVisible: "Publish"
- assertVisible: "More"

# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd
- assertVisible: "Publish this listing?"
# The dialog's confirm button says "Publish" — and so does the button behind it.
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing published!"
    timeout: 15000

# ── 3) Back on My Shop — the Active card also shows exactly two controls ────

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Listing Actions Sheet Test Item"
    direction: DOWN
    timeout: 8000

- assertVisible: "Mark as Reserved"
- assertVisible: "More"
# The buttons that used to sit inline on the card are now hidden until "More"
# is opened.
- assertNotVisible: "Unpublish"
- assertNotVisible: "Duplicate"

# ── 4) Delete from the "More" sheet — still confirmAlert + destructive ──────

- tapOn: "More"
- waitForAnimationToEnd

# Every other action is reachable from the sheet too.
- assertVisible: "Mark as Sold"
- assertVisible: "Unpublish"
- assertVisible: "Edit"
- assertVisible: "Duplicate"
- assertVisible: "Delete"

- tapOn: "Delete"
- waitForAnimationToEnd

# Destructive confirmAlert copy — never a raw Alert.alert.
- assertVisible: "Delete this listing?"
- assertVisible: "This will permanently remove your listing."
- tapOn: "Delete"
- waitForAnimationToEnd

# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a

# single check right after an action is a race — and any wait in front of it

# loses that race, turning a successful action red. Polling keeps the check at

# full strength while removing the timing dependency.

- extendedWaitUntil:

    visible: "Listing deleted"

    timeout: 15000
- assertNotVisible: "Listing Actions Sheet Test Item"
