appId: com.hatiwal.app
---
# TASK-L863 — one primary action + a "More" overflow sheet replaces the old
# 6-button wall on every seller listing card / owner-detail screen.
#
# Covers:
#   1. A draft's owner detail shows exactly two controls — the primary
#      "Publish" button (tapped directly, no sheet needed) and "More".
#      Publishing works straight from the primary button.
#   2. Once active, the My Shop card also shows exactly two controls —
#      "Mark as Sold" (primary — SF-M1, Sell Flow Redesign: Reserve is gone
#      from every listing surface, the primary is always "Mark as Sold" for
#      any Live listing) and "More".
#   3. Delete is reachable from the "More" sheet, still goes through the
#      destructive confirmAlert copy, and still fires a success toast —
#      never a raw Alert.alert (a no-op on web, but this flow runs on
#      device/simulator so a silent no-op would just hang here).

- runFlow: ../_helpers/login_seller.yaml

# WAIT FOR THE TAB BAR BEFORE TAPPING A TAB IN IT.
#
# This flow failed in run-522 on its very first action:
#   Element not found: Id matching regex: browse-tab
# which reads like a missing testID and is not — `browse-tab` is declared in
# app/(main)/(tabs)/_layout.tsx and every other flow taps it happily. The tab bar
# simply had not mounted yet when the tap was attempted, one step after
# login_seller.yaml returned.
#
# Deliberately a WAIT and not _helpers/pop_to_tab_bar.yaml, even though that
# helper exists for "no tab bar" and its header notes audit_structure found five
# flows in this shape. pop_to_tab_bar recovers by pressing BACK up to twice, and
# Back is the gesture that has already exited this app to the Android home screen
# once in this campaign (see the hideKeyboard revert of 2026-09-05). Here the app
# is on Profile with a tab bar that is merely late, so Back would navigate away
# from a correct screen to fix a timing problem. A wait costs nothing when the bar
# is already up and fails loudly, at this line, when it truly is not.
- extendedWaitUntil:
    visible:
      id: "browse-tab"
    timeout: 20000
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── 1) Create a draft ────────────────────────────────────────────────────────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# A PHOTO FIRST. This flow is about the actions sheet, but it publishes to get
# there — and publishing needs at least one photo (Listing#photo_required_to_publish,
# and now the app's own pre-check). Without it the flow was really testing the photo
# rule: Publish 422'd and the flow failed on a toast that could never appear.
#
# Photos before the text fields, per create_listing_full_publish: filling the form
# first raises the keyboard over `photos-add-button`, and Maestro then reports
# "no visible element" for a button that is merely covered.
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Listing Actions Sheet Test Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    centerElement: true
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "5000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
# DROP THE KEYBOARD BEFORE TAPPING THE CATEGORY ROW.
#
# run-576: the picker never opened. The hierarchy at the failure is the create
# form with "Tap to select category" STILL on it and keyboard_holder mounted —
# the price was typed two steps up, so the IME was covering the row. Maestro taps
# an element's bounds and reports a covered tap as COMPLETED, so the flow carried
# on and died on `tapOn: "Electronics"`, which only exists INSIDE the picker. The
# failure named a category; the cause was a keyboard.
#
# Guarded, so it is a no-op whenever the IME is already down.
- runFlow: ../_helpers/dismiss_keyboard_if_open.yaml
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# Location is a PUBLISH BLOCKER (getPublishBlockers, mode "publish"), so the pin
# has to exist before Publish will do anything. Without it the app correctly
# refuses and says "Location is required — buyers filter listings by area", and
# this flow then failed asserting a successful publish.
# Set BEFORE "Save Draft": the location row lives on the CREATE FORM, and this
# flow publishes later from the draft's DETAIL screen, where that row does not
# exist at all. The draft carries the coordinates forward.
- runFlow: ../_helpers/set_listing_location.yaml

- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
- assertVisible: "Listing Actions Sheet Test Item"

# ── 2) Draft owner detail — exactly two controls: primary Publish + More ────
# No sheet needed for the primary action itself.

# SCROLL to the actions block. It is section 7 of MyListingDetail, and on a draft
# that has a photo and a pin — which this flow now creates, because publishing
# requires both — the gallery and the Location map above it fill the first screen.
# `assertVisible` does not scroll, so it failed on controls that are certainly
# there, one screen down. (Gating the empty analytics off for drafts earlier today
# bought space; a photo and a map spend far more than it saved. See UI-042.)
- scrollUntilVisible:
    element:
      text: "Publish"
    direction: DOWN
    timeout: 20000
- assertVisible: "Publish"
- assertVisible: "More"

# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
# By testID, NOT the text "Publish". The dialog's confirm button carries the same
# word as the button behind it, so a text tap is ambiguous the moment the dialog
# is up: Maestro resolves the two matches to one point, which lands either on the
# scrim (dialog closes, nothing published) or on the confirm button (publishes
# before we look). BOTH outcomes are in the run history, which is why this flow
# was 0/6. draft_lifecycle and lifecycle_publish already tap this button by id
# and do not show the failure. MyListingDetail.tsx:529.
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- assertVisible: "Publish this listing?"
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing published!"
    timeout: 15000

# ── 3) Back on My Shop — the Active card also shows exactly two controls ────

# POP FIRST. Publishing lands on the listing's OWNER DETAIL, a PUSHED screen with
# no tab bar, so tapping a tab from here fails with "Element not found: Id
# matching regex: browse-tab" — a testID that is present and correct, just not on
# this screen. The helper backs out until the bar is there (8961e02 did the same
# for other flows).
#
# run-527 died HERE, and the step number is the whole point: step-118, the tap
# below, NOT the identical one at the top of this flow. By then the listing had
# been created and PUBLISHED — the end-of-flow screenshot is its owner detail
# reading "Listing Actions Sheet Test Item", AFN 5,000, Active, posted today. The
# publish and its "Listing published!" toast are both behind us.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Listing Actions Sheet Test Item"
    direction: DOWN
    # 20s, not 8s: this is a scroll down the whole feed to one seeded title, and 8s ran
    # out on a loaded device — offer_send_and_accept and offer_send_and_decline both
    # reported "No visible element found" with the title present in the hierarchy,
    # which is what a scroll running out of TIME rather than out of list looks like.
    timeout: 20000

- assertVisible: "Mark as Sold"
- assertVisible: "More"
# The buttons that used to sit inline on the card are now hidden until "More"
# is opened.
- assertNotVisible: "Unpublish"
- assertNotVisible: "Duplicate"

# ── 4) Delete from the "More" sheet — still confirmAlert + destructive ──────

- tapOn: "More"
- waitForAnimationToEnd

# SF-M1: "Mark as Sold" is the PRIMARY action for a non-expired active
# listing — it is not duplicated inside the More sheet (useListingLifecycle
# only adds a "sold" moreActions entry once the listing has EXPIRED). Checked
# by TESTID, not the bare text: the primary button underneath still reads
# "Mark as Sold" too, and a covered-but-present element can still count as
# "visible" to Maestro's own hierarchy check — the sheet's OWN row
# (`listing-action-sold`) is the thing that must be absent.
- assertNotVisible:
    id: "listing-action-sold"
- assertVisible: "Unpublish"
- assertVisible: "Edit"
- assertVisible: "Duplicate"
- assertVisible: "Delete"

- tapOn: "Delete"
- waitForAnimationToEnd

# Destructive confirmAlert copy — never a raw Alert.alert.
- assertVisible: "Delete this listing?"
- assertVisible: "This will permanently remove your listing."
- tapOn: "Delete"
- waitForAnimationToEnd
# NOT the toast. onDeleted does router.replace to My Shop (MyListingDetail.tsx:208), so
# listing.deleteSuccess is raised on a screen being torn down — polling cannot help, as
# delete_listing and edit_profile both proved. The durable consequence is asserted on the
# next line: the listing is gone from the list.
- assertNotVisible: "Listing Actions Sheet Test Item"
