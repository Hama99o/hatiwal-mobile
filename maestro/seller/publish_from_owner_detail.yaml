appId: com.hatiwal.app
---
# TASK-J952 (review fix) — publishing a DRAFT via Edit FROM its own
# owner-detail screen must land back on that SAME owner-detail entry —
# never push a second, stale owner-detail screen on top of the one already
# in the stack.
#
# Repro without the fix: Save Draft lands on the draft's owner detail
# (stack: My Shop list → owner detail). Edit → Publish used to do a plain
# `router.replace(".../my-listings/:id?published=1")`, which pushed a
# SECOND owner-detail screen on top of the first instead of updating it
# (stack: My Shop list → owner detail #1 [stale, still "Draft"] → owner
# detail #2 [fresh, "Active", with the success sheet]). A seller pressing
# back once from #2 landed on the stale #1 — not the My Shop list — and had
# to press back twice to actually leave.
#
# Fixed via `router.dismissTo`, which pops back to the EXISTING owner-detail
# entry already in the stack (merging in `published=1`) instead of pushing a
# duplicate — see ListingForm.tsx publishMutation.onSuccess. This flow
# proves a SINGLE back-tap after dismissing the sheet lands on My Listings,
# not on a stale duplicate.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── 1) Create a draft (Save Draft, not Publish) — lands on its OWN owner
#       detail directly, which is the screen this bug reproduces from ──────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Owner Detail Publish Regression Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "8000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# Scroll to the map row. It sits below title, price, currency, condition,
# description and category on a form taller than the viewport, and `tapOn` never
# scrolls — publish_success and publish_from_owner_detail both failed with
# `Element not found: Tap to set exact location on map` on a form that renders it.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
# testIDs, not the placeholder + a selector-less index tap.
- tapOn:
    id: "location-search-input"
- eraseText
- inputText: "Kabul"
- extendedWaitUntil:
    visible:
      id: "location-search-result"
    timeout: 15000
- tapOn:
    id: "location-search-result"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
# WAIT for the sheet to actually close before touching the form again.
# The map has to load tiles and reverse-geocode before it will confirm, which on a
# loaded host is genuinely slow — _helpers/set_listing_location.yaml allows 45s for
# exactly this. While it is still open the form's tree is not reachable, so the next
# step failed with "Element not found: Publish" on a button that had not gone anywhere.
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 45000
- assertNotVisible: "Tap to set exact location on map"

- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
- assertVisible: "Owner Detail Publish Regression Item"

# ── 2) Edit → add a photo (TASK-P736 blocks Publish with zero photos) →
#       Publish FROM this owner-detail screen (not "Post a listing") ─────────

# Edit lives in the "More" overflow sheet (TASK-L863) — a draft owner detail
# renders only the primary "Publish" button plus "More".
# SCROLL to the actions block first. Save Draft lands on the OWNER DETAIL, where
# "Manage Listing" (Publish + More) is section 7 — and this flow now attaches a
# photo and drops a pin, because publishing requires both, so the gallery and the
# Location map above it fill the whole first screen. `tapOn` does not scroll, hence
# "Element not found: More" for a control one screen down. Same root cause as
# listing_actions_sheet; recorded as UI-042.
- scrollUntilVisible:
    element:
      text: "More"
    direction: DOWN
    timeout: 20000
- tapOn: "More"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

- tapOn: "Add Photos"
- waitForAnimationToEnd
# Helper: tolerant picker selectors + Android's "Add (N)" confirm button.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"

# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd
# CONFIRM the dialog. Publishing raises a native confirmAlert, and the flow used to
# assert the success sheet straight after tapping Publish — so it was waiting for a
# sheet that no one had asked for. (Screenshot: the dialog "Publish this listing?" still
# open, the listing still a Draft.)
#
# Via the helper, not `tapOn: "Publish"`: the dialog's confirm button says the same word
# as the button behind it, so a text tap matches both, lands on the scrim and dismisses
# the dialog without publishing — the helper's own comment documents that, and
# lifecycle_publish already uses it.
- assertVisible: "Publish this listing?"
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd

# ── 3) Success sheet appears on the SAME listing; dismiss it ─────────────────

- assertVisible: "Your listing is live!"
- assertVisible: "Owner Detail Publish Regression Item"
- tapOn: "Done"
- waitForAnimationToEnd
- assertVisible: "Active"
- assertVisible: "Owner Detail Publish Regression Item"

# ── 4) A SINGLE back-tap must land on My Listings — no stale duplicate ───────
# (Before the fix this landed on a second, un-refreshed "Draft" owner-detail
# screen for the same listing underneath, requiring an extra back-tap.)

- back
- waitForAnimationToEnd
- assertVisible: "Search my listings..."
