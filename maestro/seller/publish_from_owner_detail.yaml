appId: com.hatiwal.app
---
# TASK-J952 (review fix) — publishing a DRAFT via Edit FROM its own
# owner-detail screen must land back on that SAME owner-detail entry —
# never push a second, stale owner-detail screen on top of the one already
# in the stack.
#
# Repro without the fix: Save Draft lands on the draft's owner detail
# (stack: My Shop list → owner detail). Edit → Publish used to do a plain
# `router.replace(".../my-listings/:id?published=1")`, which pushed a
# SECOND owner-detail screen on top of the first instead of updating it
# (stack: My Shop list → owner detail #1 [stale, still "Draft"] → owner
# detail #2 [fresh, "Active", with the success sheet]). A seller pressing
# back once from #2 landed on the stale #1 — not the My Shop list — and had
# to press back twice to actually leave.
#
# Fixed via `router.dismissTo`, which pops back to the EXISTING owner-detail
# entry already in the stack (merging in `published=1`) instead of pushing a
# duplicate — see ListingForm.tsx publishMutation.onSuccess. This flow
# proves a SINGLE back-tap after dismissing the sheet lands on My Listings,
# not on a stale duplicate.

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd

# ── 1) Create a draft (Save Draft, not Publish) — lands on its OWN owner
#       detail directly, which is the screen this bug reproduces from ──────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- tapOn: "What are you selling?"
- inputText: "Owner Detail Publish Regression Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- inputText: "8000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
- tapOn: "Search a province…"
- inputText: "Kabul"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
- assertNotVisible: "Tap to set exact location on map"

- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
- assertVisible: "Owner Detail Publish Regression Item"

# ── 2) Edit → add a photo (TASK-P736 blocks Publish with zero photos) →
#       Publish FROM this owner-detail screen (not "Post a listing") ─────────

# Edit lives in the "More" overflow sheet (TASK-L863) — a draft owner detail
# renders only the primary "Publish" button plus "More".
- tapOn: "More"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 20000
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

- tapOn: "Add Photos"
- waitForAnimationToEnd
- tapOn: "Gallery"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Cover"

- tapOn: "Publish"
- waitForAnimationToEnd

# ── 3) Success sheet appears on the SAME listing; dismiss it ─────────────────

- assertVisible: "Your listing is live!"
- assertVisible: "Owner Detail Publish Regression Item"
- tapOn: "Done"
- waitForAnimationToEnd
- assertVisible: "Active"
- assertVisible: "Owner Detail Publish Regression Item"

# ── 4) A SINGLE back-tap must land on My Listings — no stale duplicate ───────
# (Before the fix this landed on a second, un-refreshed "Draft" owner-detail
# screen for the same listing underneath, requiring an extra back-tap.)

- back
- waitForAnimationToEnd
- assertVisible: "Search my listings..."
