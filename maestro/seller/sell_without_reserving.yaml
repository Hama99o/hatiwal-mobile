appId: com.hatiwal.app
---
# SF-M1 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md §1.4/§4.5/§10.1) — the
# owner's core complaint, verbatim: the old primary-action mapping taught
# reserve-first on every listing, even a batch of 50, when the API never
# required a reservation at all. This flow proves the fix end to end: a
# freshly published, LIVE listing's one-tap primary action is "Mark as Sold"
# — never a "Mark as Reserved" step in between, and Reserve is not offered
# anywhere on this screen at all (it only exists inside a chat thread now,
# SF-M2).
#
# SELF-CONTAINED, same rationale as sold_quantity_reconciliation.yaml and
# ../listings/edit_listing_quantity.yaml: creates and fully sells its own
# listing rather than reusing a shared disposable fixture two flows could
# collide on.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Create + publish a fresh single-item listing ─────────────────────────────
- tapOn: "New"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- assertVisible:
    id: "photos-add-button"
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

- tapOn: "What are you selling?"
- eraseText
- inputText: "QA Sell Without Reserving"
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "5000"

- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Accessories"
- waitForAnimationToEnd

- runFlow: ../_helpers/set_listing_location.yaml

- scrollUntilVisible:
    element:
      text: "Publish"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

# QA-F1 (run-266): publishing lands on the owner detail with the
# PublishSuccessSheet — a native <Modal> — on top of it. Every assertion below
# used to run against THAT sheet: it renders the title and a StatusBadge too, so
# `"Active"` passed while the flow had never reached the screen it thought it
# was on, and the first `scrollUntilVisible` after it then failed on a control
# the backdrop was covering. Assert the sheet (it IS the publish confirmation),
# then dismiss it, then assert the screen underneath.
- extendedWaitUntil:
    visible: "Your listing is live!"
    timeout: 60000
- tapOn:
    id: "publish-success-done"
- waitForAnimationToEnd
- assertNotVisible: "Your listing is live!"

- extendedWaitUntil:
    visible: "QA Sell Without Reserving"
    timeout: 30000
- assertNotVisible: "Draft"
- assertVisible: "Active"

# ── THE ACCEPTANCE BAR: the primary action on a LIVE listing is Mark Sold,
#    one tap, no reserve step in between. ────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "lifecycle-primary-action"
    text: "Mark as Sold"

# Reserve is gone from this screen entirely — SF-M1 deletes the reserve
# mutation/handler/moreActions entry, so opening "More" must never expose it.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- assertNotVisible: "Mark as Reserved"
- assertNotVisible: "listing-action-reserve"
- tapOn:
    id: "listing-actions-backdrop"
- waitForAnimationToEnd

# One tap on the primary action goes STRAIGHT to the buyer picker's SOLD
# copy — never a reserve confirmation, never an intermediate "Reserved"
# state to undo first.
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- assertVisible: "Who bought this item?"
- assertNotVisible: "Who's buying this item?"

- tapOn:
    id: "buyer-row-skip"
- waitForAnimationToEnd
- tapOn: "Confirm sold"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000

# SCROLL BACK UP BEFORE READING THE STATUS BADGE.
#
# run-267: this line was a bare `assertVisible: "Sold"` and it failed while the
# app was completely correct — the DB row was `status=sold, sold_units=1,
# sold_at=14:33:45`, verified directly. The two `scrollUntilVisible` steps above
# had left the screen down at "Location / Manage Listing", and the StatusBadge
# lives in section 2, at the very top of MyListingDetail. Same class as run-266's
# F5/F7: asserting a marker that is off-screen, on a screen that never scrolls
# itself back.
#
# `direction: UP` with a bounded timeout, because scrollUntilVisible only ever
# moves the way it is told and the badge is ABOVE the current position.
- scrollUntilVisible:
    element:
      id: "listing-status-badge"
    direction: UP
    timeout: 20000
# TWO assertions, not one compound `{id: …, text: "Sold"}`, and the reason is a
# real Maestro/RN detail worth writing down (run-268): `StatusBadge` renders the
# testID on its container and the label on a child `<Text>`, and Android exposes
# BOTH as sibling TextViews — the one carrying `resource-id:
# listing-status-badge` has EMPTY text. Proven from the failing step's own
# hierarchy dump, with the screenshot showing the badge reading "Sold" perfectly:
#   24 'listing-status-badge' ''
#   24 ''                     'Sold'
# So a compound selector can never match, while `seller-card-primary-action` +
# text CAN (that testID sits on a Button, whose accessible text is its label).
# The id assertion proves we are looking at the badge; the text assertion proves
# what it says. Neither is weaker than the compound would have been.
- assertVisible:
    id: "listing-status-badge"
- assertVisible: "Sold"
- assertNotVisible: "Active"
