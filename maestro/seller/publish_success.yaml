appId: com.hatiwal.app
---
# TASK-J952 — Post-publish success moment + return-to-origin routing.
#
# Before this fix, EVERY exit path out of ListingForm (save draft, publish,
# cancel) blew the navigation stack away and replaced it with the Browse
# tab — the single highest-intent moment in the app (just published!) got
# nothing but a toast. This flow verifies the fix end-to-end:
#
#   1. Create + publish a brand-new listing directly from the form →
#      lands on the listing's OWN owner detail (never Browse) with the
#      one-time PublishSuccessSheet (share / view as buyer / post another).
#   2. "View as buyer" opens the public listing detail for the same item.
#   3. Coming back and editing that same listing → Save returns to the
#      previous screen (the owner detail) with the refreshed value —
#      never Browse.
#
# Location is set once via the real map picker's place search (the zod
# schema requires latitude/longitude); the edit step in part 3 relies on
# that same listing already having a location, so it never needs to touch
# the location picker again.
#
# A photo is added before publishing (TASK-P736 blocks Publish with zero
# photos) — same "Add Photos → Gallery → first result" sequence as
# create_listing_with_photos.yaml.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── 1) Create a new listing and publish it directly ──────────────────────────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- tapOn: "Add Photos"
- waitForAnimationToEnd
# Helper: tolerant picker selectors + Android's "Add (N)" confirm button.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Publish Success Test Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "12000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# Set the exact location via the map picker's place search.
# Scroll to the map row. It sits below title, price, currency, condition,
# description and category on a form taller than the viewport, and `tapOn` never
# scrolls — publish_success and publish_from_owner_detail both failed with
# `Element not found: Tap to set exact location on map` on a form that renders it.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
# testIDs, not the placeholder + a selector-less index tap.
- tapOn:
    id: "location-search-input"
- eraseText
- inputText: "Kabul"
- extendedWaitUntil:
    visible:
      id: "location-search-result"
    timeout: 15000
- tapOn:
    id: "location-search-result"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd

# Location is now set on the form
- assertNotVisible: "Tap to set exact location on map"

# Publish directly (top toolbar) — NOT "Save Draft"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

# ── 2) PublishSuccessSheet appears — never the Browse tab ────────────────────

- assertVisible: "Your listing is live!"
- assertVisible: "Buyers can find it now — share it to sell faster."
- assertVisible: "Share listing"
- assertVisible: "View as buyer"
- assertVisible: "Post another listing"
- assertVisible: "Publish Success Test Item"

# ── 3) "View as buyer" opens the public listing detail ───────────────────────

- tapOn: "View as buyer"
- waitForAnimationToEnd
- assertVisible: "Publish Success Test Item"

# Back to the owner detail underneath (the sheet already dismissed itself
# when "View as buyer" was pressed, so there is nothing left to close).
- back
- waitForAnimationToEnd
- assertVisible: "Active"
- assertVisible: "Publish Success Test Item"

# The sheet must NOT reappear on this back-navigation / refocus.
- assertNotVisible: "Your listing is live!"

# ── 4) Edit-save returns to the owner detail — never Browse ──────────────────

# Edit now lives in the "More" overflow sheet (TASK-L863) — an active
# listing's owner detail renders only its primary action ("Mark as Reserved")
# plus "More".
- tapOn: "More"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# Scroll to the price field again — see the note above.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "13500"

# Editing an already-active listing shows a single "Save" button (not
# "Save Draft"/"Publish") — see ListingForm.tsx's isPublished branch.
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Save"
- waitForAnimationToEnd

# Landed back on the SAME owner detail — never Browse — showing the
# refreshed price and the still-Active status.
- assertVisible: "Publish Success Test Item"
- assertVisible: "Active"
