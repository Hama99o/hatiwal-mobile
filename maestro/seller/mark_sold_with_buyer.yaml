appId: com.hatiwal.app
---
# TASK-TX01 — Mark-sold with a recorded buyer.
#
# Seller opens the "Lenovo ThinkPad Laptop Core i5 8GB" active listing (has a
# seeded conversation with buyer@hatiwal.test / "Ahmad Karimi" — see
# hatiwal-api/db/seeds/e2e.rb), taps "Mark as Sold" from the owner detail
# screen, and identifies the real buyer from the BuyerPickerSheet instead of
# the legacy bare confirm. Verifies:
#   - the sheet opens with the listing's conversations
#   - selecting a buyer + confirming records the sale
#   - the listing flips to Sold and the success toast fires

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd

- tapOn: "Active"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    timeout: 8000

- tapOn: "Lenovo ThinkPad Laptop Core i5 8GB"
- waitForAnimationToEnd

# Owner detail screen — single primary lifecycle button for an active listing
- tapOn: "Mark as Sold"
- waitForAnimationToEnd

# BuyerPickerSheet opens — "Who bought this item?"
- assertVisible: "Who bought this item?"
- assertVisible: "Select from your conversations on this listing."

# The seeded conversation buyer is visible with their last message
- assertVisible: "Ahmad Karimi"
- assertVisible: "Hi, is this laptop still available?"

# The legacy skip option is still offered
- assertVisible: "Someone else / skip"

# Select the real buyer
- tapOn: "Ahmad Karimi"
- waitForAnimationToEnd

# Confirm sold with the default (listed) price
- tapOn: "Confirm sold"
- waitForAnimationToEnd

# Sale recorded — success toast + listing now shows Sold
- assertVisible: "Listing marked as sold"
- assertVisible: "Sold"
