appId: com.hatiwal.app
---
# TASK-TX01 — Mark-sold with a recorded buyer.
#
# Seller opens the "QA Disposable mark_sold_with_buyer" active listing (has a
# seeded conversation with buyer@hatiwal.test / "Ahmad Karimi" — see
# hatiwal-api/db/seeds/e2e.rb) and taps its PRIMARY action (SF-M1, Sell Flow
# Redesign: "Mark as Sold" is the one-tap primary for any Live listing —
# Reserve is gone from every listing surface, and "Mark as Sold" is no
# longer duplicated in the "More" overflow sheet for a non-expired active
# listing), then identifies the real buyer from the BuyerPickerSheet instead
# of the legacy bare confirm. Verifies:
#   - the sheet opens with the listing's conversations
#   - selecting a buyer + confirming records the sale
#   - the listing flips to Sold and the success toast fires
#
# REV2: recording a real buyer now also auto-opens the double-blind
# ReviewPromptSheet ("How was Ahmad Karimi as a buyer?") right after — this
# flow stays scoped to the TASK-TX01 mechanic and dismisses it via "Not now"
# before checking the Sold badge. The review-prompt UI itself is covered by
# maestro/reviews/rate_buyer_after_sale.yaml (self-contained — do not run
# both flows in the same suite pass without an E2E DB reset in between; they
# share this one seeded buyer-conversation fixture).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, so this flow can ruin it without touching a fixture
# anything else asserts on. It used to act on "whichever listing comes first".
- tapOn: "Search my listings..."
- eraseText
- inputText: "QA Disposable mark_sold_with_buyer"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable mark_sold_with_buyer"
      timeout: 30000

- scrollUntilVisible:
    element:
      text: "QA Disposable mark_sold_with_buyer"
    direction: DOWN
    # 20s, not 8s: this is a scroll down the whole feed to one seeded title, and 8s ran
    # out on a loaded device — offer_send_and_accept and offer_send_and_decline both
    # reported "No visible element found" with the title present in the hierarchy,
    # which is what a scroll running out of TIME rather than out of list looks like.
    timeout: 20000

# By CARD testID, not the title. The title is sitting in the search box from the step
# above, and that input is higher in the hierarchy than the results — so an anchored
# text match lands on the SEARCH FIELD, the tap does nothing, and the flow carries on
# believing it navigated. Proven three times with screenshots (composer_draft,
# full_marketplace_cycle, create_listing_with_condition).
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd

# Owner detail screen — SF-M1's primary action for a Live listing is ALWAYS
# "Mark as Sold" (Reserve no longer exists here, and "Mark as Sold" is not
# duplicated in the "More" sheet for a non-expired active listing — that
# entry only appears once a listing has EXPIRED). Tap the card's own primary
# action directly.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "seller-card-primary-action"
    timeout: 20000
- assertVisible:
    id: "seller-card-primary-action"
    text: "Mark as Sold"
- tapOn:
    id: "seller-card-primary-action"
- waitForAnimationToEnd

# BuyerPickerSheet opens — "Who bought this item?"
- assertVisible: "Who bought this item?"
- assertVisible: "Select from your conversations on this listing."

# The seeded conversation buyer is visible with their last message
- assertVisible: "Ahmad Karimi"
# The picker shows `conv.lastMessageBody` — the LAST message, not the first. For the
# disposable listing these flows use, db/seeds/e2e.rb seeds:
#     buyer:  "Is this still available? I can collect today."
#     seller: "Yes — when suits you?"        <- so this is what renders
# The old assertion, "Hi, is this laptop still available?", belongs to a different
# fixture entirely (RESPONSE_BADGE_CONVOS) and was never this conversation's text —
# not before the seller reply was added to the fixture, and not after.
- assertVisible: "Yes — when suits you?"

# The legacy skip option is still offered
- assertVisible: "Sold to someone not on Hatiwal"

# Select the real buyer
- tapOn: "Ahmad Karimi"
- waitForAnimationToEnd

# Confirm sold with the default (listed) price
- tapOn: "Confirm sold"
- waitForAnimationToEnd

# Sale recorded — success toast fires
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000

# REV2: the double-blind review prompt opens automatically — dismiss it here
# (out of scope for this flow) so the underlying Sold badge is checkable.
#
# QA-BUG2 (FlowApp #300): this is now `extendedWaitUntil`, not a bare
# `assertVisible`. The sheet used to open in the SAME tick as the "Marked
# sold · Undo" toast above, which on Android put the sheet's own backdrop on
# top of the toast's Undo button — tapping where Undo used to be just
# dismissed the sheet. The fix holds this sheet until the toast finishes its
# own ~4s lifecycle (sonner-native's default `duration`), so it can now
# legitimately open a few seconds after the toast text above, not
# instantly — waiting is correct here, not a workaround.
- extendedWaitUntil:
    visible: "How was Ahmad Karimi as a buyer?"
    timeout: 10000
- tapOn: "Not now"
- waitForAnimationToEnd

# Listing now shows Sold
- assertVisible: "Sold"
