appId: com.hatiwal.app
---
# SF-M5 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md §10.3/§10.3.1) — void a
# row from the Sales screen and prove the stock comes back for real (a
# server-side DELETE, not a client-side hide). Complements
# ../seller/undo_mark_sold.yaml, which proves the SAME DELETE endpoint fires
# from the mark-sold TOAST's "Undo" action on a full sellout — this flow
# proves it from the SALES SCREEN's own row instead, on a PARTIAL sale (the
# listing never goes Sold at all), and goes on to check the screen's own
# empty state once its only row is gone.
#
# SELF-CONTAINED, same rationale as sell_without_reserving.yaml /
# undo_mark_sold.yaml: creates and partially sells its own 5-unit batch
# rather than reusing a shared disposable fixture two flows could collide on.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Create + publish a fresh 5-unit listing ─────────────────────────────────
- tapOn: "New"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- assertVisible:
    id: "photos-add-button"
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

- tapOn: "What are you selling?"
- eraseText
- inputText: "QA Sales Screen Void Row"
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "2000"

- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Accessories"
- waitForAnimationToEnd

# ── Declare 5 units ──────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "I have more than one"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "listing-form-quantity-switch"
- waitForAnimationToEnd
- tapOn:
    id: "listing-form-quantity-input"
- inputText: "5"

- runFlow: ../_helpers/set_listing_location.yaml

- scrollUntilVisible:
    element:
      text: "Publish"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

# QA-F1 (run-266): publishing lands on the owner detail with the
# PublishSuccessSheet — a native <Modal> — on top of it. Every assertion below
# used to run against THAT sheet: it renders the title and a StatusBadge too, so
# `"Active"` passed while the flow had never reached the screen it thought it
# was on, and the first `scrollUntilVisible` after it then failed on a control
# the backdrop was covering. Assert the sheet (it IS the publish confirmation),
# then dismiss it, then assert the screen underneath.
- extendedWaitUntil:
    visible: "Your listing is live!"
    timeout: 60000
- tapOn:
    id: "publish-success-done"
- waitForAnimationToEnd
- assertNotVisible: "Your listing is live!"

- extendedWaitUntil:
    visible: "QA Sales Screen Void Row"
    timeout: 30000
- assertVisible: "Active"
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: "5 in stock"

# ── Sell 2 of 5, off-platform — a PARTIAL sale, listing stays Active ────────
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- assertVisible: "Who bought this item?"
- tapOn:
    id: "buyer-row-skip"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "buyer-picker-quantity"
    timeout: 15000
# SF-M9 (FlowApp #298): the field is now the shared QuantityStepper — tap the
# tap-to-edit VALUE to swap in the numeric Input, type into THAT, then commit
# by tapping the sheet's own header title (no hideKeyboard/Back — see
# multi_quantity_offplatform_sale.yaml's own note for why).
- tapOn:
    id: "buyer-picker-quantity-value"
- eraseText
- inputText: "2"
# COMMIT THE TYPED VALUE WITH ENTER, NOT BY TAPPING THE HEADER.
#
# run-268, proven from the failing step's own hierarchy dump: after the tap and
# `inputText`, the stepper was still in EDIT mode — the node on screen was
# `buyer-picker-quantity-input` (an EditText holding "3") and
# `buyer-picker-quantity-value` did not exist at all. Tapping the sheet's plain
# `<Text>` header dismisses nothing and does not blur a focused TextInput on
# Android, so `QuantityStepper.commitEdit` (wired to onBlur/onSubmitEditing)
# never ran: the field still read 3 while the SHEET still held 1.
#
# `pressKey: Enter` is the component's own documented commit path
# (`onSubmitEditing`), it is what the numeric keypad's ✓ key sends, and unlike
# `hideKeyboard` (which is Back on Android) it cannot close the sheet — the
# hazard the previous note in this file was working around.
- pressKey: Enter
- waitForAnimationToEnd
# ON THE NUMBER'S OWN NODE (`-value-text`), NOT the control (`-value`).
#
# run-268, from a hierarchy dump after a committed edit: `…-value` is the
# Pressable, which Android renders as a Button whose contentDescription is its
# a11y label ("Quantity") and whose own text is EMPTY — the number lives on an
# unnamed child TextView. So `{id: …-value, text: "N"}` can never match. The
# component now also puts `…-value-text` on that Text, so the value has a handle;
# `…-value` stays the TAP target and keeps the accessibility props.
- assertVisible:
    id: "buyer-picker-quantity-value-text"
    text: "2"
- tapOn: "Confirm sold"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000
# SCROLL BACK UP TO THE BADGES FIRST (run-269).
#
# These four assertions are about the top of MyListingDetail — section 2 is the
# StatusBadge + StockBadge row — but the flow is parked at the bottom, where the
# preceding `scrollUntilVisible` left it to tap the primary action. A bare
# `assertVisible: "Active"` therefore failed on a listing that was correctly
# Active, which is run-266's F5/F7 class and cost this flow two runs.
#
# Safe to spend a scroll here, unlike the mark-sold flows: nothing below depends
# on the ~8s Undo toast still being up.
- scrollUntilVisible:
    element:
      id: "listing-status-badge"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "listing-status-badge"
- assertVisible: "Active"
- assertNotVisible: "Sold"
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: ".*3 of 5 left.*"

# ── Open the Sales screen from the listing's own More sheet ─────────────────
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- assertVisible:
    id: "listing-action-sales"
- tapOn:
    id: "listing-action-sales"
- waitForAnimationToEnd

- assertVisible: "Sales"
- extendedWaitUntil:
    visible:
      id: "sales-tally"
    timeout: 20000
- assertVisible: ".*2 of 5 sold.*"

# ── Void the one recorded row ────────────────────────────────────────────
- tapOn: "Sold outside Hatiwal"
- waitForAnimationToEnd
- assertVisible: "Edit this sale"
- tapOn:
    id: "sale-edit-delete"
- waitForAnimationToEnd
- assertVisible: "Remove this sale?"
- assertVisible: "This puts the units back in stock and removes it from your sales history."
# Via the helper, not the label: the dialog's destructive button says
# "Delete" — the SAME word as the sheet's own Delete button behind it — so a
# text tap matches both and can land on the sheet instead of the dialog.
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sale removed — stock restored."
    timeout: 15000

# The Sales screen now has nothing left to show — the real empty state, not
# a lingering stale row.
- assertVisible: "No sales yet"
- assertVisible: "Sales you record will show up here."

# ── Back on the listing's own detail, stock is FULLY restored ───────────────
# SETTLE, TAP, THEN PROVE WE LEFT (run-271).
#
# `sales_screen_void_row` does the identical step and passes, so the Sales
# screen's back chevron works — but here the tap landed 2.3s after an edit sheet
# had just closed and the list had just refetched, and the screen did not change
# (the end-of-flow screenshot is still the Sales screen). A settle before the tap
# removes the race; the assertion after it means a genuine back-button failure
# says "we are still on Sales" instead of surfacing three steps later as a
# missing stock badge.
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd
- assertNotVisible:
    id: "sales-tally"
# SCROLL UP AFTER `back_button` (run-270). Back returns to the owner detail at
# the scroll position it was left at — which is down at the Manage Listing row,
# because that is where this flow opened the More sheet. The badges are section 2,
# at the very top, so `stock-badge-owner` was off-screen and this failed on a
# stock figure that was perfectly correct (the tally on the previous screen had
# just confirmed the PATCH landed). run-266's F5/F7 class, one screen later.
- scrollUntilVisible:
    element:
      id: "listing-status-badge"
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "stock-badge-owner"
    timeout: 20000
- assertVisible: "5 in stock"
- assertNotVisible: ".*of 5 left.*"
- assertVisible: "Active"
