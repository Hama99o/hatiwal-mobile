appId: com.hatiwal.app
---
# SF-M5 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md §10.3/§10.3.1) — void a
# row from the Sales screen and prove the stock comes back for real (a
# server-side DELETE, not a client-side hide). Complements
# ../seller/undo_mark_sold.yaml, which proves the SAME DELETE endpoint fires
# from the mark-sold TOAST's "Undo" action on a full sellout — this flow
# proves it from the SALES SCREEN's own row instead, on a PARTIAL sale (the
# listing never goes Sold at all), and goes on to check the screen's own
# empty state once its only row is gone.
#
# SELF-CONTAINED, same rationale as sell_without_reserving.yaml /
# undo_mark_sold.yaml: creates and partially sells its own 5-unit batch
# rather than reusing a shared disposable fixture two flows could collide on.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Create + publish a fresh 5-unit listing ─────────────────────────────────
- tapOn: "New"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- assertVisible:
    id: "photos-add-button"
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

- tapOn: "What are you selling?"
- eraseText
- inputText: "QA Sales Screen Void Row"
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "2000"

- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Accessories"
- waitForAnimationToEnd

# ── Declare 5 units ──────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "I have more than one"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "listing-form-quantity-switch"
- waitForAnimationToEnd
- tapOn:
    id: "listing-form-quantity-input"
- inputText: "5"

- runFlow: ../_helpers/set_listing_location.yaml

- scrollUntilVisible:
    element:
      text: "Publish"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "QA Sales Screen Void Row"
    timeout: 60000
- assertVisible: "Active"
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: "5 in stock"

# ── Sell 2 of 5, off-platform — a PARTIAL sale, listing stays Active ────────
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- assertVisible: "Who bought this item?"
- tapOn:
    id: "buyer-row-skip"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "buyer-picker-quantity"
    timeout: 15000
# SF-M9 (FlowApp #298): the field is now the shared QuantityStepper — tap the
# tap-to-edit VALUE to swap in the numeric Input, type into THAT, then commit
# by tapping the sheet's own header title (no hideKeyboard/Back — see
# multi_quantity_offplatform_sale.yaml's own note for why).
- tapOn:
    id: "buyer-picker-quantity-value"
- eraseText
- inputText: "2"
- tapOn: "Who bought this item?"
- assertVisible:
    id: "buyer-picker-quantity-value"
    text: "2"
- tapOn: "Confirm sold"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000
- assertVisible: "Active"
- assertNotVisible: "Sold"
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: ".*3 of 5 left.*"

# ── Open the Sales screen from the listing's own More sheet ─────────────────
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- assertVisible:
    id: "listing-action-sales"
- tapOn:
    id: "listing-action-sales"
- waitForAnimationToEnd

- assertVisible: "Sales"
- extendedWaitUntil:
    visible:
      id: "sales-tally"
    timeout: 20000
- assertVisible: ".*2 of 5 sold.*"

# ── Void the one recorded row ────────────────────────────────────────────
- tapOn: "Sold outside Hatiwal"
- waitForAnimationToEnd
- assertVisible: "Edit this sale"
- tapOn:
    id: "sale-edit-delete"
- waitForAnimationToEnd
- assertVisible: "Remove this sale?"
- assertVisible: "This puts the units back in stock and removes it from your sales history."
# Via the helper, not the label: the dialog's destructive button says
# "Delete" — the SAME word as the sheet's own Delete button behind it — so a
# text tap matches both and can land on the sheet instead of the dialog.
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sale removed — stock restored."
    timeout: 15000

# The Sales screen now has nothing left to show — the real empty state, not
# a lingering stale row.
- assertVisible: "No sales yet"
- assertVisible: "Sales you record will show up here."

# ── Back on the listing's own detail, stock is FULLY restored ───────────────
- tapOn:
    id: "back_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "stock-badge-owner"
    timeout: 20000
- assertVisible: "5 in stock"
- assertNotVisible: ".*of 5 left.*"
- assertVisible: "Active"
