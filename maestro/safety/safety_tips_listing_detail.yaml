appId: com.hatiwal.app
---
# Meetup safety tips — quiet link on listing detail opens the sheet, shows
# localized tips, and closes cleanly without crowding the Message Seller CTA.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Sticky CTA is present and not obscured
- assertVisible: "Contact Seller"
# Quiet safety-tips link near location
# The safety link sits near the LOCATION block, far down the listing detail —
# below the photo, price, description and seller row — and `tapOn` never scrolls.
# It carries testID="safety-tips-link", which is also immune to translation.
- scrollUntilVisible:
    element:
      id: "safety-tips-link"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "safety-tips-link"
- waitForAnimationToEnd
# Sheet opens with localized tips
- assertVisible: "Meetup Safety Tips"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Meet in a busy, public place.*"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Never pay in advance.*"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Report suspicious users.*"
# Close the sheet
- tapOn: "Close"
- waitForAnimationToEnd
# Back on listing detail — CTA still intact
- assertVisible: "Contact Seller"
