appId: com.hatiwal.app
---
# Offer flow: buyer sends offer -> seller accepts -> accepted badge shown
#
# Fixed for TASK-O947: the previous version never actually switched accounts
# (it did `launchApp: { clearState: false }` while still signed in as the
# buyer, so the seller-only "Accept" button could never have been found) --
# now signs out and back in as the real seller via login_seller.yaml.
#
# TASK-O947 also means accepting now triggers a confirm sheet titled
# "Reserve for {buyer}?" (the accepted price appears only in the sheet BODY
# sentence, never the title -- see reserveAfterAccept.ts) -- when the
# responder owns an active listing. This flow stays scoped to the plain
# accept-outcome-badge mechanic and dismisses that sheet via "Not now",
# asserting the listing stays Active. The prompt's CONFIRM path (and the
# reserve it performs) is covered separately by
# maestro/chat/reserve_after_accept.yaml.
#
# CR fix (broken by the O947 copy change): the buyer's display name is
# wrapped in Unicode bidi-isolate marks (U+2066/U+2069) when interpolated
# into the title (`wrapBidiIsolate` in reserveAfterAccept.ts), so the
# rendered text is literally "Reserve for ⁦Ahmad Karimi⁩?" -- an
# EXACT string match can never match that. Use a `.*`-wrapped regex instead.
#
# Uses "Men Winter Jacket XL Black" (active, seller-owned, no pre-seeded
# conversation) -- kept distinct from the Lenovo ThinkPad / Ahmad Karimi
# fixture (mark_sold_with_buyer.yaml, response-rate badge seed) and from the
# listing used by reserve_after_accept.yaml, so none of these mutating flows
# collide with each other.
#
# CR fix (cycle-4, "same defects" as reserve_after_accept.yaml): "Message
# Seller" was both mislabeled AND unnecessary -- "Make an Offer" is a SIBLING
# button of "Contact Seller" directly on ListingDetail.tsx, not something
# reachable only after opening the thread, so the whole extra tap is dropped.
# The offer-amount field has no visible "Offer Amount" label -- targeted by
# its testID instead. Dropped the tautological "Pending" assertion (no such
# status text is ever rendered for a not-yet-answered offer). "Accept" ->
# the button's actual label is "Accept offer" (chat.offer.accept);
# "Accepted" -> the outcome badge's actual label is "Offer accepted"
# (chat.offer.accepted).

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Men Winter Jacket XL Black"
    direction: DOWN
    timeout: 8000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd

# "Make an Offer" is a sibling of "Contact Seller" directly on the listing
# detail page -- no need to open the thread first.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
- tapOn:
    id: "offer-amount-input"
- inputText: "3000"
- tapOn: "Send Offer"
- waitForAnimationToEnd

# Offer bubble visible. The header pill renders as "PRICE OFFER" (uppercased
# via .toUpperCase() in MessageBubble.tsx) -- asserting bare "Offer" is a
# case-sensitive miss against that. "Your Offer" is the bubble's own
# mixed-case label above the amount, and is unambiguous.
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*3,000"
- assertVisible: "Your Offer"

# Sign out and back in as the real seller to accept. chat-tab has no testID
# anywhere in the tab bar -- tap the "Chats" label (its actual translated
# tab title) instead (same fix as reserve_after_accept.yaml).
- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
- tapOn: ".*Accept.*"
- waitForAnimationToEnd

# TASK-O947: dismiss the reserve-after-accept confirm sheet -- out of scope
# here, covered by reserve_after_accept.yaml. Regex (not an exact string)
# because the interpolated buyer name is bidi-isolate wrapped (see the header
# comment above) -- an exact "Reserve for Ahmad Karimi?" string can never match.
- assertVisible: ".*Reserve for.*Ahmad Karimi.*"
- tapOn: "Not now"
- waitForAnimationToEnd

# Accepted state, and the listing is untouched -- still Active, still shows
# its own lifecycle "Reserve" action (never auto-reserved by "Not now").
- assertVisible: "Offer accepted"
- assertVisible: "Reserve"
