appId: com.hatiwal.app
---
# Respond to a meetup proposal — accept or decline

- runFlow: ../_helpers/login.yaml
- tapOn: "Chats"
- waitForAnimationToEnd
# Open a conversation that has a meetup proposal from the seller
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# Scroll to find a meetup proposal bubble
- scroll
- waitForAnimationToEnd
# Accept the meetup proposal
- tapOn: "Accept"
- waitForAnimationToEnd
- assertVisible: "Meetup accepted"
# Verify the accepted state is shown in the thread
- assertVisible: "You accepted the meetup"
