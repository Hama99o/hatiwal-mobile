appId: com.hatiwal.app
---
# Start a conversation from listing detail — buyer taps Message Seller

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# The assertion IS the check — "we are on the listing detail". The tap that used
# to precede it opened the FirstMessageSheet, whose own title is "Message Seller"
# (listing.detail.messageSeller), so the sheet covered the very button being
# asserted and every step after it acted on a covered screen.
- assertVisible: "Contact Seller"
- tapOn: "Contact Seller"
- waitForAnimationToEnd
# First message sheet opens
# "Contact Seller" opens the FirstMessageSheet (D2 start flow), NOT the thread.
#
# This flow asserted the THREAD composer's placeholder ("Ask about this item...")
# straight after the tap, which is where this used to land before that sheet
# existed — so it failed on a screen that was working correctly. The sheet is
# titled "Message Seller", shows the listing + price, and PRE-FILLS the very
# message this flow used to type ("Hi, is this still available?"), so the typing
# step is gone too: typing into a pre-filled field appends to it.
- assertVisible: "Message Seller"
- assertVisible: "Hi, is this still available?"
- tapOn: "Send Message"
- waitForAnimationToEnd
# Redirected to conversation thread
- assertVisible: "Hi, is this still available?"
# Listing pinned at top
- assertVisible: "View Listing"
