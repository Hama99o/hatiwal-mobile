appId: com.hatiwal.app
---
# Offer flow: buyer sends offer → seller declines → declined badge shown in thread

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
# A KNOWN listing owned by seller@hatiwal.test, because Step 2 declines the offer
# and only the RECIPIENT can decline. Index 0 is whatever the feed ranks first; on
# another seller's listing the test seller never sees the conversation.
- scrollUntilVisible:
    element:
      text: "Men Winter Jacket XL Black"
    direction: DOWN
    centerElement: true
    # 20s, not 8s: this is a scroll down the whole feed to one seeded title, and 8s ran
    # out on a loaded device — offer_send_and_accept and offer_send_and_decline both
    # reported "No visible element found" with the title present in the hierarchy,
    # which is what a scroll running out of TIME rather than out of list looks like.
    timeout: 20000
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
# NO "Contact Seller" tap first. "Make an Offer" is a SIBLING of "Contact
# Seller" directly on ListingDetail.tsx — tapping Contact Seller navigates
# AWAY (to the thread, or to FirstMessageSheet on a first contact), and the
# offer button is then left behind on the screen we came from. That is why
# this failed with "Element not found: Text matching regex: Make an Offer".
# offer_send_and_accept.yaml has always done it this way and passes.

# Send offer
- tapOn: "Make an Offer"
- waitForAnimationToEnd
# By testID, like offer_send_and_accept — the only offer flow that passed.
# The sheet's label is `listing.detail.yourOffer` = "Your offer", lowercase o.
# "Your Offer" with a capital O is `chat.offer.yourOffer`, which MessageBubble
# renders on the bubble IN THE THREAD after sending. Maestro text matching is a
# case-sensitive anchored regex, so tapping "Your Offer" here missed by exactly
# one character and reported "Element not found: Your Offer" with the sheet open.
- tapOn:
    id: "offer-amount-input"
- inputText: "8000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*8,000"
# NOT "Pending". No such label exists on an offer bubble — a not-yet-answered offer
# deliberately renders NO status text (offer_send_and_accept's header says the same).
# "Pending" does exist as report.json's report status, on an unrelated screen, which
# is why the flow lint's locale check did not flag it: the string is real, just not
# here.
# MessageBubble.tsx:874 renders chat.offer.yourOffer = "Your Offer" above the amount
# on the sender's own bubble, which is what offer_send_and_accept asserts and passes.
- assertVisible: "Your Offer"

# Switch to seller to decline
# THE SELLER declines, so sign out and back in as them. This flow relaunched with
# `clearState: false` — still the buyer, who had just sent the offer — so the
# seller-only "Decline" (chat.offer.decline) could never have been on screen.
# offer_send_and_accept carried the identical bug and was fixed this way; its header
# says so in as many words. offer_counter_flow had it too.
- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`, a
# label on the seller's owner-detail screen, so a text tap can land on that instead.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
# Prove we are in the right thread before acting on it.
- assertVisible: ".*8,000"
- tapOn: "Decline"
- waitForAnimationToEnd
# `chat.offer.declined` = "Offer declined" — the bare word "Declined" never
# matched, because Maestro anchors the whole string.
- assertVisible: "Offer declined"
