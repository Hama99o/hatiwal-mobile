appId: com.hatiwal.app
---
# Offer flow: buyer sends offer → seller declines → declined badge shown in thread

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# NO "Contact Seller" tap first. "Make an Offer" is a SIBLING of "Contact
# Seller" directly on ListingDetail.tsx — tapping Contact Seller navigates
# AWAY (to the thread, or to FirstMessageSheet on a first contact), and the
# offer button is then left behind on the screen we came from. That is why
# this failed with "Element not found: Text matching regex: Make an Offer".
# offer_send_and_accept.yaml has always done it this way and passes.

# Send offer
- tapOn: "Make an Offer"
- waitForAnimationToEnd
# `chat.offer.yourOffer` = "Your Offer"; there is no "Offer Amount" label.
- tapOn: "Your Offer"
- inputText: "8000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*8,000"
- assertVisible: "Pending"

# Switch to seller to decline
- launchApp:
    clearState: false
# Wait for the tab bar, not just for animations. A warm relaunch remounts the tree
# and re-bootstraps auth; `waitForAnimationToEnd` returns well before that, so a
# tab tap fires into a screen still coming up and silently does nothing.
- extendedWaitUntil:
    visible:
      id: "chat-tab"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- tapOn: "Decline"
- waitForAnimationToEnd
# `chat.offer.declined` = "Offer declined" — the bare word "Declined" never
# matched, because Maestro anchors the whole string.
- assertVisible: "Offer declined"
