appId: com.hatiwal.app
---
# Counter-offer flow (TASK-O829):
#   1. Buyer makes an offer
#   2. Seller sends a counter-offer with a higher price
#   3. Buyer accepts the counter
#   4. Both sides show the accepted outcome badge on the counter card

# ── Step 1: buyer sends an offer ────────────────────────────────────────────
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
# A KNOWN listing, not index 0 of the feed. Step 2 signs in as
# seller@hatiwal.test to counter, so this must be a listing THAT seller owns —
# index 0 is whatever the feed ranks first, and on someone else's listing the
# seller would never see the conversation.
# "Men Winter Jacket XL Black" is seeded to the test seller and left active by the
# other offer flows (accept answers "Not now", which does not reserve it). The
# Lenovo is not reusable: reserved_sold_dead_end_notice marks it reserved then sold,
# which closes offers on it.
# SEARCH, DO NOT SCROLL. Scrolling the whole feed to one title is a race against
# the fixture count, and it is a race this flow keeps losing: the timeout here was
# already raised from 8s to 20s for exactly this symptom, and in run-489 the 20s
# ran out too — "No visible element found: Men Winter Jacket XL Black" while the
# listing was present and active in the database (id 1947, owner
# seller@hatiwal.test) and the feed was rendering normally in the screenshot.
#
# The seed now leaves 98 listings, so every added fixture makes this scroll longer
# and the next timeout bump is only a delay before the same failure. Searching is
# O(1) in feed size and is already the pattern two other flows use
# (report_user_then_block, listing_detail_held_units_transparency), so this is not
# a new idea — just applying the one that does not rot.
#
# The flow's subject is the offer counter cycle, not feed scrolling, so nothing of
# value is lost.
- tapOn:
    id: "browse-search-input"
- inputText: "Men Winter Jacket XL Black"
# PUT THE KEYBOARD AWAY BEFORE TAPPING THE RESULT.
#
# Typing into a search box leaves the IME covering the lower half of the screen,
# and a result card that lands behind it cannot be tapped — Maestro reports the
# tap COMPLETED regardless, because a tap on a covered element always is, so the
# flow continues on a screen it never left and fails later somewhere unrelated.
# That is exactly how seller/reserved_buyer failed in run-490: end-of-flow
# screenshot showing BROWSE, one result card, keyboard over it, and the reported
# failure three steps later on "Make an Offer".
#
# Latent rather than certain — browse/listing_detail_held_units_transparency
# carries this same shape and passes, because its card happens to land above the
# IME. At 360dp the keyboard takes roughly half the window, so the margin is thin
# and the failure is a matter of which result row you get.
#
# `hideKeyboard` is Android's Back and is unsafe in general, but SAFE at exactly
# this point: we have just typed, so the IME is definitely up and Back closes it
# without reaching the app. flow_lint's HIDEKEY rule encodes that precondition.
# CORRECTED 2026-09-05: this was `hideKeyboard`, and that EXITED THE APP.
# hideKeyboard is Android's Back. It is safe only while the IME is definitely up,
# and after `inputText` on this screen it often is NOT — the field can lose focus
# on its own. Back then reaches the app and pops out of it. The proof is
# browse/listing_detail_held_units_transparency's failure screenshot from
# run-494: the ANDROID HOME SCREEN, on a flow that had passed twice before this
# change. The repo already carried that warning and I rolled the mistake into ten
# flows anyway.
#
# The margin drag sends NO key event, so it cannot reach the app whether or not
# the IME is up. That is the whole reason _helpers/dismiss_keyboard_by_drag.yaml
# exists.
- runFlow: ../_helpers/dismiss_keyboard_by_drag.yaml
- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Men Winter Jacket XL Black"
    timeout: 20000
# BY testID, not by the title. The title is now also the SEARCH INPUT's own text,
# so a text tap can land on the field instead of the result — which is precisely
# how the dev-launcher URL field swallowed 18 flows earlier tonight. index 0 is
# safe here because the query is the exact full title, so the result list is this
# listing.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# NO "Contact Seller" tap first. "Make an Offer" is a SIBLING of "Contact
# Seller" directly on ListingDetail.tsx — tapping Contact Seller navigates
# AWAY (to the thread, or to FirstMessageSheet on a first contact), and the
# offer button is then left behind on the screen we came from. That is why
# this failed with "Element not found: Text matching regex: Make an Offer".
# offer_send_and_accept.yaml has always done it this way and passes.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
# By testID, like offer_send_and_accept — the only offer flow that passed.
# The sheet's label is `listing.detail.yourOffer` = "Your offer", lowercase o.
# "Your Offer" with a capital O is `chat.offer.yourOffer`, which MessageBubble
# renders on the bubble IN THE THREAD after sending. Maestro text matching is a
# case-sensitive anchored regex, so tapping "Your Offer" here missed by exactly
# one character and reported "Element not found: Your Offer" with the sheet open.
- tapOn:
    id: "offer-amount-input"
- inputText: "8000"
- tapOn: "Send Offer"
- waitForAnimationToEnd

# Offer bubble is visible in thread
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*8,000"
- assertVisible: "Price Offer"

# ── Step 2: seller counters with a new price ─────────────────────────────────
# The old comment here claimed "Seller is already the other participant" — the flow
# was still signed in as the BUYER, who had just sent the offer. Only the recipient
# can counter, so `chat.actions.counter` ("Counter") was never on screen and this
# failed with "Element not found: Text matching regex: Counter". The literal was
# right; the session was wrong.
#
# offer_send_and_accept carried exactly this bug for the seller-only "Accept" button
# and was fixed the same way, so this mirrors it.
- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`, a
# label on the seller's owner-detail screen, so a text tap can land on that instead.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# lint: searchtap-ok — this is the CONVERSATIONS list, not the search results. No
# search field is on screen here, so the title can only match the thread's row.
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
# Prove we are in the right thread before acting on it, so a wrong thread fails here
# rather than three steps later on a button that looks missing.
- assertVisible: ".*8,000"
- tapOn: "Counter"
- waitForAnimationToEnd

# Counter sheet is open
- assertVisible: "Counter Offer"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Previous offer.*"

# Clear pre-filled amount and enter counter price
- eraseText
- inputText: "9500"
- tapOn: "Send Counter"
- waitForAnimationToEnd

# Counter-offer card is visible
- assertVisible: "Counter Offer"
- assertVisible: ".*9,500"

# ── Step 3: buyer accepts the counter ────────────────────────────────────────
# Buyer is the other participant; the counter card shows Accept/Decline
- assertVisible: "Accept offer"
- tapOn: "Accept offer"
- waitForAnimationToEnd

# ── Step 4: accepted outcome badge shown on counter card ─────────────────────
- assertVisible: "Offer accepted"
