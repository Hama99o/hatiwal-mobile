appId: com.hatiwal.app
---
# Counter-offer flow (TASK-O829):
#   1. Buyer makes an offer
#   2. Seller sends a counter-offer with a higher price
#   3. Buyer accepts the counter
#   4. Both sides show the accepted outcome badge on the counter card

# ── Step 1: buyer sends an offer ────────────────────────────────────────────
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
# A KNOWN listing, not index 0 of the feed. Step 2 signs in as
# seller@hatiwal.test to counter, so this must be a listing THAT seller owns —
# index 0 is whatever the feed ranks first, and on someone else's listing the
# seller would never see the conversation.
# "Men Winter Jacket XL Black" is seeded to the test seller and left active by the
# other offer flows (accept answers "Not now", which does not reserve it). The
# Lenovo is not reusable: reserved_sold_dead_end_notice marks it reserved then sold,
# which closes offers on it.
- scrollUntilVisible:
    element:
      text: "Men Winter Jacket XL Black"
    direction: DOWN
    centerElement: true
    timeout: 8000
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
# NO "Contact Seller" tap first. "Make an Offer" is a SIBLING of "Contact
# Seller" directly on ListingDetail.tsx — tapping Contact Seller navigates
# AWAY (to the thread, or to FirstMessageSheet on a first contact), and the
# offer button is then left behind on the screen we came from. That is why
# this failed with "Element not found: Text matching regex: Make an Offer".
# offer_send_and_accept.yaml has always done it this way and passes.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
# By testID, like offer_send_and_accept — the only offer flow that passed.
# The sheet's label is `listing.detail.yourOffer` = "Your offer", lowercase o.
# "Your Offer" with a capital O is `chat.offer.yourOffer`, which MessageBubble
# renders on the bubble IN THE THREAD after sending. Maestro text matching is a
# case-sensitive anchored regex, so tapping "Your Offer" here missed by exactly
# one character and reported "Element not found: Your Offer" with the sheet open.
- tapOn:
    id: "offer-amount-input"
- inputText: "8000"
- tapOn: "Send Offer"
- waitForAnimationToEnd

# Offer bubble is visible in thread
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*8,000"
- assertVisible: "Price Offer"

# ── Step 2: seller counters with a new price ─────────────────────────────────
# The old comment here claimed "Seller is already the other participant" — the flow
# was still signed in as the BUYER, who had just sent the offer. Only the recipient
# can counter, so `chat.actions.counter` ("Counter") was never on screen and this
# failed with "Element not found: Text matching regex: Counter". The literal was
# right; the session was wrong.
#
# offer_send_and_accept carried exactly this bug for the seller-only "Accept" button
# and was fixed the same way, so this mirrors it.
- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`, a
# label on the seller's owner-detail screen, so a text tap can land on that instead.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn: "Men Winter Jacket XL Black"
- waitForAnimationToEnd
# Prove we are in the right thread before acting on it, so a wrong thread fails here
# rather than three steps later on a button that looks missing.
- assertVisible: ".*8,000"
- tapOn: "Counter"
- waitForAnimationToEnd

# Counter sheet is open
- assertVisible: "Counter Offer"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Previous offer.*"

# Clear pre-filled amount and enter counter price
- eraseText
- inputText: "9500"
- tapOn: "Send Counter"
- waitForAnimationToEnd

# Counter-offer card is visible
- assertVisible: "Counter Offer"
- assertVisible: ".*9,500"

# ── Step 3: buyer accepts the counter ────────────────────────────────────────
# Buyer is the other participant; the counter card shows Accept/Decline
- assertVisible: "Accept offer"
- tapOn: "Accept offer"
- waitForAnimationToEnd

# ── Step 4: accepted outcome badge shown on counter card ─────────────────────
- assertVisible: "Offer accepted"
