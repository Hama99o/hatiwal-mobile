appId: com.hatiwal.app
---
# Full meetup cycle: buyer proposes → seller accepts → confirmed badge in both threads

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- tapOn: "Message Seller"
- waitForAnimationToEnd

# Propose meetup — TASK-K487: the composer's meetup/file/photo/offer icons
# are now collapsed behind a single "+" actions sheet.
- tapOn:
    text: "More actions"
- waitForAnimationToEnd
- tapOn: "Propose Meetup"
- waitForAnimationToEnd
- assertVisible: "Propose a Meetup"

# Fill in place and time
- tapOn: "Location"
- inputText: "Kabul City Center"
- tapOn: "Date & Time"
- waitForAnimationToEnd
# Select tomorrow date (tap first available slot)
- tapOn:
    index: 0
- waitForAnimationToEnd

- tapOn: "Send Proposal"
- waitForAnimationToEnd
- assertVisible: "Meetup Proposed"

# Switch to seller to respond
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Meetup Proposed"
- tapOn: "Accept Meetup"
- waitForAnimationToEnd
- assertVisible: "Meetup Confirmed"
