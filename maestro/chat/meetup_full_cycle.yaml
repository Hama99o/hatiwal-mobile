appId: com.hatiwal.app
---
# Full meetup cycle: buyer proposes → seller accepts → confirmed badge in both threads

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- tapOn: "Message Seller"
- waitForAnimationToEnd

# Propose meetup — TASK-K487: the composer's meetup/file/photo/offer icons
# are now collapsed behind a single "+" actions sheet.
- tapOn:
    accessibilityLabel: "More actions"
- waitForAnimationToEnd
- tapOn: "Propose Meetup"
- waitForAnimationToEnd
- assertVisible: "Propose a Meetup"

# Fill in place and time
- tapOn: "Location"
- inputText: "Kabul City Center"
- tapOn: "Date & Time"
- waitForAnimationToEnd
# Select tomorrow date (tap first available slot)
- tapOn:
    index: 0
- waitForAnimationToEnd

- tapOn: "Send Proposal"
- waitForAnimationToEnd
- assertVisible: "Meetup Proposed"

# Switch to seller to respond
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Meetup Proposed"
- tapOn: "Accept Meetup"
- waitForAnimationToEnd
- assertVisible: "Meetup Confirmed"
