appId: com.hatiwal.app
---
# Full meetup cycle: buyer proposes → seller accepts → confirmed badge in both threads

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Not a bare `tapOn: "Contact Seller"`: on a FIRST contact the app opens
# FirstMessageSheet ("Message Seller" + a pre-filled opener + Send Message)
# and the thread does not exist until that is sent. The helper handles both
# paths and leaves us in the thread. Whether a thread already exists depends
# on shared fixture state, so this cannot be assumed either way.
- runFlow: ../_helpers/open_thread_from_listing.yaml

# Propose meetup — TASK-K487: the composer's meetup/file/photo/offer icons
# are now collapsed behind a single "+" actions sheet.
# The composer "+" button. NOT its accessibilityLabel ("More actions",
# chat.composer.moreActions): that is translated, and matching it was failing
# with "Element not found: Text matching regex: More actions" on a control
# that is right there — it carries testID="composer-plus-button", which is
# both locale-independent and unambiguous.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# The actions-sheet ROW that opens the meetup sheet (composer-action-meetup).
# Note "Propose Meetup" is TWO different controls: this row
# (chat.proposeMeetup) and the submit button inside the sheet
# (chat.meetup.propose). Same words, so they must be told apart by testID.
- tapOn:
    id: "composer-action-meetup"
- waitForAnimationToEnd
- assertVisible: "Propose a Meetup"

# Fill in place and time
# The meetup sheet's PLACE field, by its placeholder
# (`chat.meetup.placePlaceholder`). "Location" is not a label on this sheet at all
# — that name belongs to the listing form, which is a different screen.
# testIDs, not the placeholders. Maestro matches text as an ANCHORED REGEX and
# these placeholders contain "(" and ")" — an unescaped capture group that never
# matches the literal text, plus a "?" that makes the preceding letter optional.
- tapOn:
    id: "meetup-place-input"
- eraseText
- inputText: "Kabul City Center"
# The Time field is a plain text Input — there is NO date picker on this sheet, so
# the old "tap Time, then tap the first available slot" could not work: the slot it
# reached for does not exist, and the bare index tap that stood in for it had no
# selector, so it matched every element on screen.
- tapOn:
    id: "meetup-time-input"
- eraseText
- inputText: "Tomorrow 3pm"
- waitForAnimationToEnd
# NO IME dismissal before submitting. BOTH cures failed in run-232:
#   * `hideKeyboard` is BACK on Android — it dismissed the sheet's <Modal>, and
#     the submit button came back "not found" because the sheet was gone.
#   * tapping the "Propose a Meetup" heading to blur ALSO failed "not found":
#     MeetupSheet has no ScrollView and uses KeyboardAvoidingView
#     behavior="height" on Android, so the IME compresses the sheet and clips
#     the heading out of the layout exactly when the keyboard is up.
# MeetupSheet's own platform audit says the submit button stays reachable with
# the keyboard up, so tap it directly. By ID, never by label: the label swaps to
# "Sending…" while submitting. The assert makes a clipped button fail HERE.
- assertVisible:
    id: "meetup-propose-submit"
- tapOn:
    id: "meetup-propose-submit"
- waitForAnimationToEnd
# The bubble header is `chat.meetup.proposed` = "Meetup Proposal".
- assertVisible: "Meetup Proposal"

# The proposal must survive a cold restart — the "full cycle" coverage that
# meetup_respond does not have. clearState:false keeps the session.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "chat-tab"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Row 0 = most recent message, and the proposal we just sent is the newest one
# in the account, so this is the thread we proposed in.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Meetup Proposal"

# Accept as the SELLER. Accept/Decline render only when `!isMine`
# (MessageBubble.tsx), so the buyer who proposed can NEVER accept their own
# bubble — this flow used to relaunch as the same user and tap "Accept", which
# is why run-232 reported "Element not found: Accept" here.
- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Meetup Proposal"
    direction: DOWN
    timeout: 20000
# Wildcards: Maestro text matching is an ANCHORED full-string regex, so a bare
# "Accept" misses a label rendered with any surrounding text.
- tapOn: ".*Accept.*"
- waitForAnimationToEnd
# Toast first — it lives ~3s.
- extendedWaitUntil:
    visible: "You accepted the meetup"
    timeout: 10000
- assertVisible: "Meetup accepted"
