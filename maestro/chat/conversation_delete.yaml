appId: com.hatiwal.app
---
# Delete a conversation — confirm dialog, then removed from the list.
#
# This flow used to OPEN the conversation and look for "Delete Conversation" in
# the thread header, with a comment admitting it was a guess ("depends on
# implementation"). It is not there. Deleting is done from the LIST, via the row's
# own options menu (ConversationRow: `conversation-options-<id>` ->
# `conversation-action-menu` -> `menu-delete`), and the confirmation is a
# confirmAlert whose CTA is the generic "Delete" (common.delete), not the menu
# item's longer "Delete Conversation" label.

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"

# DELETE THE ONE NOTHING ELSE NEEDS.
#
# This used to open the menu on `conversation-options-\\d+` index 0 — whatever
# happens to be most recent. It passes either way, and it destroys a fixture other
# flows depend on: five flows later failed on a missing conversation because this
# one had removed it. A destructive flow must target something it can afford to
# lose. The Xiaomi thread is on a SOLD listing, so nothing that needs a working
# composer, an offer or a meetup can be using it.
#
# Long-pressing the ROW opens the same action menu as its kebab
# (ConversationRow has onLongPress), and needs no relational selector.
- scrollUntilVisible:
    element:
      text: "Xiaomi Redmi.*"
    direction: DOWN
    timeout: 20000
- longPressOn:
    text: "Xiaomi Redmi.*"
- waitForAnimationToEnd
- assertVisible:
    id: "conversation-action-menu"

- tapOn:
    id: "menu-delete"
- waitForAnimationToEnd

# The confirm dialog: title + description, then the destructive CTA.
- assertVisible: "Delete Conversation"
- assertVisible: "This will permanently remove the conversation and all messages."
- tapOn: "Delete"
- waitForAnimationToEnd

# Back on the list, and the menu is gone.
- assertVisible: "Messages"
- assertNotVisible:
    id: "conversation-action-menu"
