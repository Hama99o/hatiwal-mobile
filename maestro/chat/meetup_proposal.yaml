appId: com.hatiwal.app
---
# Propose a meetup in a conversation thread

- runFlow: ../_helpers/login.yaml
# Opens the thread on a listing that is still ACTIVE, so the composer and its
# "+" actions sheet exist. Opening "the first conversation" landed on a sold or
# reserved listing depending on run order, and there the composer is replaced by
# ListingUnavailableNotice — no "+" button at all. See the helper for the
# database evidence.
- runFlow: ../_helpers/open_active_conversation.yaml
# TASK-K487: the composer's meetup/file/photo/offer icons are now collapsed
# behind a single "+" actions sheet — open it first, then tap the row.
# The composer "+" button. NOT its accessibilityLabel ("More actions",
# chat.composer.moreActions): that is translated, and matching it was failing
# with "Element not found: Text matching regex: More actions" on a control
# that is right there — it carries testID="composer-plus-button", which is
# both locale-independent and unambiguous.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# The actions-sheet ROW that opens the meetup sheet (composer-action-meetup).
# Note "Propose Meetup" is TWO different controls: this row
# (chat.proposeMeetup) and the submit button inside the sheet
# (chat.meetup.propose). Same words, so they must be told apart by testID.
- tapOn:
    id: "composer-action-meetup"
- waitForAnimationToEnd
# Bottom sheet opens
- assertVisible: "Propose a Meetup"
- assertVisible: "Place"
- assertVisible: "Time"
# testIDs, not the placeholders. Maestro matches text as an ANCHORED REGEX and
# these placeholders contain "(" and ")" — an unescaped capture group that never
# matches the literal text, plus a "?" that makes the preceding letter optional.
- tapOn:
    id: "meetup-place-input"
- inputText: "Shahr-e-Naw market, near the blue mosque"
- tapOn:
    id: "meetup-time-input"
- inputText: "Tomorrow at 3pm"
- waitForAnimationToEnd
# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- waitForAnimationToEnd
# NO IME dismissal before submitting. BOTH cures failed in run-232:
#   * `hideKeyboard` is BACK on Android — it dismissed the sheet's <Modal>, and
#     the submit button came back "not found" because the sheet was gone.
#   * tapping the "Propose a Meetup" heading to blur ALSO failed "not found":
#     MeetupSheet has no ScrollView and uses KeyboardAvoidingView
#     behavior="height" on Android, so the IME compresses the sheet and clips
#     the heading out of the layout exactly when the keyboard is up.
# MeetupSheet's own platform audit says the submit button stays reachable with
# the keyboard up, so tap it directly. By ID, never by label: the label swaps to
# "Sending…" while submitting. The assert makes a clipped button fail HERE.
- assertVisible:
    id: "meetup-propose-submit"
- tapOn:
    id: "meetup-propose-submit"
- waitForAnimationToEnd
# Meetup proposal bubble visible in thread
- assertVisible: "Meetup Proposal"
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Meetup proposal sent!"
    timeout: 15000
