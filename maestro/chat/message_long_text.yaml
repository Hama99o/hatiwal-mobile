appId: com.hatiwal.app
---
# Long message: 500+ characters wraps correctly in bubble, does not overflow

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Not a bare `tapOn: "Contact Seller"`: on a FIRST contact the app opens
# FirstMessageSheet ("Message Seller" + a pre-filled opener + Send Message)
# and the thread does not exist until that is sent. The helper handles both
# paths and leaves us in the thread. Whether a thread already exists depends
# on shared fixture state, so this cannot be assumed either way.
- runFlow: ../_helpers/open_thread_from_listing.yaml

- tapOn: "Type a message..."
- inputText: "Hello, I am very interested in this item. I have been looking for something exactly like this for a long time. Could you please tell me more about its condition, how long you have had it, and whether you are willing to negotiate on the price? I can meet in Kabul any day this week, morning or afternoon. Please let me know what works best for you. Thank you so much!"
- tapOn: "Send"
- waitForAnimationToEnd

# Long message visible, not clipped or overflowing
# Matching is an anchored FULL-STRING regex, so this prefix could never match the
# 366-character bubble it was aimed at. Wildcards — and deliberately spanning both
# ENDS of the message, because the whole point of a long-text flow is that nothing
# was truncated on the way through. A prefix-only assert would pass on a message
# cut off in the middle, which is the one thing this flow exists to catch.
# (366 chars is well under MESSAGE_MAX_LENGTH = 1000, so the full text is expected.)
- assertVisible: ".*Hello, I am very interested.*Thank you so much!"
