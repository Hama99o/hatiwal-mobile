appId: com.hatiwal.app
---
# Buyer starts conversation from listing detail → conversation appears in Chats tab

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Not a bare `tapOn: "Contact Seller"`: on a FIRST contact the app opens
# FirstMessageSheet ("Message Seller" + a pre-filled opener + Send Message)
# and the thread does not exist until that is sent. The helper handles both
# paths and leaves us in the thread. Whether a thread already exists depends
# on shared fixture state, so this cannot be assumed either way.
- runFlow: ../_helpers/open_thread_from_listing.yaml
# NOT `assertVisible: "Chat"`. The tab is "Chats" and the thread screen shows the
# listing, never the bare word "Chat" — `common.chat` ("Chat") is a dead key. The
# composer is what proves a thread is open.
- assertVisible: "Type a message..."

# Send opening message
- tapOn: "Type a message..."
- inputText: "Hi, is this item available?"
- tapOn: "Send"
- waitForAnimationToEnd
- assertVisible: "Hi, is this item available?"

# Back → Chats tab — conversation listed
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "chat-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "chat-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Hi, is this item available?"
