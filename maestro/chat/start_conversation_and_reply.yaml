appId: com.hatiwal.app
---
# Buyer starts conversation from listing detail → conversation appears in Chats tab

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- tapOn: "Contact Seller"
- waitForAnimationToEnd
# NOT `assertVisible: "Chat"`. The tab is "Chats" and the thread screen shows the
# listing, never the bare word "Chat" — `common.chat` ("Chat") is a dead key. The
# composer is what proves a thread is open.
- assertVisible: "Type a message..."

# Send opening message
- tapOn: "Type a message..."
- inputText: "Hi, is this item available?"
- tapOn: "Send"
- waitForAnimationToEnd
- assertVisible: "Hi, is this item available?"

# Back → Chats tab — conversation listed
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Hi, is this item available?"
