appId: com.hatiwal.app
---
# TASK-O947 — Accept offer -> one-tap "Reserve for {buyer} at {price}" (confirm path)
#
# Buyer sends an offer on an active listing; the real owner (seller) accepts
# it, and the resulting confirm sheet -- titled "Reserve for Ahmad Karimi?",
# with the agreed price shown via its own captioned PriceTag (not repeated in
# the body sentence) -- is confirmed -- verifying the listing flips straight
# to Reserved in the pinned thread header with no manual refresh and NO
# pick-a-buyer list ever shown (the old flow required dismissing the thread
# and re-picking the buyer; this collapses that into one tap).
#
# CR fix (broken by the O947 copy change): the buyer's display name is
# wrapped in Unicode bidi-isolate marks (U+2066/U+2069) when interpolated
# into the title (`wrapBidiIsolate` in reserveAfterAccept.ts), so the
# rendered text is literally "Reserve for ⁦Ahmad Karimi⁩?" -- an EXACT or
# naively-quoted string can never match that; the assertion below is a
# `.*`-wrapped regex for exactly this reason.
#
# Uses "Traditional Kandahari Carpet 3x4" (active, seller-owned, no
# pre-seeded conversation) rather than the shared Lenovo ThinkPad / Ahmad
# Karimi fixture used by maestro/seller/mark_sold_with_buyer.yaml and the
# response-rate badge seed, and a different listing than
# maestro/chat/offer_send_and_accept.yaml (which only dismisses the prompt) --
# so none of these mutating flows collide with each other.
#
# This flow ends with the listing RESERVED. Re-run against a freshly reseeded
# E2E database (see mark_sold_with_buyer.yaml's note on shared/mutated
# fixtures) -- do not run twice in a row without a reset.
#
# CR fixes (cycle-4, both reviews) -- every selector below was checked against
# the actual rendered copy/testIDs in ListingDetail.tsx / Conversation.tsx /
# BuyerPickerSheet.tsx / reserveAfterAccept.ts / chat.json / buyerPicker.json:
#  - "Contact Seller" -> "Contact Seller" was the wrong fix: TASK-C381 (the
#    composer's "+" -> Make an Offer entry point) is still CHANGES_REQUESTED
#    and does not exist. "Make an Offer" is a SIBLING button on
#    ListingDetail.tsx (visible alongside Contact Seller, not behind it) that
#    opens OfferSheet directly -- so the whole "Contact Seller ->
#    composer-plus-button -> composer-action-offer" chain is unnecessary. One
#    tap on "Make an Offer" is both correct today and stays correct once
#    TASK-C381 lands (that entry point is additive, not a replacement).
#  - The offer-amount field has no visible "Offer Amount" label -- targeted
#    by its testID (offer-amount-input, added to OfferSheet.tsx) instead.
#  - Dropped the "Pending" assertion: no such status text is ever rendered
#    for a not-yet-answered offer (the sender's own bubble shows no outcome
#    badge at all until the recipient responds) -- there was nothing there
#    to assert.
#  - "Accept" -> the button's actual label is "Accept offer"
#    (chat.offer.accept); "Accepted" -> the outcome badge's actual label is
#    "Offer accepted" (chat.offer.accepted).
#  - DR BLOCKER: the confirm step moved from a native confirmAlert into the
#    shared BuyerPickerSheet's "preselectedBuyer" confirm mode -- so
#    assertNotVisible now checks buyerPicker.reserveTitle ("Who's buying this
#    item?"), the pick-a-buyer TITLE that component would show if this
#    regressed back to the full picker, not soldTitle ("Who bought this
#    item?"), which belongs to the separate Mark-Sold action and was never
#    the one at risk of appearing here.
#  - DR: the confirm button never carries the price (it truncated inside an
#    alert BUTTON in ps/fa) -- it now reads the sheet's generic
#    "Confirm reserve" (buyerPicker.confirmReserve), never "Reserve at
#    {{price}}". The buyer name appears in the sheet TITLE; the price appears
#    ONLY via the sheet's own captioned PriceTag (review fix, LOW: the body
#    sentence used to repeat the same number and no longer does).
#  - DR: assert the Reserved STATUS BADGE, not the transient success toast --
#    toasts are not a stable E2E signal.
#  - Wrapped the interpolated/compound strings (the offer amount embedded in
#    "AFN 24,000", the buyer name embedded in the confirm sheet title) with
#    `.*` so they match regardless of the exact currency formatting around
#    them.
#  - chat-tab has no testID anywhere in the tab bar -- tap the "Chats" label
#    (its actual translated tab title) instead.

# ── Step 1: buyer sends an offer on an active listing ───────────────────────
- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Traditional Kandahari Carpet 3x4"
    direction: DOWN
    timeout: 8000
- tapOn: "Traditional Kandahari Carpet 3x4"
- waitForAnimationToEnd

# "Make an Offer" is a sibling of "Contact Seller" directly on the listing
# detail page -- no need to open the thread first.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
- tapOn:
    id: "offer-amount-input"
- inputText: "24000"
- tapOn: "Send Offer"
- waitForAnimationToEnd

# Offer bubble visible, pending the seller's response
- assertVisible: ".*24,000.*"

# ── Step 2: the real listing owner accepts the offer ────────────────────────
- runFlow: ../_helpers/login_seller.yaml
- tapOn: "Chats"
- waitForAnimationToEnd
- tapOn: "Traditional Kandahari Carpet 3x4"
- waitForAnimationToEnd

# Sanity check: this is still an active, owned listing before any response --
# the old manual "dismiss thread -> lifecycle button" path starts from here.
- assertVisible: "Reserve"

- tapOn: ".*Accept.*"
- waitForAnimationToEnd
- assertVisible: "Offer accepted"

# ── Step 3: one-tap reserve confirm fires -- no pick-a-buyer list ───────────
- assertVisible: ".*Reserve for.*Ahmad Karimi.*"
- assertVisible: ".*Ahmad Karimi.*"
- assertVisible: ".*24,000.*"
- assertNotVisible: ".*Who's buying this item.*"

- tapOn: "Confirm reserve"
- waitForAnimationToEnd

# ── Step 4: reserved in place -- pinned header updates without a refresh ───
# Asserts the Reserved STATUS BADGE (not the transient success toast).
- assertVisible: "Reserved"
- assertVisible: "Mark Sold"
