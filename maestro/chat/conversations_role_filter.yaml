appId: com.hatiwal.app
---
#
# ── WHY THE POSITIVE ASSERTIONS SCROLL (and what the negative ones do NOT prove)
#
# These two threads sit at positions 10 and 11 of a 24-thread seller inbox — the
# seed adds six more Lenovo threads for the response-rate badge, which land at
# 18-22 — so neither is ever on the first screen. Bare `assertVisible` therefore
# failed on fixtures that were present and correct, which is how this flow failed
# in run-299.
#
# The `assertNotVisible` assertions below are WEAKER than they look, and that is
# left as-is deliberately rather than papered over: a row that was filtered out
# and a row that is merely below the fold are indistinguishable to Maestro. They
# pass either way. Proving real absence would mean exhausting the filtered list,
# which Maestro cannot express directly. Treat them as a smoke check on the
# filter, not as proof of exclusion — the positive, scrolled assertions are the
# ones carrying weight here.
# TASK-R517 — Chat inbox: Buying vs Selling role filter chips
#
# Uses login_seller.yaml (seller@hatiwal.test), the ONE E2E fixture account
# that deterministically has BOTH a Selling side (7 seeded conversations
# where it's the seller — see db/seeds/e2e.rb) and exactly one Buying thread
# (its own message to newbuyer@hatiwal.test's "Mountain Bike 26-inch Steel
# Frame" listing). login.yaml's default buyer@hatiwal.test has zero Selling
# threads, which made every prior assertion here tautological (chip exists /
# tapping doesn't crash) instead of proving the scope actually narrows the
# list.
#
# Happy path: chip row renders, tapping Selling narrows to the seller's OWN
# selling threads (asserted via a listing title only a Selling thread has),
# tapping Buying narrows to its one buying thread (asserted via the Mountain
# Bike listing title, which is invisible while Selling is active), tapping
# the active chip again deselects back to the mixed inbox. Composition:
# selecting Selling and switching to Archived keeps the chip visible and the
# scope applied (review fix — it used to be an invisible, uncleanable filter
# there). Per-row hint: the Buying thread's role pill is asserted by its
# stable `role-pill-<id>` testID, not by text (chat.role.selling and
# chat.filter.selling both localize to "Selling", so text lookups would be
# ambiguous the moment both are on screen at once).

- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"

# Chip row is visible alongside All/Unread/Read, and the mixed inbox shows
# both a Selling-only listing and the one Buying-side listing.
- assertVisible: "All"
- assertVisible:
    id: "role-chip-buying"
- assertVisible:
    id: "role-chip-selling"
- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Mountain Bike 26-inch Steel Frame"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
# Per-row role hint (acceptance #5) — the mixed/unfiltered inbox is the ONE
# place the pill is never redundant (every row's role differs), so at least
# one `role-pill-<id>` must be on screen. Matched by testID regex, never by
# text — chat.role.selling and chat.filter.selling both localize to
# "Selling", so a getText("Selling") lookup would be ambiguous the moment
# both the chip and a pill are on screen together.
- assertVisible:
    id: "role-pill-.*"

# Selling — narrows to threads where seller@hatiwal.test is the seller. The
# Buying-side thread's listing must disappear; a Selling-side one stays.
- tapOn:
    id: "role-chip-selling"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- assertNotVisible: "Mountain Bike 26-inch Steel Frame"

# Tapping the active chip again deselects it — back to the mixed inbox.
- tapOn:
    id: "role-chip-selling"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Mountain Bike 26-inch Steel Frame"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000

# Buying — narrows to the one thread where seller@hatiwal.test is the buyer.
- tapOn:
    id: "role-chip-buying"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Mountain Bike 26-inch Steel Frame"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- assertNotVisible: "Lenovo ThinkPad Laptop Core i5 8GB"

# Deselect back to the full inbox.
- tapOn:
    id: "role-chip-buying"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Mountain Bike 26-inch Steel Frame"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000

# ── Role filter composes with the Archived tab (review fix) ────────────────
# Selecting Selling, then switching to Archived, must keep the chip visible
# (and tappable) there instead of silently narrowing the archive with no way
# to clear it — the exact "hidden, uncleanable filter" bug this flow guards
# against.
- tapOn:
    id: "role-chip-selling"
- waitForAnimationToEnd
- tapOn:
    id: "tab-archived"
- waitForAnimationToEnd
- assertVisible: "Archived"
- assertVisible:
    id: "role-chip-selling"
# All/Unread/Read has no meaning once archived — it must NOT show here.
- assertNotVisible: "Unread"

# Back to Inbox — the Selling scope (still active) narrows it again.
- tapOn:
    id: "tab-inbox"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- assertNotVisible: "Mountain Bike 26-inch Steel Frame"

# Clean up the scope so this flow doesn't leak state into a later run.
- tapOn:
    id: "role-chip-selling"
- waitForAnimationToEnd
