appId: com.hatiwal.app
---
# Meetup proposal bubble shows location, date/time, and accept/decline buttons

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- tapOn: "Contact Seller"
- waitForAnimationToEnd

# TASK-K487: the composer's meetup/file/photo/offer icons are now collapsed
# behind a single "+" actions sheet — open it first, then tap the row.
# The composer "+" button. NOT its accessibilityLabel ("More actions",
# chat.composer.moreActions): that is translated, and matching it was failing
# with "Element not found: Text matching regex: More actions" on a control
# that is right there — it carries testID="composer-plus-button", which is
# both locale-independent and unambiguous.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# The actions-sheet ROW that opens the meetup sheet (composer-action-meetup).
# Note "Propose Meetup" is TWO different controls: this row
# (chat.proposeMeetup) and the submit button inside the sheet
# (chat.meetup.propose). Same words, so they must be told apart by testID.
- tapOn:
    id: "composer-action-meetup"
- waitForAnimationToEnd
- tapOn: "Location"
- inputText: "Share Now Market"
# The meetup sheet's confirm button is `chat.meetup.propose` = "Propose Meetup".
- tapOn: "Propose Meetup"
- waitForAnimationToEnd

# Bubble shows correct UI elements
# The bubble header is `chat.meetup.proposed` = "Meetup Proposal".
- assertVisible: "Meetup Proposal"
- assertVisible: "Share Now Market"

# Seller side would show Accept/Decline — switch to seller
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Share Now Market"
# `chat.meetup.accept` = "Accept".
- assertVisible: "Accept"
- assertVisible: "Decline"
