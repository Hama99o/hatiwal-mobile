appId: com.hatiwal.app
---
# Meetup proposal bubble shows location, date/time, and accept/decline buttons

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Bare `tapOn: index:` has no selector — see the note in the chat flows.
# The feed card carries testID="listing-card".
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Not a bare `tapOn: "Contact Seller"`: on a FIRST contact the app opens
# FirstMessageSheet ("Message Seller" + a pre-filled opener + Send Message)
# and the thread does not exist until that is sent. The helper handles both
# paths and leaves us in the thread. Whether a thread already exists depends
# on shared fixture state, so this cannot be assumed either way.
- runFlow: ../_helpers/open_thread_from_listing.yaml

# TASK-K487: the composer's meetup/file/photo/offer icons are now collapsed
# behind a single "+" actions sheet — open it first, then tap the row.
# The composer "+" button. NOT its accessibilityLabel ("More actions",
# chat.composer.moreActions): that is translated, and matching it was failing
# with "Element not found: Text matching regex: More actions" on a control
# that is right there — it carries testID="composer-plus-button", which is
# both locale-independent and unambiguous.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# The actions-sheet ROW that opens the meetup sheet (composer-action-meetup).
# Note "Propose Meetup" is TWO different controls: this row
# (chat.proposeMeetup) and the submit button inside the sheet
# (chat.meetup.propose). Same words, so they must be told apart by testID.
# Wait for the SHEET's contents, not just the animation. ComposerActionsSheet is a
# native Modal and waitForAnimationToEnd returns before its children reach the
# accessibility tree; offer_in_existing_thread failed with "Element not found:
# composer-action-offer" while the hierarchy captured at that moment contained it.
- extendedWaitUntil:
    visible:
      id: "composer-action-meetup"
    timeout: 15000
- tapOn:
    id: "composer-action-meetup"
- waitForAnimationToEnd
# The meetup sheet's PLACE field, by its placeholder
# (`chat.meetup.placePlaceholder`). "Location" is not a label on this sheet at all
# — that name belongs to the listing form, which is a different screen.
# testIDs, not the placeholders. Maestro matches text as an ANCHORED REGEX and
# these placeholders contain "(" and ")" — an unescaped capture group that never
# matches the literal text, plus a "?" that makes the preceding letter optional.
- tapOn:
    id: "meetup-place-input"
- eraseText
- inputText: "Share Now Market"
- tapOn:
    id: "meetup-time-input"
- eraseText
# The app REFUSES to propose without a time: handlePropose sets timeError
# ("Please enter a meeting time.") and returns. Filling place alone, as this
# flow used to, could never produce a proposal bubble.
# NOT "Tomorrow": typing that word into a field on this AVD loses the screen.
# Android's on-device text classifier (AiAiTextClassifier in logcat) treats it as
# a date entity and fires smart-action machinery that takes the app out of the
# foreground — the flow then lands back on the Bazaar feed and every later
# selector misses. Measured 5/5 failures with "Tomorrow"/"tomorrow" against 4/4
# passes for "Saturday", "abcdefgh" and the same word typed character by
# character. Nothing in the app parses it. See QA_HANDBOOK.md.
- inputText: "Saturday 4pm"
- waitForAnimationToEnd
# NO IME dismissal before submitting. BOTH cures failed in run-232:
#   * `hideKeyboard` is BACK on Android — it dismissed the sheet's <Modal>, and
#     the submit button came back "not found" because the sheet was gone.
#   * tapping the "Propose a Meetup" heading to blur ALSO failed "not found":
#     MeetupSheet had no ScrollView and used KeyboardAvoidingView
#     behavior="height" on Android, so the IME compressed the sheet and clipped
#     the heading out of the layout exactly when the keyboard was up.
#     SUPERSEDED by d46c896: the sheet now lifts itself by the keyboard height
#     (behavior is undefined on Android), so it is no longer compressed and the
#     heading stays in the layout. The reason not to dismiss the IME still
#     stands — it is the Back press above, not the clipping.
# The submit button is reachable with the keyboard up — since d46c896 because the
# sheet sits ABOVE the IME, not because the old audit said so (its Android half
# was wrong: it only held when the IME arrived AFTER the sheet, and this sheet
# was unreachable in the other order). Either way, with
# the keyboard up, so tap it directly. By ID, never by label: the label swaps to
# "Sending…" while submitting. The assert makes a clipped button fail HERE.
- assertVisible:
    id: "meetup-propose-submit"
- tapOn:
    id: "meetup-propose-submit"
- waitForAnimationToEnd

# Bubble shows correct UI elements
# The bubble header is `chat.meetup.proposed` = "Meetup Proposal".
- assertVisible: "Meetup Proposal"
- assertVisible: "Share Now Market"

# Seller side would show Accept/Decline — switch to seller
- launchApp:
    clearState: false
# Wait for the tab bar, not just for animations. A warm relaunch remounts the tree
# and re-bootstraps auth; `waitForAnimationToEnd` returns well before that, so a
# tab tap fires into a screen still coming up and silently does nothing.
- extendedWaitUntil:
    visible:
      id: "chat-tab"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Share Now Market"
- assertVisible: "Saturday 4pm"
# The PROPOSER must not be able to answer their own proposal. MessageBubble
# renders the action row only when `!isMine && onMeetupRespond`, so from this
# side there is no outcome badge and no buttons — just the details above. This
# flow never switches identity, so asserting Accept/Decline VISIBLE (as it used
# to) could never pass; asserting they are absent is the real invariant.
# The responder's side is covered by meetup_respond / meetup_decline.
- assertNotVisible: "Accept"
- assertNotVisible: "Decline"
