appId: com.hatiwal.app
name: "Conversations list search — narrow, no-match empty state + Clear search, composes with Unread filter"
tags:
  - chat
  - search

---

# TASK-Z684 — the list-level half of chat search (in-thread message search is
# TASK-N803 / maestro flows already covering the thread screen).

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"

# ── Precondition: at least one seeded conversation exists ───────────────────
- assertVisible:
    id: "conversation-row-\\d+"

# ── Happy path: typing narrows the list live, no crash / no error state ─────
- tapOn:
    id: "conversations-search-input"
- inputText: "a"
- waitForAnimationToEnd
- assertVisible: "Messages"
- assertVisible:
    id: "conversations-search-clear"

# ── Clearing an in-progress term restores the full list ─────────────────────
- tapOn:
    id: "conversations-search-clear"
- waitForAnimationToEnd
- assertNotVisible:
    id: "conversations-search-clear"
# Clearing the term refetches the UNFILTERED list, so these rows come back over
# the network too. React Query usually serves them from cache — and "usually" is
# exactly what makes a flow intermittent.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000

# ── No-match: a nonsense term shows the localized empty state + "Clear search" ─
- tapOn:
    id: "conversations-search-input"
- inputText: "xzxzxzxz_no_such_conversation_xzxzxz"
# SUBMIT, to put the soft keyboard away before asserting on the empty state.
#
# The empty-state action sits at the BOTTOM of the empty state, so with the IME
# up it is off-screen — and Gboard makes it worse than a plain keyboard: run-382
# failed here with `Assertion is false: "Clear search" is visible` on a screen
# where the app was entirely correct (the screenshot shows the localized
# `No matches for "xzxzxzxz…"` state, with the blue button's top edge just
# visible under Gboard's expanded CLIPBOARD SUGGESTION panel, which covers the
# bottom half of the display).
#
# `hideKeyboard` is NOT the tool: in this Maestro version it is a Back press with
# no guaranteed IME, and on this screen that pops Messages back to Bazaar — the
# rig's own lint warns about it, and it has already cost one flow today.
# `pressKey: Enter` is a real user action instead: SearchBar passes
# `returnKeyType="search"` to a single-line RNR Input, so submitting blurs it and
# the keyboard goes away without touching the navigation stack.
- pressKey: Enter
- waitForAnimationToEnd
- assertNotVisible:
    id: "conversation-row-\\d+"
# WAIT, do not assert. The search is now served by the API (`Conversation.matching`)
# behind a 400ms debounce, so the empty state ARRIVES over the network —
# waitForAnimationToEnd does not wait on the network. Waiting is for something
# that will arrive; asserting is for something already there.
- extendedWaitUntil:
    visible: "Clear search"
    timeout: 20000

# The "Clear search" empty-state action also empties the field
- tapOn: "Clear search"
- waitForAnimationToEnd
- assertNotVisible: "Clear search"
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000

# ── Search composes with the Unread filter (not a replacement for it) ───────
- tapOn: "Unread"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversations-search-input"
    timeout: 20000
- tapOn:
    id: "conversations-search-input"
- inputText: "xzxzxzxz_no_such_conversation_xzxzxz"
- pressKey: Enter
- waitForAnimationToEnd
# `hasSearchTerm` always takes priority over the tab/filter empty copy, so a
# nonsense term deterministically shows the no-match state — never the
# "All caught up!" copy — regardless of which unread/read rows existed
# before the search.
#
# The claim that this search is "instant/client-side (no debounce, TASK-Z684)"
# was true when this flow was written and is NOT true any more: the owner asked
# for it to hit the database ("can we use search like when we type it should
# check in db"), so it is a debounced API query now. Hence the wait.
- extendedWaitUntil:
    visible: "Clear search"
    timeout: 20000

# Clearing the field falls back to just the Unread filter — still composed,
# not reset to "All".
- tapOn:
    id: "conversations-search-clear"
- waitForAnimationToEnd
- assertVisible: "Unread"

# ── Back to Inbox / All — unaffected by the search interactions above ───────
- tapOn: "All"
- waitForAnimationToEnd
- assertVisible:
    id: "conversation-row-\\d+"
