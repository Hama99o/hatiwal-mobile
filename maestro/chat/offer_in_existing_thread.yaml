appId: com.hatiwal.app
---
# Send offer in existing thread (thread already has messages)

- runFlow: ../_helpers/login.yaml
# CR fix: "chat-tab" has no testID anywhere in the tab bar (same defect
# documented and fixed in offer_send_and_accept.yaml / reserve_after_accept.yaml)
# — tap the "Chats" label (its actual translated tab title, sidebar.chat) instead.
# Opens the thread on a listing that is still ACTIVE, so the composer and its
# "+" actions sheet exist. Opening "the first conversation" landed on a sold or
# reserved listing depending on run order, and there the composer is replaced by
# ListingUnavailableNotice — no "+" button at all. See the helper for the
# database evidence.
- runFlow: ../_helpers/open_active_conversation.yaml
# (Removed `assertVisible: "Chat"` — the word is never on screen, and
# open_active_conversation.yaml already asserts the composer.)

# Existing messages present — TASK-K487: the composer's meetup/file/photo/
# offer icons are now collapsed behind a single "+" actions sheet. CR fix
# (TASK-C381): "More actions" (the plus button's accessibilityLabel) and
# "Make an Offer" (the sheet row's rendered label, chat.offer.makeOffer) are
# both real, but drift-prone as text targets — chat.offer.makeOffer is
# actually "Make an offer" (lowercase "offer"), a case mismatch that made
# this exact tapOn silently fail to match. Target by testID instead, the
# same convention already used by reserved_sold_dead_end_notice.yaml:
# "composer-plus-button" then "composer-action-offer".
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# Wait for the SHEET's contents, not just the animation. ComposerActionsSheet is a
# native Modal, and waitForAnimationToEnd returns before its children are in the
# accessibility tree — the failing step reported "Element not found:
# composer-action-offer" while the hierarchy captured at that moment DID contain it,
# which is what a tap losing a race with a modal looks like.
- extendedWaitUntil:
    visible:
      id: "composer-action-offer"
    timeout: 15000
- tapOn:
    id: "composer-action-offer"
- waitForAnimationToEnd
- assertVisible: "Send Offer"
# CR fix: the amount input has no visible "Offer Amount" label (same defect
# already fixed in offer_send_and_accept.yaml) — target its testID instead.
- tapOn:
    id: "offer-amount-input"
- inputText: "15000"
- tapOn: "Send Offer"
- waitForAnimationToEnd

# Offer bubble appears in thread. CR fix: the header pill renders as
# "PRICE OFFER" (uppercased via .toUpperCase() in MessageBubble.tsx), so
# asserting bare "Offer" is a case-sensitive miss against it — "Your Offer"
# is the bubble's own real, mixed-case label above the amount (matches
# offer_send_and_accept.yaml's fix for the same defect). "Pending" is never
# rendered for a not-yet-answered offer, so that assertion is dropped too.
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*15,000"
- assertVisible: "Your Offer"
