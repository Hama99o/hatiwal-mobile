appId: com.hatiwal.app
---
# Sending a message with NO NETWORK — the failure this app cannot afford to be
# quiet about.
#
# Hatiwal is a marketplace for Afghanistan: patchy connectivity is the normal
# case, not an edge case. If a send fails silently the user believes they have
# reached the seller and waits for a reply that will never come — and there is no
# payment or delivery record to reveal the mistake later.
#
# The code does the right thing (`handleSend`'s catch rolls the optimistic bubble
# back and toasts `chat.thread.sendFailed`), but nothing verified it end to end.
# `grep -c offline maestro/chat/` was 0.
#
# Airplane mode IS drivable from Maestro 2.7 (`setAirplaneMode: enabled`), which
# is what makes this expressible at all — a fact discovered while fixing
# profile/view_profile_error.yaml, whose own airplane-mode block used the wrong
# shape and so had never run.
#
# ALWAYS restores the network, including on the failure paths, or every flow that
# runs after this one fails for no app reason.

- runFlow: ../_helpers/login.yaml

# Open the seeded thread on the ThinkPad (buyer@hatiwal.test has one).
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Lenovo ThinkPad Laptop Core i5 8GB"
- waitForAnimationToEnd
- assertVisible: "Type a message..."

# ── Go offline ──────────────────────────────────────────────────────────────
- setAirplaneMode: enabled
- waitForAnimationToEnd

- tapOn: "Type a message..."
- inputText: "QA offline send — this must not appear to succeed"
# NO hideKeyboard here. On Android hideKeyboard IS Back, so on a screen that is not a
# modal it pops the conversation — and the next step then failed with "Element not
# found: Text matching regex: Send" on a button that was simply on another screen.
# This was the only flow of the nine that tap "Send" to dismiss the keyboard first,
# and the only one failing that way; send_message, delete_message and
# send_message_double_tap all tap it with the keyboard up and pass.
# Nothing is hidden by the keyboard anyway: Conversation.tsx anchors the bottom bar to
# the keyboard's top edge rather than letting it overlap.
# The send button carries no testID — only `accessibilityLabel={t("chat.send")}`,
# which Maestro matches as text. (Adding a testID would be a nicer selector, but
# that is app code and this flow is about the offline path, not the markup.)
- tapOn: "Send"

# ── The user must be TOLD ───────────────────────────────────────────────────
# The optimistic bubble is rolled back and an error is raised. What must never
# happen is the composer clearing with the message apparently sent.
- extendedWaitUntil:
    visible: "Failed to send message. Please try again."
    timeout: 30000

# AND THE DRAFT MUST SURVIVE — which is the same requirement, stated correctly.
#
# This was `assertNotVisible` on the message text, and it CONTRADICTED the comment
# three lines above it: "What must never happen is the composer clearing with the
# message apparently sent." Asserting the text is nowhere on screen demands
# precisely that clearing.
#
# run-523 failed here (5m 8s) and the app was RIGHT. Its end-of-flow screenshot,
# taken with the airplane-mode icon in the status bar, shows the text still in the
# COMPOSER INPUT and the thread's last message unchanged at 6:39 PM — the send did
# not go through and the user's typing was preserved. Maestro matches text
# ANYWHERE on screen, so `assertNotVisible` could not tell "sitting in the thread
# looking delivered" from "still in the input box", and failed on the correct
# behaviour.
#
# The send having failed is already proven by the error toast asserted directly
# above. What is worth guarding here is the other half of the contract: the draft
# is still there to retry. A cleared composer would fail this line, which is the
# regression the original comment was reaching for.
- assertVisible: "QA offline send — this must not appear to succeed"

# ── Restore the network — unconditionally ────────────────────────────────────
- setAirplaneMode: disabled
- waitForAnimationToEnd
