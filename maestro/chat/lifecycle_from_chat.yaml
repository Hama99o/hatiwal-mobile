appId: com.hatiwal.app
env:
  EMAIL: buyer@hatiwal.test
  PASSWORD: Password123!
---
# Lifecycle actions from the chat thread pinned listing header (seller owner only)
#
# SF-M2 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md §4.4.1): ListingHeader's
# old `showReserve`/`showMarkSold` toggle is gone -- the header's ONE inline
# pill is now ALWAYS "Mark Sold" for the owner of any Live listing (`active`
# OR `reserved`), never "Reserve". Reserve is no longer triggered from this
# header at all -- placing a hold moved into the composer's "+" menu
# (`ComposerActionsSheet`, "Place a hold for {name}" -- see
# ../chat/place_and_release_hold.yaml) and stays proven-reachable on a
# RESERVED listing too by ../chat/reserve_after_accept.yaml's own final
# assertions (its listing ends Reserved and still shows "Mark Sold").
#
# Covers:
#   1. Happy path: seller opens conversation on an ACTIVE listing -> only
#      "Mark Sold" is offered (never "Reserve", which does not exist here
#      any more) -> tapping it opens BuyerPickerSheet -> skip -> badge
#      updates to Sold, the pill disappears (sold is terminal), composer
#      stays usable.
#   2. Buyer perspective: no "Mark Sold" button visible in the same conversation.

# ─── Scenario 1: Owner marks the listing sold, one tap, straight from chat ───

- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Open the first conversation where the seller owns the listing
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# The pinned listing header is visible at the top of the thread
- assertVisible: "View Listing"
# SF-M2: "Mark Sold" is the ONLY lifecycle pill this header ever renders now --
# no "Reserve" button exists anywhere in this thread.
- assertVisible: "Mark Sold"
- assertNotVisible: "Reserve"
- tapOn: "Mark Sold"
- waitForAnimationToEnd
# BuyerPickerSheet opens, scoped to this thread's own buyer (confirm mode) --
# TASK-TX01 / SF-M2, never the full pick-a-buyer list.
- assertVisible: "Who bought this item?"
- assertNotVisible: "Who's buying this item?"

# run-266 F8, reproduced run-267: this used to tap
# "Sold to someone not on Hatiwal" and failed with `Element not found`. The
# flow's own header comment already said "confirm mode, never the full
# pick-a-buyer list" — but its STEPS still drove the picker. In confirm mode
# `BuyerPickerSheet` is passed `preselectedBuyer`, which by design renders no
# conversation list, no "someone else / skip" row and no editable price: just
# the buyer's identity, the agreed price and one Confirm. The premise the old
# step encoded is genuinely gone, so it is replaced by assertions of the
# premise that replaced it — and they are stronger, because they pin the scope
# (this thread's buyer, this thread's price) that the skip row would have
# thrown away. Screenshot: qa/reports/run-267/chat/screens/lifecycle_from_chat.png
- assertVisible: "Ahmad Karimi"
- assertVisible: "Agreed price"
- assertNotVisible: "Sold to someone not on Hatiwal"
- assertNotVisible:
    id: "buyer-row-skip"
- assertNotVisible:
    id: "buyer-picker-final-price"

- tapOn: "Confirm sold"
# Success toast appears
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
# TOAST WINDOW (run-268): `waitForAnimationToEnd` after a confirm waits out the
# toast's ENTIRE in-sit-out animation — measured at 4.6s against a ~4s toast — so
# anything asserted after it is a coin flip, and the Undo action had already gone.
# Assert the ACTION first with `extendedWaitUntil` (it polls, so it catches the
# toast as it appears, and it is stronger than the text: a toast that fired
# without its action fails it), then the text in the same frame.
- extendedWaitUntil:
    visible: "Undo"
    timeout: 20000
- assertVisible: "Listing marked as sold"
# QA-BUG5 (card 303) — the toast raised from the CHAT thread must carry the same
# "Undo" action the listing screens have offered since SF-M5. Before commit
# 3e083ab, ListingHeader hand-rolled its own markSold + a plain success toast,
# so the seller who sold from the thread — the path this redesign deliberately
# made PRIMARY, because the buyer is already there — was the one seller with no
# way back from a mistap. Asserted here, not merely unit-tested, because the
# reason it broke in the first place was that no device test ever looked.
#
# Reachability only (the tap-through round trip is undo_mark_sold.yaml's job on
# a listing this flow does not have to leave sold): "Undo" being on screen at
# all is what regressed, and what a duplicate mark-sold implementation would
# silently take away again.
# ...and the review sheet is NOT up yet, so nothing is covering it (QA-BUG2).
# This sale records a REAL buyer now (confirm mode always does), so REV2's
# prompt WILL arrive — after the toast finishes its own lifecycle, which is
# exactly the ordering commit c7bbf3f introduced.
- assertNotVisible: "How was Ahmad Karimi as a buyer?"
- extendedWaitUntil:
    visible: "How was Ahmad Karimi as a buyer?"
    timeout: 15000
- tapOn: "Not now"
- waitForAnimationToEnd
# THE LISTING STAYS LIVE, because this thread's listing is MULTI-UNIT.
#
# This asserted `"Sold"` and could never pass. The fixture is the Phone Case
# (quantity 15) — chosen deliberately, since the steps above depend on its
# seeded offer thread ("Who bought this item?" / "Ahmad Karimi" / "Agreed
# price"). Selling one unit out of 15 CORRECTLY leaves the listing `active`:
# that is the redesign's central rule (docs/SELL_FLOW_REDESIGN.md — a batch is
# not a dead end after a partial sale), so the badge stays "Active" and the
# "Mark Sold" pill stays available for the next unit.
#
# Verified against the database at the time of the failure: qty=15, sold=4,
# available=11, status=active — the sale HAD recorded (the success toast above
# passed), and the flow then demanded a state the app is right to refuse.
#
# So this now asserts what a partial sale on a batch actually means, which is a
# more valuable check than the one it replaces: the pill must still be there,
# because there is still stock to sell.
- assertVisible: "Mark Sold"
# Never "Reserve" from this header — SF-M2 removed it entirely (see the header
# comment); a hold is placed from the composer's "+" menu instead.
- assertNotVisible: "Reserve"
# The thread STAYS USABLE after the sale, and that is deliberate.
#
# These two lines used to assert the opposite — no composer, plus "This
# conversation is closed." — and described a mechanism that was never built.
# `Conversation#status` does have a `closed` value, but NOTHING writes it: no code
# path in the API, no route (only mark_read/unread/archive/unarchive/destroy), and
# 0 of 36 conversations in the seeded DB are closed. So `isClosed` is unreachable
# and `chat.thread.closedNotice` is dead copy in all three locales.
#
# The implemented dead-end keys off the LISTING, not the conversation, and it
# closes OFFERS rather than the chat: chat.thread.unavailable.soldBody reads "a new
# offer can no longer be sent here", and reservedForYouBody says "Keep chatting
# here to arrange…". That is the right call for a meetup marketplace — the handover
# still has to be coordinated after the sale. See UI-047.
#
# Asserted positively so that removing the composer later fails HERE, loudly,
# instead of quietly changing what a seller can do after a sale.
- assertVisible: "Type a message..."
#
# The buyer-facing "Item sold" recovery notice is NOT asserted here: Conversation.tsx
# renders ListingUnavailableNotice behind `!isOwner`, and this half of the flow is
# the seller. maestro/chat/reserved_sold_dead_end_notice.yaml covers the buyer view.

# ─── Scenario 2: Buyer sees no Mark Sold button ────────────────────────────

# run-269: scenario 2 used to hand-roll `launchApp: clearState: true` followed by
# its own sign-in, and it could not work. `clearState` runs `pm clear`, which also
# wipes the dev client's REMEMBERED METRO SERVER — so the app comes back in the
# expo-dev-client launcher, not in Hatiwal, and the flow waited 60s for a login
# screen that was never going to render ("Buy and sell locally in Afghanistan" is
# visible, FAILED). Scenario 1 above had already passed in full by then.
#
# `_helpers/login_fresh.yaml` exists for exactly this: `clearState` +
# `open_bundle` (which re-enters the bundle at 10.0.2.2:3008) + `goto_login` +
# sign in, with `buyer@hatiwal.test` as its default account — which is the
# account this scenario wants. Using it also deletes ~25 lines of duplicated
# login handling, per the house no-duplication rule.
- runFlow: ../_helpers/login_fresh.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Open the same conversation (buyer's view)
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# Pinned listing header is visible
- assertVisible: "View Listing"
# Buyer must NOT see Reserve or Mark Sold — this pill is owner-only.
- assertNotVisible: "Reserve"
- assertNotVisible: "Mark Sold"
