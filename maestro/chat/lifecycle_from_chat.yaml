appId: com.hatiwal.app
env:
  EMAIL: buyer@hatiwal.test
  PASSWORD: Password123!
---
# Lifecycle actions from the chat thread pinned listing header (seller owner only)
#
# TASK-TX01: Reserve / Mark Sold from the chat header now open the
# BuyerPickerSheet (listing this listing's conversations, incl. the one the
# seller is currently in) instead of firing directly / a plain confirmAlert.
#
# Covers:
#   1. Happy path: seller opens conversation → taps Reserve on active listing
#      → BuyerPickerSheet opens → skip (legacy path) → badge updates to Reserved
#      (picking a specific buyer from the picker is covered end-to-end by
#      ../seller/mark_sold_with_buyer.yaml, which targets a known seeded listing)
#   2. Happy path: seller taps Mark Sold on reserved listing → BuyerPickerSheet
#      → skip → badge updates to Sold, input closes
#   3. Buyer perspective: no Reserve / Mark Sold button visible in the same conversation

# ─── Scenario 1: Owner taps Reserve (active → reserved) ──────────────────────

- runFlow: ../_helpers/login_seller.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Open the first conversation where the seller owns the listing
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# The pinned listing header is visible at the top of the thread
- assertVisible: "View Listing"
# The Reserve button is visible (listing is active, user is the owner)
- assertVisible: "Reserve"
# The Mark Sold button is NOT visible yet
- assertNotVisible: "Mark Sold"
# Tap Reserve — opens the BuyerPickerSheet (TASK-TX01) instead of firing directly
- tapOn: "Reserve"
- waitForAnimationToEnd
- assertVisible: "Who's buying this item?"
- assertVisible: "Sold to someone not on Hatiwal"
- tapOn: "Sold to someone not on Hatiwal"
- tapOn: "Confirm reserve"
- waitForAnimationToEnd
# Success toast appears
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing marked as reserved"
    timeout: 15000
# StatusBadge in the pinned header updates to Reserved
- assertVisible: "Reserved"
# Reserve button is gone; Mark Sold appears instead
- assertNotVisible: "Reserve"
- assertVisible: "Mark Sold"

# ─── Scenario 2: Owner taps Mark Sold (reserved → sold), skips buyer pick ─────

# (continuing from scenario 1 — listing is now reserved)
- tapOn: "Mark Sold"
- waitForAnimationToEnd
# BuyerPickerSheet fires instead of a plain confirmAlert
- assertVisible: "Who bought this item?"
- tapOn: "Sold to someone not on Hatiwal"
- tapOn: "Confirm sold"
- waitForAnimationToEnd
# Success toast
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000
# StatusBadge updates to Sold
- assertVisible: "Sold"
# No lifecycle button remains (sold is terminal)
- assertNotVisible: "Reserve"
- assertNotVisible: "Mark Sold"
# Conversation is now closed — input is disabled
- assertNotVisible: "Type a message..."
- assertVisible: "This conversation is closed."

# ─── Scenario 3: Buyer sees no Reserve / Mark Sold button ─────────────────────

- launchApp:
    clearState: true
# Log in as a buyer
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- assertVisible: "Bazaar"
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Open the same conversation (buyer's view)
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# Pinned listing header is visible
- assertVisible: "View Listing"
# Buyer must NOT see Reserve or Mark Sold
- assertNotVisible: "Reserve"
- assertNotVisible: "Mark Sold"
