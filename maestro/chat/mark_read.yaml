appId: com.hatiwal.app
name: "Mark conversation read/unread from conversations list"
tags:
  - chat
  - mark_read

---

# ── Setup: log in and navigate to the Chat tab ─────────────────────────────
- runFlow: ../auth/login.yaml

# `chat-tab`, not `tab-chat`. The tabs now carry tabBarButtonTestID
# "<route>-tab" — the convention the other 10 flows already used.
- tapOn:
    id: "chat-tab"

# ── Happy path: mark a conversation as read ────────────────────────────────
# Wait for the conversations list to load
- waitForAnimationToEnd

# Verify we're on the conversations screen
- assertVisible:
    text: "Messages"

# Long-press the first conversation row to open the action menu.
# The row Pressable's testID is `conversation-row-{item.id}` — keyed off the
# conversation's stable database id, not its transient render position, so we
# match any id (regex) and take the first (topmost) row.
- longPressOn:
    id: "conversation-row-\\d+"
    index: 0

# The bottom-sheet action menu should appear
- waitForAnimationToEnd

# Tap "Mark as read" if it is visible (conversation has unread messages)
- runFlow:
    when:
      visible:
        id: "menu-mark-read"
    commands:
      - tapOn:
          id: "menu-mark-read"
      # Badge should clear after marking as read
      - waitForAnimationToEnd
      - assertNotVisible:
          id: "menu-mark-read"

# CLOSE THE MENU if the conditional above did not fire.
#
# `menu-mark-read` is only present when the row is UNREAD; on a read row the menu
# offers "mark unread" instead, the block skips — and the menu STAYS OPEN. The next
# step then taps `conversation-options-\\d+`, which is behind the open modal, and
# fails with "Element not found" on a button that is always there. Every
# conditional that might leave a sheet open needs this.
- runFlow:
    when:
      visible:
        id: "conversation-action-menu"
    commands:
      - back
      - waitForAnimationToEnd

# ── Mark as unread flow ────────────────────────────────────────────────────
# Long-press the same row again via the options button (always visible)
- tapOn:
    id: "conversation-options-\\d+"
    index: 0

- waitForAnimationToEnd

# Now "Mark as unread" should be available (row was just marked read)
- runFlow:
    when:
      visible:
        id: "menu-mark-unread"
    commands:
      - tapOn:
          id: "menu-mark-unread"
      - waitForAnimationToEnd
      # Badge should reappear
      - assertVisible:
          id: "unread-badge-\\d+"

# CLOSE THE MENU if the conditional above did not fire.
#
# `menu-mark-read` is only present when the row is UNREAD; on a read row the menu
# offers "mark unread" instead, the block skips — and the menu STAYS OPEN. The next
# step then taps `conversation-options-\\d+`, which is behind the open modal, and
# fails with "Element not found" on a button that is always there. Every
# conditional that might leave a sheet open needs this.
- runFlow:
    when:
      visible:
        id: "conversation-action-menu"
    commands:
      - back
      - waitForAnimationToEnd

# ── Verify existing Delete action still works ──────────────────────────────
- tapOn:
    id: "conversation-options-\\d+"
    index: 0

- waitForAnimationToEnd

- assertVisible:
    id: "menu-delete"

# Dismiss menu without deleting
- tapOn:
    point: "50%, 20%"

- waitForAnimationToEnd
