appId: com.hatiwal.app
---
# Conversations list — UniversalList migration verification
# Tests: row render, filter tabs, empty state, tap opens thread

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Header title visible
- assertVisible: "Messages"

# Filter tabs present
- assertVisible: "All"
- assertVisible: "Unread"
- assertVisible: "Read"

# If conversations exist, first row is visible and tappable
# The row itself. A bare index tap matches every element on screen, and being
# `optional` it failed silently — the flow then asserted against the inbox it
# never left.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
    optional: true
- waitForAnimationToEnd
- back

# Tap Unread filter
- tapOn: "Unread"
- waitForAnimationToEnd

# Tap back to All filter
- tapOn: "All"
- waitForAnimationToEnd
