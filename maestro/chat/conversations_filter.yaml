appId: com.hatiwal.app
---
# Conversations list — filter by All / Unread / Read tabs

- runFlow: ../_helpers/login.yaml
- tapOn: "Chats"
- waitForAnimationToEnd
- assertVisible: "Messages"
# Default shows All
- assertVisible: "All"
# Switch to Unread
- tapOn: "Unread"
- waitForAnimationToEnd
# Either shows unread conversations or empty "All caught up!" state — the
# `anyOf` property doesn't exist on assertVisible in this Maestro version
# (2.7.0 exits 1 with "Unknown Property: anyOf"); `assertTrue`+`condition`
# with the JS-like `visible()` helper is the documented way to branch.
- assertTrue:
    condition: ${visible("All caught up!") || visible("No unread messages right now.")}
# Switch to Read
- tapOn: "Read"
- waitForAnimationToEnd
- assertVisible: "Messages"
# Back to All
- tapOn: "All"
- waitForAnimationToEnd
