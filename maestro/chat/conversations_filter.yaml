appId: com.hatiwal.app
---
# Conversations list — filter by All / Unread / Read tabs

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"
# Default shows All
- assertVisible: "All"
# Switch to Unread
- tapOn: "Unread"
- waitForAnimationToEnd
# Either shows unread conversations or empty "All caught up!" state — the
# `anyOf` property doesn't exist on assertVisible in this Maestro version
# (2.7.0 exits 1 with "Unknown Property: anyOf"); `assertTrue`+`condition`
# with the JS-like `visible()` helper is the documented way to branch.
# Maestro has no `visible()` in its JS sandbox. This was
# `assertTrue: condition: ${visible(a) || visible(b)}` and died with
# "JsEvaluationException: TypeError: undefined is not a function" — which the .log
# never shows; only the .xml carries it, so the flow read as an unexplained fail.
# The comment above claiming this was the documented way to branch was wrong for
# 2.7.0. Text matching is an anchored regex, so plain alternation does the same
# job natively: either alternative has to match the whole node text.
- assertVisible: "All caught up!|No unread messages right now\\."
# Switch to Read
- tapOn: "Read"
- waitForAnimationToEnd
- assertVisible: "Messages"
# Back to All
- tapOn: "All"
- waitForAnimationToEnd
