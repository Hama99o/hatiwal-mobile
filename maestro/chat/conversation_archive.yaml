appId: com.hatiwal.app
---
# Archive / Unarchive conversation flow:
#   1. Open the Chats tab — Inbox tab is visible by default.
#   2. Long-press the first conversation row to open the action menu.
#   3. Tap "Archive" — row optimistically disappears from inbox.
#   4. Switch to Archived tab — archived conversation appears.
#   5. Open the action menu on the archived row — "Unarchive" is shown.
#   6. Tap "Unarchive" — row disappears from Archived tab.
#   7. Switch back to Inbox — conversation is restored.

- runFlow: ../_helpers/login.yaml

# Navigate to Chats tab
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd

# Inbox is the default tab
- assertVisible: "Inbox"
- assertVisible: "Archived"

# WAIT FOR THE LIST, NOT JUST FOR THE CHROME.
#
# The asserts above are the screen's furniture — a title, a tab — and they render
# before the conversations request comes back. This flow then long-pressed a row
# that did not exist yet.
#
# Proven, not guessed: conversation_archive's hierarchy dump at its failing step
# (run-496, debug-conversation_archive/.../screen-hierarchy/step-083-*.json) holds
# `conversations-search-bar`, `conversations-filter-chip-row` and the whole tab
# bar — and ZERO `conversation-row-*` nodes. Its own end-of-flow screenshot, three
# minutes later, shows three rows. The testID was never wrong: it is a template
# literal, `conversation-row-${item.id}` at ConversationRow.tsx:209.
#
# chat_older_messages_pagination already does exactly this and passed in the same
# run — the pattern is the suite's, this flow just was not using it.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000

# Long-press first conversation row to open the action menu. testID is keyed
# off the conversation's stable database id, not render position — match any
# id (regex) and take the first (topmost) row.
- longPressOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Action menu is open — Archive option must be visible (inbox context)
- assertVisible: "Archive"
- assertNotVisible: "Unarchive"

# Tap Archive
- tapOn:
    text: "Archive"
- waitForAnimationToEnd

# Switch to the Archived tab
- tapOn:
    id: "tab-archived"
- waitForAnimationToEnd

# Archived conversation now appears in the Archived tab
- assertVisible:
    id: "conversation-row-\\d+"

# Open the archived conversation's action menu
- tapOn:
    id: "conversation-options-\\d+"
    index: 0
- waitForAnimationToEnd

# Unarchive option must be present (archived context), Archive must not
- assertVisible: "Unarchive"
- assertNotVisible: "Archive"

# Tap Unarchive
- tapOn:
    text: "Unarchive"
- waitForAnimationToEnd

# Archived tab should now be empty (the row was removed)
- assertVisible: "No archived chats"

# Switch back to Inbox — conversation should be restored
- tapOn:
    id: "tab-inbox"
- waitForAnimationToEnd
- assertVisible:
    id: "conversation-row-\\d+"
