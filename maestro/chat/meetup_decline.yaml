appId: com.hatiwal.app
---
# Decline a meetup proposal.
#
# TWO-PARTY BY NECESSITY. Accept/Decline render only when `!isMine`
# (MessageBubble.tsx), so the proposal must come from the OTHER participant.
# This flow used to sign in as the buyer, `scroll` once, and tap "Decline" on a
# proposal it assumed was already there — but db/seeds/e2e.rb creates no meetup
# proposal at all, so it only ever passed if some earlier flow happened to leave
# a pending one behind. It failed in run-232 with "Element not found: Decline".
#
# Leg 1: buyer proposes.   Leg 2: seller responds.
# Both legs use the login + chat-tab pattern proven by offer_send_and_accept.
- runFlow: ../_helpers/login.yaml
- runFlow: ../_helpers/open_active_conversation.yaml
- runFlow: ../_helpers/propose_meetup.yaml

# Switch to the seller. login_seller.yaml signs the buyer out itself (its
# identity guard fires when "Omar Noori" is not on the profile screen).
- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Search rather than scroll: the seller has several conversations on their own
# listings sorted above this one, so a bounded scroll does not reach it, and a
# scroll gesture here has already registered as a tap and opened a wrong thread.
- tapOn:
    id: "conversations-search-bar"
- inputText: "Phone Case"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Phone Case.*"
    timeout: 10000
# Tap the ROW, not the title text. The text I type into the search box is itself
# "Phone Case", which matches `text: "Phone Case.*"` — so the tap landed on the
# search field and the flow never left the list. That regressed three flows,
# meetup_validation among them, which had been passing. Filtered to one result,
# row 0 is the conversation.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Fail here, not on the button, if the proposal never arrived for the seller.
- scrollUntilVisible:
    element:
      text: "Meetup Proposal"
    direction: DOWN
    timeout: 20000
# Wildcards mirror offer_send_and_accept: Maestro text matching is an ANCHORED
# full-string regex, so a bare "Decline" misses a label with any surrounding text.
- tapOn: ".*Decline.*"
- waitForAnimationToEnd
# The toast FIRST: it lives ~3s, so assertVisible can lose the race while the
# thread re-renders. extendedWaitUntil polls instead of sampling once.
- extendedWaitUntil:
    visible: "You declined the meetup"
    timeout: 10000
# Bubble outcome label (MessageBubble renders chat.meetup.declined).
# The outcome badge renders on the ORIGINAL proposal bubble, not on a new one
# (MessageBubble shows it whenever `meetupOutcome` is set). Replying appends a
# message and the thread sticks to the bottom, so the proposal — and its badge —
# can sit above the fold: meetup_respond failed here on a badge that existed.
# scrollUntilVisible returns straight away when it is already on screen.
- scrollUntilVisible:
    element:
      text: "Meetup declined"
    direction: UP
    timeout: 10000
