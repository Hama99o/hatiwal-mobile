appId: com.hatiwal.app
---
# Block a user from within an open conversation thread (not from their profile).
# The conversation header has a block button next to the other participant's name.

- runFlow: ../_helpers/login.yaml
# The tab is labelled "Chats" (sidebar.chat). Maestro text matching is an
# ANCHORED regex, not a substring, so "Chat" never matched it and the flow
# failed at step 1 with "Element not found: Text matching regex: Chat".
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Open first conversation
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Type a message..."
# Tap block icon / button in the conversation participant bar
- tapOn:
    id: "block-user-button"
- waitForAnimationToEnd
- assertVisible: "Block this user?"
# Maestro matches the FULL string as a regex, and the real copy continues
# "…and their listings will be hidden." (profile.blockConfirmMessage), so the
# bare prefix never matched. `.*` makes it a prefix match on purpose.
- assertVisible: "Blocked users cannot contact you.*"
# Confirm
- tapOn: "Block User"
- waitForAnimationToEnd
# The toast is transient AND its copy is `chat.block.blockSuccess` = "User
# blocked." WITH A PERIOD — Maestro anchors the whole string, so the bare
# "User blocked" never matched it. Optional, with the period covered.
- assertVisible:
    text: "User blocked.*"
    optional: true
# The durable proof on THIS screen. `block-user-button` renders only a ShieldBan
# icon, but it carries accessibilityLabel={isBlocked ? "Unblock User" :
# "Block User"} — Android exposes that as contentDescription and Maestro matches
# it as text, so the flipped label IS assertable. (Not `chat.block.blocked`:
# audit_labels reports that key as DEAD — no component renders it.)
- extendedWaitUntil:
    visible: "Unblock User"
    timeout: 15000
# Input should now be disabled or a blocked notice visible
- assertNotVisible: "Type a message..."
# Unblock — tap the same button (now shows Unblock)
- tapOn:
    id: "block-user-button"
- waitForAnimationToEnd
# Same again: `chat.block.unblockSuccess` is "User unblocked." with a period.
- assertVisible:
    text: "User unblocked.*"
    optional: true
# Durable proof: the blocked notice is gone and the composer is back.
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 15000
# Input re-enabled after unblock
- assertVisible: "Type a message..."
