appId: com.hatiwal.app
---
# Archive a conversation from Inbox -> assert gone -> open Archived tab
# -> assert present -> unarchive -> back in Inbox

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"

# ── Confirm we are on the Inbox tab ────────────────────────────────────
- assertVisible:
    id: "tab-inbox"

# WAIT FOR THE LIST, NOT JUST FOR THE CHROME.
#
# "Messages" and `tab-inbox` above are the screen's furniture — they render before
# the conversations request comes back, so long-pressing a row here was a race.
# This flow won it in run-496; its sibling conversation_archive lost, and that
# one's hierarchy dump at the failing step proves the shape: search bar, filter
# chip row and the whole tab bar present, ZERO `conversation-row-*` nodes.
#
# chat_older_messages_pagination already waits like this and passed in the same
# run. The testID was never wrong — it is a template literal,
# `conversation-row-${item.id}` at ConversationRow.tsx:209.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000

# ── Long-press the first conversation row to open the action menu ──────
- longPressOn:
    index: 0
    id: "conversation-row-\\d+"
- waitForAnimationToEnd

# The Archive option should be visible (inbox tab shows Archive, not Unarchive)
- assertVisible: "Archive"
- assertNotVisible: "Unarchive"

# ── Archive it ──────────────────────────────────────────────────────────
- tapOn: "Archive"
- waitForAnimationToEnd

# ── Conversation should be gone from the inbox list ─────────────────────
# (optimistic removal — the row vanishes immediately)
# We assert the archive empty-state only if the list is now empty:
# If more conversations exist the list simply shrinks. Check tab is still Inbox.
- assertVisible:
    id: "tab-inbox"

# ── Switch to Archived tab ─────────────────────────────────────────────
- tapOn:
    id: "tab-archived"
- waitForAnimationToEnd
- assertVisible: "Archived"

# The archived conversation row should now appear
- assertVisible:
    index: 0
    id: "conversation-row-\\d+"

# ── Long-press to open the action menu in Archived tab ─────────────────
- longPressOn:
    index: 0
    id: "conversation-row-\\d+"
- waitForAnimationToEnd

# Unarchive option should be visible (archived tab shows Unarchive, not Archive)
- assertVisible: "Unarchive"
- assertNotVisible: "Archive"

# ── Unarchive it ────────────────────────────────────────────────────────
- tapOn: "Unarchive"
- waitForAnimationToEnd

# Archived tab should now be empty (or show the empty state)
- assertNotVisible:
    index: 0
    id: "conversation-row-\\d+"

# ── Switch back to Inbox ────────────────────────────────────────────────
- tapOn:
    id: "tab-inbox"
- waitForAnimationToEnd
- assertVisible: "Messages"

# The conversation is back in the inbox
- assertVisible:
    index: 0
    id: "conversation-row-\\d+"
