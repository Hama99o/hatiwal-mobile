appId: com.hatiwal.app
---
# mark_read end-to-end flow
#
# Acceptance criteria (TASK-D003):
#   - Opening a conversation with unread messages clears its unread badge on the list.
#   - The chat tab badge decrements when all unread conversations are read.
#   - markRead fires on thread focus (useFocusEffect) — not only on first load.
#   - Re-navigating back into the same thread fires markRead again (idempotent / safe).
#
# Acceptance criteria (TASK-D428 — day separators + "unread messages" divider):
#   - Opening a conversation with unread messages shows the "Unread messages"
#     divider once the thread loads — its boundary is resolved from the
#     pre-read unreadCount BEFORE mark-read fires.
#   - A day separator is always visible above the thread's messages (a
#     single-day thread still gets exactly one).
#   - Sending a message during this same visit never moves or hides the
#     divider captured on open (the DR-BLOCKER fix: the boundary is a frozen
#     message id, not a live recomputation) — and a message sent right now
#     always falls under a "Today" day separator, regardless of how old the
#     rest of the thread is.
#
# Prerequisites: test device seeded with at least one conversation that has
#               unread_count > 0 for the logged-in buyer@hatiwal.test account.

- runFlow: ../_helpers/login.yaml

# ── Step 1: verify unread badge is present before opening ───────────────────
- tapOn:
    text: "Chats"
- waitForAnimationToEnd

- assertVisible:
    id: "unread-badge-\\d+"

# ── Step 2: open the unread conversation ────────────────────────────────────
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# Allow network roundtrip for mark_read PUT
- waitForAnimationToEnd

# Thread loaded — message list visible
- assertVisible: "Type a message..."

# TASK-D428: the divider is resolved from the conversation's unreadCount at
# load — captured BEFORE the markRead call just above zeroes it server-side —
# so it must be visible right after the thread finishes loading.
- assertVisible: "Unread messages"

# ── Step 2b: send a message — the divider must survive it ──────────────────
- tapOn: "Type a message..."
- inputText: "Let's confirm the meetup time"
- tapOn: "Send"
- waitForAnimationToEnd

- assertVisible: "Let's confirm the meetup time"
# A message sent right now always lands under "Today" — proves the day
# separator renders even when the rest of the seeded thread is much older.
- assertVisible: "Today"
# DR-BLOCKER regression guard: sending a new message must never move or hide
# the divider that was already resolved when the thread was opened.
- assertVisible: "Unread messages"

# ── Step 3: return to list; badge must be cleared ───────────────────────────
- back
- waitForAnimationToEnd

- assertNotVisible:
    id: "unread-badge-\\d+"

# ── Step 4: re-enter the same conversation (focus fires markRead again) ──────
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- waitForAnimationToEnd

# Still operational — no crash, input bar visible
- assertVisible: "Type a message..."

# ── Step 5: back to list — badge still absent (idempotent) ──────────────────
- back
- waitForAnimationToEnd

- assertNotVisible:
    id: "unread-badge-\\d+"

# ── Step 6: error state — closed conversation has no input bar ───────────────
# (Skipped automatically if no closed conversation is available on device)
