appId: com.hatiwal.app
---
# Send a photo in an existing conversation and verify the inline image bubble appears.
# Covers: pick photo from library → optimistic bubble → server response → bubble renders.

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd

# Open the first conversation in the list
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Thread is open and input bar visible
- assertVisible: "Type a message..."

# TASK-K487: the composer's meetup/file/photo/offer icons are now collapsed
# behind a single "+" actions sheet — open it first, then tap the Photo row.
# The composer "+" button. NOT its accessibilityLabel ("More actions",
# chat.composer.moreActions): that is translated, and matching it was failing
# with "Element not found: Text matching regex: More actions" on a control
# that is right there — it carries testID="composer-plus-button", which is
# both locale-independent and unambiguous.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
- tapOn:
    text: "Attach photo"
- waitForAnimationToEnd

# Expo ImagePicker sheet should open — pick first photo from the library
# On the system photo picker, pick the first available asset
- tapOn:
    id: "com.apple.Photos"
    optional: true
- tapOn:
    index: 0
    optional: true
- waitForAnimationToEnd

# Dismiss any permission dialogs
- tapOn:
    text: "Allow Access to All Photos"
    optional: true
- waitForAnimationToEnd

# After returning to the app, an image bubble should appear in the thread.
# The bubble has accessibilityRole="imagebutton" set on the Pressable.
- assertVisible:
    text: "View photo fullscreen"

# Tapping the bubble opens the fullscreen viewer
- tapOn:
    text: "View photo fullscreen"
- waitForAnimationToEnd

# Fullscreen viewer is open — close button (X) must be visible
- assertVisible:
    text: "common.close"
- tapOn:
    text: "common.close"
- waitForAnimationToEnd

# We are back in the thread — image bubble is still present
- assertVisible:
    text: "View photo fullscreen"
