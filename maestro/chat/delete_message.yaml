appId: com.hatiwal.app
---
# TASK-M913: Soft-delete a sent message — tombstone bubble appears, original text gone.
#
# Happy path:
#   1. Send a message
#   2. Long-press on it → bottom-sheet appears with "Delete message"
#   3. Confirm deletion → tombstone "Message deleted" appears
#   4. Original text is gone from the thread

- runFlow: ../_helpers/login.yaml
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd

# Open first conversation
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Send a unique message we'll delete
- tapOn: "Type a message..."
- inputText: "Test message to delete"
- tapOn: "Send"
- waitForAnimationToEnd

# Verify the message appears
- assertVisible: "Test message to delete"

# Long-press the message bubble to trigger the delete action sheet
- longPressOn: "Test message to delete"
- waitForAnimationToEnd

# Delete action sheet should be visible
# WAIT for the action sheet, do not assert it — it animates in.
#
# This flow failed in run-299 here (`Assertion is false: "Delete message" is
# visible`) with the message itself sent and visible. Two things could produce
# that, and both are now addressed:
#
#   - the sheet had not finished animating when the assert ran (fixed here), and
#   - the bubble was sitting UNDERNEATH the composer bar, so the long press
#     landed on the bar instead of the message and no sheet ever opened. That was
#     a real app defect — the owner reported it independently on 2026-09-02 — and
#     is fixed in Conversation.tsx (scrollThreadToEnd + the bar-height effect).
#     maestro/chat/scroll_to_latest.yaml covers it directly.
- extendedWaitUntil:
    visible: "Delete message"
    timeout: 20000

# Tap delete
- tapOn: "Delete message"
- waitForAnimationToEnd

# Confirm deletion in the alert
- assertVisible: "Delete this message?"
- tapOn: "Delete"
- waitForAnimationToEnd

# Tombstone should appear
- assertVisible: "Message deleted"

# Original text should be gone
- assertNotVisible: "Test message to delete"
