appId: com.hatiwal.app
---
# From an open conversation, tap the other participant's name/avatar →
# navigates to their public profile (seller/[id] screen).
# Works for both buyer (tapping seller) and seller (tapping buyer).

- runFlow: ../_helpers/login.yaml
# The tab is labelled "Chats" (sidebar.chat). Maestro text matching is an
# ANCHORED regex, not a substring, so "Chat" never matched it and the flow
# failed at step 1 with "Element not found: Text matching regex: Chat".
- tapOn: "Chats"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Type a message..."
# Tap the other participant's name in the conversation header bar
- tapOn:
    id: "other-participant-name"
- waitForAnimationToEnd
# Should be on public profile / seller profile screen
# The stat label is "Active Listings", not a bare "Listings".
- assertVisible: "Active Listings"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Member since.*"
# Back returns to conversation
- back
- waitForAnimationToEnd
- assertVisible: "Type a message..."
