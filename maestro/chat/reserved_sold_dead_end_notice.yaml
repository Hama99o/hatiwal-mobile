appId: com.hatiwal.app
---
# Reserved listing seen by a NON-BUYER: the thread shows the recovery notice, offers
# are closed, and "See similar" gets them out of the dead end.
#
# This flow used to cover the active, reserved AND sold cases in 205 lines with FIVE
# logins — buyer, seller, buyer, seller, buyer, because each status change needs the
# other party. Comparable two-login flows take 405-504s, so five could never fit
# FLOW_TIMEOUT=600: it failed at 601s having recorded nothing, its log 34 bytes long.
# Not one of its assertions had ever reported a result.
#
# Now three flows, and only this one has to mutate anything:
#   dead_end_notice_absent_when_active.yaml — active listing, no notice   (1 login)
#   dead_end_notice_sold.yaml               — sold listing, notice        (1 login)
#   this one                                — reserved listing, notice    (2 logins)
#
# It reserves the Lenovo, which db/seeds/e2e.rb now returns to :active every seed —
# before that fix a status change here was permanent, and the eight flows sharing
# that listing silently lost their active fixture.
- runFlow: ../_helpers/login_seller.yaml

# ── The seller reserves it ────────────────────────
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "Lenovo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 15000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Conditional, because chat/reserve_after_accept also reserves this listing and may
# have run first in this cycle. Either way the listing ends up reserved, which is all
# the buyer half below depends on. A bare `tapOn: "Reserve"` would fail on an
# already-reserved listing, where the lifecycle button reads "Mark Sold" instead.
- runFlow:
    when:
      visible: "Reserve"
    commands:
      - tapOn: "Reserve"
      - waitForAnimationToEnd
      - assertVisible: "Who's buying this item?"
      # No named buyer: the notice this flow checks is the NEUTRAL one, and naming the
      # e2e buyer would make them the sale buyer and switch the copy to the
      # viewer-scoped variant (covered by dead_end_notice_sold.yaml).
      - tapOn: "Sold to someone not on Hatiwal"
      - tapOn: "Confirm reserve"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Listing marked as reserved"
          timeout: 15000
- assertVisible: "Reserved"

# ── The buyer sees the dead end ───────────────────────
- runFlow: ../_helpers/login.yaml
# No tab bar on a pushed screen, so this tap used to fail with "Element not
# found" on a testID that exists — audit_structure flags it. The helper pops
# back until the bar is there, and does nothing when it already is.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "Lenovo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 15000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

- assertVisible:
    id: "listing-unavailable-notice"
# Status-neutral title only: the copy never says WHO the seller committed to — that
# is viewerIsSaleBuyer's job, and this viewer is not the buyer.
- assertVisible: "Item reserved"
- assertVisible:
    id: "unavailable-browse-similar"
- assertVisible:
    id: "unavailable-more-from-seller"

# Offers are closed while it is reserved.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
- assertVisible:
    id: "composer-action-offer-disabled"
- tapOn:
    id: "composer-actions-backdrop"
- waitForAnimationToEnd

# And the recovery CTA actually gets them out of the dead end.
- tapOn:
    id: "unavailable-browse-similar"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
