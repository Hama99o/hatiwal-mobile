appId: com.hatiwal.app
---
# SF-M3 (docs/SELL_FLOW_REDESIGN.md §4.4.3) — a reserved listing's thread is
# NO LONGER a dead end for a non-buyer viewer. Before this ticket this flow
# proved the OPPOSITE: that the thread showed a recovery notice and steered
# the viewer away via "See similar". That behaviour is gone — reserved now
# means "still for sale, someone is first in line", so the thread stays a
# normal, fully-usable conversation. Only OFFERS stay paused on a reserved
# listing (§3.2's deliberate judgment call: a NEW price negotiation from a
# different buyer doesn't make sense once a specific buyer's hold is already
# in progress) — that one exclusion is unchanged and still asserted below.
# The filename is kept (rather than renamed) so this flow's history in
# qa/FLOW_REGISTER.md stays continuous; the CONTENT below is the new contract.
#
# This flow used to cover the active, reserved AND sold cases in 205 lines with
# FIVE logins — buyer, seller, buyer, seller, buyer, because each status change
# needs the other party. Comparable two-login flows take 405-504s, so five
# could never fit FLOW_TIMEOUT=600: it failed at 601s having recorded nothing,
# its log 34 bytes long.
#
# Now three flows, and only this one has to mutate anything:
#   dead_end_notice_absent_when_active.yaml — active listing, no notice   (1 login)
#   dead_end_notice_sold.yaml               — sold listing, notice        (1 login)
#   this one                                — reserved listing, NO notice (2 logins)
#
# It reserves the Lenovo, which db/seeds/e2e.rb now returns to :active every seed —
# before that fix a status change here was permanent, and the eight flows sharing
# that listing silently lost their active fixture.
- runFlow: ../_helpers/login_seller.yaml

# ── The seller reserves it ────────────────────────
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "Lenovo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 15000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# Conditional, because chat/reserve_after_accept also reserves this listing and may
# have run first in this cycle. Either way the listing ends up reserved, which is all
# the buyer half below depends on.
#
# SF-M2 (Sell Flow Redesign) removed the header's old showReserve/showMarkSold
# toggle — the pinned pill is now ALWAYS "Mark Sold" for the owner of a Live
# listing, so a bare `tapOn: "Reserve"` (that button no longer exists at all)
# can never fire, and gating on its VISIBILITY would silently skip placing the
# hold on every run, passing only by accident whenever some other flow had
# already reserved this listing first. Gate on the STATUS BADGE instead — if
# it does not already read "Reserved", place a hold from the composer's "+"
# menu (ComposerActionsSheet's "Place a hold for {name}" row), scoped to
# whichever buyer this seeded conversation already has.
- runFlow:
    when:
      notVisible: "Reserved"
    commands:
      - tapOn:
          id: "composer-plus-button"
      - waitForAnimationToEnd
      # Wait for the SHEET's contents, not just the animation — see
      # place_and_release_hold.yaml's own note: ComposerActionsSheet is a
      # native Modal and waitForAnimationToEnd returns before its children
      # reach the a11y tree.
      - extendedWaitUntil:
          visible:
            id: "composer-action-place-hold"
          timeout: 15000
      - tapOn:
          id: "composer-action-place-hold"
      - waitForAnimationToEnd
      - assertVisible: ".*Reserve for.*"
      - assertNotVisible: "Who's buying this item?"
      - tapOn: "Confirm reserve"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: ".*reserved.*"
          timeout: 15000
- assertVisible: "Reserved"

# ── The buyer sees a NORMAL, usable thread — not a dead end ─────────────────
- runFlow: ../_helpers/login.yaml
# No tab bar on a pushed screen, so this tap used to fail with "Element not
# found" on a testID that exists — audit_structure flags it. The helper pops
# back until the bar is there, and does nothing when it already is.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "Lenovo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 15000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

# SF-M3 — the whole regression this flow now guards against: no recovery
# notice, no "Item reserved" dead-end headline, no steer-away CTAs.
- assertNotVisible:
    id: "listing-unavailable-notice"
- assertNotVisible:
    id: "unavailable-browse-similar"
- assertNotVisible:
    id: "unavailable-more-from-seller"

# Offers stay paused on a reserved listing (§3.2, unchanged by this ticket) —
# the "+" sheet still shows the DISABLED offer row, never the live one.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
- assertVisible:
    id: "composer-action-offer-disabled"
- assertNotVisible:
    id: "composer-action-offer"
- tapOn:
    id: "composer-actions-backdrop"
- waitForAnimationToEnd

# And the thread itself is fully usable — the actual point of SF-M3: a buyer
# can still message the seller about a reserved listing, in case the
# reservation falls through.
- assertVisible: "Type a message..."
- tapOn: "Type a message..."
- inputText: "Is this still available if the reservation falls through?"
- tapOn: "Send"
- waitForAnimationToEnd
- assertVisible: "Is this still available if the reservation falls through?"
