appId: com.hatiwal.app
---
# THE NEWEST MESSAGE MUST BE VISIBLE WITHOUT A MANUAL DRAG — both after sending
# one and after arriving on the thread fresh.
#
# Owner report, 2026-09-02, in two parts:
#   "when we send message it did not scroll till it should… it scroll smal…
#    I need to scrom manul to see it"
#   "and where there are messages and you come to message page you need to scrol
#    to see last message. I think the send message input and default message text
#    proposal hide the latest message. That scroll might work but the TARGET
#    might be wrong."
#
# Both were real and they had DIFFERENT causes (see Conversation.tsx):
#   1. onScroll fired mid-animation (scrollEventThrottle 200ms) and wrote the
#      near-bottom flag back to false, so no later layout pass was allowed to
#      finish the scroll.
#   2. paddingBottom is `bottomBarH + barLift`, and bottomBarH starts at 0 until
#      the bar's onLayout — so an early scroll aimed at a content height that
#      reserved no room for the composer or the QuickReplies chips, parking the
#      newest bubble underneath them. The target was wrong, exactly as reported.
#
# This flow plants a UNIQUELY identifiable message so the assertion cannot pass
# on some other thread's content, then checks it twice: right after sending, and
# again after a cold start (the "come to the message page" case).
#
# NOTE ON WHAT THIS CAN AND CANNOT PROVE: Maestro's visibility is computed from
# an element's own bounds, so it does NOT detect occlusion by the composer bar
# sitting on top of it. A pass here proves the message is on screen; it does not
# by itself prove it is UNCOVERED. qa/check_message_not_occluded.py compares the
# real bounds afterwards, and the screenshots below are for eyes.
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 30000

# A LIVE thread, found by name. Not `conversation-row-\d+` index 0: the inbox is
# ordered by last_message_at and every sibling flow that sends a message
# reorders it, which is how three chat flows ended up acting on whichever thread
# happened to be newest (see mark_read_end_to_end's own note).
# ITS OWN thread, not the shared "Phone Case" one.
#
# This flow deliberately sends 6-8 filler messages, and doing that in a shared
# thread is destructive: the outbound filler pushed Phone Case's latest INBOUND
# message far into the history, and chat/mark_read_end_to_end then failed because
# the mark-unread helper nulls read_at on that message — leaving the "Unread
# messages" divider dozens of screens above the fold.
- tapOn:
    id: "conversations-search-bar"
- inputText: "QA Disposable scroll_to_latest"
- waitForAnimationToEnd
# NO hideKeyboard here. It is a BACK PRESS.
#
# Maestro's hideKeyboard has no guaranteed IME to close, so on this screen it
# popped Messages and left the app on Bazaar — run-355's screenshot shows the
# Bazaar tab selected with a listing grid, and the flow then failed looking for a
# conversation row that could not exist. qa/flow_lint.py warns about exactly this
# ("no IME guaranteed, so this is a Back press that pops the screen") and I added
# it anyway.
#
# It is also no longer needed. It was added because at 360dp the Messages chrome
# (search field + Inbox/Archived tabs + filter chips + the FloatingTabBar) left
# ~13dp of list with the keyboard up. The app now COLLAPSES the tabs and the chip
# row while a search term is present, so the results have room without dismissing
# anything.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 30000

# ── 0. MAKE THE THREAD LONG ENOUGH TO ACTUALLY SCROLL ──────────────────────
#
# Without this the test is worthless. The first run of this flow passed with the
# newest message sitting 982px ABOVE the composer — because the re-seed had left
# the thread short enough to fit on screen, so nothing had to scroll and the
# assertion proved nothing. The owner's screenshot showed a LONG thread whose
# last bubble was a tall PRICE OFFER / MEETUP PROPOSAL card, which is the worst
# case for this bug: a tall bubble is exactly what an interrupted scroll leaves
# half-covered.
- repeat:
    times: 6
    commands:
      - tapOn: "Type a message..."
      - inputText: "filler to make the thread scroll"
      - tapOn: "Send"
      - waitForAnimationToEnd

# ── 1. after SENDING ───────────────────────────────────────────────────────
- tapOn: "Type a message..."
- inputText: "Scroll target check"
- tapOn: "Send"
- waitForAnimationToEnd
# A second settle: the bubble measures, the bar re-measures, the keyboard moves.
# The retry chain in scrollThreadToEnd runs to 460ms, so this is the window in
# which the old code gave up half-way.
- waitForAnimationToEnd
- assertVisible: "Scroll target check"
- takeScreenshot: scroll_to_latest-after-send

# ── 2. after ARRIVING on the thread fresh ──────────────────────────────────
# Cold start, so the thread mounts from scratch with bottomBarH back at 0 —
# precisely the window where the target used to be computed too short.
- launchApp:
    stopApp: true
- runFlow: ../_helpers/open_bundle.yaml
- extendedWaitUntil:
    visible:
      id: "chat-tab"
    timeout: 120000
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 30000
- tapOn:
    id: "conversations-search-bar"
- inputText: "QA Disposable scroll_to_latest"
- waitForAnimationToEnd
# NO hideKeyboard here. It is a BACK PRESS.
#
# Maestro's hideKeyboard has no guaranteed IME to close, so on this screen it
# popped Messages and left the app on Bazaar — run-355's screenshot shows the
# Bazaar tab selected with a listing grid, and the flow then failed looking for a
# conversation row that could not exist. qa/flow_lint.py warns about exactly this
# ("no IME guaranteed, so this is a Back press that pops the screen") and I added
# it anyway.
#
# It is also no longer needed. It was added because at 360dp the Messages chrome
# (search field + Inbox/Archived tabs + filter chips + the FloatingTabBar) left
# ~13dp of list with the keyboard up. The app now COLLAPSES the tabs and the chip
# row while a search term is present, so the results have room without dismissing
# anything.
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 30000
- waitForAnimationToEnd
# NO scrolling between opening the thread and this assertion — that is the whole
# point. If it needs a drag, this fails.
- assertVisible: "Scroll target check"
- takeScreenshot: scroll_to_latest-on-open

# ── 3. a TALL bubble last — the owner's actual case ────────────────────────
#
# A meetup proposal renders the tall card bubble from the report (place link +
# time + timestamp). If any scroll stops short, this is the bubble that ends up
# behind the composer, and it is what `check_message_not_occluded.py` is pointed
# at afterwards.
- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "composer-action-meetup"
    timeout: 20000
- tapOn:
    id: "composer-action-meetup"
- waitForAnimationToEnd
- tapOn:
    id: "meetup-place-input"
- inputText: "Scroll target meetup place"
- tapOn:
    id: "meetup-time-input"
- inputText: "Saturday at 3pm"
- extendedWaitUntil:
    visible:
      id: "meetup-propose-submit"
    timeout: 20000
- tapOn:
    id: "meetup-propose-submit"
- waitForAnimationToEnd
- waitForAnimationToEnd
# The tall card must be reachable with no drag.
- assertVisible: "Scroll target meetup place"
- takeScreenshot: scroll_to_latest-tall-bubble
