appId: com.hatiwal.app
---
# Composer draft persistence — per conversation, survives navigation
#
# Happy path: type → navigate away → reopen same thread → assert text still there
# Send path:  send → reopen thread → assert input is empty

- runFlow: ../_helpers/login.yaml

# ── Step 1: Open the first conversation ──────────────────────────────────────
# Opens the thread on a listing that is still ACTIVE, so the composer and its
# "+" actions sheet exist. Opening "the first conversation" landed on a sold or
# reserved listing depending on run order, and there the composer is replaced by
# ListingUnavailableNotice — no "+" button at all. See the helper for the
# database evidence.
- runFlow: ../_helpers/open_active_conversation.yaml
- assertVisible: "Type a message..."

# ── Step 2: Type a draft message but do NOT send ──────────────────────────────
- tapOn: "Type a message..."
- inputText: "Draft that must survive navigation"
- assertVisible: "Draft that must survive navigation"

# ── Step 3: Navigate back to the conversations list ───────────────────────────
- tapOn:
    id: "back_button"
- waitForAnimationToEnd
- assertVisible: "Messages"

# ── Step 4: Reopen the SAME conversation ─────────────────────────────────────
# The SAME one, by name. Index 0 is the most recently active thread, and a
# *draft* does not bump a conversation's position — so reopening index 0 here
# could open a different thread and then assert the draft in it. The row
# truncates the title, so this matches the prefix (see
# _helpers/open_active_conversation.yaml).
- tapOn:
    text: "Phone Case.*"
- waitForAnimationToEnd

# ── Step 5: Assert the draft text is restored in the composer ────────────────
- assertVisible: "Draft that must survive navigation"

# ── Step 6: Send the message ──────────────────────────────────────────────────
- tapOn: "Send"
- waitForAnimationToEnd
# The sent message appears in the thread
- assertVisible: "Draft that must survive navigation"

# ── Step 7: Navigate back then reopen to verify composer is now empty ─────────
- tapOn:
    id: "back_button"
- waitForAnimationToEnd
- assertVisible: "Messages"

# Same thread again, by name rather than position.
- tapOn:
    text: "Phone Case.*"
- waitForAnimationToEnd

# After a successful send the draft must be gone — composer is empty.
#
# NOT `assertNotVisible: "Draft that must survive navigation"`. That text was just
# SENT, so it is on screen as a message bubble in the thread — the assertion could
# never pass, no matter how correct the app was. The placeholder is the real proof:
# a TextInput renders its placeholder only when its value is empty.
- assertVisible: "Type a message..."

# ── Error state: send failure keeps the draft ─────────────────────────────────
# (This scenario requires simulating a network error; skip in standard CI.
#  The unit tests in useComposerDraft.test.ts cover this contract.)
