appId: com.hatiwal.app
---
# Meetup proposal validation — place and time are required

- runFlow: ../_helpers/login.yaml
- tapOn: "Chats"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector, so it matches EVERY element on screen
# and index 0 is whatever comes first in the hierarchy — the heading or the
# search bar, never a conversation. The flow stayed on the list and then failed
# on the composer it never reached ("Type a message..." is visible).
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# TASK-K487: the composer's meetup/file/photo/offer icons are now collapsed
# behind a single "+" actions sheet — open it first, then tap the row.
- tapOn:
    text: "More actions"
- waitForAnimationToEnd
- tapOn: "Propose Meetup"
- waitForAnimationToEnd
- assertVisible: "Propose a Meetup"
# Try submitting empty form
- tapOn: "Propose Meetup"
- waitForAnimationToEnd
- assertVisible: "Please enter a meeting place."
# Fill place only
- tapOn: "Where? (e.g. Shahr-e-Naw market)"
- inputText: "Shahr-e-Naw"
- tapOn: "Propose Meetup"
- waitForAnimationToEnd
- assertVisible: "Please enter a meeting time."
# Fill time too
- tapOn: "When? (e.g. Tomorrow 3pm)"
- inputText: "Tomorrow at 3pm"
- tapOn: "Propose Meetup"
- waitForAnimationToEnd
# Proposal sent
- assertVisible: "Meetup proposal sent!"
