appId: com.hatiwal.app
---
# Conversations empty state — a brand-new account has no messages.
#
# IT REGISTERS ITS OWN ACCOUNT, because no seeded account is chat-empty. This flow
# used to call login.yaml with a comment saying "use newbuyer account which has no
# conversations" — but login.yaml signs in the ordinary buyer, who has three, and
# even newbuyer is not empty: db/seeds/e2e.rb gives it a conversation as the
# SELLER of its own listing (added later, for a different scenario, which silently
# invalidated this flow's premise). Verified against the database: NO account
# matching %hatiwal.test has zero conversations.
#
# A freshly registered user is empty by definition, needs no fixture, and cannot
# be invalidated by a seed change later.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml

# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Create Account"
- tapOn: "First Name"
- inputText: "Zahra"
- tapOn: "Last Name"
- inputText: "Amini"
- tapOn: "Phone Number"
- inputText: "0700000042"
- tapOn: "Email"
# Maestro's built-in — a constant address would collide with the account this
# flow created on its previous run.
- inputText: ${maestroRandomEmail}
- tapOn: "Password"
- inputText: "Password123!"
# "Confirm Password" is the LAST field on the register form, so it is below the
# fold once the keyboard is up from the fields above it. `tapOn` does not scroll.
- scrollUntilVisible:
    element:
      text: "Confirm Password"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Confirm Password"
- inputText: "Password123!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bazaar"
    timeout: 60000

# ── The empty state itself ──────────────────────────────────────────────────
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# "No conversations YET" (chat.noConversations) is what the default inbox renders.
# `chat.empty.title` ("No conversations") is a dead key — the code only reaches
# chat.empty.sellingTitle / buyingTitle when a role filter is active. Anchored
# matching makes that one word the difference between pass and fail.
- assertVisible: "No conversations yet"
- assertVisible: "Browse Listings"

# And its call to action gets you out of it.
- tapOn: "Browse Listings"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
