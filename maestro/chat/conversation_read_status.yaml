appId: com.hatiwal.app
---
# Read-receipt / unread-clearing flow:
#   1. Make the first conversation unread (so this flow does not depend on
#      whatever the previous flow left behind).
#   2. The row shows an unread badge.
#   3. Tap into the thread — markRead fires on focus.
#   4. Return to the list — the badge on that row is gone.
#
# IT CREATES ITS OWN UNREAD STATE, deliberately. It used to open the Chats tab and
# assert `unread-badge-\d+` was already visible, which is true of a freshly seeded
# database and false a few flows later: every flow that opens a thread marks it
# read, so running this in a suite failed on "Assertion is false: id:
# unread-badge-\d+ is visible" purely because of what ran before it. The row menu
# has a "mark unread" action, so the precondition can simply be established.

- runFlow: ../_helpers/login.yaml

# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"

# ── Establish the precondition: this row IS unread ──────────────────────────
- tapOn:
    id: "conversation-options-\\d+"
    index: 0
- waitForAnimationToEnd
# Whichever of the two the row currently offers: if it is already unread the menu
# shows "mark read" instead, so this is optional and the assertion below is the
# real gate.
- tapOn:
    id: "menu-mark-unread"
    optional: true
- waitForAnimationToEnd
# If the menu is still open (the row was already unread), close it.
- runFlow:
    when:
      visible:
        id: "conversation-action-menu"
    commands:
      - back
      - waitForAnimationToEnd

# WAIT for the badge: marking unread is a mutation plus a refetch, not an
# animation, so `waitForAnimationToEnd` returns long before the badge is back.
- extendedWaitUntil:
    visible:
      id: "unread-badge-\\d+"
    timeout: 30000

# ── Open the thread — markRead fires on focus ───────────────────────────────
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Type a message..."

# ── Back on the list, that row is read ──────────────────────────────────────
- back
- waitForAnimationToEnd
- assertVisible: "Messages"
# Same on the way back: clearing it is a mutation + refetch.
- extendedWaitUntil:
    notVisible:
      id: "unread-badge-\\d+"
    timeout: 30000

# The old final step, `assertNotVisible: text: "1"`, was dropped on purpose. It was
# meant to check the tab-bar badge had cleared, but "1" is an anchored match on ANY
# element whose whole text is "1" — a price, a count, a date — so it could fail for
# reasons that have nothing to do with read state, and pass while the badge was
# still there under a different count. The row badge above is the real signal.
