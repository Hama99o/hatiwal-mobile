appId: com.hatiwal.app
---
# Dark mode: switch to Dark theme from Profile, verify Bazaar renders (no blank areas)

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# `profile.theme` = "Appearance". Nothing in the app uppercases section
# titles — same mistake as "LANGUAGE".
# "Appearance" (profile.theme) sits in the Preferences card near the BOTTOM of the
# profile screen — below the stats, the quick actions, the pending-reviews nudge
# and PERSONAL INFO — so asserting it on arrival fails on a screen that is
# perfectly correct. The scroll below is the stronger proof anyway: it lands on a
# control INSIDE that card.
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "theme-option-dark"
- waitForAnimationToEnd
# Navigate to Bazaar — all elements should be visible in dark mode
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Scroll to verify cards render
- scroll
- waitForAnimationToEnd
# Switch back to system to avoid affecting other tests
- tapOn:
    id: "profile-tab"
# Scroll first. The Appearance card is near the BOTTOM of Profile — below the
# stats, quick actions, pending-reviews nudge and PERSONAL INFO — and `tapOn`
# never scrolls. These reset taps at the end of a flow LACKED the scroll their
# opening tap had, and browse_dark failed on `Element not found:
# theme-option-system` for exactly that reason.
- scrollUntilVisible:
    element:
      id: "theme-option-system"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "theme-option-system"
