appId: com.hatiwal.app
---
# Dark mode: Saved tab renders correctly — cards visible, no text-on-dark issues

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "theme-option-dark"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd

# First save a listing so Saved tab is non-empty
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn:
# The card save hearts all share the id "save-button" (added to both the list
# and grid variants); "save-button-N" existed nowhere. `index` picks the Nth.
    id: "save-button"
    index: 0
- waitForAnimationToEnd

- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
# Cards render — listing visible in dark mode
# The empty state is `saved.empty` = "No saved items yet".
- assertNotVisible: "No saved items yet"

# Reset
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn:
    id: "theme-option-system"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd
