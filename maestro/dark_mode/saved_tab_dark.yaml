appId: com.hatiwal.app
---
# Dark mode: Saved tab renders correctly — cards visible, no text-on-dark issues

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Dark"
    direction: DOWN
    timeout: 20000
- tapOn: "Dark"
- waitForAnimationToEnd

# First save a listing so Saved tab is non-empty
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn:
    id: "save-button-0"
- waitForAnimationToEnd

- tapOn: "Saved"
- waitForAnimationToEnd
# Cards render — listing visible in dark mode
- assertNotVisible: "No saved listings"

# Reset
- tapOn: "Me"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn: "System"
- waitForAnimationToEnd
