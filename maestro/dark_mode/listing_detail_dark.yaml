appId: com.hatiwal.app
---
# Dark mode: listing detail renders correctly — no white areas, text readable

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "theme-option-dark"
- waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards. The comment above it said "open a
# listing detail" the whole time.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# Do NOT tap "Contact Seller": it opens the FirstMessageSheet, which then covers
# the detail screen this flow exists to inspect — including the very button, so
# the next line failed with `Assertion is false: "Contact Seller" is visible`.
# This flow checks that listing detail RENDERS correctly in dark mode; asserting
# the button is present is the check, and tapping it defeats it.
# (report/block_user.yaml carries the same note for the same reason.)
- assertVisible: "Contact Seller"
- assertVisible: "Description"
- scroll
- assertVisible: "Seller"
- back
# Reset theme
- tapOn:
    id: "profile-tab"
# Scroll first. The Appearance card is near the BOTTOM of Profile — below the
# stats, quick actions, pending-reviews nudge and PERSONAL INFO — and `tapOn`
# never scrolls. These reset taps at the end of a flow LACKED the scroll their
# opening tap had, and browse_dark failed on `Element not found:
# theme-option-system` for exactly that reason.
- scrollUntilVisible:
    element:
      id: "theme-option-system"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "theme-option-system"
