appId: com.hatiwal.app
---
# Profile screen in dark mode — all elements visible

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Switch to dark
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
# These two live at the TOP of Profile — the mode toggle just under the avatar,
# "Edit Profile" beside it — so they are asserted ON ARRIVAL, before the flow
# scrolls down to the Appearance card. They used to be checked AFTER that
# scroll, by which point both had left the screen: the hierarchy at failure
# showed Profile correctly rendered from "Messages" down to "PRIVACY", with the
# toggle simply scrolled off the top.
- assertVisible: "Switch to .*"
- assertVisible: "Edit Profile"

- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "theme-option-dark"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- assertVisible: "Appearance"
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"
# Restore
- tapOn:
    id: "theme-option-light"
- waitForAnimationToEnd
