appId: com.hatiwal.app
---
# Light mode: set explicit Light → verify on every tab, no dark backgrounds visible

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn: "Light"
- waitForAnimationToEnd

# Bazaar — light mode
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Light background, cards visible
- assertVisible: "Bazaar"

# Saved
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Saved"

# Chat
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Chats"

# Profile
- tapOn: "Me"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"

# Listing detail
- tapOn: "Bazaar"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Contact Seller"

# Reset
- back
- waitForAnimationToEnd
- tapOn: "Me"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn: "System"
- waitForAnimationToEnd
