appId: com.hatiwal.app
---
# Light mode: set explicit Light → verify on every tab, no dark backgrounds visible

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "theme-option-light"
    timeout: 20000
- tapOn:
    id: "theme-option-light"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd

# Bazaar — light mode
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Light background, cards visible
- assertVisible: "Bazaar"

# Saved
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertVisible: "Saved"

# Chat
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Chats"

# Profile
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere — the screen
# shows the user's NAME. Anchor on the mode toggle's label instead: it is
# high on the screen (just under the avatar), needs no scroll, and the regex
# keeps it independent of which mode the account is in.
#
# Not "Edit" either, though that IS a real control here: it lives in
# PersonalInfoCard, well below the fold, so asserting it without a scroll
# just trades one guaranteed failure for another.
- assertVisible: "Switch to .*"

# Listing detail
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Contact Seller"

# Reset
- back
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "theme-option-system"
    timeout: 20000
- tapOn:
    id: "theme-option-system"
# Theme switches RESTART the app (theme.store.ts:26 -> reloadApp -> RNRestart), so it
# returns on the Bazaar feed. This flow happens to want the feed next, so it passed
# without waiting — but the tap after a switch was racing a restarting app. UI-048
# is what that race looks like when a flow needs to stay on the profile screen.
- runFlow: ../_helpers/await_theme_restart.yaml
- waitForAnimationToEnd
