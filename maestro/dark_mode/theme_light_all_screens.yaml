appId: com.hatiwal.app
---
# Light mode: set explicit Light → verify on every tab, no dark backgrounds visible

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn: "Light"
- waitForAnimationToEnd

# Bazaar — light mode
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Light background, cards visible
- assertVisible: "Bazaar"

# Saved
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Saved"

# Chat
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Chats"

# Profile
- tapOn: "Me"
- waitForAnimationToEnd
- assertVisible: "Profile"

# Listing detail
- tapOn: "Bazaar"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Message Seller"

# Reset
- back
- waitForAnimationToEnd
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn: "System"
- waitForAnimationToEnd
