appId: com.hatiwal.app
---
# Chat screen in dark mode — conversations list and thread visible

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# Switch to dark theme
- tapOn: "Dark"
- waitForAnimationToEnd
# Navigate to Chats tab
- tapOn: "Chats"
- waitForAnimationToEnd
- assertVisible: "Messages"
# Open a conversation
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Type a message..."
# Send a message in dark mode
- tapOn: "Type a message..."
- inputText: "Dark mode test message"
- tapOn: "Send"
- waitForAnimationToEnd
# Restore light theme
- back
- waitForAnimationToEnd
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Light"
- waitForAnimationToEnd
