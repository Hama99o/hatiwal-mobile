appId: com.hatiwal.app
---
# Chat screen in dark mode — conversations list and thread visible

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Switch to dark theme
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "theme-option-dark"
- waitForAnimationToEnd
# Navigate to Chats tab
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- assertVisible: "Messages"
# Open a conversation
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Type a message..."
# Send a message in dark mode
- tapOn: "Type a message..."
- inputText: "Dark mode test message"
- tapOn: "Send"
- waitForAnimationToEnd
# Restore light theme
- back
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- tapOn:
    id: "theme-option-light"
- waitForAnimationToEnd
