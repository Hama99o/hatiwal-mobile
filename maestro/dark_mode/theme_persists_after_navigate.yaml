appId: com.hatiwal.app
---
# Dark mode persists: set dark → navigate all tabs → still dark after app restart

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "theme-option-dark"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
# `selected: true` is the whole point of this flow. Asserting the button merely
# EXISTS is always true — it is on screen in every theme — so the assertion
# would pass even if the theme had reset. accessibilityState.selected is what
# carries "this is the active theme".
- assertVisible:
    id: "theme-option-dark"
    selected: true

# Navigate all tabs
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Restart and verify still dark
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn: "Appearance"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      id: "theme-option-dark"
    direction: DOWN
    timeout: 20000
# `selected: true` is the whole point of this flow. Asserting the button merely
# EXISTS is always true — it is on screen in every theme — so the assertion
# would pass even if the theme had reset. accessibilityState.selected is what
# carries "this is the active theme".
- assertVisible:
    id: "theme-option-dark"
    selected: true

# Reset to system
# Scroll first. The Appearance card is near the BOTTOM of Profile — below the
# stats, quick actions, pending-reviews nudge and PERSONAL INFO — and `tapOn`
# never scrolls. These reset taps at the end of a flow LACKED the scroll their
# opening tap had, and browse_dark failed on `Element not found:
# theme-option-system` for exactly that reason.
- scrollUntilVisible:
    element:
      id: "theme-option-system"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "theme-option-system"
- waitForAnimationToEnd
