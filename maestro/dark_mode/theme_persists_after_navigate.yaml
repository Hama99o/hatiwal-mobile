appId: com.hatiwal.app
---
# Dark mode persists: set dark → navigate all tabs → still dark after app restart

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Appearance"
- waitForAnimationToEnd
- tapOn: "Dark"
- waitForAnimationToEnd
- assertVisible: "Dark"

# Navigate all tabs
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn: "Saved"
- waitForAnimationToEnd
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn: "Me"
- waitForAnimationToEnd

# Restart and verify still dark
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Appearance"
- waitForAnimationToEnd
- assertVisible: "Dark"

# Reset to system
- tapOn: "System"
- waitForAnimationToEnd
