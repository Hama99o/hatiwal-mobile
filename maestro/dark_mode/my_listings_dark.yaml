appId: com.hatiwal.app
---
# My Shop in dark mode — all listing cards visible

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Dark"
    direction: DOWN
    timeout: 20000
- tapOn: "Dark"
- waitForAnimationToEnd
- tapOn: "My Shop"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
# Listing cards render without blank/white backgrounds
- scroll
- waitForAnimationToEnd
# Restore theme
- tapOn: "Me"
- waitForAnimationToEnd
- tapOn: "Light"
- waitForAnimationToEnd
