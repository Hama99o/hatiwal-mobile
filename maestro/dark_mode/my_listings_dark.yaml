appId: com.hatiwal.app
---
# My Listings in dark mode — all listing cards visible

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "Profile"
- waitForAnimationToEnd
- tapOn: "Dark"
- waitForAnimationToEnd
- tapOn: "My Listings"
- waitForAnimationToEnd
- assertVisible: "My Listings"
# Listing cards render without blank/white backgrounds
- scroll
- waitForAnimationToEnd
# Restore theme
- tapOn: "Profile"
- waitForAnimationToEnd
- tapOn: "Light"
- waitForAnimationToEnd
