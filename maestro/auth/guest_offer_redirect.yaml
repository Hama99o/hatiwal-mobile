appId: com.hatiwal.app
---
# Guest taps "Make an Offer" → redirected to login → completes offer after login

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml

# ── Blank-screen recovery (this flow only) ──────────────────────────────────
# `clearState: true` erases the dev client's remembered Metro URL, and
# reconnecting sometimes leaves a blank white screen — logcat shows
# `DevLauncherActivity EXITING` with a DeadObjectException. One warm relaunch
# fixes it; the dev client remembers the server by then.
#
# It lives HERE and not in open_bundle.yaml because Maestro's `launchApp` GRANTS
# ALL RUNTIME PERMISSIONS by default, with no "leave them alone" option. In the
# shared helper it granted location to every flow and broke the two whose whole
# subject is the permission PROMPT. This flow does not care about permissions.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - launchApp
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: "Skip|Bazaar|Me|Email|Buy and sell locally in Afghanistan"
          timeout: 120000
- runFlow: ../_helpers/goto_login.yaml
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
- tapOn: "Continue browsing"
- waitForAnimationToEnd
- tapOn:
    index: 0
    text: "Bazaar"
- waitForAnimationToEnd
# OPEN A LISTING FIRST. Both "Make an Offer" and the heart are listing-DETAIL
# controls, and the step before this only taps the Bazaar TAB — so the flow was
# looking for them on the FEED. That is why they failed with `Element not found`
# on an app that renders them perfectly.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
- tapOn: "Make an Offer"
- waitForAnimationToEnd
# Redirected to login
- assertVisible: "Sign In"
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
# Offer sheet should reopen after login
- assertVisible: "Make an Offer"
# `chat.offer.yourOffer` = "Your Offer".
- tapOn: "Your Offer"
- inputText: "1500"
- tapOn: "Send Offer"
- waitForAnimationToEnd
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*1,500"
