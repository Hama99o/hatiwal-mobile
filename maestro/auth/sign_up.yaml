appId: com.hatiwal.app
---
# Happy path: new user registers and lands on Bazaar

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
# Navigate to Register
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Create Account"
- assertVisible: "Buy and sell locally in Afghanistan"
# Fill form
- tapOn:
    id: "register-firstname-input"
- inputText: "Ahmad"
- tapOn:
    id: "register-lastname-input"
- inputText: "Karimi"
- tapOn:
    id: "register-phone-input"
- inputText: "0700000001"
- tapOn:
    id: "register-email-input"
# `${random}` is NOT a Maestro variable. Maestro evaluates ${...} as JavaScript,
# so this resolved to an undefined identifier rather than a fresh value — and a
# constant email means this flow can only ever succeed ONCE, then collides with
# the account it created last time. `maestroRandomEmail` is the documented
# built-in for exactly this.
# `maestroRandomEmail` is defined NOWHERE in the suite, and Maestro evaluates
# ${...} as JavaScript — so it resolved to the literal string "undefined". The
# screenshot showed "undefined" sitting in the email field with the app correctly
# refusing it: "• Email is not an email". The app was right; the flow fed it
# rubbish. Use the idiom that already works in account_delete_and_restore.
- evalScript: ${output.email = 'qasignup_' + Date.now() + '@hatiwal.test'}
- inputText: ${output.email}
- tapOn:
    id: "register-password-input"
- inputText: "Password123!"
# "Confirm Password" is the LAST field on the register form, so it is below the
# fold once the keyboard is up from the fields above it. `tapOn` does not scroll.
- scrollUntilVisible:
    element:
      id: "register-confirm-password-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "register-confirm-password-input"
- inputText: "Password123!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
# Lands on Bazaar after successful registration.
#
# Registration is an API round-trip, so this needs a WAIT rather than a bare
# assertion — and a brand-new account is also asked for notification permission
# straight away, and that dialog covers the tab bar. Both were making this fail
# after the form had been filled and submitted perfectly.
- extendedWaitUntil:
    visible: "Allow Hatiwal to send you notifications?"
    timeout: 20000
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bazaar"
    timeout: 60000
