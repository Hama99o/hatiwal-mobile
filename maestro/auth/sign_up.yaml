appId: com.hatiwal.app
---
# Happy path: new user registers and lands on Bazaar

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- assertVisible: "Welcome to Hatiwal"
# Navigate to Register
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Create Account"
- assertVisible: "Buy and sell locally in Afghanistan"
# Fill form
- tapOn: "First Name"
- inputText: "Ahmad"
- tapOn: "Last Name"
- inputText: "Karimi"
- tapOn: "Phone Number"
- inputText: "0700000001"
- tapOn: "Email"
# `${random}` is NOT a Maestro variable. Maestro evaluates ${...} as JavaScript,
# so this resolved to an undefined identifier rather than a fresh value — and a
# constant email means this flow can only ever succeed ONCE, then collides with
# the account it created last time. `maestroRandomEmail` is the documented
# built-in for exactly this.
- inputText: ${maestroRandomEmail}
- tapOn: "Password"
- inputText: "Password123!"
# "Confirm Password" is the LAST field on the register form, so it is below the
# fold once the keyboard is up from the fields above it. `tapOn` does not scroll.
- scrollUntilVisible:
    element:
      text: "Confirm Password"
    direction: DOWN
    timeout: 20000
- tapOn: "Confirm Password"
- inputText: "Password123!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
- tapOn:
    id: "register-submit"
# Lands on Bazaar after successful registration.
#
# Registration is an API round-trip, so this needs a WAIT rather than a bare
# assertion — and a brand-new account is also asked for notification permission
# straight away, and that dialog covers the tab bar. Both were making this fail
# after the form had been filled and submitted perfectly.
- extendedWaitUntil:
    visible: "Allow Hatiwal to send you notifications?"
    timeout: 20000
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bazaar"
    timeout: 60000
