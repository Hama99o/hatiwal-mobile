appId: com.hatiwal.app
---
# Happy path: user logs in and lands on Browse

- launchApp:
    clearState: true
- assertVisible: "Welcome to Hatiwal"
- assertVisible: "Buy and sell locally in Afghanistan"
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- assertVisible: "Browse"
# Verify user is authenticated — Profile tab shows name
- tapOn: "Profile"
- assertNotVisible: "Sign In"
- assertVisible: "Sign Out"
