appId: com.hatiwal.app
---
# Happy path: user logs in and lands on Bazaar

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- assertVisible: "Welcome to Hatiwal"
- assertVisible: "Buy and sell locally in Afghanistan"
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- assertVisible: "Bazaar"
# Verify user is authenticated — Profile tab shows name
- tapOn: "Me"
- assertNotVisible: "Sign In"
# Sign Out sits below the fold on the profile screen — assert after scrolling to
# it, otherwise this fails on a logged-in user who is plainly logged in.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"
