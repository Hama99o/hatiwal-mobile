appId: com.hatiwal.app
---
# Happy path: user logs out, lands on Bazaar (guest mode), tokens cleared

- runFlow: ../_helpers/login.yaml
# Go to Profile
- tapOn:
    id: "profile-tab"
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- assertVisible: "Sign Out"
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign Out"
# Confirm dialog appears
- assertVisible: "Are you sure you want to sign out?"
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign Out"
# Lands on Bazaar (guests can browse without auth)
- assertVisible: "Bazaar"
# Verify logged out — Profile tab no longer shows user name
- tapOn:
    id: "profile-tab"
- assertVisible: "Sign In"
