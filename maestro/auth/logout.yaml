appId: com.hatiwal.app
---
# Happy path: user logs out, lands on Browse (guest mode), tokens cleared

- runFlow: ../_helpers/login.yaml
# Go to Profile
- tapOn: "Profile"
- assertVisible: "Sign Out"
- tapOn: "Sign Out"
# Confirm dialog appears
- assertVisible: "Are you sure you want to sign out?"
- tapOn: "Sign Out"
# Lands on Browse (guests can browse without auth)
- assertVisible: "Browse"
# Verify logged out — Profile tab no longer shows user name
- tapOn: "Profile"
- assertVisible: "Sign In"
