appId: com.hatiwal.app
---
# qa:expect-api-error — this flow PROVOKES a failed request on purpose (a 401 from
# wrong credentials), so the rig must not read that as a SILENT failure. SILENT
# means "the screen looked right while a request failed"; here the failing
# request IS the subject.
# Register with an email that already exists — shows error

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- waitForAnimationToEnd
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- waitForAnimationToEnd
- assertVisible: "Create Account"
# Fill with an existing email
- tapOn: "First Name"
- inputText: "Ahmad"
- tapOn: "Last Name"
- inputText: "Test"
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
# "Confirm Password" is the LAST field on the register form, so it is below the
# fold once the keyboard is up from the fields above it. `tapOn` does not scroll.
- scrollUntilVisible:
    element:
      text: "Confirm Password"
    direction: DOWN
    timeout: 20000
- tapOn: "Confirm Password"
- inputText: "Password123!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
- waitForAnimationToEnd
# Server returns 422 — error shown
- assertVisible: "Email has already been taken"
