appId: com.hatiwal.app
---
# Deep login: verify session data on profile, logout, re-login, same data shown

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- waitForAnimationToEnd
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Sign In"
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Bazaar"

# Verify profile data populated
- tapOn: "Me"
- waitForAnimationToEnd
# NOT "Profile": `profile.title` is a dead key, rendered nowhere (the screen shows
# the user's name). "Edit" (common.edit) is a real control on the profile screen.
- assertVisible: "Edit"
# User name shown (Ahmad Karimi from seed data)
- assertVisible: "Ahmad"

# Logout
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign Out"
- waitForAnimationToEnd
- assertVisible: "Are you sure you want to sign out?"
# "Sign Out" (profile.logout) is at the BOTTOM of the profile screen, below the
# stats, quick actions and settings rows — so it needs a scroll. `tapOn` and
# `assertVisible` do not scroll to their target.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign Out"
- waitForAnimationToEnd
- assertVisible: "Welcome to Hatiwal"

# Re-login
- tapOn: "Sign In"
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Bazaar"

# Profile data still there on second login
- tapOn: "Me"
- waitForAnimationToEnd
- assertVisible: "Ahmad"
