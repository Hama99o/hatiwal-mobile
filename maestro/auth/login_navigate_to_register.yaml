appId: com.hatiwal.app
---
# From login screen: tap "Create account" → lands on register screen

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- waitForAnimationToEnd
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Sign In"
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so no exact-match selector on either casing can find it. (This flow
# used a lowercase "a", which is why the earlier sweep for the exact string
# missed it.)
- tapOn:
    id: "go-to-register"
- waitForAnimationToEnd
- assertVisible: "Create Account"
- assertVisible: "Already have an account?"
