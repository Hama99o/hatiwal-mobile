appId: com.hatiwal.app
---
# Guest can browse without logging in

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Continue browsing"
- assertVisible: "Bazaar"
# Can tap a listing
- tapOn:
    text: "Bazaar"
- assertVisible: "Bazaar"
