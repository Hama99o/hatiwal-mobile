appId: com.hatiwal.app
---
# Guest taps save heart → redirected to login → logs in → listing is saved

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Continue browsing"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
# Tap a listing to open detail
- tapOn:
    index: 0
    text: "Bazaar"
- waitForAnimationToEnd
# Tap the save heart as a guest — should redirect to login
- tapOn:
    id: "save-button"
- waitForAnimationToEnd
- assertVisible: "Sign In"
# Complete login
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- waitForAnimationToEnd
# Back on listing — listing is now saved
- assertVisible: "Saved"
