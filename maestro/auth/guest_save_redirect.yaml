appId: com.hatiwal.app
---
# Guest taps save heart → redirected to login → logs in → listing is saved

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml

# ── Blank-screen recovery (this flow only) ──────────────────────────────────
# `clearState: true` erases the dev client's remembered Metro URL, and
# reconnecting sometimes leaves a blank white screen — logcat shows
# `DevLauncherActivity EXITING` with a DeadObjectException. One warm relaunch
# fixes it; the dev client remembers the server by then.
#
# It lives HERE and not in open_bundle.yaml because Maestro's `launchApp` GRANTS
# ALL RUNTIME PERMISSIONS by default, with no "leave them alone" option. In the
# shared helper it granted location to every flow and broke the two whose whole
# subject is the permission PROMPT. This flow does not care about permissions.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - launchApp
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: "Skip|Bazaar|Me|Email|Buy and sell locally in Afghanistan"
          timeout: 120000
- runFlow: ../_helpers/goto_login.yaml
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
# By testID: this chip's label is localized and was renamed to "Go to Bazaar",
# so tapping the old text would miss.
- tapOn:
    id: "go-to-bazaar"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
# Tap a listing to open detail
- tapOn:
    index: 0
    text: "Bazaar"
- waitForAnimationToEnd
# OPEN A LISTING FIRST. The heart is a listing-DETAIL control and the step above
# only taps the Bazaar TAB, so this was looking for it on the FEED — hence
# `Element not found: save-toggle-button` on an app that renders it fine.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# Tap the save heart as a guest — should redirect to login
- tapOn:
    # The heart on listing detail is `save-toggle-button` — added when this
    # class of failure was traced (its label is localized AND flips on isSaved,
    # so a testID is the only stable handle). `save-button` never existed.
    id: "save-toggle-button"
- waitForAnimationToEnd
- assertVisible: "Sign In"
# Complete login
- tapOn:
    id: "login-email-input"
- inputText: "buyer@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
# Back on listing — listing is now saved
# What the app ACTUALLY does, verified in source: `useRequireAuth` sends the guest
# to login with a `returnTo`, and `returnTo` is only used for router.replace back
# to the ROUTE — the pending action is never replayed. So after signing in we are
# back on the listing and it is NOT saved. Asserting "Saved" here asserted
# behaviour that does not exist, and "Saved" is also the tab-bar label, so it
# could pass for the wrong reason on any screen showing the tabs.
#
# Assert the real contract instead: returnTo landed us back on the listing, the
# save did NOT happen, and saving now works. If the app is ever changed to replay
# the pending action, this fails loudly and gets updated deliberately — see UI-044.
- assertVisible: "Wool Blanket Handmade King Size"
# The pending intent is REPLAYED now (UI-044 implemented). The guest tapped save,
# was sent to login, and coming back the save actually happens — so the toggle
# already reads "Remove from saved" without tapping anything.
#
# This flow previously asserted the opposite ("Save listing", i.e. the tap was
# dropped) and said it would fail loudly if the behaviour was ever changed
# deliberately. It was, so this is that update.
- extendedWaitUntil:
    visible: "Remove from saved"
    timeout: 15000
# And it fired exactly once: a double replay would toggle the save back off.
- assertNotVisible: "Save listing"
