appId: com.hatiwal.app
---
# Validation: required fields, password mismatch

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Create Account"

# Submit empty form
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
- tapOn:
    id: "register-submit"
- assertVisible: "is required"

# Fill first + last name only, submit — still missing email/password
- tapOn: "First Name"
- inputText: "Ahmad"
- tapOn: "Last Name"
- inputText: "Karimi"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
- tapOn:
    id: "register-submit"
- assertVisible: "is required"

# Fill email + mismatched passwords
- tapOn: "Email"
- inputText: "test@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Confirm Password"
- inputText: "DifferentPass!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
- tapOn:
    id: "register-submit"
- assertVisible: "Passwords do not match"
