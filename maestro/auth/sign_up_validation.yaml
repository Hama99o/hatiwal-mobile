appId: com.hatiwal.app
---
# Validation: required fields, password mismatch

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
# The login screen renders this as ONE Text — "Don't have an account? Create
# Account" — so an exact-match selector on "Create Account" can never find it.
- tapOn:
    id: "go-to-register"
- assertVisible: "Create Account"

# Submit empty form
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
# Blur to drop the IME before scrolling to the button. NOT hideKeyboard (that is
# BACK on Android) and NOT a scroll on its own: scrollUntilVisible's swipe starts
# in the lower half of the screen, lands ON the keyboard, and scrolls nothing —
# which is why this failed with "No visible element found: id: register-submit"
# on a button that plainly exists. The subtitle is a plain Text at the top of the
# form and unique on the screen, so tapping it only blurs.
- tapOn: "Buy and sell locally in Afghanistan"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "register-submit"
# Register builds each message as `t("auth.firstName") + " " + t("common.required")`
# -> "First Name is required". Maestro matches the WHOLE string, so the bare
# fragment never matched. `.*` on both sides makes it the substring check intended.
- assertVisible: ".*is required.*"

# Fill first + last name only, submit — still missing email/password
- tapOn:
    id: "register-firstname-input"
- inputText: "Ahmad"
- tapOn:
    id: "register-lastname-input"
- inputText: "Karimi"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
# Blur to drop the IME before scrolling to the button. NOT hideKeyboard (that is
# BACK on Android) and NOT a scroll on its own: scrollUntilVisible's swipe starts
# in the lower half of the screen, lands ON the keyboard, and scrolls nothing —
# which is why this failed with "No visible element found: id: register-submit"
# on a button that plainly exists. The subtitle is a plain Text at the top of the
# form and unique on the screen, so tapping it only blurs.
- tapOn: "Buy and sell locally in Afghanistan"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
# Register builds each message as `t("auth.firstName") + " " + t("common.required")`
# -> "First Name is required". Maestro matches the WHOLE string, so the bare
# fragment never matched. `.*` on both sides makes it the substring check intended.
- assertVisible: ".*is required.*"

# Fill email + mismatched passwords
- tapOn:
    id: "register-email-input"
- inputText: "test@hatiwal.test"
- tapOn:
    id: "register-password-input"
- inputText: "Password123!"
# "Confirm Password" is the LAST field on the register form, so it is below the
# fold once the keyboard is up from the fields above it. `tapOn` does not scroll.
- scrollUntilVisible:
    element:
      id: "register-confirm-password-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "register-confirm-password-input"
- inputText: "DifferentPass!"
# The submit button, by testID: "Create Account" is also the screen HEADING,
# so the words alone match two elements.
# Scroll to it: the register form is first name, last name, phone, email,
# password and confirm password before the button, and the IME is up from the
# field just typed. `tapOn` never scrolls, so it failed with "Element not found:
# Id matching regex: register-submit" on a button that exists and is in the
# bundle — just below the fold.
# Blur to drop the IME before scrolling to the button. NOT hideKeyboard (that is
# BACK on Android) and NOT a scroll on its own: scrollUntilVisible's swipe starts
# in the lower half of the screen, lands ON the keyboard, and scrolls nothing —
# which is why this failed with "No visible element found: id: register-submit"
# on a button that plainly exists. The subtitle is a plain Text at the top of the
# form and unique on the screen, so tapping it only blurs.
- tapOn: "Buy and sell locally in Afghanistan"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
    timeout: 20000
# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
# Wildcards for the BULLET. Register is the ONLY screen that bullets its errors
# — `<Text>{"• "}{msg}</Text>` — so the node reads "• Passwords do not match" and
# Maestro's anchored regex cannot match the bare literal. Same cause as
# register_duplicate_email; my fix there was scoped to that one assertion.
#
# Checked the other validation assertions in the suite (Title/Location/First name
# is required): those screens render plain inline errors with no bullet, so their
# bare literals are correct and were left alone.
- assertVisible: ".*Passwords do not match.*"
