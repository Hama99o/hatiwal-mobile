appId: com.hatiwal.app
---
# Session persists: login, background app, reopen — still logged in (no re-login required)

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- waitForAnimationToEnd
- assertVisible: "Welcome to Hatiwal"
- tapOn: "Sign In"
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "buyer@hatiwal.test"
- tapOn: "Password"
- inputText: "Password123!"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "Bazaar"

# Background and reopen without clearing state
- launchApp:
    clearState: false
- waitForAnimationToEnd

# Should land on Bazaar, not Welcome/Login
- assertVisible: "Bazaar"
- assertNotVisible: "Welcome to Hatiwal"
- assertNotVisible: "Sign In"
