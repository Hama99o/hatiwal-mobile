appId: com.hatiwal.app
---
# Login with empty email and password — validation messages shown
#
# The Sign In button has no client-side empty-field guard (Login.tsx only
# disables it while `loading`), so tapping it with blank fields submits the
# request; the backend's devise_token_auth rejects it exactly like a wrong
# password would (`bad_credentials: "Invalid login credentials. Please try
# again."` — see devise_token_auth's config/locales/en.yml), and Login.tsx
# renders that string verbatim. Review fix: the previous `anyOf: ["Email",
# "Invalid email or password", "error"]` both used a YAML property
# (`anyOf`) that doesn't exist on `assertVisible` in this Maestro version
# (2.7.0 exits 1 with "Unknown Property: anyOf") AND, even syntax-fixed,
# would never have matched the real backend copy — "Email" (the field
# label, always on screen) and the "error" substring were silently carrying
# every prior run.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- waitForAnimationToEnd
# NOT "Welcome to Hatiwal": the onboarding carousel's FIRST SLIDE and the login
# screen both render that exact heading (onboarding.slides.welcome.title and
# auth.welcome), so asserting it cannot tell the two apart — a flow could pass
# this line while sitting on onboarding and then fail on the next one.
# auth.subtitle appears on the login screen only.
#
# extendedWaitUntil, not assertVisible: after `clearState` the dev client
# re-fetches the JS bundle, and a bare assert can fire before the first screen
# has rendered at all. guest_browse failed exactly that way after passing minutes
# earlier — neither screen was up yet.
- extendedWaitUntil:
    visible: "Buy and sell locally in Afghanistan"
    timeout: 60000
- tapOn: "Sign In"
- waitForAnimationToEnd
# Submit empty form
- tapOn: "Sign In"
- waitForAnimationToEnd
# The app now VALIDATES before sending. Submitting empty fields used to POST to
# /auth/sign_in and render the API's "Invalid login credentials. Please try
# again." — wrong on the facts (nothing was invalid; the fields were empty) and a
# wasted round-trip. This flow passed while logcat showed two 401s, which is the
# SILENT class the rig exists to catch: green assertions over a failing request.
#
# Register.tsx already validated its required fields as "<field> is required";
# Login now matches. The `.*` covers both fields being reported together.
- assertVisible: "Email is required.*"
