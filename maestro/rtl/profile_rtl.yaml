appId: com.hatiwal.app
---
# Profile screen in RTL (Dari) — all buttons/labels visible, layout mirrored

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*دری.*"
- waitForAnimationToEnd
# Profile tab should show Dari labels
# The profile tab by testID. The Pashto label is "زه" and the Dari one differs
# again; the testID is identical in all three locales, which is why it exists.
# `index: 4` matched the fifth element on screen, not the fifth tab.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Profile SCREEN HEADER in Dari (profile.title key — unchanged)
- assertVisible: "پروفایل"
# Edit profile
- assertVisible: "ویرایش پروفایل"
# Appearance
- assertVisible: "ظاهر"
# Sign out
- assertVisible: "خروج"
# Reset to English
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*(English|انګلیسي|انگلیسی).*"
- waitForAnimationToEnd
