appId: com.hatiwal.app
---
# Profile screen in RTL (Dari) — all buttons/labels visible, layout mirrored

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-fa"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
# Profile tab should show Dari labels
# The profile tab by testID. The Pashto label is "زه" and the Dari one differs
# again; the testID is identical in all three locales, which is why it exists.
# `index: 4` matched the fifth element on screen, not the fifth tab.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# `profile.title` is defined in every locale and RENDERED NOWHERE — grep for
# t("profile.title") returns nothing, so this "screen header" does not exist and the
# assertion could never pass in any language. `profile.info` (the PERSONAL INFO card
# heading) IS rendered and IS translated, so it proves the same thing.
- scrollUntilVisible:
    element:
      text: "اطلاعات شخصی"
    direction: DOWN
    timeout: 20000
# Edit profile
# The edit BUTTON in the card we just scrolled to — not "ویرایش پروفایل".
#
# That string is fa `profile.editProfile`, which is the AVATAR's
# accessibilityLabel up in the hero header. This flow scrolls DOWN to the
# PERSONAL INFO card first, so by then the avatar is off screen and the assertion
# fails on an app that is rendering Dari perfectly. Profile.tsx documents exactly
# this trap ("the avatar carries accessibilityLabel 'Edit Profile', so a flow
# selecting that text hits the avatar").
#
# Asserting BOTH keeps the locale check honest: the testID proves the control is
# on screen, and fa `common.edit` proves it is rendering in Dari rather than
# English.
- assertVisible:
    id: "profile-edit-button"
- assertVisible: "ویرایش"
# Appearance
# Appearance sits well down the profile screen and `assertVisible` does not scroll.
- scrollUntilVisible:
    element:
      text: "ظاهر"
    direction: DOWN
    timeout: 20000
# Sign out
# Sign out sits well down the profile screen and `assertVisible` does not scroll.
- scrollUntilVisible:
    element:
      text: "خروج"
    direction: DOWN
    timeout: 20000
# Reset to English
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
