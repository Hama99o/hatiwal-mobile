appId: com.hatiwal.app
---
# RTL verification: Dari — Bazaar renders correctly

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- scrollUntilVisible:
    text: "LANGUAGE"
- tapOn: "Dari (دری)"
- waitForAnimationToEnd
# Navigate to Bazaar tab (Dari label is "بازار")
- tapOn:
    text: "بازار"
    optional: true
- waitForAnimationToEnd
- assertVisible: "دری"
- waitForAnimationToEnd
