appId: com.hatiwal.app
---
# Listing detail in RTL (Pashto) — all elements visible, layout correct

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
# Tabs by testID, not by index. A bare `index:` has NO selector — it matches
# every element on screen and index N is whatever lands there in hierarchy
# order, not the Nth tab. These flows used it as a "fallback" because the tab
# labels are in Pashto here, which is exactly what the tab testIDs are for:
# they are identical in all three locales.
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The feed card by its testID rather than index 0 of everything on screen.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Core elements visible in Pashto
# The app renders `listing.detail.contactSeller`, whose Pashto value is
# "پلورونکي سره اړیکه". The string asserted before had the leading "د " because it
# came from `browse.startChat` — a DEAD key that nothing references, whose English
# value is identical ("Contact Seller") but whose Pashto translation diverged. So this
# assertion could only ever fail, and only in Pashto: in English and Dari the two keys
# hold the same string, so no other flow noticed.
- assertVisible: "پلورونکي سره اړیکه"
# Scroll to see seller section
- scroll
- waitForAnimationToEnd
# Reset to English
- back
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
