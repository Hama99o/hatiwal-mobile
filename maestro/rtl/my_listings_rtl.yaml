appId: com.hatiwal.app
---
# My Shop in RTL (Pashto) — cards mirrored, action buttons readable

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
# Tabs by testID, not by index. A bare `index:` has NO selector — it matches
# every element on screen and index N is whatever lands there in hierarchy
# order, not the Nth tab. These flows used it as a "fallback" because the tab
# labels are in Pashto here, which is exactly what the tab testIDs are for:
# they are identical in all three locales.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# run-266 F11 / run-267: this used to TAP "switch to SELLER mode"
# ("د پلورونکي حالت ته لاړ شئ") — an action that can only exist when the account
# is in BUYER mode. `login_seller.yaml` above already guarantees seller mode (it
# asserts "Switch to Buyer Mode" as its own last step, and the language switch
# does not change mode), so that tap could never match and the flow could never
# reach the screen it exists to look at.
#
# Replaced with the positive assertion of the same premise, in Pashto: the
# toggle now OFFERS buyer mode, i.e. we are in seller mode. That is the
# precondition the rest of this flow needs, stated rather than performed.
# ps profile.switchToBuyer — taken from the device, not the locale file.
- extendedWaitUntil:
    visible: "د اخیستونکي حالت ته لاړ شئ"
    timeout: 30000
# My Shop is the FIRST tab in seller mode — the same route and testID as Bazaar
# in buyer mode, only relabelled. It was never tab index 3.
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Pashto screen header for My Listings
# ps sidebar.myListings is "زما هټۍ" ("my shop"), not "زما توکي" ("my items").
- assertVisible: "زما هټۍ"
# Cards render without crash
- scroll
- waitForAnimationToEnd
# Reset to English
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
