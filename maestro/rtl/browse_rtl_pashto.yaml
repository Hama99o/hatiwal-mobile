appId: com.hatiwal.app
---
# RTL verification: Pashto — Browse renders correctly, no overflow

- runFlow: ../_helpers/login.yaml
- tapOn: "Profile"
- scrollUntilVisible:
    text: "LANGUAGE"
- tapOn: "Pashto (پښتو)"
- waitForAnimationToEnd
# Navigate to Browse
- tapOn:
    text: "Browse"
    optional: true
- waitForAnimationToEnd
# App should be in RTL layout — Maestro can verify elements exist
# but visual RTL correctness requires manual screenshot review
- assertVisible: "پښتو"
- waitForAnimationToEnd
# Listings are still visible
- assertVisible:
    text: "Browse"
    optional: true
