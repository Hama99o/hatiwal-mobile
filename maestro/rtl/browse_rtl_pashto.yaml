appId: com.hatiwal.app
---
# RTL verification: Pashto — Bazaar renders correctly, no overflow

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- scrollUntilVisible:
    element:
      text: "Language"
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
# Navigate to Bazaar tab (Pashto label is "بازار")
- tapOn:
    text: "بازار"
    optional: true
- waitForAnimationToEnd
# App should be in RTL layout — Maestro can verify elements exist
# but visual RTL correctness requires manual screenshot review
# The language NAME lives on the Profile screen's language row, and this flow has
# just switched language — which RESTARTS the app (forceRTL + reloadApp) onto the
# feed — and then navigated to Bazaar. So "پښتو" was never going to be on screen.
#
# Assert the locale-specific TAB label instead: it is in the tab bar wherever the app
# lands, it changes with the locale, and `sidebar.profile` differs between Pashto
# ("زه") and Dari ("من"), so it proves WHICH language is active — which "بازار",
# identical in both, cannot.
- extendedWaitUntil:
    visible: "زه"
    timeout: 40000
- waitForAnimationToEnd
# Listings are still visible (Pashto Bazaar label "بازار")
- assertVisible:
    text: "بازار"

# ── Category chip row must open on its FIRST chip ────────────────────────────
# This is the bug the user reported from a screenshot, and nothing here caught it:
# a horizontal scroller is already laid out right-to-left under RTL, so a
# `row-reverse` on its contentContainerStyle flipped it BACK — the first chip
# ("ټول") landed at the far edge and the row opened mid-list, visibly clipped.
# Fixed in nine scrollers (see the rtl commit), and now guarded: if the first
# chip is off-screen when the feed opens, this fails.
- tapOn:
    text: "بازار"
    optional: true
- waitForAnimationToEnd
- assertVisible: "ټول"
