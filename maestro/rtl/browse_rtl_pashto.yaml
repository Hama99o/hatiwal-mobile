appId: com.hatiwal.app
---
# RTL verification: Pashto — Bazaar renders correctly, no overflow

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- scrollUntilVisible:
    element:
      text: "Language"
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*پښتو.*"
- waitForAnimationToEnd
# Navigate to Bazaar tab (Pashto label is "بازار")
- tapOn:
    text: "بازار"
    optional: true
- waitForAnimationToEnd
# App should be in RTL layout — Maestro can verify elements exist
# but visual RTL correctness requires manual screenshot review
- assertVisible: "پښتو"
- waitForAnimationToEnd
# Listings are still visible (Pashto Bazaar label "بازار")
- assertVisible:
    text: "بازار"
    optional: true
