appId: com.hatiwal.app
---
# Profile quick action cards in RTL (Pashto) — verifies icon+label+badge mirror correctly
# for both buyer-mode single-column actions and the seller side-by-side row.

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Switch to Pashto to trigger RTL
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml

# Navigate back to profile tab (Pashto tab label "زه", use index as fallback)
# The profile tab by testID. The Pashto label is "زه" and the Dari one differs
# again; the testID is identical in all three locales, which is why it exists.
# `index: 4` matched the fifth element on screen, not the fifth tab.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Pashto profile SCREEN HEADER visible (profile.title key — unchanged)
# `profile.title` is defined in every locale and RENDERED NOWHERE — grep for
# t("profile.title") returns nothing, so this "screen header" does not exist and the
# assertion could never pass in any language. `profile.info` (the PERSONAL INFO card
# heading) IS rendered and IS translated, so it proves the same thing.
# ORDER MATTERS HERE.
#
# The quick-action rows sit ABOVE the PERSONAL INFO card (Profile renders hero ->
# stats -> quick actions -> personal info), so they must be asserted while the
# screen is still at its cold-start offset. Scrolling DOWN to PERSONAL INFO first
# and then asserting them — which is what this flow used to do — asserts rows
# that the scroll has just pushed off the top.

# --- Buyer-mode RTL quick actions ---
# Buyer mode is the default; verify the three single-column action rows are visible
# These are profile quick-action labels (separate i18n keys, not sidebar tab labels)
# SCROLL to each label. There are FOUR quick-action rows and they follow the
# hero header and the stats grid, so even at 411dp the lower ones are below the
# fold — this failed on the third (`Assertion is false: "پیغامونه" is visible`)
# with the first two found. The rows render correctly in Pashto; they simply do
# not all fit at once.
#
# Asserting each after a scroll still proves what this flow is for: that these
# labels render in Pashto rather than English.
- scrollUntilVisible:
    element:
      text: "اعلانونه لټول"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "خوندي اعلانونه"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "پیغامونه"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000

# NOW scroll down — the Pashto section header is the thing this proves.
- scrollUntilVisible:
    element:
      text: "شخصي معلومات"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000

# --- Switch to seller mode and verify seller side-by-side row in RTL ---
# The mode toggle sits just under the avatar at the TOP of Profile, so scroll UP
# to it before tapping — `mapqa/_body_form.yaml` documents the same thing. This
# flow failed with `Element not found: Text matching regex: د پلورونکي حالت ته لاړ شئ`
# after the scroll above had left it off the top of the screen.
#
# Scroll AND tap by testID only. Do NOT assert this control's label.
#
# Profile.tsx says so directly: buyer/seller mode is persisted on the USER and
# leaks across flows, so "targeting this control by its label means matching
# the mode you are trying to detect, and the label is translated on top of
# that — hence a stable handle". Asserting the Pashto label reintroduced that
# fragility and failed with `Element not found` while the screenshot showed the
# app rendering Pashto perfectly. This flow already proves the locale through
# the quick-action labels it asserts above.
- scrollUntilVisible:
    element:
      id: "mode-toggle-button"
    direction: UP
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "mode-toggle-button"
- waitForAnimationToEnd

# Navigate back to profile tab to see seller content
# The profile tab by testID. The Pashto label is "زه" and the Dari one differs
# again; the testID is identical in all three locales, which is why it exists.
# `index: 4` matched the fifth element on screen, not the fifth tab.
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd

# Seller quick-action labels visible in Pashto
# "My Listings" and "Messages" appear as a side-by-side row
# whose container is now flexDirection:row-reverse (RTL fix applied)
# These are profile quick-action labels, not sidebar tab labels
# ANCHOR THE SCROLL FIRST. Re-entering Profile after the mode switch keeps
# whatever offset it had, and by this point the flow has scrolled down to
# PERSONAL INFO and back up to the toggle — so a bare DOWN scroll can start below
# the quick actions and travel away from them. That is how this failed with
# `No visible element found: "زما اعلانونه"` on a screen that was rendering the
# seller quick actions correctly.
#
# mode-toggle-button sits at the very top, so scrolling UP to it puts the list at
# a known position before the DOWN scrolls below.
# ...AND MATCH IT AS A PREFIX, because the app renders a COUNT after this one
# label and Maestro anchors its text regexes to the WHOLE string:
#   Profile.tsx:306  label={`${t("profile.quickActions.myListings")} (${count})`}
# so the on-screen text is "زما اعلانونه (0)" and the bare label matched nothing.
# The anchor scroll above was NOT the fix and the mode switch was never at fault:
# run-379's failure screenshot shows Profile in seller mode (green tab bar, three
# tabs, `saved-tab` gone) with `buyer.seller_mode = true` in the DB, i.e. the
# quick actions WERE rendering while this step scrolled past them to the bottom
# hunting for a string that cannot exist. The three sibling labels here carry no
# suffix, which is why only this row ever failed.
- scrollUntilVisible:
    element:
      id: "mode-toggle-button"
    direction: UP
    visibilityPercentage: 40
    timeout: 20000

# Same again for the seller-mode set — four rows, one screen.
- scrollUntilVisible:
    element:
      text: "زما اعلانونه.*"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "پیغامونه"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "نوی اعلان پوسٹ کړئ"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 20000

# Switch back to buyer mode
# The mode toggle sits just under the avatar at the TOP of Profile, so scroll UP
# to it before tapping — `mapqa/_body_form.yaml` documents the same thing. This
# flow failed with `Element not found: Text matching regex: د اخیستونکي حالت ته لاړ شئ`
# after the scroll above had left it off the top of the screen.
#
# Scroll AND tap by testID only. Do NOT assert this control's label.
#
# Profile.tsx says so directly: buyer/seller mode is persisted on the USER and
# leaks across flows, so "targeting this control by its label means matching
# the mode you are trying to detect, and the label is translated on top of
# that — hence a stable handle". Asserting the Pashto label reintroduced that
# fragility and failed with `Element not found` while the screenshot showed the
# app rendering Pashto perfectly. This flow already proves the locale through
# the quick-action labels it asserts above.
- scrollUntilVisible:
    element:
      id: "mode-toggle-button"
    direction: UP
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "mode-toggle-button"
- waitForAnimationToEnd

# Reset to English
# The option list is COLLAPSED on mount and its row is below the fold, so
# tapping an option straight away could never work — the helper scrolls to the
# row and expands it first.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-en"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml
