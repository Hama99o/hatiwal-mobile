appId: com.hatiwal.app
---
# Categories hub — RTL layout check with Pashto language

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"

# Switch to Pashto to enable RTL
- tapOn:
    text: "Me"
- waitForAnimationToEnd
# NOT a bare `tapOn: "Language"`: that row is in the Preferences card near the
# bottom of Profile and `tapOn` never scrolls, so it failed with `Element not
# found: Language` on a screen that renders it perfectly. The helper scrolls to
# the row and expands the collapsed option list, and it is idempotent — safe when
# a later step opens the picker again.
- runFlow: ../_helpers/open_language_picker.yaml
- tapOn:
    id: "language-option-ps"
- waitForAnimationToEnd
# The switch restarts the app when the direction flips; wait for it to come back
# before touching anything. A no-op when it did not restart.
- runFlow: ../_helpers/await_language_restart.yaml

# Navigate back to Browse tab
- tapOn:
    text: "بازار"
- waitForAnimationToEnd

# Open the categories hub via the grid-icon affordance
# The categories TAB by id. "ډلې وګورئ" is `browse.browseCategories`, a DEAD key —
# it exists in all three locale files and no screen renders it, so this tap could
# never land. browse/categories_hub.yaml already uses this id.
- tapOn:
    id: "categories-tab"
- waitForAnimationToEnd

# Hub title in Pashto
- assertVisible: "ډلې"

# Category cards should render localized names
- assertVisible: "برقی وسایل"

# Back button returns to Browse
- tapOn:
    text: "Back"
- waitForAnimationToEnd
- assertVisible: "بازار"
