appId: com.hatiwal.app
---
# Categories hub — RTL layout check with Pashto language

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"

# Switch to Pashto to enable RTL
- tapOn:
    text: "Me"
- waitForAnimationToEnd
- tapOn: "Language"
- waitForAnimationToEnd
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*پښتو.*"
- waitForAnimationToEnd

# Navigate back to Browse tab
- tapOn:
    text: "بازار"
- waitForAnimationToEnd

# Open the categories hub via the grid-icon affordance
- tapOn:
    text: "ډلې وګورئ"
- waitForAnimationToEnd

# Hub title in Pashto
- assertVisible: "ډلې"

# Category cards should render localized names
- assertVisible: "برقی وسایل"

# Back button returns to Browse
- tapOn:
    text: "Back"
- waitForAnimationToEnd
- assertVisible: "بازار"
