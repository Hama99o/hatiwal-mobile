appId: com.hatiwal.app
---
# Chat in RTL (Pashto) — messages, input, send button in correct RTL order

- runFlow: ../_helpers/login.yaml
- tapOn: "Me"
- waitForAnimationToEnd
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*پښتو.*"
- waitForAnimationToEnd
# Tabs by testID, not by index. A bare `index:` has NO selector — it matches
# every element on screen and index N is whatever lands there in hierarchy
# order, not the Nth tab. These flows used it as a "fallback" because the tab
# labels are in Pashto here, which is exactly what the tab testIDs are for:
# they are identical in all three locales.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# The conversation row by its own id — `conversation-row-<db id>` — rather than
# index 0 of everything on screen.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# Message input and send button visible
- assertVisible: "پیغام ولیکئ..."
# Send a message in RTL
- tapOn: "پیغام ولیکئ..."
- inputText: "سلام، آیا دا شتون لري؟"
- tapOn: "لیږل"
- waitForAnimationToEnd
# Reset to English
- back
- waitForAnimationToEnd
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
# Language options are labelled in the CURRENT language, so the same option reads
# "Pashto (پښتو)" from English, "پښتو" from Pashto and "پشتو (پښتو)" from Dari —
# and Maestro matches the FULL string. A fixed label therefore only works from
# one starting locale, and these flows cannot know which one the previous flow
# left behind. The regex matches every form.
- tapOn: ".*(English|انګلیسي|انگلیسی).*"
- waitForAnimationToEnd
