appId: com.hatiwal.app
---
# Filter listings by "Active sellers" chip (seller_active_days=7)
# Happy path: toggle on, results update, toggle off, results clear

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open filter sheet
# The filters TOGGLE by testID. "Filters" is both `browse.filtersToggle` (the
# control) and `browse.filters.title` (the sheet heading it opens), so a text
# tap can hit the heading of an already-open sheet and do nothing.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd

# Scroll down to the Active sellers section if needed
- scrollUntilVisible:
    element: "Active sellers"
    direction: DOWN

# Tap chip — should highlight (active state)
- tapOn: "Active sellers"
- waitForAnimationToEnd
- assertVisible: "Active sellers"

# Close filter sheet and confirm feed reloaded
- tapOn: "Show results"
- waitForAnimationToEnd
- assertVisible: "Bazaar"

# Reopen and toggle chip off
# The filters TOGGLE by testID. "Filters" is both `browse.filtersToggle` (the
# control) and `browse.filters.title` (the sheet heading it opens), so a text
# tap can hit the heading of an already-open sheet and do nothing.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Active sellers"
    direction: DOWN
- tapOn: "Active sellers"
- waitForAnimationToEnd

# Reset all filters via the sheet's footer and confirm clean state
- tapOn: "Clear all"
- waitForAnimationToEnd
- tapOn: "Show results"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
