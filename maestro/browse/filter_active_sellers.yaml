appId: com.hatiwal.app
---
# Filter listings by "Active sellers" chip (seller_active_days=7)
# Happy path: toggle on, results update, toggle off, results clear

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open filter panel
- tapOn: "Filters"
- waitForAnimationToEnd

# Scroll down to the Active sellers section if needed
- scrollUntilVisible:
    element: "Active sellers"
    direction: DOWN

# Tap chip — should highlight (active state)
- tapOn: "Active sellers"
- waitForAnimationToEnd
- assertVisible: "Active sellers"

# Close filter panel and confirm feed reloaded
- tapOn: "Filters"
- waitForAnimationToEnd
- assertVisible: "Bazaar"

# Reopen and toggle chip off
- tapOn: "Filters"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Active sellers"
    direction: DOWN
- tapOn: "Active sellers"
- waitForAnimationToEnd

# Reset all filters and confirm clean state
- tapOn: "Reset filters"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
