appId: com.hatiwal.app
---
# Filter by category — the category chip row stays visible/reachable
# regardless of the filter sheet's open state; selection filters the feed.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
# Open filter sheet, confirm the always-visible category row underneath is untouched
- tapOn: "Filters"
- waitForAnimationToEnd
- assertVisible: "All Categories"
# Close the sheet — the category chip row lives outside it
- tapOn: "Show results"
- waitForAnimationToEnd
# Select a category (Electronics is common — adjust if seeded differently)
- tapOn: "Electronics"
- waitForAnimationToEnd
# Category chip is shown as active
- assertVisible: "Electronics"
# Clear filter — full feed returns
- tapOn: "All"
- waitForAnimationToEnd
