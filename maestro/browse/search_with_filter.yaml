appId: com.hatiwal.app
---
# Search for a term then apply a condition filter on top — both active simultaneously

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Type a search term
- tapOn: "Search listings..."
- inputText: "phone"
- waitForAnimationToEnd
# lint: anchored-ok — the query typed into the search box, whose node text IS exactly this
- assertVisible: "phone"
# Now apply a condition filter on top of the search
# NOT "Filter" (`common.filter`, a dead key). The control renders "Filters", and
# Maestro matches the full string, so "Filter" never matched it. The testID from
# BrowseHeader.tsx is immune to both the plural and the locale.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Good"
# The filter sheet's confirm button is `browse.filters.apply` = "Show results".
- tapOn: "Show results"
- waitForAnimationToEnd
# Both search term and condition filter are active
# lint: anchored-ok — the query typed into the search box, whose node text IS exactly this
- assertVisible: "phone"
# The CONDITION does not appear on the feed. Only the category renders as a
# removable chip there; condition lives inside the filter sheet. What the feed
# shows is the count pill, `browse.filtersActive` — and search + condition is two,
# so assert that instead of "Good", which is behind the closed sheet.
- assertVisible: ".*2 filters active.*"
# Results reflect both — no "New" condition items visible
- assertNotVisible: "Brand New"
# Clear the condition filter — reopen the sheet, since "Good" is only in there.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Good"
- waitForAnimationToEnd
- tapOn: "Show results"
- waitForAnimationToEnd
# Search survives on its own: one filter left, and the term still in the box.
# lint: anchored-ok — the query typed into the search box, whose node text IS exactly this
- assertVisible: "phone"
- assertVisible: ".*1 filter active.*"
# Clear search — back to full browse
- eraseText
- waitForAnimationToEnd
