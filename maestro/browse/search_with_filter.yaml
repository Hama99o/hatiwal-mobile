appId: com.hatiwal.app
---
# Search for a term then apply a condition filter on top — both active simultaneously

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Type a search term
- tapOn: "Search listings..."
- inputText: "phone"
- waitForAnimationToEnd
- assertVisible: "phone"
# Now apply a condition filter on top of the search
# NOT "Filter" (`common.filter`, a dead key). The control renders "Filters", and
# Maestro matches the full string, so "Filter" never matched it. The testID from
# BrowseHeader.tsx is immune to both the plural and the locale.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Good"
# The filter sheet's confirm button is `browse.filters.apply` = "Show results".
- tapOn: "Show results"
- waitForAnimationToEnd
# Both search term and condition filter are active
- assertVisible: "phone"
- assertVisible: "Good"
# Results reflect both — no "New" condition items visible
- assertNotVisible: "Brand New"
# Clear condition filter — search results remain
- tapOn: "Good"
- waitForAnimationToEnd
- assertVisible: "phone"
# Clear search — back to full browse
- eraseText
- waitForAnimationToEnd
