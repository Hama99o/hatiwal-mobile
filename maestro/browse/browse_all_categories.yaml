appId: com.hatiwal.app
---
# Browse — verify all category chips load and can be tapped

- runFlow: ../_helpers/login.yaml
- assertVisible: "Browse"
- waitForAnimationToEnd
# Scroll the category chips horizontally to see all
- tapOn: "All Categories"
- waitForAnimationToEnd
# Category filter sheet opens — should list all categories
- assertVisible: "Electronics"
- assertVisible: "Clothes"
- assertVisible: "Vehicles"
# Tap a category
- tapOn: "Electronics"
- waitForAnimationToEnd
# Feed is filtered
- assertVisible: "Browse"
# Clear filter — tap "All Categories" chip or the X
- tapOn: "All Categories"
- waitForAnimationToEnd
- assertVisible: "Browse"
