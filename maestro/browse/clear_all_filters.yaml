appId: com.hatiwal.app
---
# clear_all_filters — always-visible filter summary pill
#
# Scenario: apply a price min filter (via the filter bottom-sheet) and a
# category filter (via the chip row), assert the pill shows "2 filters
# active", tap "Clear all", assert the pill disappears and the unfiltered
# Browse feed is visible again.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# ── Step 1: Open the filter sheet ───────────────────────────────────────────
- tapOn: "Filters"
- waitForAnimationToEnd

# ── Step 2: Apply a price min filter ────────────────────────────────────────
- tapOn: "Min Price"
- inputText: "5000"
- hideKeyboard

# ── Step 3: Close the filter sheet (the category chip row lives outside it) ─
- tapOn: "Show results"
- waitForAnimationToEnd

# ── Step 4: Apply a category filter via the chip row ────────────────────────
- tapOn: "Electronics"
- waitForAnimationToEnd

# ── Step 5: Assert the "filters active" pill is visible with count 2 ────────
# The pill shows "2 filters active" (en locale, _other form)
- assertVisible: "2 filters active"

# ── Step 6: Tap "Clear all" and assert the pill disappears ──────────────────
- tapOn: "Clear all"
- waitForAnimationToEnd

# Pill should be gone — no longer any filters active
- assertNotVisible: "2 filters active"
- assertNotVisible: "1 filter active"

# Feed is back to unfiltered state — Bazaar header still visible
- assertVisible: "Bazaar"
