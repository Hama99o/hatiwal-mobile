appId: com.hatiwal.app
---
# Filter listings by price range — min and max price

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open filter sheet
# The filters TOGGLE by testID. "Filters" is both `browse.filtersToggle` (the
# control) and `browse.filters.title` (the sheet heading it opens), so a text
# tap can hit the heading of an already-open sheet and do nothing.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
# Set min price
- tapOn: "Min Price"
- inputText: "10000"
# Set max price
- tapOn: "Max Price"
- inputText: "50000"
# Apply filters — closes the sheet (filters already apply live)
- tapOn: "Show results"
- waitForAnimationToEnd
# Results show (may be empty or filtered)
- assertVisible: "Bazaar"
# Reopen sheet and reset via its footer
# The filters TOGGLE by testID. "Filters" is both `browse.filtersToggle` (the
# control) and `browse.filters.title` (the sheet heading it opens), so a text
# tap can hit the heading of an already-open sheet and do nothing.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Clear all"
- waitForAnimationToEnd
- tapOn: "Show results"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
