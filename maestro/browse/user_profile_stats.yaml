appId: com.hatiwal.app
---
# Seller public profile: stats (listings count, joined date) visible to buyers

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# The seller row sits below the photo, the price, the description and the views
# chart, so it is off-screen on arrival — and `tapOn` does not scroll to reach
# its target. None of the ten flows that tap this had a scroll; on a tablet the
# hero alone takes 60% of the viewport, which makes it certain.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    # `seller-name` / `seller-identity` do not exist. The seller row on the listing
    # detail screen carries testID="seller-profile-link" (ListingDetail.tsx), which
    # is what the other seven flows already use.
    id: "seller-profile-link"
- waitForAnimationToEnd
# NOT "Seller Profile" — that is only the LOADING/ERROR header. Once the profile
# loads, HeaderBar shows the person's NAME instead (UserProfile.tsx), so asserting
# the static title is a race the loaded screen always wins. "Active Listings" is a
# literal stat label in ProfileHeader and is there for every profile.
- assertVisible: "Active Listings"

# Stats section. ProfileHeader renders exactly TWO cells: "Active Listings" and
# "Joined" (profile.userProfile.*). A bare "Listings" matches neither, and
# "Items Sold" (soldItems) is a dead key.
# NOT "Items Sold". ProfileHeader renders exactly TWO stat cells — "Active
# Listings" and "Joined". `profile.userProfile.soldItems` ("Items Sold") is a
# dead key, referenced nowhere in the app (UI-021).
- assertVisible: "Joined"
# Year present in joined date
# NOT "2024". Two independent reasons that literal could never match:
#   1. member_since is created_at.strftime("%B %Y") (user_serializer.rb) — one
#      node reading "August 2026", so an anchored full-string match on the bare
#      year fails even in the right year.
#   2. It is a hardcoded year in a flow meant to run for years. The seed creates
#      users at seed time, so the year is always "now", never a fixed value.
# Matching the SHAPE instead. Character class, not \d, so it stays valid YAML.
- assertVisible: ".*20[0-9][0-9].*"

# Message button visible (buyer can message from profile)
- assertVisible: "Message"
