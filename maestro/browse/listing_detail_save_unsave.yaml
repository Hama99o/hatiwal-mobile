appId: com.hatiwal.app
---
# Save and unsave a listing from the detail page

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards. The comment above it said "open a
# listing detail" the whole time.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
# Search instead of scrolling. This pair — scrollUntilVisible on the title, then
# tapOn that same title — is the pattern that produced "No visible element
# found: Wool Blanket Handmade King Size" while the listing was active in the database and
# the feed rendered fine. The seed now leaves ~98 listings, so every fixture
# added lengthens the scroll and a raised timeout only postpones it; search is
# O(1) in feed size. The helper also dismisses the IME before tapping and taps
# the RESULT CARD by testID, because once typed the title is also the search
# input's own text.
#
# Proven in run-496, not assumed: the helper was already wired into
# reserve_after_accept and its screenshot is the correct listing detail.
- runFlow:
    file: ../_helpers/open_listing_by_title.yaml
    env:
      TITLE: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# The assertion IS the check — "we are on the listing detail". The tap that used
# to precede it opened the FirstMessageSheet, whose own title is "Message Seller"
# (listing.detail.messageSeller), so the sheet covered the very button being
# asserted and every step after it acted on a covered screen.
- assertVisible: "Contact Seller"
# Save the listing via the heart button
- tapOn:
    id: "save-toggle-button"
- waitForAnimationToEnd
# Pop back to the tab layout FIRST. Listing detail lives outside
# app/(main)/(tabs), so the tab bar is not in the view tree there and a tab tap
# reports "Element not found: saved-tab" — which reads like a missing testID.
#
# Two conditional blocks rather than a bare `back` or a `while`: this is the
# pattern saved_listing_goes_sold already uses, it is a no-op when the bar is
# already showing, and these screens are at most two pushes deep so an unbounded
# loop could only spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "saved-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "saved-tab"
    commands:
      - back
      - waitForAnimationToEnd
# Navigate to Saved tab to confirm the listing is there
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertVisible: "Saved"
# Go back to Bazaar and re-open the listing
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# REOPEN THE LISTING. This tapped "Contact Seller" on the FEED, where no such
# button exists — it is a listing-detail control and the flow had just returned to
# Bazaar via the tab. The heart it wants is on the detail screen, so the listing
# has to be opened again, the same way it was the first time.
# Search instead of scrolling. This pair — scrollUntilVisible on the title, then
# tapOn that same title — is the pattern that produced "No visible element
# found: Wool Blanket Handmade King Size" while the listing was active in the database and
# the feed rendered fine. The seed now leaves ~98 listings, so every fixture
# added lengthens the scroll and a raised timeout only postpones it; search is
# O(1) in feed size. The helper also dismisses the IME before tapping and taps
# the RESULT CARD by testID, because once typed the title is also the search
# input's own text.
#
# Proven in run-496, not assumed: the helper was already wired into
# reserve_after_accept and its screenshot is the correct listing detail.
- runFlow:
    file: ../_helpers/open_listing_by_title.yaml
    env:
      TITLE: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
- assertVisible: "Contact Seller"
# Unsave it
- tapOn:
    id: "save-toggle-button"
- waitForAnimationToEnd
# Pop back to the tab layout FIRST. Listing detail lives outside
# app/(main)/(tabs), so the tab bar is not in the view tree there and a tab tap
# reports "Element not found: saved-tab" — which reads like a missing testID.
#
# Two conditional blocks rather than a bare `back` or a `while`: this is the
# pattern saved_listing_goes_sold already uses, it is a no-op when the bar is
# already showing, and these screens are at most two pushes deep so an unbounded
# loop could only spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "saved-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "saved-tab"
    commands:
      - back
      - waitForAnimationToEnd
# Navigate to Saved — should be empty now
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
# Assert THIS listing is gone, not that the whole Saved tab is empty. Saves are
# per-account state that no flow owns: the buyer accumulates them across the suite
# (saved/save_from_browse_feed, saved_listing_goes_sold and the report/block flows all
# save things), so "No saved items yet" can only pass if this flow happens to run
# before any of them. It failed with api_errors: 0 — the unsave worked perfectly, the
# tab simply still held somebody else's save.
- extendedWaitUntil:
    notVisible: "Wool Blanket Handmade King Size"
    timeout: 20000
