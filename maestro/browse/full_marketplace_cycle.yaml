appId: com.hatiwal.app
---
# Full cross-account marketplace cycle:
# Seller creates + publishes listing → Buyer finds it, saves it, messages seller →
# Seller accepts offer → Seller marks reserved → Seller marks sold →
# Buyer checks saved tab → listing shows as Sold

# ── Step 1: Seller creates and publishes a listing ───────────────────────────
- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
# TASK-P736 — Publish now requires >=1 photo and an exact map pin; add both
# before filling the rest of the form (mirrors the block added to
# create_listing_with_condition.yaml for the same card).
- tapOn: "Add Photos"
- waitForAnimationToEnd
- tapOn: "Gallery"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Cover"
# TASK-P736 (review fix) — tap the input placeholders, not the "Title *" /
# "Price *" Labels (a Label is inert text, not focusable; tapping it would
# leave nothing focused and inputText below would silently go nowhere) —
# matches create_listing_publish_direct.yaml / create_listing_with_condition.yaml.
- tapOn: "What are you selling?"
- inputText: "Marketplace Cycle Phone"
- tapOn: "Enter price"
- inputText: "3500"
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
- tapOn: "Search a province…"
- inputText: "Kabul"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
- assertNotVisible: "Tap to set exact location on map"
- tapOn: "Publish"
- waitForAnimationToEnd
# TASK-J952: publishing lands on the owner detail with PublishSuccessSheet —
# "Listing posted" was removed with that card; this now matches
# create_listing_with_condition.yaml / create_listing_publish_direct.yaml.
- assertVisible: "Your listing is live!"
- tapOn: "Done"
- waitForAnimationToEnd

# ── Step 2: Buyer finds the listing and saves it ─────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn: "Search"
- inputText: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"
- assertVisible: "3,500"
# Save it
- tapOn:
    id: "save-button"
- waitForAnimationToEnd
# Verify in Saved tab
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"

# ── Step 3: Buyer messages seller + makes an offer ───────────────────────────
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- tapOn: "Your offer price"
- inputText: "3000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
- assertVisible: "3,000"

# ── Step 4: Seller accepts the offer ─────────────────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login_seller.yaml
- tapOn: "Chat"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- assertVisible: "3,000"
- tapOn: "Accept"
- waitForAnimationToEnd
- assertVisible: "Offer accepted"

# ── Step 5: Seller marks listing reserved then sold ──────────────────────────
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn: "Mark as Reserved"
- waitForAnimationToEnd
- assertVisible: "Reserved"
- tapOn: "Mark as Sold"
- waitForAnimationToEnd
- assertVisible: "Sold"

# ── Step 6: Buyer checks saved tab — listing shows Sold ──────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"
- assertVisible: "Sold"
