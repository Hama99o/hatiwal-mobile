appId: com.hatiwal.app
---
# Full cross-account marketplace cycle:
# Seller creates + publishes listing → Buyer finds it, saves it, messages seller →
# Seller accepts offer → Seller marks reserved → Seller marks sold →
# Buyer checks saved tab → listing shows as Sold

# ── Step 1: Seller creates and publishes a listing ───────────────────────────
- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
# TASK-P736 — Publish now requires >=1 photo and an exact map pin; add both
# before filling the rest of the form (mirrors the block added to
# create_listing_with_condition.yaml for the same card).
- tapOn: "Add Photos"
- waitForAnimationToEnd
# Helper: tolerant picker selectors + Android's "Add (N)" confirm. The bare index
# tap it replaces had no selector, so no photo was ever picked.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"
# TASK-P736 (review fix) — tap the input placeholders, not the "Title *" /
# "Price *" Labels (a Label is inert text, not focusable; tapping it would
# leave nothing focused and inputText below would silently go nowhere) —
# matches create_listing_publish_direct.yaml / create_listing_with_condition.yaml.
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Marketplace Cycle Phone"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    centerElement: true
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "3500"
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
# Scroll to the map row. It sits below title, price, currency, condition,
# description and category on a form taller than the viewport, and `tapOn` never
# scrolls — publish_success and publish_from_owner_detail both failed with
# `Element not found: Tap to set exact location on map` on a form that renders it.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
# testIDs from LocationRangePicker, which is what actually renders this search:
# input `location-search-input`, rows `location-search-result`. The old
# `province-option` lives ONLY in ProvincePickerSheet, a component that is
# imported nowhere in the app (UI-041) — so this could never match. Six other
# flows already use the pair below; this now matches them.
- tapOn:
    id: "location-search-input"
- eraseText
- inputText: "Kabul"
- extendedWaitUntil:
    visible:
      id: "location-search-result"
    timeout: 15000
- tapOn:
    id: "location-search-result"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
# WAIT for the sheet to actually close before touching the form again.
# The map has to load tiles and reverse-geocode before it will confirm, which on a
# loaded host is genuinely slow — _helpers/set_listing_location.yaml allows 45s for
# exactly this. While it is still open the form's tree is not reachable, so the next
# step failed with "Element not found: Publish" on a button that had not gone anywhere.
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 45000
- assertNotVisible: "Tap to set exact location on map"
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd
# TASK-J952: publishing lands on the owner detail with PublishSuccessSheet —
# "Listing posted" was removed with that card; this now matches
# create_listing_with_condition.yaml / create_listing_publish_direct.yaml.
- assertVisible: "Your listing is live!"
- tapOn: "Done"
- waitForAnimationToEnd

# ── Step 2: Buyer finds the listing and saves it ─────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# By testID. The search bar shows the PLACEHOLDER "Search listings..." — Maestro
# text matching is an anchored full-string regex, so a bare "Search" never matched
# it. Six other flows already use browse-search-input.
- runFlow: ../_helpers/clear_browse_filters.yaml
- tapOn:
    id: "browse-search-input"
# eraseText, like every other search site in this flow. Without it the typing APPENDS:
# the feed was found holding "Marketplace Cycle PhoneCycle Phone", which matches
# nothing. This flow's own comment at the top says Maestro mangles the first character
# without an eraseText, and this was the one site that did not have one.
- eraseText
- inputText: "Marketplace Cycle Phone"
- waitForAnimationToEnd
# NOT `tapOn: "Marketplace Cycle Phone"`. That text is sitting in the SEARCH BOX,
# which is higher in the hierarchy than the results, so Maestro's first match was
# the input itself: the tap re-focused the search field, the flow carried on
# believing it had navigated, and it died later on a screen it never left. The
# comment at "Step 4" below already spotted this class once — it was fixed in one
# place and left standing in four.
# Card/row testIDs cannot collide with the query text, and they also survive the
# list truncating a long title.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*3,500"
# Save it
# No tab bar on a pushed screen, so this tap used to fail with "Element not
# found" on a testID that exists — audit_structure flags it. The helper pops
# back until the bar is there, and does nothing when it already is.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    # The heart on listing detail is `save-toggle-button` — added when this
    # class of failure was traced (its label is localized AND flips on isSaved,
    # so a testID is the only stable handle). `save-button` never existed.
    id: "save-toggle-button"
- waitForAnimationToEnd
# Pop back to the tabs FIRST — listing detail lives outside app/(main)/(tabs), so
# the tab bar is not in the view tree and a tab tap reports "Element not found".
# Same pattern as saved_listing_goes_sold and listing_detail_save_unsave.
- runFlow:
    when:
      notVisible:
        id: "saved-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "saved-tab"
    commands:
      - back
      - waitForAnimationToEnd
# Verify in Saved tab
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"

# ── Step 3: Buyer messages seller + makes an offer ───────────────────────────
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# NOT `tapOn: "Marketplace Cycle Phone"`. That text is sitting in the SEARCH BOX,
# which is higher in the hierarchy than the results, so Maestro's first match was
# the input itself: the tap re-focused the search field, the flow carried on
# believing it had navigated, and it died later on a screen it never left. The
# comment at "Step 4" below already spotted this class once — it was fixed in one
# place and left standing in four.
# Card/row testIDs cannot collide with the query text, and they also survive the
# list truncating a long title.
#
# The query from Step 2 may or may not still be in the box after this tab switch,
# and typing into a box that already has text APPENDS rather than replaces. So
# erase first and re-search: this then reaches the same listing whatever state
# the Bazaar was left in.
- runFlow: ../_helpers/clear_browse_filters.yaml
- tapOn:
    id: "browse-search-input"
- eraseText
- inputText: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
# By testID, like offer_send_and_accept — the only offer flow that passed.
# The sheet's label is `listing.detail.yourOffer` = "Your offer", lowercase o.
# "Your Offer" with a capital O is `chat.offer.yourOffer`, which MessageBubble
# renders on the bubble IN THE THREAD after sending. Maestro text matching is a
# case-sensitive anchored regex, so tapping "Your Offer" here missed by exactly
# one character and reported "Element not found: Your Offer" with the sheet open.
- tapOn:
    id: "offer-amount-input"
- inputText: "3000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
- assertVisible: ".*3,000"

# ── Step 4: Seller accepts the offer ─────────────────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login_seller.yaml
# The tab is labelled "Chats" (sidebar.chat). Maestro text matching is an
# ANCHORED regex, not a substring, so "Chat" never matched it and the flow
# failed at step 1 with "Element not found: Text matching regex: Chat".
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
# Same reason as on the Bazaar, with the conversations search bar and a row id.
# The row shows the LISTING title, which the list truncates — another reason not
# to match it as text.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- eraseText
- inputText: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
- assertVisible: ".*3,000"
- tapOn: "Accept"
- waitForAnimationToEnd
- assertVisible: "Offer accepted"

# ── Step 5: Seller marks listing reserved then sold ──────────────────────────
# No tab bar on a pushed screen, so this tap used to fail with "Element not
# found" on a testID that exists — audit_structure flags it. The helper pops
# back until the bar is there, and does nothing when it already is.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# NOT `tapOn: "Marketplace Cycle Phone"`. That text is sitting in the SEARCH BOX,
# which is higher in the hierarchy than the results, so Maestro's first match was
# the input itself: the tap re-focused the search field, the flow carried on
# believing it had navigated, and it died later on a screen it never left. The
# comment at "Step 4" below already spotted this class once — it was fixed in one
# place and left standing in four.
# Card/row testIDs cannot collide with the query text, and they also survive the
# list truncating a long title.
#
# The query from Step 2 may or may not still be in the box after this tab switch,
# and typing into a box that already has text APPENDS rather than replaces. So
# erase first and re-search: this then reaches the same listing whatever state
# the Bazaar was left in.
- runFlow: ../_helpers/clear_browse_filters.yaml
- tapOn:
    id: "browse-search-input"
- eraseText
- inputText: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# SF-M1 (Sell Flow Redesign) removed "Mark as Reserved" from every listing
# surface — the primary action on a Live listing is now ALWAYS "Mark as
# Sold", one tap, no reserve step in between. Selling opens BuyerPickerSheet
# (TASK-TX01) rather than firing directly, so the confirm step below is not
# optional the way a bare confirmAlert tap used to be.
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "lifecycle-primary-action"
    text: "Mark as Sold"
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- assertVisible: "Who bought this item?"
- tapOn:
    id: "buyer-row-skip"
- waitForAnimationToEnd
- tapOn: "Confirm sold"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000
- assertVisible: "Sold"

# ── Step 6: Buyer checks saved tab — listing shows Sold ──────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "saved-tab"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"
- assertVisible: "Sold"
