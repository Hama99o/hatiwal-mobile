appId: com.hatiwal.app
---
# Full cross-account marketplace cycle:
# Seller creates + publishes listing → Buyer finds it, saves it, messages seller →
# Seller accepts offer → Seller marks reserved → Seller marks sold →
# Buyer checks saved tab → listing shows as Sold

# ── Step 1: Seller creates and publishes a listing ───────────────────────────
- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
# TASK-P736 — Publish now requires >=1 photo and an exact map pin; add both
# before filling the rest of the form (mirrors the block added to
# create_listing_with_condition.yaml for the same card).
- tapOn: "Add Photos"
- waitForAnimationToEnd
- tapOn: "Gallery"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Cover"
# TASK-P736 (review fix) — tap the input placeholders, not the "Title *" /
# "Price *" Labels (a Label is inert text, not focusable; tapping it would
# leave nothing focused and inputText below would silently go nowhere) —
# matches create_listing_publish_direct.yaml / create_listing_with_condition.yaml.
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Marketplace Cycle Phone"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "3500"
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
- tapOn: "Search a province…"
- inputText: "Kabul"
- waitForAnimationToEnd
# The province suggestion rows now carry testID="province-option"; a bare
# index tap here selected no particular element.
- tapOn:
    id: "province-option"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
- assertNotVisible: "Tap to set exact location on map"
- tapOn: "Publish"
- waitForAnimationToEnd
# TASK-J952: publishing lands on the owner detail with PublishSuccessSheet —
# "Listing posted" was removed with that card; this now matches
# create_listing_with_condition.yaml / create_listing_publish_direct.yaml.
- assertVisible: "Your listing is live!"
- tapOn: "Done"
- waitForAnimationToEnd

# ── Step 2: Buyer finds the listing and saves it ─────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn: "Search"
- inputText: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*3,500"
# Save it
- tapOn:
    # The heart on listing detail is `save-toggle-button` — added when this
    # class of failure was traced (its label is localized AND flips on isSaved,
    # so a testID is the only stable handle). `save-button` never existed.
    id: "save-toggle-button"
- waitForAnimationToEnd
# Verify in Saved tab
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"

# ── Step 3: Buyer messages seller + makes an offer ───────────────────────────
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.
- tapOn: "Make an Offer"
- waitForAnimationToEnd
# `chat.offer.yourOffer` = "Your Offer".
- tapOn: "Your Offer"
- inputText: "3000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
- assertVisible: ".*3,000"

# ── Step 4: Seller accepts the offer ─────────────────────────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login_seller.yaml
# The tab is labelled "Chats" (sidebar.chat). Maestro text matching is an
# ANCHORED regex, not a substring, so "Chat" never matched it and the flow
# failed at step 1 with "Element not found: Text matching regex: Chat".
# The Chats TAB by testID. "Chats" is also `listing.ownerDetail.conversations`,
# a label on the seller's owner-detail screen, so a text tap can land on that
# instead — Maestro takes the first match, and the flow then carries on
# believing it navigated. The tab id is unambiguous and locale-independent.
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- assertVisible: ".*3,000"
- tapOn: "Accept"
- waitForAnimationToEnd
- assertVisible: "Offer accepted"

# ── Step 5: Seller marks listing reserved then sold ──────────────────────────
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Marketplace Cycle Phone"
- waitForAnimationToEnd
- tapOn: "Mark as Reserved"
- waitForAnimationToEnd
- assertVisible: "Reserved"
- tapOn: "Mark as Sold"
- waitForAnimationToEnd
- assertVisible: "Sold"

# ── Step 6: Buyer checks saved tab — listing shows Sold ──────────────────────
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn: "Saved"
- waitForAnimationToEnd
- assertVisible: "Marketplace Cycle Phone"
- assertVisible: "Sold"
