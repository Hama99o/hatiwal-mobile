appId: com.hatiwal.app
---
# Make a price offer from listing detail

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards. The comment above it said "open a
# listing detail" the whole time.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# The assertion IS the check — "we are on the listing detail". The tap that used
# to precede it opened the FirstMessageSheet, whose own title is "Message Seller"
# (listing.detail.messageSeller), so the sheet covered the very button being
# asserted and every step after it acted on a covered screen.
- assertVisible: "Contact Seller"
# Tap "Make an Offer"
- tapOn: "Make an Offer"
- waitForAnimationToEnd
- assertVisible: "Make an Offer"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "No payment required.*"
# Enter an offer amount
- tapOn: "Your offer"
- inputText: "20000"
- tapOn: "Send Offer"
- waitForAnimationToEnd
# Redirected to conversation thread with the offer message
# `chat.preview.offer` = "Offer: {{price}}" — interpolated.
- assertVisible: "Offer:.*"
