appId: com.hatiwal.app
---
# Report a listing from listing detail — more options menu → Report

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# The assertion IS the check — "we are on the listing detail". The tap that used
# to precede it opened the FirstMessageSheet, whose own title is "Message Seller"
# (listing.detail.messageSeller), so the sheet covered the very button being
# asserted and every step after it acted on a covered screen.
- assertVisible: "Contact Seller"
# Open the more-options sheet. ONE tap, by testID.
#
# There were two: `tapOn: "More options"` (the accessibility label) followed by
# `tapOn: id: "more-options-button"` — the same control twice. The first opened
# the sheet and the second then failed "Element not found", because Maestro reads
# only the top window and the button now sits behind the sheet. A half-finished
# migration to the testID left both taps in place.
#
# "Report" itself lives inside this sheet (ListingDetail:1037), not on the detail
# screen, which is what the note below the old duplicate was getting at.
- tapOn:
    id: "more-options-button"
- waitForAnimationToEnd
- tapOn: "Report"
- waitForAnimationToEnd
- assertVisible: "Why are you reporting this?"
# Select a reason
- tapOn: "Fraud or scam"
- tapOn: "Submit Report"
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    # Either answer. The Report row is unique per reporter+target and survives
    # between cycles, so after the first successful run this submit is answered with
    # report.errors.duplicate. This flow covers the DETAIL-SCREEN entry point into
    # reporting; the duplicate rule itself is asserted in report/report_listing.yaml.
    visible: "Report submitted. Thank you.|You have already reported this."
    timeout: 15000
