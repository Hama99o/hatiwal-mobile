appId: com.hatiwal.app
---
# Listing detail — Saved-by-N social-proof count (TASK-V259)
# Only shown in the meta row once at least one user has saved the listing.

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Save the listing via the heart button so saves_count becomes >= 1 — but ONLY if it is
# not already saved. save-toggle-button is a TOGGLE, and saves are per-account state
# that no flow owns (several saved/ and report/ flows leave things saved on this buyer),
# so tapping it blind UNSAVES what somebody else saved: the count drops to 0 and
# "Saved by ..." never renders, because ListingDetail gates it on savesCount > 0
# (ListingDetail.tsx:610). That is this flow's failure, with api_errors: 0.
#
# The accessibilityLabel flips with the state (ListingDetail.tsx:891) — "Save listing"
# unsaved, "Remove from saved" saved — so the state is readable, and the wait after
# makes the end state explicit either way.
- runFlow:
    when:
      visible: "Save listing"
    commands:
      - tapOn:
          id: "save-toggle-button"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Remove from saved"
    timeout: 15000
# Scroll down to the meta row where the saved-by count is shown
- scroll
- waitForAnimationToEnd
# "Saved by N person/people" label is now visible
# The count does NOT update in place. saveMutation flips `isSaved` optimistically
# (onMutate) and has no onSuccess, so nothing invalidates the listing query and
# `savesCount` — which is server-derived and gates this row via
# `savesCount > 0` — is unchanged until the listing is refetched. The heart fills;
# the social-proof line does not. Logged as UI-045.
#
# So assert it after a refetch: leave the screen and come back, which is the only
# path that currently refreshes the count.
- back
- waitForAnimationToEnd
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Saved by.*"
    timeout: 15000   # interpolated: "Saved by 3 people" / "Saved by 1 person" (listing.savesCount)
# Unsave — go back and re-open to confirm the row still reflects a valid state
# (no crash, no negative/undefined count rendered)
- tapOn:
    id: "save-toggle-button"
- waitForAnimationToEnd
- back
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
