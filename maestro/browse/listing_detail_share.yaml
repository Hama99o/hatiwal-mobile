appId: com.hatiwal.app
---
# Listing detail — tap Share in the more-options menu → OS share sheet appears

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Open more-options menu (⋯ / kebab in header)
- tapOn:
    id: "more-options-button"
- waitForAnimationToEnd
- assertVisible: "Share"
- assertVisible: "Report"
# Tap Share — native OS share sheet opens
- tapOn: "Share"
- waitForAnimationToEnd
# The native share sheet should be visible — dismiss it
- pressKey: Escape
- waitForAnimationToEnd
# Still on listing detail after dismissing share
- assertVisible: "Message Seller"
