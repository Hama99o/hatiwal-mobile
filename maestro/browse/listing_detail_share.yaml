appId: com.hatiwal.app
---
# Listing detail — tap Share in the more-options menu → OS share sheet appears

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Open more-options menu (⋯ / kebab in header)
- tapOn:
    id: "more-options-button"
- waitForAnimationToEnd
- assertVisible: "Share"
- assertVisible: "Report"
# Tap Share — native OS share sheet opens
- tapOn: "Share"
- waitForAnimationToEnd
# Dismiss the native share sheet with BACK, not Escape.
#
# Escape is not how Android closes a share sheet, so the sheet stayed on top and
# the final assertion failed on "Contact Seller" — the button was there, behind
# the sheet. Back is safe here specifically BECAUSE the sheet is on top: it
# consumes the press. (From a root screen with nothing above it, Back would exit
# the app — see the note in _helpers/open_bundle.yaml.)
- pressKey: Back
- waitForAnimationToEnd
# Still on listing detail after dismissing share
- assertVisible: "Contact Seller"
