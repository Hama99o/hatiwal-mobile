appId: com.hatiwal.app
---
# Listing detail — similar listings rail shows + tapping one opens that listing

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Scroll down to the similar listings section
- scroll
- scroll
- waitForAnimationToEnd
- assertVisible: "Similar Listings"
# Tap the first similar listing card
- tapOn:
    id: "similar-listing"
    index: 0
- waitForAnimationToEnd
# Opens a new listing detail — verify we're on a detail screen
- assertVisible: "Contact Seller"
# Scroll to the SELLER section, not Description. Description is conditional —
# `{listing.description ? ...}` — and 3 of 54 active listings have none, one of
# them "Marketplace Cycle Phone", which full_marketplace_cycle creates without a
# description. So this flow, which taps an ARBITRARY similar listing, failed
# whenever it happened to land on one. The seller block is unconditional: every
# listing has an owner.
- scrollUntilVisible:
    element:
      text: "Seller"
    direction: DOWN
    timeout: 15000
- back
- waitForAnimationToEnd
- assertVisible: "Similar Listings"

# More from this seller — scroll further and optionally verify the rail
# (only present when the seller has other active listings; hidden otherwise)
- scroll
- waitForAnimationToEnd
# NOT `optional: true` on an assertVisible — that can never fail, so it asserted
# nothing. "More from this Seller" only renders when the seller has other active
# listings, so express that as a conditional check instead of a toothless one.
- runFlow:
    when:
      visible: "More from this Seller"
    commands:
      - assertVisible: "More from this Seller"
