appId: com.hatiwal.app
---
# Listing detail — similar listings rail shows + tapping one opens that listing

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Scroll down to the similar listings section
- scroll
- scroll
- waitForAnimationToEnd
- assertVisible: "Similar Listings"
# Tap the first similar listing card
- tapOn:
    id: "similar-listing"
    index: 0
- waitForAnimationToEnd
# Opens a new listing detail — verify we're on a detail screen
- assertVisible: "Contact Seller"
# "Description" is a section heading further down the page — on arrival the hero
# occupies the top of the screen (60% of it on a tablet), so it needs a scroll.
- scrollUntilVisible:
    element:
      text: "Description"
    direction: DOWN
    timeout: 20000
# Back returns to original listing detail
- back
- waitForAnimationToEnd
- assertVisible: "Similar Listings"

# More from this seller — scroll further and optionally verify the rail
# (only present when the seller has other active listings; hidden otherwise)
- scroll
- waitForAnimationToEnd
- assertVisible:
    text: "More from this Seller"
    optional: true
