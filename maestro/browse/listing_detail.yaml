appId: com.hatiwal.app
---
# Listing detail: photos, price, description, seller, contact button all visible

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# Open a listing. This step was MISSING: the flow's own comment said "tap first
# listing card" while the command tapped "Contact Seller" — a DETAIL-screen
# button — from the feed, where it does not exist. So the flow never opened a
# listing and failed on the button it should have been asserting afterwards.
# A named seeded listing rather than "the first card", so the flow does not
# depend on feed ordering: it is active, and owned by the seller, so the buyer
# running this sees the contact affordance.
- scrollUntilVisible:
    element:
      text: "Wool Blanket Handmade King Size"
    direction: DOWN
    timeout: 15000
- tapOn: "Wool Blanket Handmade King Size"
- waitForAnimationToEnd
# Verify detail screen elements. NOT by tapping "Contact Seller": that opens the
# first-message sheet, which then covers the very screen the rest of this flow is
# asserting on (my own first pass did exactly that and failed on "Description").
# The contact affordance is checked by its PRESENCE — sending a message is
# chat/start_conversation.yaml's job.
- assertVisible: "Contact Seller"
# Section headings sit below the gallery and the price block, so they need a
# scroll rather than a bare assertion.
- scrollUntilVisible:
    element:
      text: "Description"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Location"
    direction: DOWN
    timeout: 10000
# Back to Bazaar
- back
- assertVisible: "Bazaar"
