appId: com.hatiwal.app
---
# Saved searches: apply filters → auto-saved → clear → re-apply from saved searches chip

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# Apply a category filter — this combination gets auto-saved
# NOT "Filter" (`common.filter`, a dead key). The control renders "Filters", and
# Maestro matches the full string, so "Filter" never matched it. The testID from
# BrowseHeader.tsx is immune to both the plural and the locale.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# The filter sheet's confirm button is `browse.filters.apply` = "Show results".
- tapOn: "Show results"
- waitForAnimationToEnd
# Filtered results visible
- assertVisible: "Electronics"
# Wait for auto-save (debounced)
- waitForAnimationToEnd
# Clear filters
- tapOn: "Clear"
- waitForAnimationToEnd
# Saved search chip should appear (auto-saved the previous filter combo)
- assertVisible: "Saved Searches"
# Tap the saved search to re-apply it
- tapOn:
    id: "saved-search-chip"
    index: 0
- waitForAnimationToEnd
# Filters are re-applied — Electronics results visible again
- assertVisible: "Electronics"
