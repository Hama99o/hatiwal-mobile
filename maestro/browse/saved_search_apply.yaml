appId: com.hatiwal.app
---
# Saved searches: apply filters → auto-saved → clear → re-apply from saved searches chip

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Apply a category filter — this combination gets auto-saved
# NOT "Filter" (`common.filter`, a dead key). The control renders "Filters", and
# Maestro matches the full string, so "Filter" never matched it. The testID from
# BrowseHeader.tsx is immune to both the plural and the locale.
# Pick the CATEGORY first, on the feed header. The category chips live in the
# header row, not in the filter sheet — that sheet holds Location, Min/Max price,
# Condition, Sort, Seller activity and Deals. Tapping "Electronics" after opening
# the sheet looked for a chip that was behind it, hence "Element not found".
- tapOn: "Electronics"
- waitForAnimationToEnd
# Now open the sheet for the rest of the filters.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- waitForAnimationToEnd
# The filter sheet's confirm button is `browse.filters.apply` = "Show results".
- tapOn: "Show results"
- waitForAnimationToEnd
# Filtered results visible
- assertVisible: "Electronics"
# Wait for auto-save (debounced)
- waitForAnimationToEnd
# Clear filters
# The feed's chip, not the sheet's button. `tapOn: "Clear"` is common.clear, which is
# rendered inside FilterSheet (FilterSheet.tsx:270) — and the flow closed that sheet
# with "Show results" two steps earlier, so the tap could not land. On the feed the
# affordance is the "Clear all" chip, whose accessibilityLabel collides with the
# search-history clear, hence the testID.
- tapOn:
    id: "browse-clear-filters"
- waitForAnimationToEnd
# Saved search chip should appear (auto-saved the previous filter combo)
# `browse.savedSearch` = "Saved search" — singular, lower-case s.
- assertVisible: "Saved search"
# Tap the saved search to re-apply it
- tapOn:
    id: "saved-search-chip"
    index: 0
- waitForAnimationToEnd
# Filters are re-applied — Electronics results visible again
- assertVisible: "Electronics"
