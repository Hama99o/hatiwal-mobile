appId: com.hatiwal.app
---
# Filter listings by condition chips

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# The filters TOGGLE by testID. "Filters" is both `browse.filtersToggle` (the
# control) and `browse.filters.title` (the sheet heading it opens), so a text
# tap can hit the heading of an already-open sheet and do nothing.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
# Select "Like new" condition
- tapOn: "Like new"
- waitForAnimationToEnd
# Confirm chip is selected (appears highlighted)
- assertVisible: "Like new"
# Apply and check results — closes the sheet
- tapOn: "Show results"
- waitForAnimationToEnd
- assertVisible: "Bazaar"
# Reopen and clear via the sheet's footer
# The filters TOGGLE by testID. "Filters" is both `browse.filtersToggle` (the
# control) and `browse.filters.title` (the sheet heading it opens), so a text
# tap can hit the heading of an already-open sheet and do nothing.
- tapOn:
    id: "browse-filters-toggle"
- waitForAnimationToEnd
- tapOn: "Clear all"
- waitForAnimationToEnd
- tapOn: "Show results"
- waitForAnimationToEnd
