appId: com.hatiwal.app
# NO env defaults here on purpose. The rig resolves real ids at feature start and
# passes them as `--env LISTING_ID=… --env SOLD_LISTING_ID=…` (qa/lib/flows.sh),
# but a flow-level `env:` block WINS over --env in this Maestro version — so the
# hardcoded `SOLD_LISTING_ID: 1` silently shadowed the injected 82 and this flow
# deep-linked to listing 1, which does not exist. The screenshot said "Listing not
# found" and the debug commands.json confirmed `hatiwal://listing/1`.
#
# With no default, an unresolved id produces an obviously broken link instead of a
# quietly wrong one. Run by hand with:
#   SOLD_LISTING_ID=82 maestro test <flow>   (or let the rig inject it)
---
# TASK-N317 — Listing detail: sold recovery actions
#
# SOLD-ONLY as of SF-M3 (docs/SELL_FLOW_REDESIGN.md §4.2.1). This flow used to
# cover BOTH sold and reserved — a reserved listing showed this exact same
# recovery card ("See similar" / "More from seller") in place of the contact
# bar. That is no longer true: a reserved listing stays live and message-able
# (SF-B1), so it now falls into the normal Message/Offer branch instead of
# this dead-end block — covered by
# maestro/browse/listing_detail_reserved_contactable.yaml, which is also the
# regression test proving this card does NOT appear for a reserved listing.
# This file keeps only the half that is still true: `sold` is terminal and
# still gets `ListingUnavailableActions` — the same status sentence PLUS a
# primary "See similar in {category}" button (with a ±30% price band when the
# already-fetched `similar` rail proves it holds live stock) and a secondary
# "More from {seller}" link — never an empty button row.
#
# Prerequisites:
#   - A SOLD listing exists, viewable by a guest (NOT the logged-in test
#     buyer's own listing), with a category that has other active listings
#     (so the recovery CTA isn't itself a dead end) and a seller. The seed
#     data's "Wedding Dress" (sold, clothes) fixture satisfies this.
#   - Set SOLD_LISTING_ID before running:
#       SOLD_LISTING_ID=7 maestro test maestro/browse/listing_detail_sold_recovery.yaml

# ── Sold listing — deep link straight to the detail screen (guest browsing
#    is supported, no login wall — see maestro/share/open_listing_deep_link.yaml) ──
- launchApp:
    clearState: true
    stopApp: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/skip_onboarding.yaml
# Let the app finish STARTING before firing the link. These flows launch with
# clearState: true, so the splash and the auth bootstrap are still deciding where to go;
# their router.replace lands after the link and silently discards it, leaving the app on
# the feed. That is precisely what the failing hierarchy showed — 6 listing-cards and
# not one detail element — and the scroll then burned 20s hunting a control that was on
# a screen the flow never reached.
#
# share/open_seller_deep_link is the same shape and PASSES; its only difference is
# clearState: false, i.e. no startup navigation left to run.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 60000
- openLink: "hatiwal://listing/${SOLD_LISTING_ID}"
- waitForAnimationToEnd
# Prove the link actually landed before asserting anything about the screen, and re-fire
# it once if the app is still on the feed.
- runFlow:
    when:
      visible:
        id: "listing-card"
    commands:
      - openLink: "hatiwal://listing/${SOLD_LISTING_ID}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-unavailable-actions"
    timeout: 20000
# The seller row sits below the photo, price and description on the listing
# detail, so it needs a scroll — neither assertVisible nor tapOn scrolls to its
# target, and this failed as `id: seller-profile-link is visible` being false on
# a row that is simply further down.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "seller-profile-link"
    label: "Sold listing detail renders without a login wall"

# No flat dead-end box remains — the recovery card is always on screen for a
# non-owner viewing a sold listing.
- assertVisible:
    id: "listing-unavailable-actions"
    label: "Recovery card visible in place of the old flat notice box"

# A well-formed fixture (a category with other active stock) always shows the
# primary recovery CTA — never an empty button row.
- assertVisible:
    id: "unavailable-see-similar"
    label: "Primary 'See similar in {category}' CTA visible"
# Deliberately NOT asserted here. The "More from {seller}" CTA is genuinely
# omitted when this seller has no other active listings, so it cannot be a hard
# assert — but `optional: true` on an assert means it can never fail either, so
# what stood here recorded an intention rather than checking anything.
# The real check is the `when:` block at the end of this flow: if the CTA is
# present it must navigate to the seller's profile.

# Sold is final — the reserved-only "may free up" line must NOT appear here.
# (The reserved case itself no longer reaches this component at all — see
# listing_detail_reserved_contactable.yaml.)
- assertNotVisible:
    id: "unavailable-reserved-may-free-up"
    label: "'May free up' line never shown for a sold listing"

# Tapping the primary CTA lands on Browse, pre-filtered by category (+ price
# band when applicable) — never back on the dead sold listing.
- tapOn:
    id: "unavailable-see-similar"
- waitForAnimationToEnd
- assertVisible:
    id: "browse-search-bar"
    label: "Primary CTA navigates to Browse"

# Tapping "More from {seller}" (back on the sold listing) lands on that
# seller's public profile.
#
# Conditional rather than a pair of optionals. The CTA really is omitted when the
# seller has no other active listings, so the TAP has to tolerate its absence — but
# an optional tap paired with an optional assert checked nothing: with the CTA
# absent the tap no-opped and the assert passed on the listing screen it had never
# left. Inside the `when`, both are real: the CTA is there, so it must navigate, and
# "Active Listings" is the literal stat label ProfileHeader renders on EVERY
# profile whatever the count.
- launchApp:
    clearState: false
    stopApp: true
- openLink: "hatiwal://listing/${SOLD_LISTING_ID}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "unavailable-more-from-seller"
    commands:
      - tapOn:
          id: "unavailable-more-from-seller"
      - waitForAnimationToEnd
      - assertVisible:
          text: "Active Listings"
          label: "Secondary CTA navigates to the seller's public profile"
