appId: com.hatiwal.app
---
# TASK-D583 — Verify the "Nearest first" sort chip appears in the Browse filter
# panel, acquires the device location on tap, re-fetches the feed sorted by
# distance, and can be toggled off (cleared) cleanly.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the filter panel
- tapOn:
    id: "browse-filters-toggle"   # was `browse.filters` — an i18n KEY prefix, never a testID
- waitForAnimationToEnd

# Scroll down inside the filter panel until the Sort section is visible
- scrollUntilVisible:
    element:
      text: "Sort"
    direction: DOWN
    timeout: 5000

# The "Nearest first" chip should be visible alongside the other sort pills
# The sort chips live in a HORIZONTAL ScrollView, in the order newest, oldest,
# price asc, price desc, most viewed, nearest — so the later ones start
# off-screen to the right, and `tapOn` does not scroll to reach them. Scroll
# the row sideways first. (This is why the chip "was not visible" while being
# rendered unconditionally.)
# The sort chips sit in a horizontal ScrollView and "Nearest first" is the last of
# six, so on a narrow screen it starts off to the right.
# `scrollUntilVisible` is the right tool precisely because it checks first and
# does nothing when the element is already on screen. An unconditional swipe is
# NOT: the previous version swiped the row left, which pushed the chip OUT of
# view on the tablet — where a device hierarchy dump shows the whole row fits and
# "Nearest first" is already visible at [1405,971][1569,1014] of a 2560px screen.
# The fix caused the failure it was meant to cure.
- scrollUntilVisible:
    element:
      text: "Nearest first"
    direction: RIGHT
    timeout: 15000
- assertVisible: "Nearest first"

# Tap "Nearest first" — this triggers the OS location permission prompt on a
# fresh install/emulator. Dismiss it by allowing access so the fix succeeds.
- tapOn: "Nearest first"
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Allow once"
    optional: true
- waitForAnimationToEnd

# The feed re-fetches sorted by distance — wait for the loading spinner
# on the chip to clear and the list to settle.
- waitForAnimationToEnd

# Tap "Nearest first" again to toggle it off (back to default newest order)
- tapOn: "Nearest first"
- waitForAnimationToEnd
