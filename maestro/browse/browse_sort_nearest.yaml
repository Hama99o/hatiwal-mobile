appId: com.hatiwal.app
---
# TASK-D583 — Verify the "Nearest first" sort chip appears in the Browse filter
# panel, acquires the device location on tap, re-fetches the feed sorted by
# distance, and can be toggled off (cleared) cleanly.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the filter panel
- tapOn:
    id: "browse-filters-toggle"   # was `browse.filters` — an i18n KEY prefix, never a testID
- waitForAnimationToEnd

# Scroll the SHEET down until the chip itself is on screen.
#
# Targeting the chip, not the "Sort" heading. Scrolling to the heading with a
# short timeout can stop with "Sort" just barely visible at the bottom and the
# chip row still BELOW the fold — and once that has happened no amount of
# sideways scrolling can reveal it, which is what made this look like a missing
# chip. On a 1280dp tablet the whole row fits, so this settles it there; a
# hierarchy dump puts "Nearest first" at [1405,971][1569,1014] of 2560px.
# Bring the Sort SECTION into view (vertical), then move the row itself.
- scrollUntilVisible:
    element:
      text: "Sort"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
# Swipe along the Sort row until the chip shows, rather than a fixed count. The
# row is longer than it looks: Newest first, Oldest first, Price: low to high,
# Price: high to low, Most viewed, Nearest first. Two swipes only reached
# "Price: high to low" (see run-243's screenshot), and an anchor chip cannot be
# used because it scrolls off after the first swipe — hence a percentage swipe
# along the row's own y (68% once the sheet is at rest).
#
# The inner runFlow makes each iteration a no-op once the chip is visible, so
# this stops early instead of over-scrolling past it.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible: "Nearest first"
          commands:
            # TWO y VALUES PER ITERATION, because one fixed percentage cannot
            # serve both viewports — and that is exactly how this failed.
            #
            # run-494 at 360dp: the Sort chip row sits at y ~= 944/1280 = 74%, so a
            # swipe at 68% lands on the "Sort" HEADING above it. The scroller never
            # moves, "Nearest first" never arrives, and the flow reports it not
            # visible while it is rendered and merely off-screen to the right — the
            # screenshot still shows "Newest first / Oldest first / Price: low to...".
            # 68% was measured on the 411dp sheet, where it is correct.
            #
            # scrollUntilVisible direction: RIGHT is NOT the fix: it swipes at the
            # screen CENTRE (~50%), which on this sheet is over the price inputs.
            # listings/listing_status_counts and my_listings_filter_tabs both record
            # that same finding.
            - swipe:
                start: "85%, 74%"
                end: "20%, 74%"
            - waitForAnimationToEnd
            - swipe:
                start: "85%, 68%"
                end: "20%, 68%"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Nearest first"
    timeout: 10000

# Tap "Nearest first" — this triggers the OS location permission prompt on a
# fresh install/emulator. Dismiss it by allowing access so the fix succeeds.
- tapOn: "Nearest first"
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    # lint: anchored-ok — Android's permission-dialog button, matched exactly
    text: "Allow"
    optional: true
- tapOn:
    text: "Allow once"
    optional: true
- waitForAnimationToEnd

# The feed re-fetches sorted by distance — wait for the loading spinner
# on the chip to clear and the list to settle.
- waitForAnimationToEnd

# Wait for the chip to STOP saying "Finding your location…" before tapping again.
#
# While acquiring GPS the chip relabels itself (`nearestLoading ?
# browse.nearestLocationLoading : browse.sort.nearest`), so for that window the
# text "Nearest first" does not exist on screen at all — and the toggle-off tap
# failed with "Element not found: Nearest first" while the chip was sitting right
# there, mid-load. `waitForAnimationToEnd` does not cover it: acquiring a location
# is not an animation.
- extendedWaitUntil:
    visible: "Nearest first"
    timeout: 30000

# Tap "Nearest first" again to toggle it off (back to default newest order)
- tapOn: "Nearest first"
- waitForAnimationToEnd
