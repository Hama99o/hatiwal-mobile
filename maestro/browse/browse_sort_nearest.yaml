appId: com.hatiwal.app
---
# TASK-D583 — Verify the "Nearest first" sort chip appears in the Browse filter
# panel, acquires the device location on tap, re-fetches the feed sorted by
# distance, and can be toggled off (cleared) cleanly.

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the filter panel
- tapOn:
    id: "browse-filters-toggle"   # was `browse.filters` — an i18n KEY prefix, never a testID
- waitForAnimationToEnd

# Scroll the SHEET down until the chip itself is on screen.
#
# Targeting the chip, not the "Sort" heading. Scrolling to the heading with a
# short timeout can stop with "Sort" just barely visible at the bottom and the
# chip row still BELOW the fold — and once that has happened no amount of
# sideways scrolling can reveal it, which is what made this look like a missing
# chip. On a 1280dp tablet the whole row fits, so this settles it there; a
# hierarchy dump puts "Nearest first" at [1405,971][1569,1014] of 2560px.
- scrollUntilVisible:
    element:
      text: "Nearest first"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- assertVisible: "Nearest first"

# Tap "Nearest first" — this triggers the OS location permission prompt on a
# fresh install/emulator. Dismiss it by allowing access so the fix succeeds.
- tapOn: "Nearest first"
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Allow once"
    optional: true
- waitForAnimationToEnd

# The feed re-fetches sorted by distance — wait for the loading spinner
# on the chip to clear and the list to settle.
- waitForAnimationToEnd

# Wait for the chip to STOP saying "Finding your location…" before tapping again.
#
# While acquiring GPS the chip relabels itself (`nearestLoading ?
# browse.nearestLocationLoading : browse.sort.nearest`), so for that window the
# text "Nearest first" does not exist on screen at all — and the toggle-off tap
# failed with "Element not found: Nearest first" while the chip was sitting right
# there, mid-load. `waitForAnimationToEnd` does not cover it: acquiring a location
# is not an animation.
- extendedWaitUntil:
    visible: "Nearest first"
    timeout: 30000

# Tap "Nearest first" again to toggle it off (back to default newest order)
- tapOn: "Nearest first"
- waitForAnimationToEnd
