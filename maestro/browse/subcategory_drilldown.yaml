appId: com.hatiwal.app
---
# Subcategory drill-down — happy path:
#   1. Open the Categories hub
#   2. Tap a parent category that has subcategories → panel expands inline
#   3. Tap a subcategory chip → Browse opens filtered to that subcategory
#   4. Active-filter chip shows the subcategory name and is removable
#   5. Tapping the X chip clears the filter → chip disappears

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# ── Navigate to the Categories hub ───────────────────────────────────────────
# NOT "Browse categories": `browse.browseCategories` is a dead key and there is
# no such affordance in BrowseHeader. The hub is a TAB (buyer mode only).
- tapOn:
    id: "categories-tab"
- waitForAnimationToEnd
- assertVisible: "Categories"

# The parent category card should be visible
- assertVisible: "Electronics"

# ── Tap a parent that has subcategories ──────────────────────────────────────
# (Electronics has Phones as a subcategory in the test seed)
- tapOn: "Electronics"
- waitForAnimationToEnd

# The subcategory panel must appear with the "All in Electronics" chip
- assertVisible:
    text: "All in Electronics"
# The seeded subcategory is "Phones & Tablets", not "Phones" — and Maestro text
# matching is an anchored full-string regex, so the short form matched nothing.
# Wildcards rather than the literal, so a seed rename of the tail does not break it.
- assertVisible: ".*Phones.*"

# The parent card must show the collapse indicator (ChevronUp) — tested via
# the expanded accessibilityState on the Pressable; Maestro checks visible text.
# Verify the panel rendered by confirming a subcategory is now on screen.
# The seeded subcategory is "Phones & Tablets", not "Phones" — and Maestro text
# matching is an anchored full-string regex, so the short form matched nothing.
# Wildcards rather than the literal, so a seed rename of the tail does not break it.
- assertVisible: ".*Phones.*"

# ── Tap a subcategory chip ────────────────────────────────────────────────────
# See the note above: the subcategory is "Phones & Tablets".
- tapOn: ".*Phones.*"
- waitForAnimationToEnd

# Browse should be active
- assertVisible: "Bazaar"

# ── Active subcategory filter chip must be visible ────────────────────────────
# BrowseHeader renders browse.subcategoryFilter = "Subcategory: {{name}}", and the
# seeded name is "Phones & Tablets" — so the chip reads "Subcategory: Phones & Tablets".
# Matching is anchored, so the exact string "Subcategory: Phones" can never match it.
# The taps and asserts further up already carry this note and use `.*Phones.*`; these
# two chip assertions were left behind.
- assertVisible:
    text: "Subcategory: Phones.*"

# ── Clear the subcategory filter chip ────────────────────────────────────────
- tapOn:
    text: "Clear subcategory"
- waitForAnimationToEnd

# The chip must disappear after clearing
- assertNotVisible:
    text: "Subcategory: Phones.*"

# ── Parent with no children keeps its original tap→Browse behavior ────────────
# Go back to the hub and verify a childless category navigates directly
# NOT "Browse categories": `browse.browseCategories` is a dead key and there is
# no such affordance in BrowseHeader. The hub is a TAB (buyer mode only).
- tapOn:
    id: "categories-tab"
- waitForAnimationToEnd
- assertVisible: "Categories"

# ── Collapse test: tapping an expanded parent collapses the panel ─────────────
- tapOn: "Electronics"
- waitForAnimationToEnd
# The seeded subcategory is "Phones & Tablets", not "Phones" — and Maestro text
# matching is an anchored full-string regex, so the short form matched nothing.
# Wildcards rather than the literal, so a seed rename of the tail does not break it.
- assertVisible: ".*Phones.*"

# Tap Electronics again to collapse
- tapOn: "Electronics"
- waitForAnimationToEnd
# Wildcards here are load-bearing: the app renders "Phones & Tablets", so
# `assertNotVisible: "Phones"` was trivially TRUE on every screen and asserted
# nothing at all — a false pass hiding inside a negative check.
- assertNotVisible: ".*Phones.*"
