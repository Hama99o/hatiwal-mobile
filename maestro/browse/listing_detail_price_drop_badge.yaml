appId: com.hatiwal.app
---
# Price-drop badge: after a seller lowers a listing's price, the buyer should
# see the badge on the listing detail and on the browse card.
#
# Prerequisites:
#   - Seed data includes at least one active listing with a recent price drop
#     (a ListingPriceHistory record created within the last 14 days with
#      new_price < old_price).
#
# Happy-path flow:
#   1. Login as buyer
#   2. Bazaar feed — confirm the price-drop badge/overlay is visible on a card
#   3. Open the listing detail — confirm the detail badge is visible
#   4. The badge should NOT appear for listings that have no price drop

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd
# CLEAR INHERITED BROWSE FILTERS BEFORE SCROLLING THE FEED.
#
# Filters PERSIST between flows (the app is never restarted), so this flow
# inherited "Electronics" + "Electronics - 5000-inf" from an earlier flow and then
# scrolled a two-card filtered result set looking for a listing the filter had
# excluded. That is why it failed 0/6 at this sha with "No visible element found"
# on a fixture that is present and active (verified over HTTP: it sits at feed
# position 20 of 69 browsable listings).
#
# The end-of-flow screenshot in run-530 shows both chips active above the grid.
# _helpers/clear_browse_filters.yaml names this exact filter in its own comment,
# and four other flows already open with it.
- runFlow: ../_helpers/clear_browse_filters.yaml

# Happy path: a listing with a recent price drop shows the card badge (overlay)
# The CARD badge is `listing.priceDrop.badgeCardShort` = "↓{{percent}}%" — a DOWN
# ARROW, not a minus sign. This asserted "-\d+%" (and said so in a comment), which
# never matched. The DETAIL page uses a different key,
# `listing.priceDrop.badge` = "{{percent}}% price drop", which this flow already
# asserts correctly further down — so the two screens were half right.
# Scroll to the listing that actually HAS the drop before asserting the card badge.
# The seeded price drop is on the LENOVO — db/seeds/e2e.rb creates a ListingPriceHistory
# of 38 000 -> 32 300 AFN (~15%) dated 2 days ago, and Listing#recent_price_drop only
# counts reductions inside a 14-day window. The Wool Blanket this flow used to open has
# price_drop_percent: null (checked against the API), so neither the card badge nor the
# detail line could ever render for it.
- scrollUntilVisible:
    element:
      text: "Lenovo ThinkPad Laptop Core i5 8GB"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    text: "↓\\d+%"

# Open a listing detail. THE STEP THAT OPENS ONE WAS MISSING: this flow tapped
# "Contact Seller" — a DETAIL-screen button — while still on the Bazaar feed,
# where it does not exist, so it never opened a listing and failed on the button
# it should have been asserting afterwards.
#
# A NAMED seeded listing, not "the first card": it does not depend on feed
# ordering, it is active, and it belongs to seller@hatiwal.test — so the buyer
# running this flow sees the contact affordance rather than their own listing.
- tapOn: "Lenovo ThinkPad Laptop Core i5 8GB"
- waitForAnimationToEnd
# NOT tapping "Contact Seller" here: that opens the first-message sheet, which
# then covers the detail screen the rest of this flow acts on. Opening the
# listing IS the step that was missing; the contact tap was never the point.

# Detail variant: the detail badge renders "N% price drop" (e.g. "15% price drop")
- assertVisible:
    text: "\\d+% price drop"

# Price must still be the dominant element — assert price is visible
- assertVisible: "Description"
- assertVisible: "Seller"

# Back to Bazaar
- back
- assertVisible: "Bazaar"
