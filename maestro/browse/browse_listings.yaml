appId: com.hatiwal.app
---
# Bazaar feed loads listings, pagination works, tap opens detail

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
# Feed is visible with listings
- waitForAnimationToEnd
- assertVisible: "Bazaar"
# Scroll down to trigger pagination
- scroll
- scroll
- waitForAnimationToEnd
# Tap first visible listing to open detail
- tapOn:
    text: "Contact Seller"
    optional: true
- back
