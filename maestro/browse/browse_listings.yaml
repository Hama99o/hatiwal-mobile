appId: com.hatiwal.app
---
# Browse feed loads listings, pagination works, tap opens detail

- runFlow: ../_helpers/login.yaml
- assertVisible: "Browse"
# Feed is visible with listings
- waitForAnimationToEnd
- assertVisible: "Browse"
# Scroll down to trigger pagination
- scroll
- scroll
- waitForAnimationToEnd
# Tap first visible listing to open detail
- tapOn:
    text: "Contact Seller"
    optional: true
- back
