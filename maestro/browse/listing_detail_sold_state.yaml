appId: com.hatiwal.app
# NO env defaults here on purpose. The rig resolves real ids at feature start and
# passes them as `--env LISTING_ID=… --env SOLD_LISTING_ID=…` (qa/lib/flows.sh),
# but a flow-level `env:` block WINS over --env in this Maestro version — so the
# hardcoded `SOLD_LISTING_ID: 1` silently shadowed the injected 82 and this flow
# deep-linked to listing 1, which does not exist. The screenshot said "Listing not
# found" and the debug commands.json confirmed `hatiwal://listing/1`.
#
# With no default, an unresolved id produces an obviously broken link instead of a
# quietly wrong one. Run by hand with:
#   SOLD_LISTING_ID=82 maestro test <flow>   (or let the rig inject it)
---
# Sold listing detail — non-owner view.
#
# This flow was previously a no-op: it asserted "Bazaar" three times without
# ever opening a sold listing, so it proved nothing about the sold state.
# It now covers the narrow "does the active-listing contact bar correctly
# disappear" contract; the recovery CTAs themselves (TASK-N317) — "See
# similar in {category}" / "More from {seller}" and their navigation — are
# covered by maestro/browse/listing_detail_sold_recovery.yaml.
#
# Prerequisites:
#   - A SOLD listing exists, viewable by a guest (NOT the logged-in test
#     buyer's own listing). Set SOLD_LISTING_ID before running:
#       SOLD_LISTING_ID=7 maestro test maestro/browse/listing_detail_sold_state.yaml

- launchApp:
    clearState: true
    stopApp: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/skip_onboarding.yaml
- openLink: "hatiwal://listing/${SOLD_LISTING_ID}"
# The seller row sits below the photo, price and description on the listing
# detail, so it needs a scroll — neither assertVisible nor tapOn scrolls to its
# target, and this failed as `id: seller-profile-link is visible` being false on
# a row that is simply further down.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "seller-profile-link"
    label: "Sold listing detail renders without a login wall"

# The active-listing contact controls must be completely gone for a sold
# listing — this is the whole reason the sticky bar has a separate branch.
- assertNotVisible: "Contact Seller"
- assertNotVisible: "Make an Offer"

# TASK-N317: the recovery card takes their place — never the old flat box
# with no next action.
- assertVisible:
    id: "listing-unavailable-actions"
    label: "Recovery card renders instead of the old flat notice box"

# The rest of the page still renders normally for a sold listing.
- assertVisible: "Description"
- scroll
- assertVisible: "Seller"
- back
