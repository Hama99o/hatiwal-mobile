appId: com.hatiwal.app
---
# Categories hub — happy path: grid loads, counts visible, tap navigates to Browse

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# The hub is reached from the dedicated CATEGORIES TAB.
#
# There is no "Browse categories" affordance in BrowseHeader — that string comes
# from `browse.browseCategories`, a dead translation key (UI-021), and
# BrowseHeader.tsx says so in a comment: "The full categories hub is reached from
# the dedicated Categories tab". The LayoutGrid icon in the header is the
# grid/list VIEW toggle (browse.viewGrid), not a categories link.
#
# Targeted by testID because every tab label is translated.
- tapOn:
    id: "categories-tab"
- waitForAnimationToEnd

# Hub screen is shown
- assertVisible: "Categories"

# Category cards should render with names and listing counts
- assertVisible: "Electronics"

# Tapping a top-level category EXPANDS it, it does not navigate.
#
# Every one of the 16 top-level categories has children, and the hub card's own
# accessibility hint says so ("Tap to see subcategories"). So this tap reveals a
# subcategory row — "All in Electronics", "Phones & Tablets", … — and the app
# stays on the hub. Navigating to a pre-filtered Bazaar is the "All in <name>"
# chip (categories.allIn). The flow used to tap "Electronics" and immediately
# assert the Bazaar chip was selected, which could never pass; the screenshot
# showed the hub, expanded, exactly as designed.
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "All in Electronics"
- waitForAnimationToEnd

# Back on Browse — verify the Electronics category chip is actively selected.
# If the categoryId param was dropped (broken routing), this chip will be
# unselected and the assertion fails, catching the regression.
- assertVisible: "Bazaar"
- assertVisible:
    text: "Electronics"
    selected: true

# ── Re-selection regression path ──────────────────────────────────────────────
# This second leg specifically tests the re-entry bug where tapping the SAME
# category from the hub a second time would fail to re-apply the filter because
# the URL param value was identical (unchanged dependency → effect did not fire).
# With the param-clear fix in Browse.tsx this leg must pass.

# Step 1: tap 'All' (or any other chip) to clear the Electronics selection
- tapOn:
    text: "All"
- waitForAnimationToEnd

# Verify Electronics is no longer selected
- assertNotVisible:
    text: "Electronics"
    selected: true

# Step 2: go back to the hub (same reason as above)
- tapOn:
    id: "categories-tab"
- waitForAnimationToEnd
- assertVisible: "Categories"

# Step 3: tap Electronics again — this is the re-selection path (expand, then
# navigate, same as above)
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "All in Electronics"
- waitForAnimationToEnd

# The filter must be re-applied: Electronics chip must be selected again.
# Without the param-clear fix this assertion fails (param unchanged → no re-fire).
- assertVisible: "Bazaar"
- assertVisible:
    text: "Electronics"
    selected: true
