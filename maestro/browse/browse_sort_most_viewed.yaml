appId: com.hatiwal.app
---
# Verify that the "Most viewed" sort option appears in the Browse filter panel,
# can be selected, re-fetches the feed, and can be toggled off (cleared).

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the filter panel
- tapOn:
    id: "browse-filters-toggle"   # was `browse.filters` — an i18n KEY prefix, never a testID
- waitForAnimationToEnd

# Scroll down inside the filter panel until the Sort section is visible
- scrollUntilVisible:
    element:
      text: "Sort"
    direction: DOWN
    timeout: 5000

# The "Most viewed" option should be visible in the sort row
# The sort chips live in a HORIZONTAL ScrollView, in the order newest, oldest,
# price asc, price desc, most viewed, nearest — so the later ones start
# off-screen to the right, and `tapOn` does not scroll to reach them. Scroll
# the row sideways first. (This is why the chip "was not visible" while being
# rendered unconditionally.)
- scrollUntilVisible:
    element:
      text: "Most viewed"
    direction: RIGHT
    timeout: 15000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- assertVisible: "Most viewed"

# Tap "Most viewed" to activate it
- tapOn:
    text: "Most viewed"
- waitForAnimationToEnd

# The feed re-fetches — wait for animation to settle
- waitForAnimationToEnd

# Tap "Most viewed" again to toggle it off (back to default)
- tapOn:
    text: "Most viewed"
- waitForAnimationToEnd
