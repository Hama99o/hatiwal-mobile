appId: com.hatiwal.app
---
# Verify that the "Most viewed" sort option appears in the Browse filter panel,
# can be selected, re-fetches the feed, and can be toggled off (cleared).

- runFlow: ../_helpers/login.yaml
- assertVisible: "Bazaar"
- waitForAnimationToEnd

# Open the filter panel
- tapOn:
    id: "browse-filters-toggle"   # was `browse.filters` — an i18n KEY prefix, never a testID
- waitForAnimationToEnd

# Scroll down inside the filter panel until the Sort section is visible
- scrollUntilVisible:
    element:
      text: "Sort"
    direction: DOWN
    timeout: 5000

# The "Most viewed" option should be visible in the sort row
# The sort chips live in a HORIZONTAL ScrollView, in the order newest, oldest,
# price asc, price desc, most viewed, nearest — so the later ones start
# off-screen to the right, and `tapOn` does not scroll to reach them. Scroll
# the row sideways first. (This is why the chip "was not visible" while being
# rendered unconditionally.)
# Swipe along the Sort row until the chip shows, rather than a fixed count. The
# row is longer than it looks: Newest first, Oldest first, Price: low to high,
# Price: high to low, Most viewed, Nearest first. Two swipes only reached
# "Price: high to low" (see run-243's screenshot), and an anchor chip cannot be
# used because it scrolls off after the first swipe — hence a percentage swipe
# along the row's own y (68% once the sheet is at rest).
#
# The inner runFlow makes each iteration a no-op once the chip is visible, so
# this stops early instead of over-scrolling past it.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible: "Most viewed"
          commands:
            - swipe:
                start: "85%, 68%"
                end: "20%, 68%"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Most viewed"
    timeout: 10000

# Tap "Most viewed" to activate it
- tapOn:
    text: "Most viewed"
- waitForAnimationToEnd

# The feed re-fetches — wait for animation to settle
- waitForAnimationToEnd

# Tap "Most viewed" again to toggle it off (back to default)
- tapOn:
    text: "Most viewed"
- waitForAnimationToEnd
