appId: com.hatiwal.app
---
# Listing detail — views count is visible and increments on visit

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Scroll down to meta section where views count is shown
- scroll
- waitForAnimationToEnd
# Views count label is visible (e.g. "12 views" or "1 view")
- assertVisible: "view"
# Go back and re-open the same listing — count should increment
- back
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- assertVisible: "view"
