appId: com.hatiwal.app
---
# Listing detail — views count is visible and increments on visit

- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
# Scroll down to meta section where views count is shown
- scroll
- waitForAnimationToEnd
# Views count label is visible (e.g. "12 views" or "1 view")
# Wildcards: the app renders `listing.viewsCount` = "{{count}} views", e.g.
# "17 views", and Maestro text matching is an anchored full-string regex — a bare
# "view" matched nothing. `views?` covers the singular form too.
- assertVisible: ".*views?.*"
# Go back and re-open the same listing — count should increment
- back
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
# Wildcards: the app renders `listing.viewsCount` = "{{count}} views", e.g.
# "17 views", and Maestro text matching is an anchored full-string regex — a bare
# "view" matched nothing. `views?` covers the singular form too.
- assertVisible: ".*views?.*"
