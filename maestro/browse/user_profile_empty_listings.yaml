appId: com.hatiwal.app
---
# A public profile that has NO active listings: shows the empty state.
#
# The old version of this flow could never pass, and not because of a selector.
# Its premise was self-contradictory: it opened a listing from the feed and
# tapped through to THAT LISTING'S SELLER, then asserted the seller has no
# active listings. The listing it arrived from is one. seller@hatiwal.test has
# 14. There is no seed state in which a listing's owner has zero listings.
#
# Reaching a genuinely empty profile needs a user who sells nothing. login.yaml
# defaults to buyer@hatiwal.test, and every profile a BUYER can reach in the UI
# is a seller's — so this flow logs in as the seller instead. Every one of the
# seller's conversation partners (Ahmad x5, Bilal x1) has 0 active listings, so
# any conversation row lands on an empty profile; no fixture id needed.
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: seller@hatiwal.test
      # PASSWORD is left at login.yaml's default (Password123!).

- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd

# Ahmad Karimi SPECIFICALLY, not whichever row happens to be first. The inbox is
# ordered by recent activity, so index 0 changes as other flows send messages, and one
# of the seller's twelve partners is Fatima Rahimi (newbuyer@hatiwal.test) — who owns a
# seeded "Mountain Bike 26-inch Steel Frame". Landing on her profile fails the
# empty-state assertion for a reason that has nothing to do with the screen, which is
# exactly what happened: api_errors 0, "Active Listings" visible, empty state absent.
# Ahmad is buyer@hatiwal.test and has 0 active listings — checked in the DB.
- scrollUntilVisible:
    element:
      text: ".*Ahmad Karimi.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: ".*Ahmad Karimi.*"
- waitForAnimationToEnd
- assertVisible: "Type a message..."

# The header name goes to /(main)/seller/[userId], which renders the same
# UserProfileScreen as /(main)/user/[id] — so the copy below is that screen's.
- tapOn:
    id: "other-participant-name"
- waitForAnimationToEnd

# NOT "Seller Profile" — that is only the LOADING/ERROR header. Once the profile
# loads, HeaderBar shows the person's NAME instead (UserProfile.tsx), so
# asserting the static title is a race the loaded screen always wins.
# "Active Listings" is the literal stat label in ProfileHeader, present on every
# profile whatever its count.
- assertVisible: "Active Listings"

# profile.userProfile.noListings. "No listings yet" (listing.empty.title) is a
# different, unused string — do not swap it back in.
- assertVisible: "No active listings"
- assertVisible: "This seller has no active listings at the moment."
