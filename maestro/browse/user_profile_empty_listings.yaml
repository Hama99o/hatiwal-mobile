appId: com.hatiwal.app
---
# Seller profile with no listings: shows "No listings yet" empty state

- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
# A bare `tapOn: index:` has NO selector: it matches every element on screen,
# so index 0 is whatever lands first in hierarchy order — never the feed card.
# The flow stayed on the feed and failed further down on the detail screen it
# never opened.
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd

# Navigate to a seller whose profile has 0 listings
# The seller row sits below the photo, the price, the description and the views
# chart, so it is off-screen on arrival — and `tapOn` does not scroll to reach
# its target. None of the ten flows that tap this had a scroll; on a tablet the
# hero alone takes 60% of the viewport, which makes it certain.
- scrollUntilVisible:
    element:
      id: "seller-profile-link"
    direction: DOWN
    timeout: 20000
- tapOn:
    # `seller-name` / `seller-identity` do not exist. The seller row on the listing
    # detail screen carries testID="seller-profile-link" (ListingDetail.tsx), which
    # is what the other seven flows already use.
    id: "seller-profile-link"
- waitForAnimationToEnd
# NOT "Seller Profile" — that is only the LOADING/ERROR header. Once the profile
# loads, HeaderBar shows the person's NAME instead (UserProfile.tsx), so asserting
# the static title is a race the loaded screen always wins. "Active Listings" is a
# literal stat label in ProfileHeader and is there for every profile.
- assertVisible: "Active Listings"
# `profile.userProfile.noListings` = "No active listings" is what UserProfile
# renders. "No listings yet" (listing.empty.title / listing.noListings) is dead.
- assertVisible: "No active listings"
