appId: com.hatiwal.app
---
# Edit listing — discard unsaved changes via confirm dialog

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"
# Make a change
- tapOn: "What are you selling?"
- eraseText
- inputText: "Changed Title"
# Try to go back — discard dialog should appear
- back
- waitForAnimationToEnd
- assertVisible: "Discard changes?"
- assertVisible: "Your unsaved changes will be lost."
# Confirm discard
- tapOn: "Discard"
- waitForAnimationToEnd
# Back to My Listings — no changes saved
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
