appId: com.hatiwal.app
---
# Create a listing with EUR currency — verify price displays with € symbol

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# The INPUT by testID, not the label. "Title" / "Description" / "Price" are
# non-interactive Text labels above their fields, so tapping one focuses
# nothing and the inputText that follows goes nowhere. A testID also works when
# the field already HAS a value (draft restore, edit), where the placeholder is
# no longer on screen.
- tapOn:
    id: "listing-form-title-input"
- inputText: "EUR Currency Test Item"
# The INPUT by testID — see the note on the title field.
- tapOn:
    id: "listing-form-price-input"
- inputText: "250"
# Open currency picker and select EUR
# Currency by testID, not by label. The rows read "AFN – Afghani" / "USD – US
# Dollar" in English but "افغاني" / "امریکايي ډالر" in Pashto — the code is not in
# the translated string at all, so every text selector here was English-only.
- tapOn:
    id: "listing-form-currency-trigger"
- waitForAnimationToEnd
# The row reads "EUR – Euro" (en dash) — this flow already says so two lines
# down for the tap, but asserted the bare code, which anchored matching rejects.
- assertVisible:
    id: "listing-form-currency-EUR"
# The currency SHEET rows read "USD – US Dollar" / "EUR – Euro" (en dash).
# Maestro anchors its text regex, so a bare code cannot match the row.
- tapOn:
    id: "listing-form-currency-EUR"
- waitForAnimationToEnd
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
# Save as draft
# The button is "Save Draft" (listing.form.saveDraft).
- tapOn: "Save Draft"
- waitForAnimationToEnd
# After "Save Draft" the toast is `listing.form.savedDraft` = "Draft saved".
# "Listing saved" exists nowhere ("Changes saved" is the EDIT toast).
- assertVisible: "Draft saved"

# BACK FIRST. Saving a draft navigates to the listing DETAIL screen, which is not a
# tab route — so the tab bar is not on screen and `browse-tab` was simply not there
# ("Element not found: Id matching regex: browse-tab"), after the flow had already
# done everything right and created the listing (201 in the Rails log).
- back
- waitForAnimationToEnd

# Find it in My Shop and verify EUR price. In SELLER mode the `browse` route is
# relabelled "My Shop" (tabs/_layout.tsx: title = isSeller ? sidebar.myListings :
# sidebar.browse), so this id is correct here — it is the same tab.
- extendedWaitUntil:
    visible:
      id: "browse-tab"
    timeout: 20000
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# SEARCH for it. My Shop's list is virtualised, so a card that has not been rendered
# yet is absent from the hierarchy entirely — which is why this failed with "Element
# not found" rather than "No visible element found", and why the new draft's position
# among the seller's dozen listings mattered.
- tapOn: "Search my listings..."
- inputText: "EUR Currency Test Item"
- waitForAnimationToEnd
# By CARD testID, not the title: the title is now sitting in the search box, higher in
# the hierarchy than the results, so a text match lands on the input.
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd
# Price should display with EUR formatting
# Wildcards: Intl formats the amount and the symbol into ONE node ("€250.00"), so
# neither bare literal can match an anchored full-string regex. Two assertions rather
# than one combined pattern, because the symbol's side varies by locale.
- assertVisible: ".*250.*"
- assertVisible: ".*€.*"
