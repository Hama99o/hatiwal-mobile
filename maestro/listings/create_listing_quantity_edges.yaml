appId: com.hatiwal.app
---
# Quantity EDGE CASES on create — docs/SPIKE_LISTING_QUANTITY.md.
# Schema: `z.number().int().min(1).max(999)`, default 1.
#
# The governing rule of the whole feature is that a seller with ONE item is never
# asked about quantity. So the first thing this asserts is an ABSENCE: no
# quantity input until the toggle is on. If that ever regresses, every ordinary
# seller pays for a feature they do not use.
#
# Covered here:
#   - quantity input hidden until "I have more than one" is on
#   - toggling on reveals it, toggling off hides it again
#   - 0 and 1 are rejected as "more than one" is meaningless there
#   - 999 (the maximum) is accepted
#   - a value past the maximum is refused
#
# The toggle row is tapped by testID because the whole row is pressable and the
# label appears twice in the accessibility tree otherwise (UI-012).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Quantity Edge Case Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "250"

# ── THE GOVERNING RULE: nothing to see for a single item ────────────────────
- scrollUntilVisible:
    element:
      id: "listing-form-quantity-row"
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: "listing-form-quantity-input"

# ── Toggling on reveals the field ───────────────────────────────────────────
- tapOn:
    id: "listing-form-quantity-row"
- waitForAnimationToEnd
- assertVisible:
    id: "listing-form-quantity-input"

# ── The maximum, 999, is accepted ───────────────────────────────────────────
# NO `eraseText` on this field, and the reason is a real app behaviour worth
# knowing: its onChange maps an empty string to 1
# (`field.onChange(digits === "" ? 1 : Number(digits))`), a deliberate guard
# against an empty numeric value. So erasing leaves "1" on screen, and typing
# then APPENDS — "999" became "1999", and this assertion failed on a field that
# had accepted every keystroke.
#
# The field carries `selectTextOnFocus`, so a tap already selects the whole value
# and typing replaces it. That is also what a real seller gets.
- tapOn:
    id: "listing-form-quantity-input"
- inputText: "999"
- assertVisible: "999"

# ── Past the maximum is refused AT SUBMIT ───────────────────────────────────
# The input does not clamp, and it is not supposed to: `z.number().int().min(1)
# .max(999)` refuses the value when the form is submitted. So the honest
# assertion is that SAVING is refused and says why — not that the field silently
# rewrites what the seller typed. (The earlier version expected clamping "or" the
# 4th digit being dropped; neither happens, so it could only ever fail.)
# eraseText first. `selectTextOnFocus` fires on a FOCUS CHANGE, and this field is
# already focused from typing 999 above — so tapping it only moves the caret and
# the next inputText APPENDS: the field held "9991000", and `assertVisible: "1000"`
# (anchored) correctly refused to match it. That is the same pre-fill hazard the
# component documents at this input (UI-008), reproduced by a flow rather than a
# seller.
- tapOn:
    id: "listing-form-quantity-input"
- eraseText
- inputText: "1000"
- assertVisible: "1000"
- tapOn: "Save Draft"
- waitForAnimationToEnd
# Still on the form, with the listing unsaved — a quantity of 1000 must not go
# through, and the seller must not be left guessing.
- assertVisible: "Create Listing"
# ...and the flow now PROVES the second half of that sentence. The field carried no
# inline error until today, so the only feedback was the generic "Please check the
# highlighted fields before continuing" with nothing highlighted — refused, but
# unexplained. Asserting the specific message is what stops that regressing.
- assertVisible: "Enter a number between 1 and 999."

# ── Toggling back off hides the field again ─────────────────────────────────
# The listing must fall back to a single unit, not keep a stale 999 hidden.
- tapOn:
    id: "listing-form-quantity-row"
- waitForAnimationToEnd
- assertNotVisible:
    id: "listing-form-quantity-input"
