appId: com.hatiwal.app
---
# Edit a draft listing — change title and price, verify updated.
#
# SELF-CONTAINED, and it has to be. The previous version edited whichever draft
# came first, which in practice is the SEEDED "iPhone 12 Pro - 128GB", and RENAMED
# it to "iPhone 12 Pro - 256GB (Updated)". create_listing.yaml and
# delete_listing.yaml both reference that seeded title, so this flow silently broke
# them for the rest of the cycle — a fixture mutation that shows up as two
# unrelated flows failing later.
#
# It now creates its own draft and edits that.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Create the draft this flow will edit ────────────────────────────────────
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
- tapOn:
    id: "listing-form-title-input"
- eraseText
- inputText: "QA Edit Target Original"
- tapOn:
    id: "listing-form-price-input"
- eraseText
- inputText: "12000"
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# A LEAF: every top-level category has children.
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
- tapOn: "Save Draft"
- waitForAnimationToEnd

# ── Reopen it ───────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "QA Edit Target Original"
    timeout: 30000
- tapOn: "QA Edit Target Original"
- waitForAnimationToEnd
# "Edit" is not ON the detail screen — it is an item INSIDE the More sheet.
# useListingLifecycle builds it into `moreActions` (key "edit", label common.edit),
# alongside Duplicate and Delete. So no amount of scrolling the page finds it; the
# sheet has to be opened first, via `lifecycle-more-action`.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"
# Change title
- tapOn:
    id: "listing-form-title-input"
- eraseText
- inputText: "QA Edit Target Renamed"
# Change price
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "28000"
# Save
- tapOn: "Save Draft"
- waitForAnimationToEnd
# Verify updated values shown
- assertVisible: "QA Edit Target Renamed"
