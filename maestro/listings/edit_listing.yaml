appId: com.hatiwal.app
---
# Edit existing draft listing — change title and price, verify updated

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Tap on first draft listing
- tapOn: "Draft"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 20000
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"
# Change title
- tapOn:
    text: "iPhone 12 Pro - 128GB"
    optional: true
- eraseText
- inputText: "iPhone 12 Pro - 256GB (Updated)"
# Change price
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "28000"
# Save
- tapOn: "Save Draft"
- waitForAnimationToEnd
# Verify updated values shown
- assertVisible: "iPhone 12 Pro - 256GB (Updated)"
