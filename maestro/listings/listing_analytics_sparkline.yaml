appId: com.hatiwal.app
---
# Seller listing analytics — daily views sparkline
#
# Tests:
#   happy path  → sparkline section visible on MyListingDetail
#   empty state → no views yet message when all counts are 0
#   skeleton    → loading bars shown while data is fetching
#
# Prerequisites: a listing with some views in the last 7 days
# should show the sparkline; a brand-new listing may show the empty state.

- runFlow: ../_helpers/login_seller.yaml

# ── Navigate to My Listings and open the first listing ──────────────────────
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"

# Open first listing card
# The card itself, not one of its action buttons. A bare `tapOn: index: 0` has no
# selector: it matches every element on screen, so this tapped whatever landed at
# hierarchy position 0 — usually a header, never the card.
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd

# Owner detail scroll is present
- assertVisible:
    id: "my-listing-detail-scroll"

# Wait for analytics section to load (network fetch)
- waitForAnimationToEnd

# ── Happy path: sparkline or empty state is visible ─────────────────────────
# Either the sparkline chart OR the "no views yet" empty state should be
# present — both are valid depending on how many views the listing has.
# Maestro has no `selectorExists()` in its JS sandbox (nor `visible()`), so this
# raised "TypeError: undefined is not a function" rather than asserting anything.
# The second argument made it doubly wrong: 'listing.ownerDetail.noViewsYet' is a
# TRANSLATION KEY, and the screen renders the resolved string.
# Expressed with a native conditional instead: the chart is absent only when there
# is nothing to plot, and then the empty state has to be there.
- runFlow:
    when:
      notVisible:
        id: "views-sparkline"
    commands:
      - assertVisible: "No views yet in the last 7 days"

# ── Verify analytics stats row is still present ──────────────────────────────
- assertVisible:
    id: "analytics-views"
- assertVisible:
    id: "analytics-conversations"

# ── Navigate back ─────────────────────────────────────────────────────────────
- back
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
