appId: com.hatiwal.app
---
# Create listing with photos — picker opens, photos appear in preview

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Tap add photos
- tapOn: "Add Photos"
- waitForAnimationToEnd
# Photo picker opens — select from gallery
- tapOn: "Gallery"
- waitForAnimationToEnd
# Select first available photo (Maestro picks the first in the media library)
- tapOn:
    index: 0
- waitForAnimationToEnd
# Photo preview should be visible
- assertVisible: "Cover"
# Add title and price to make it submittable
- tapOn: "What are you selling?"
- inputText: "Laptop HP"
- tapOn: "Enter price"
- inputText: "45000"
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
- tapOn: "Save Draft"
- waitForAnimationToEnd
# TASK-J952: lands on the listing's own owner detail (never the My Listings
# list) — the title is visible right there with the Draft badge.
- assertVisible: "Laptop HP"
- assertVisible: "Draft"
