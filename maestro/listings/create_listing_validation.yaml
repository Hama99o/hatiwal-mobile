appId: com.hatiwal.app
---
# Validation: required fields show errors on empty submit

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Submit empty form
- tapOn: "Save Draft"
- assertVisible: "Title is required (max 150 characters)"
# Fill title but no price
- tapOn: "What are you selling?"
- inputText: "Test Item"
- tapOn: "Save Draft"
- assertVisible: "Enter a valid price greater than 0"
# Fill price = 0
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- inputText: "0"
- tapOn: "Save Draft"
- assertVisible: "Enter a valid price greater than 0"
# No category
- eraseText
- inputText: "100"
- tapOn: "Save Draft"
- assertVisible: "Please select a category"
