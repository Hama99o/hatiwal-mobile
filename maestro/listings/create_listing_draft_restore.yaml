appId: com.hatiwal.app
---
# Draft flow: create → save as draft → verify in My Listings with Draft badge → publish

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- tapOn: "Title"
- inputText: "Draft Test Listing"

- tapOn: "Description"
- inputText: "This is a draft"

- tapOn: "Price"
- inputText: "5000"

- tapOn: "Category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd

# Save as draft
- tapOn: "Save as Draft"
- waitForAnimationToEnd
- assertVisible: "Saved as draft"

# My Listings → Drafts tab
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Drafts"
- waitForAnimationToEnd
- assertVisible: "Draft Test Listing"
- assertVisible: "Draft"

# Open draft → Publish
- tapOn: "Draft Test Listing"
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd
- assertVisible: "Listing posted"

# Now shows in Active tab
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Draft Test Listing"
- assertVisible: "Active"
