appId: com.hatiwal.app
---
# Create a MULTI-UNIT listing — docs/SPIKE_LISTING_QUANTITY.md, Tier 1.
#
# The creation half of the feature had no flow at all: every create_listing_*
# flow predates quantity, so nothing exercised the toggle or proved the number
# reaches the API. This covers both halves of the spike's governing rule in one
# pass:
#
#   1. the toggle is OFF by default, so a seller with one item is asked nothing
#      new — asserted by the field's ABSENCE before the toggle is touched
#   2. turning it on, typing 15, and saving produces a listing that actually
#      says "15 in stock"
#
# Login is explicit rather than via ../_helpers/login_seller.yaml: that helper is
# still on the pre-rig shape (`clearState: true` with no open_bundle.yaml) and
# lands in the expo-dev-client launcher — see qa/UI_FINDINGS.md.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- tapOn:
    id: "login-email-input"
- inputText: "seller@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000

# Seller mode
- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Switch to Seller Mode"
    commands:
      - tapOn: "Switch to Seller Mode"
      - waitForAnimationToEnd
- assertVisible: "Switch to Buyer Mode"

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# "New", not "Post a listing" — the My Shop header button is labelled `New`
# (the `postListing` string is the empty-state CTA, which is why the older
# create flows tap a label that is not on a populated shop).
- tapOn: "New"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "QA Phone Cases Bulk 15"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    centerElement: true
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "400"
# Dismiss the keypad by tapping the screen heading, never the hide-keyboard
# command: on Android that sends BACK, and a dirty form intercepts BACK as
# "leave the screen" — so it raises "Discard changes?" over everything and the
# next step fails on a dialog instead of the form (run-034). Tapping an inert
# heading blurs the field with no navigation.
- tapOn: "Create Listing"

- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# "Electronics" is a PARENT — tapping it drills into subcategories rather than
# selecting, so the picker sheet stays open over the form. A leaf has to be
# chosen. (create_listing.yaml and friends stop at the parent and then act on a
# form the sheet is still covering — same latent bug, noted in qa/UI_FINDINGS.md.)
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Accessories"
- waitForAnimationToEnd

# ── THE GOVERNING RULE ──────────────────────────────────────────────────────
# Before the toggle is touched there must be NO quantity field: a seller with
# one item must never see that this feature exists.
- scrollUntilVisible:
    element:
      text: "I have more than one"
    direction: DOWN
    timeout: 10000
- assertNotVisible:
    id: "listing-form-quantity-input"

# Turn it on — the field appears, pre-filled "2" (flipping the switch already
# means "more than one", so the next keystroke just fixes the number).
# The switch by testID, not the label text: both carry the same
# accessibilityLabel, and Maestro matches the visible Text — which used to be
# inert, so the tap did nothing (run-038). The row is pressable now too, but a
# flow should target the control it means.
- tapOn:
    id: "listing-form-quantity-switch"
- waitForAnimationToEnd
- assertVisible:
    id: "listing-form-quantity-input"

- tapOn:
    id: "listing-form-quantity-input"
- inputText: "15"
- tapOn: "Create Listing"
# Prove the field holds 15 and not "215" — the pre-filled "2" must be replaced,
# the same hazard that sold a whole batch in run-018.
- assertVisible:
    id: "listing-form-quantity-input"
    text: "15"

- scrollUntilVisible:
    element:
      text: "Describe your item..."
    direction: DOWN
    centerElement: true
    timeout: 10000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Describe your item..."
- eraseText
- inputText: "QA fixture — a box of 15 identical cases."

# Straight to Save Draft — no keyboard dance needed. It lives in the FIXED top
# toolbar beside Publish, which the keypad never covers and scrolling never
# moves; the earlier "tap the heading to blur" trick only worked while that
# heading happened to be on screen (run-040).
- tapOn: "Save Draft"
- waitForAnimationToEnd

# Saving a new listing lands on its own owner detail (TASK-J952).
- assertVisible: "QA Phone Cases Bulk 15"
- assertVisible: "Draft"

# The count survived the round trip and the seller can see it. "in stock", not
# "of 15 left" — nothing has sold, so the progress phrasing would just repeat
# itself (UI-009).
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: "15 in stock"
# And the price is marked per-unit, so 400 cannot be read as the price of the box.
- assertVisible: "each"
