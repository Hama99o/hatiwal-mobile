appId: com.hatiwal.app
---
# Edit listing: remove a photo — photo count decreases, saved successfully

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
    # centerElement: `scrollUntilVisible` stops the moment the target enters the view
    # tree, which can leave it at the very bottom — under the FloatingTabBar, which
    # overlays that edge. Maestro taps an element CENTRE, so the tap lands on the tab
    # bar and nothing happens. That cost two seller flows ~7 minutes each, failing
    # inside the language helper on a row that was demonstrably on screen.
    centerElement: true
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"
- assertVisible: "Photos"

# Tap the delete/X button on first photo
- tapOn:
# Every photo tile's remove control shares the id "listing-form-photo-remove";
    # "photo-delete-0" existed nowhere. `index` picks the first tile's.
    id: "listing-form-photo-remove"
    index: 0
- waitForAnimationToEnd
# Confirm deletion if prompted
- tapOn: "Remove"
- waitForAnimationToEnd

# Save
- tapOn: "Save Changes"
- waitForAnimationToEnd
- assertVisible: "Changes saved"
