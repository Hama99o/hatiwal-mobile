appId: com.hatiwal.app
---
# Edit listing: remove a photo — photo count decreases, saved successfully

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
# The LIST-side route. `lifecycle-more-action` exists only on MyListingDetail
# (MyListingDetail.tsx:553) and this flow never opens a listing — it goes from My Shop's
# list straight to scrolling for a detail-screen control, so the scroll burned its full
# 20s and reported "No visible element found" for something never on this screen.
# gallery/listing_edit_add_photos.yaml already had the working route from here: the
# card's own ⋮ opens the same actions, by testID rather than the word "Edit".
- scrollUntilVisible:
    element:
      id: "seller-listing-card"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-card-more-action"
    index: 0
- waitForAnimationToEnd
- tapOn:
    id: "listing-action-edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# ── Guarantee there IS a photo to remove ─────────────────
# The flow edits whichever listing is first in My Shop, and that one need not have any
# photos — the list's first card is often a draft with the "No photo" placeholder. That
# is what failed: "Element not found: Id matching regex: listing-form-photo-remove",
# because there was no tile to remove.
#
# Attaching one first makes the flow self-contained instead of depending on which
# listing happens to rank first. No seeded fixture can carry this: the only photo-
# bearing seeded listing is the Lenovo, which eight flows share and two of them sell,
# and "Samsung Galaxy S22" only exists after two other create flows have run.
- tapOn: "Add Photos"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- waitForAnimationToEnd
- assertVisible:
    id: "listing-form-photo-remove"
    index: 0
# By testID. FieldLabel renders a required field's label plus a nested
# `<Text> *</Text>`, so the node reads "Photos *" and an anchored regex on the bare
# word cannot match it.
- assertVisible:
    id: "listing-form-field-photos"

# Tap the delete/X button on first photo
- tapOn:
# Every photo tile's remove control shares the id "listing-form-photo-remove";
    # "photo-delete-0" existed nowhere. `index` picks the first tile's.
    id: "listing-form-photo-remove"
    index: 0
- waitForAnimationToEnd
# No confirmation step. Nothing prompts: removePhoto (PhotosSection.tsx:210) drops the
# photo straight out of the array —
#     onChange(photos.filter((_, i) => i !== index))
# — with no dialog, so `tapOn: "Remove"` was reaching for a button that never appears
# and failed with "Element not found". The comment above it said "if prompted", which
# was an assumption rather than an observation, and an unconditional tap made it a
# requirement.
- waitForAnimationToEnd

# Save
# "Save", not "Save Changes". No such string exists in the locale files: editing a
# PUBLISHED listing submits through `common.save` = "Save" (ListingForm.tsx, the
# onSavePublished button). The only near neighbours are listing.form.saveDraft
# ("Save Draft") and the toast listing.form.saved ("Changes saved") — which this flow
# asserts afterwards, and which is probably where "Save Changes" came from.
- tapOn: "Save"
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST from toast.success in
# ListingForm.tsx and it lives a few seconds. A plain assert races that window and
# loses under load — which is how create_listing_draft_restore failed here, with the
# draft itself created correctly. extendedWaitUntil polls, so it can only ever wait
# longer, never less.
# ("Offer accepted"/"Offer declined" are NOT converted: those strings are also the
# offer bubble's own outcome label, so they are durable rather than transient.)
- extendedWaitUntil:
    visible: "Changes saved"
    timeout: 15000
