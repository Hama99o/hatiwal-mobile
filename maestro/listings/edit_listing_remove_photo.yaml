appId: com.hatiwal.app
---
# Edit listing: remove a photo — photo count decreases, saved successfully

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 20000
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"
- assertVisible: "Photos"

# Tap the delete/X button on first photo
- tapOn:
    id: "photo-delete-0"
- waitForAnimationToEnd
# Confirm deletion if prompted
- tapOn: "Remove"
- waitForAnimationToEnd

# Save
- tapOn: "Save Changes"
- waitForAnimationToEnd
- assertVisible: "Changes saved"
