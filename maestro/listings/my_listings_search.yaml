appId: com.hatiwal.app
---
# My Listings — search within seller's own listings

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
# Search for known listing
- tapOn: "Search my listings..."
- inputText: "iPhone"
- waitForAnimationToEnd
- assertVisible: "iPhone"
# Search for something that doesn't exist
- eraseText
- inputText: "xyznonexistent"
- waitForAnimationToEnd
# Empty state shown
# NOT "No". Matching is an anchored full-string regex, so that needs a node whose
# whole text is the two letters "No" — nothing renders that. (The flow lint missed it
# because it skips literals of two characters or fewer.)
# Asserting the ABSENCE of cards instead of the empty-state copy: it is the same claim,
# it does not depend on which empty string this screen picks for a no-match search, and
# it stays true if that copy is reworded.
- assertNotVisible:
    id: "seller-listing-card"
# Clear search
- eraseText
- waitForAnimationToEnd
# CLOSE THE IME BEFORE LOOKING FOR THE TAB BAR. "My Shop" is the BOTTOM TAB's
# label (sidebar.myListings), and `eraseText` does not dismiss the keyboard — so
# the tab bar is still covered and assertVisible, which means ON SCREEN, fails on
# a label that is exactly where it should be. run-528's end-of-flow screenshot is
# this screen with the search field focused, the keypad over the lower half, and
# one card showing.
#
# `pressKey: Enter`, never `hideKeyboard`: on Android hideKeyboard is BACK, which
# would leave the screen entirely. This is the same technique
# _helpers/open_listing_by_title.yaml settled on for the Bazaar grid.
#
# The identical assert at the TOP of this flow passes, because nothing has
# focused the search field yet.
- pressKey: Enter
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
