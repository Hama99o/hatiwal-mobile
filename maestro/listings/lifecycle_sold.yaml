appId: com.hatiwal.app
---
# Lifecycle: reserved → sold
#
# TASK-TX01: "Mark as Sold" now opens the BuyerPickerSheet instead of a plain
# confirmAlert. This flow exercises the legacy "Sold to someone not on Hatiwal" path
# (no buyer recorded) — the buyer-recorded path is covered by
# ../seller/mark_sold_with_buyer.yaml.

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Find a reserved listing
# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, precisely so this flow can ruin it without touching a
# fixture anything else asserts on. It used to act on "whichever listing comes
# first", which was a shared one.
- tapOn: "Search my listings..."
- eraseText
- inputText: "QA Disposable lifecycle_sold"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable lifecycle_sold"
      timeout: 30000
# With the search working (the API used to drop it — UI-031), the list holds
# exactly ONE card, so its own action button is unambiguous and there is no need
# to open the detail at all. Tapping the title did not navigate anyway: after
# typing, the first tap outside the field goes to dismissing the IME, so the flow
# stayed on the list and then looked for the DETAIL's `lifecycle-primary-action`.
# Verified by screenshot — header "1 listing", one card, still on My Shop.
- tapOn:
    id: "seller-card-primary-action"
    index: 0
- waitForAnimationToEnd
# BuyerPickerSheet opens
- assertVisible: "Who bought this item?"
- tapOn: "Sold to someone not on Hatiwal"
- tapOn: "Confirm sold"
- waitForAnimationToEnd
# Status changed
- assertVisible: "Listing marked as sold"
- assertVisible: "Sold"
