appId: com.hatiwal.app
---
# My Listings — filter by status tab (All / Draft / Active / Reserved / Sold)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
# Default tab shows All
- assertVisible: "All"
# Tap Draft tab
- tapOn: "Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
# Tap Active tab
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Active"
# Tap Reserved tab
- tapOn: "Reserved"
- waitForAnimationToEnd
- assertVisible: "Reserved"
# Tap Sold tab
- tapOn: "Sold"
- waitForAnimationToEnd
- assertVisible: "Sold"
# Back to All
- tapOn: "All"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
