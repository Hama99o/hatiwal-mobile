appId: com.hatiwal.app
---
# My Listings — filter by status tab (All / Draft / Active / Reserved / Sold)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
# Default tab shows All
- assertVisible: "All"
# Tap Draft tab
- tapOn:
    id: "my-listings-status-draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
# Tap Active tab
- tapOn:
    id: "my-listings-status-active"
- waitForAnimationToEnd
- assertVisible: "Active"
# Tap Reserved tab
- tapOn:
    id: "my-listings-status-reserved"
- waitForAnimationToEnd
- assertVisible: "Reserved"
# Tap Sold tab
# SCROLL right first: "Sold" is the last of six tabs in a horizontal scroller and sits
# past the right edge, where Android's accessibility tree omits it. Proven by
# listing_status_counts, which reached every earlier tab and failed with "Element not
# found" on this one.
# SWIPE ON THE TAB ROW, not scrollUntilVisible. That helper swipes at screen CENTRE,
# which on this screen is over the listing cards — the thin tab strip never moved, and
# the error merely changed from "Element not found" to "No visible element found".
# `swipe: from:` anchors the gesture to an element, so the drag happens inside the
# horizontal scroller. Two swipes because one may not clear the last tab, and a swipe
# with nothing left to scroll is a no-op rather than an error.
# A COORDINATE swipe across the tab row. Two things did not work first:
#   scrollUntilVisible direction: RIGHT — it swipes at screen CENTRE, which here is over
#     the listing cards, so the thin tab strip never moved. The error only changed from
#     "Element not found" to "No visible element found".
#   swipe: from: <selector> — semantic and self-documenting, but nothing in this repo
#     has ever run it (the only other uses are two never-executed pagination flows), and
#     an unsupported property fails the whole flow rather than the step.
# `start`/`end` is a field the bundled maestro-cli 2.7.0 does carry. The row sits at a
# stable ~14% of screen height — directly under the search bar, above the first card —
# measured off qa/reports/run-252/listings/screens/delete_listing.png.
- swipe:
    start: "85%, 14%"
    end: "20%, 14%"
- waitForAnimationToEnd
- swipe:
    start: "85%, 14%"
    end: "20%, 14%"
- waitForAnimationToEnd
- tapOn:
    id: "my-listings-status-sold"
- waitForAnimationToEnd
- assertVisible: "Sold"
# Back to All
- tapOn:
    id: "my-listings-status-all"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
