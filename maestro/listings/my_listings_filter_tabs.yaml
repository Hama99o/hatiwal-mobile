appId: com.hatiwal.app
---
# My Listings — filter by status tab (All / Draft / Active / Reserved / Sold)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
# Default tab shows All
- assertVisible: "All"
# Tap Draft tab
- tapOn: "Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"
# Tap Active tab
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Active"
# Tap Reserved tab
- tapOn: "Reserved"
- waitForAnimationToEnd
- assertVisible: "Reserved"
# Tap Sold tab
# SCROLL right first: "Sold" is the last of six tabs in a horizontal scroller and sits
# past the right edge, where Android's accessibility tree omits it. Proven by
# listing_status_counts, which reached every earlier tab and failed with "Element not
# found" on this one.
- scrollUntilVisible:
    element:
      text: "Sold"
    direction: RIGHT
    timeout: 15000
- tapOn: "Sold"
- waitForAnimationToEnd
- assertVisible: "Sold"
# Back to All
- tapOn: "All"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
