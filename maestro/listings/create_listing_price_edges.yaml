appId: com.hatiwal.app
---
# Price EDGE CASES on create. Schema: positive, and at most MAX_LISTING_PRICE
# (9,999,999,999.99).
#
# The point of this flow is the DISTINCTION between the two failures. An
# over-large price reports zod issue "too_big", and ListingForm maps that to
# "Price is too high. Enter a smaller amount." — because showing the
# greater-than-zero message for a huge number tells the seller the opposite of
# what is wrong. A flow that only checked "some error appeared" would not notice
# if that mapping broke.
#
# Covered here:
#   - price 0            -> "Enter a valid price greater than 0"
#   - price over the max -> "Price is too high…"  (NOT the greater-than-0 text)
#   - a normal price     -> neither error

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# waitForAnimationToEnd between the tap and the typing: Maestro types the instant
# the tap returns, and the first character can land before the field has focus.
# Seen on device — "Abroad Location Item" was saved as "Broad Location Item",
# and the flow then failed four minutes later asserting the title it typed.
# Not an app bug: the field is a plain react-hook-form Controller with no
# remount or debounce, and no human types within a frame of tapping.
- tapOn: "What are you selling?"
- waitForAnimationToEnd
- inputText: "Price Edge Case Item"

# ── Zero is not a price ─────────────────────────────────────────────────────
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# waitForAnimationToEnd between the tap and the typing: Maestro types the instant
# the tap returns, and the first character can land before the field has focus.
# Seen on device — "Abroad Location Item" was saved as "Broad Location Item",
# and the flow then failed four minutes later asserting the title it typed.
# Not an app bug: the field is a plain react-hook-form Controller with no
# remount or debounce, and no human types within a frame of tapping.
- tapOn: "Enter price"
- waitForAnimationToEnd
- inputText: "0"
- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Enter a valid price greater than 0"

# ── Over the maximum reports the RIGHT error ────────────────────────────────
# 11 digits — one order of magnitude past MAX_LISTING_PRICE.
# Scroll to the price field again — see the note above.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "99999999999"
- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Price is too high. Enter a smaller amount."
# The two messages must not be confused for each other.
- assertNotVisible: "Enter a valid price greater than 0"

# ── A normal price clears both ──────────────────────────────────────────────
# Scroll to the price field again — see the note above.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- eraseText
- inputText: "1200"
- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertNotVisible: "Price is too high. Enter a smaller amount."
- assertNotVisible: "Enter a valid price greater than 0"
# Reaches the next blocker, which proves the price was accepted.
- assertVisible: "Please select a category"
