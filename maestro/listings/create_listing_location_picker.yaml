appId: com.hatiwal.app
---
# Create listing: open location picker, scroll, select Kandahar, verify on listing

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd

- tapOn: "Title"
- inputText: "Kandahar Location Test"

- tapOn: "Price"
- inputText: "3000"

# The category FIELD is tapped by its placeholder, "Tap to select category"
# (listing.form.selectCategoryPlaceholder). "Category" is not a label the form
# renders, so this never opened the picker.
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# "Clothes" is not a category — it is "Clothes & Fashion", and Maestro matches an
# anchored regex. Using Electronics -> Phones & Tablets for the same reason the
# other create flows do: a top-level category only DRILLS IN, so a leaf is needed.
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

- tapOn: "Location"
- waitForAnimationToEnd
# Location sheet / picker opens
- assertVisible: "Kabul"
- assertVisible: "Kandahar"
- tapOn: "Kandahar"
- waitForAnimationToEnd

# Location field shows Kandahar
- assertVisible: "Kandahar"

- tapOn: "Post Listing"
- waitForAnimationToEnd
- assertVisible: "Listing posted"

# Open listing — location shown
- tapOn: "Kandahar Location Test"
- waitForAnimationToEnd
- assertVisible: "Kandahar"
