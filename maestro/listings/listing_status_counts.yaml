appId: com.hatiwal.app
---
# My Listings — status tab count badges
# Verifies that each status tab pill shows a numeric count next to its label.
# The count appears as soon as the screen loads (parallel fetch with the list).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# The "All" tab is selected by default; it must display a numeric count.
# Maestro's assertVisible matches any visible text — the number will be present
# next to the "All" label as a sibling Text node.
- assertVisible: "All"

# Tap the Draft tab and assert its count renders (any digit is acceptable).
- tapOn: "Draft"
- waitForAnimationToEnd
- assertVisible: "Draft"

# Tap the Active tab and assert it shows.
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Active"

# Tap the Expired tab.
- tapOn: "Expired"
- waitForAnimationToEnd
- assertVisible: "Expired"

# Tap Reserved.
- tapOn: "Reserved"
- waitForAnimationToEnd
- assertVisible: "Reserved"

# Tap Sold.
# SCROLL the tab row right first. "Sold" is the last of six tabs in a horizontal
# scroller (MyListings.tsx:251, STATUS_TABS at line 24) and sits past the right edge —
# the screenshot of My Shop cuts off mid-"Reserved". Android's accessibility tree omits
# children clipped outside a horizontal scroller's viewport, which is why this reported
# "Element not found" rather than "No visible element found", and why every earlier tab
# in the same row was tappable.
- scrollUntilVisible:
    element:
      text: "Sold"
    direction: RIGHT
    timeout: 15000
- tapOn: "Sold"
- waitForAnimationToEnd
- assertVisible: "Sold"

# Return to All — counts remain stable after tab switching.
- tapOn: "All"
- waitForAnimationToEnd
- assertVisible: "All"
