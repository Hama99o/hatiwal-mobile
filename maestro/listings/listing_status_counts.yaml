appId: com.hatiwal.app
---
# My Listings — status tab count badges
# Verifies that each status tab pill shows a numeric count next to its label.
# The count appears as soon as the screen loads (parallel fetch with the list).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# The "All" tab is selected by default; it must display a numeric count.
# Maestro's assertVisible matches any visible text — the number will be present
# next to the "All" label as a sibling Text node.
- assertVisible: "All"

# Tap the Draft tab and assert its count renders (any digit is acceptable).
- tapOn:
    id: "my-listings-status-draft"
- waitForAnimationToEnd
- assertVisible: "Draft"

# Tap the Active tab and assert it shows.
- tapOn:
    id: "my-listings-status-active"
- waitForAnimationToEnd
- assertVisible: "Active"

# Tap the Expired tab.
- tapOn:
    id: "my-listings-status-expired"
- waitForAnimationToEnd
- assertVisible: "Expired"

# SF-M1 (Sell Flow Redesign) dropped "Reserved" from STATUS_TABS entirely —
# a held listing now shows under Active with its own hold badge instead of a
# dedicated tab (docs/SELL_FLOW_REDESIGN.md §4.5). The tab, and its
# `my-listings-status-reserved` testID, no longer exist — asserted here so a
# regression (the tab quietly coming back) fails loudly instead of drifting
# back in unnoticed.
- assertNotVisible:
    id: "my-listings-status-reserved"

# Tap Sold.
# SCROLL the tab row right first. STATUS_TABS is now five tabs — all, draft,
# active, expired, sold (MyListings.tsx STATUS_TABS, "reserved" dropped by
# SF-M1) — and "Sold" is still the LAST one, still past the right edge on a
# typical phone width. Android's accessibility tree omits
# children clipped outside a horizontal scroller's viewport, which is why this reported
# "Element not found" rather than "No visible element found", and why every earlier tab
# in the same row was tappable.
# SWIPE ON THE TAB ROW, not scrollUntilVisible. That helper swipes at screen CENTRE,
# which on this screen is over the listing cards — the thin tab strip never moved, and
# the error merely changed from "Element not found" to "No visible element found".
# `swipe: from:` anchors the gesture to an element, so the drag happens inside the
# horizontal scroller. Two swipes because one may not clear the last tab, and a swipe
# with nothing left to scroll is a no-op rather than an error.
# A COORDINATE swipe across the tab row. Two things did not work first:
#   scrollUntilVisible direction: RIGHT — it swipes at screen CENTRE, which here is over
#     the listing cards, so the thin tab strip never moved. The error only changed from
#     "Element not found" to "No visible element found".
#   swipe: from: <selector> — semantic and self-documenting, but nothing in this repo
#     has ever run it (the only other uses are two never-executed pagination flows), and
#     an unsupported property fails the whole flow rather than the step.
# `start`/`end` is a field the bundled maestro-cli 2.7.0 does carry. The row sits at a
# stable ~14% of screen height — directly under the search bar, above the first card —
# measured off qa/reports/run-252/listings/screens/delete_listing.png.
- swipe:
    start: "85%, 14%"
    end: "20%, 14%"
- waitForAnimationToEnd
- swipe:
    start: "85%, 14%"
    end: "20%, 14%"
- waitForAnimationToEnd
- tapOn:
    id: "my-listings-status-sold"
- waitForAnimationToEnd
- assertVisible: "Sold"

# Return to All — counts remain stable after tab switching.
- tapOn:
    id: "my-listings-status-all"
- waitForAnimationToEnd
- assertVisible: "All"
