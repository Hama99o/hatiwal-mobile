appId: com.hatiwal.app
---
# Lifecycle: active → reserved
#
# TASK-TX01: "Mark as Reserved" now opens the BuyerPickerSheet instead of a
# plain confirmAlert. This flow exercises the legacy skip path — "Sold to
# someone not on Hatiwal" (no buyer recorded) — the buyer-recorded path is covered by
# ../seller/mark_sold_with_buyer.yaml.

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Find an active listing
# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, precisely so this flow can ruin it without touching a
# fixture anything else asserts on. It used to act on "whichever listing comes
# first", which was a shared one.
- tapOn:
    id: "browse-search-bar"
    optional: true
- tapOn: "Search my listings..."
- eraseText
- inputText: "QA Disposable lifecycle_reserve"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable lifecycle_reserve"
      timeout: 30000
- tapOn: "Mark as Reserved"
- waitForAnimationToEnd
# BuyerPickerSheet opens
- assertVisible: "Who's buying this item?"
- tapOn: "Sold to someone not on Hatiwal"
- tapOn: "Confirm reserve"
- waitForAnimationToEnd
# Status changed
- assertVisible: "Listing marked as reserved"
- assertVisible: "Reserved"
