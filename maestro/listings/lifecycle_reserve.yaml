appId: com.hatiwal.app
---
# Lifecycle: active → reserved, via a hold placed from the CHAT THREAD.
#
# SF-M2 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md §4.4.2) removed
# Reserve from every listing surface — there is no "Mark as Reserved" primary
# action or More-sheet entry any more (SF-M1: the primary is always
# "Mark as Sold", live or held). This flow used to tap the card's own
# `seller-card-primary-action` and land in a pick-a-buyer sheet titled "Who's
# buying this item?" — that control now opens the SOLD flow instead ("Who
# bought this item?"), so this is a full rewrite of the MECHANISM, not a copy
# fix. A hold is placed from the chat thread's composer "+" menu now, scoped
# to whichever buyer the seller is already talking to
# (ComposerActionsSheet's "Place a hold for {name}" row) — generalizing the
# exact confirm-mode BuyerPickerSheet mechanism
# ../chat/reserve_after_accept.yaml already proves for the offer-accept
# trigger. This flow proves the same fact as before (an active, single-item
# listing can be held for a specific buyer and its status flips to Reserved)
# through the mechanism that actually exists today.

# ─── Buyer messages the disposable listing, creating a conversation ────────
- runFlow: ../_helpers/login.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn:
    id: "browse-search-input"
- inputText: "QA Disposable lifecycle_reserve"
# PUT THE KEYBOARD AWAY BEFORE TAPPING THE RESULT.
#
# Typing into a search box leaves the IME covering the lower half of the screen,
# and a result card that lands behind it cannot be tapped — Maestro reports the
# tap COMPLETED regardless, because a tap on a covered element always is, so the
# flow continues on a screen it never left and fails later somewhere unrelated.
# That is exactly how seller/reserved_buyer failed in run-490: end-of-flow
# screenshot showing BROWSE, one result card, keyboard over it, and the reported
# failure three steps later on "Make an Offer".
#
# Latent rather than certain — browse/listing_detail_held_units_transparency
# carries this same shape and passes, because its card happens to land above the
# IME. At 360dp the keyboard takes roughly half the window, so the margin is thin
# and the failure is a matter of which result row you get.
#
# `hideKeyboard` is Android's Back and is unsafe in general, but SAFE at exactly
# this point: we have just typed, so the IME is definitely up and Back closes it
# without reaching the app. flow_lint's HIDEKEY rule encodes that precondition.
- hideKeyboard
- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "listing-card"
    timeout: 20000
- tapOn:
    id: "listing-card"
    index: 0
- waitForAnimationToEnd
- runFlow: ../_helpers/open_thread_from_listing.yaml

# ─── Seller places a hold for this buyer from the composer's "+" menu ──────
- runFlow: ../_helpers/login_seller.yaml
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "QA Disposable lifecycle_reserve"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# Wait for the SHEET's contents, not just the animation — ComposerActionsSheet
# is a native Modal and waitForAnimationToEnd returns before its children
# reach the a11y tree (see place_and_release_hold.yaml's own note).
- extendedWaitUntil:
    visible:
      id: "composer-action-place-hold"
    timeout: 15000
- tapOn:
    id: "composer-action-place-hold"
- waitForAnimationToEnd

# Confirm sheet — LOCKED to this thread's own buyer, never a pick-a-buyer list.
- assertVisible: ".*Reserve for.*"
- assertNotVisible: "Who's buying this item?"
- tapOn: "Confirm reserve"
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: ".*reserved.*"
    timeout: 15000

# ─── Status confirmed Reserved on the pinned thread header ─────────────────
- assertVisible: "Reserved"
- assertVisible: "Mark Sold"
