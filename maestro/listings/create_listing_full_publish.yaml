appId: com.hatiwal.app
---
# THE REAL THING: fill everything, pin a location, add a photo, and PUBLISH.
#
# Every other create flow stops at "Save Draft". A draft is deliberately allowed to
# be incomplete — zod gates only title/price/currency/category — so a suite full of
# draft flows never exercises what it actually takes to go LIVE. That is enforced
# separately by `getPublishBlockers({ mode: "publish" })`, and it needs BOTH a map
# pin and at least one photo.
#
# So this is the flow that proves a seller can actually sell something:
#   title → price → currency → condition → category (leaf) → description
#   → location pinned on the map → photo attached → Publish
#   → the listing exists, is ACTIVE, and is not a draft.
#
# Preconditions the rig provides (`qa.sh up`): four photos in the device gallery
# and a GPS fix. Without them this flow fails for device reasons, not app reasons.

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# ── Photo FIRST — it is the form's first section ─────────────────────────────
# ListingForm's own header numbers the sections "1. Photos", and PhotosSection is
# rendered before title/price/category/description/location. The earlier version of
# this flow filled everything else and then scrolled DOWN for the photo button,
# which sits at the TOP: it failed with "No visible element found: id:
# photos-add-button" while the button was simply behind it. Doing photos first
# matches the form AND the order a seller actually works in.
#
# A publish blocker: `getPublishBlockers({ mode: "publish" })` refuses a live
# listing with no photo, which is exactly what this flow exists to prove.
- assertVisible:
    id: "photos-add-button"
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- tapOn:
    text: "Gallery"
    optional: true
- waitForAnimationToEnd
# Selecting an image in the SYSTEM picker. The picker is not our app, so it exposes
# no testIDs; these are the shapes it takes across Android versions, tried in order
# and all optional. The real gate is the thumbnail asserted below.
- tapOn:
    text: "Photo taken on.*"
    optional: true
- tapOn:
    text: "qa_photo.*"
    optional: true
- waitForAnimationToEnd

# CONFIRM the selection. Android's photo picker selects on tap but does NOT
# return until its own button is pressed — a screenshot showed the first photo
# ticked, "Add (1)" waiting at the bottom right, and this flow patiently waiting
# 30s for a thumbnail that could not appear while the picker was still open.
# The label carries the count, hence the regex; "Done" and "Select" are the other
# shapes this button takes across Android versions and picker variants.
- tapOn:
    text: "Add \\(\\d+\\)"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Select"
    optional: true
- waitForAnimationToEnd

# The real gate: the picker handed a photo back to the FORM.
- extendedWaitUntil:
    visible:
      id: "listing-form-photo-thumb"
    timeout: 30000

# ── Title and price ─────────────────────────────────────────────────────────
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "QA Full Publish Bicycle"
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "7800"

# ── Category: a LEAF, not a parent ──────────────────────────────────────────
# All 16 top-level categories have children, so tapping one only drills in and the
# picker sheet stays open over the form.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# ── Description ─────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Describe your item..."
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Describe your item..."
- eraseText
- inputText: "Barely used, one owner. Collection in Kabul."

# ── Location: an actual pin on the map ──────────────────────────────────────
# A publish blocker, and the reason this cannot be a draft-only flow.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible:
    id: "location-confirm"
- tapOn:
    id: "location-confirm"
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 45000
# The row must stop offering to set a location — that is the proof the pin took.
- assertNotVisible: "Tap to set exact location on map"

# ── PUBLISH ─────────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Publish"
    direction: DOWN
    timeout: 20000
- tapOn: "Publish"
- waitForAnimationToEnd

# ── It is live ──────────────────────────────────────────────────────────────
# The listing's own detail screen, with the title and NO draft badge. A publish that
# silently left it a draft is the failure this guards against.
- extendedWaitUntil:
    visible: "QA Full Publish Bicycle"
    timeout: 60000
- assertNotVisible: "Draft"
