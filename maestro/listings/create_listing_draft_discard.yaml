appId: com.hatiwal.app
---
# Create listing: tap back mid-way → discard dialog → confirm discard → not in My Listings

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# The INPUT by testID, not the label. "Title" / "Description" / "Price" are
# non-interactive Text labels above their fields, so tapping one focuses
# nothing and the inputText that follows goes nowhere. A testID also works when
# the field already HAS a value (draft restore, edit), where the placeholder is
# no longer on screen.
- tapOn:
    id: "listing-form-title-input"
- inputText: "Should Not Be Saved"

- back
- waitForAnimationToEnd
# Discard confirmation dialog
# The dialog is `listing.form.discardTitle` — "Discard changes?", not
# "Discard listing?". Stale expected string; the app was right.
- assertVisible: "Discard changes?"
- tapOn: "Discard"
- waitForAnimationToEnd

# Listing not created
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
- assertNotVisible: "Should Not Be Saved"
