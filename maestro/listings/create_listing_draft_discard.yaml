appId: com.hatiwal.app
---
# Create listing: tap back mid-way → discard dialog → confirm discard → not in My Listings

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- tapOn: "Title"
- inputText: "Should Not Be Saved"

- back
- waitForAnimationToEnd
# Discard confirmation dialog
# The dialog is `listing.form.discardTitle` — "Discard changes?", not
# "Discard listing?". Stale expected string; the app was right.
- assertVisible: "Discard changes?"
- tapOn: "Discard"
- waitForAnimationToEnd

# Listing not created
- assertVisible: "My Listings"
- assertNotVisible: "Should Not Be Saved"
