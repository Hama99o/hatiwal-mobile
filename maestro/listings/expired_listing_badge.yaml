appId: com.hatiwal.app
---
# Expired listing: badge visible on card, Renew button available in detail

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# Expired tab
- tapOn: "Expired"
- waitForAnimationToEnd
- assertVisible: "Expired"

# Open expired listing
# The card itself, not one of its action buttons. A bare `tapOn: index: 0` has no
# selector: it matches every element on screen, so this tapped whatever landed at
# hierarchy position 0 — usually a header, never the card.
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd
# Expired badge on detail
- assertVisible: "Expired"
# Renew button available
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- assertVisible: "Renew"
