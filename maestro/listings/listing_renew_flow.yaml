appId: com.hatiwal.app
---
# Renew listing: expired → tap Renew → listing moves to Active tab

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd

- tapOn: "Expired"
- waitForAnimationToEnd
- assertVisible: "Expired"

# Open expired listing
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Expired"
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- assertVisible: "Renew"

# Renew it
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- tapOn: "Renew"
- waitForAnimationToEnd
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Listing renewed.*"

# Now appears in Active
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Active"
