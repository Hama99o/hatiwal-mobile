appId: com.hatiwal.app
---
# Renew listing: expired → tap Renew → listing moves to Active tab

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

- tapOn: "Expired"
- waitForAnimationToEnd
- assertVisible: "Expired"

# Open expired listing
# The card itself, not one of its action buttons. A bare `tapOn: index: 0` has no
# selector: it matches every element on screen, so this tapped whatever landed at
# hierarchy position 0 — usually a header, never the card.
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Expired"
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- assertVisible: "Renew"

# Renew it
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- tapOn: "Renew"
- waitForAnimationToEnd
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Listing renewed.*"

# Now appears in Active
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Active"
