appId: com.hatiwal.app
---
# Renew listing: expired → tap Renew → listing moves to Active tab

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

- tapOn: "Expired"
- waitForAnimationToEnd
- assertVisible: "Expired"

# WAIT for the list, not just the animation. Selecting a status tab fires a fresh
# /my/listings?status=expired request, and waitForAnimationToEnd does not wait on the
# network — so the flow tapped into a list that was still empty. Verified from the
# API directly that the data is fine (1 row: "Expired Winter Coat Size L", active,
# expires_at 3 days ago) and the rig recorded api_errors=0, so nothing was broken
# here except the timing. The status tabs have no testID, hence the text tap above.
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
# Open expired listing
# The card itself, not one of its action buttons. A bare `tapOn: index: 0` has no
# selector: it matches every element on screen, so this tapped whatever landed at
# hierarchy position 0 — usually a header, never the card.
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Expired"
# SCROLL TO THE ACTION ROW. "Renew" is the lifecycle-primary-action's LABEL for an
# expired listing — the same button that reads Publish on a draft and Mark as Sold
# on a live one — and it renders below the photo, description and views chart. The
# detail opens at the TOP, so both the assert and the tap below were reaching for
# something off-screen, and neither command scrolls.
#
# run-559's hierarchy is the top of that page: the status badge, "Expired", price,
# "Expired Winter Coat Size L", "Kabul, Karte Naw", "Posted September 14, 2026",
# Views/Chats and "Views — last 7 days", with no action row on it.
#
# One scroll serves both the assert and the tap: nothing between them navigates,
# so the offset carries.
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- assertVisible: "Renew"

# Renew it
# `listing.renew` = "Renew". "Renew Listing" has never existed.
- tapOn: "Renew"
- waitForAnimationToEnd
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "Listing renewed.*"

# Now appears in Active
# Pop back to the tab layout FIRST. Listing detail, the conversation thread and
# the owner detail all live outside app/(main)/(tabs), so the tab bar is not in
# the view tree there and a tab tap cannot find its target — it read as
# `Element not found: <tab>`, which looks like a missing testID. Two bounded
# blocks, not a `while`: these screens are at most two pushes deep, and an
# unbounded loop that never reveals the bar would spin to the flow timeout.
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "browse-tab"
    commands:
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
- assertVisible: "Active"
