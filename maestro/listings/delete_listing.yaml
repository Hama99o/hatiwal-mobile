appId: com.hatiwal.app
---
# Delete a listing — confirm dialog appears, listing removed, toast shown.
#
# SELF-CONTAINED, and this one matters most of the three: it DELETES. The previous
# version opened whichever draft came first — in practice the seeded
# "iPhone 12 Pro - 128GB" — and removed it. Every later flow expecting that listing
# then failed, and the damage lasted until the next re-seed, so the cause showed up
# nowhere near the flow that did it.
#
# It creates its own draft and deletes that.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Create the draft this flow will delete ──────────────────────────────────
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
- tapOn:
    id: "listing-form-title-input"
- eraseText
- inputText: "QA Delete Target"
- tapOn:
    id: "listing-form-price-input"
- eraseText
- inputText: "5500"
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# A LEAF: every top-level category has children.
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
- tapOn: "Save Draft"
- waitForAnimationToEnd

# ── Open it ─────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "QA Delete Target"
    timeout: 30000
- tapOn: "QA Delete Target"
- waitForAnimationToEnd
# The delete action lives in the More sheet and is labelled `common.delete` =
# "Delete". `listing.delete` ("Delete Listing") is rendered nowhere — this flow was
# tapping a string the app does not have, on a screen that does not hold the action.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Delete"
- waitForAnimationToEnd
# Confirm dialog
- assertVisible: "Delete this listing?"
- assertVisible: "This will permanently remove your listing."
- tapOn: "Delete"
- waitForAnimationToEnd
# NOT the toast. Polling was already in place here and still failed, because the
# problem is not timing: deleting navigates AWAY immediately —
#     onDeleted: () => router.replace("/(main)/(tabs)/my-listings")
# (MyListingDetail.tsx:208) — so listing.deleteSuccess is raised on a screen that is
# being torn down. The failure screenshot is My Shop with the list already loaded, i.e.
# the delete had worked and the flow was waiting for a message that had gone with the
# screen.
#
# Assert the durable consequences instead: we land on My Shop, and the listing is gone.
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 30000
# Listing no longer in list
# The listing this flow created is gone; the seeded ones are untouched.
- assertNotVisible: "QA Delete Target"
