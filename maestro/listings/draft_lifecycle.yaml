appId: com.hatiwal.app
---
# Full draft lifecycle: draft → publish → sold (one tap, no reserve step)
#
# SF-M1 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md) removed "Mark as
# Reserved" from every listing surface — the primary action on a Live listing
# is now ALWAYS "Mark as Sold", and Sold is terminal (no "Reactivate" from
# Sold exists; a mistaken sale is undone via the toast's "Undo" action or the
# Sales screen instead — see ../seller/undo_mark_sold.yaml). This flow used
# to tap "Mark as Reserved" then "Reactivate" straight off a Sold listing —
# neither control exists any more — so it is rewritten to prove the CURRENT
# one-tap lifecycle end to end, including the BuyerPickerSheet confirm step
# TASK-TX01 already requires (the old version skipped it and would have
# failed on "Who bought this item?" regardless of the SF-M1 rename).

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd

# A PHOTO AND A PIN — this flow publishes the draft it creates, and publishing needs
# both (getPublishBlockers, mode "publish"). Without them the publish is refused and
# the flow failed on `assertVisible: "Your listing is live!"` having done nothing
# wrong except omit two required fields.
#
# Photos before the text fields: filling the form raises the keyboard over
# `photos-add-button`, and Maestro then reports "no visible element" for a button
# that is merely covered.
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml

# The INPUT by testID, not the label. "Title" / "Description" / "Price" are
# non-interactive Text labels above their fields, so tapping one focuses
# nothing and the inputText that follows goes nowhere. A testID also works when
# the field already HAS a value (draft restore, edit), where the placeholder is
# no longer on screen.
- tapOn:
    id: "listing-form-title-input"
- inputText: "Lifecycle Test Item"
# The INPUT by testID — see the note on the title field.
# SCROLL TO THE FIELD FIRST — the keyboard is up from the title.
#
# run-528 failed here with "Element not found: Id matching regex: listing-form-price-input",
# and that testID is CURRENT (ListingForm.tsx). The field is simply below the
# fold: typing the title raises the IME, which takes roughly half the window at
# 360dp, and `tapOn` never scrolls.
#
# Identical shape and identical fix to create_listing_currency_eur, which is this
# campaign's CONFIRMED fix (66c3093): it failed five consecutive runs at sha
# 198aa2244b02 and passed in run-528 with exactly this scroll.
#
# No centerElement — a field near the end of a form cannot be centred, which is
# how CENTERELEM findings are manufactured.
- scrollUntilVisible:
    element:
      id: "listing-form-price-input"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "listing-form-price-input"
- inputText: "2500"
# The category FIELD is tapped by its placeholder, "Tap to select category"
# (listing.form.selectCategoryPlaceholder). "Category" is not a label the form
# renders, so this never opened the picker.
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# Then a LEAF. Every one of the 16 top-level categories has children, so
# tapping "Electronics" DRILLS IN and selects nothing — the picker sheet stays
# open over the form and every later step acts on a covered screen.
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# 1) Save as draft
- runFlow: ../_helpers/set_listing_location.yaml

# The button is "Save Draft" (listing.form.saveDraft).
- tapOn: "Save Draft"
- waitForAnimationToEnd
# The toast is `listing.form.savedDraft` = "Draft saved".
# extendedWaitUntil, not assertVisible: this is a TOAST from toast.success in
# ListingForm.tsx and it lives a few seconds. A plain assert races that window and
# loses under load — which is how create_listing_draft_restore failed here, with the
# draft itself created correctly. extendedWaitUntil polls, so it can only ever wait
# longer, never less.
# ("Offer accepted"/"Offer declined" are NOT converted: those strings are also the
# offer bubble's own outcome label, so they are durable rather than transient.)
- extendedWaitUntil:
    visible: "Draft saved"
    timeout: 15000

# 2) Publish from draft
# The filter tab is `listing.filter.draft` = "Draft", singular.
- tapOn: "Draft"
- waitForAnimationToEnd
- tapOn: "Lifecycle Test Item"
- waitForAnimationToEnd
# The primary action on the owner detail, by testID. It sits below the photo,
# description and views chart, so a text tap cannot reach it — and its LABEL
# changes with status (Publish for a draft, Mark as Reserved for active, Mark as
# Sold for reserved, Renew when expired), so the testID is the stable handle.
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
# CONFIRM the dialog. Publishing raises a native confirmAlert, and the flow used to
# assert the success sheet straight after tapping Publish — so it was waiting for a
# sheet that no one had asked for. (Screenshot: the dialog "Publish this listing?" still
# open, the listing still a Draft.)
#
# Via the helper, not `tapOn: "Publish"`: the dialog's confirm button says the same word
# as the button behind it, so a text tap matches both, lands on the scrim and dismisses
# the dialog without publishing — the helper's own comment documents that, and
# lifecycle_publish already uses it.
- assertVisible: "Publish this listing?"
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
# A TOAST, NOT THE SUCCESS SHEET. Publishing IN PLACE from the owner detail runs
# useListingLifecycle.ts:252 — `toast.success(t("listing.publishSuccess"))` =
# "Listing published!". It does NOT raise PublishSuccessSheet.
#
# That sheet is `listing.form.publishSuccess.title` ("Your listing is live!") and
# MyListingDetail only shows it when the route param `published=1` arrives, which
# is set once by ListingForm right after a publish from the CREATE FORM
# (MyListingDetail.tsx:97-117). Publishing an existing draft from its own detail
# never re-navigates, so the param never arrives and the sheet correctly never
# opens. run-559's hierarchy at the old assert shows the owner detail with no
# sheet — the publish had SUCCEEDED, the flow was watching for the wrong thing.
#
# The two keys are almost the same name — `listing.publishSuccess` (toast) versus
# `listing.form.publishSuccess.title` (sheet) — which is how the wrong one got
# written down. lifecycle_publish.yaml already asserts the toast correctly.
#
# extendedWaitUntil, not assertVisible: a toast lives ~3s, so a single check is a
# race and any fixed wait in front of it loses that race.
- extendedWaitUntil:
    visible: "Listing published!"
    timeout: 15000

# 3) Mark as Sold — the one-tap primary, no reserve step in between
# POP FIRST. This tap is issued FROM the owner detail, a pushed screen with no tab
# bar, so it would fail "Element not found: browse-tab" — the same defect fixed in
# create_listing_publish_blocked. Reached here by `tapOn: "Lifecycle Test Item"`, a
# TEXT selector, which is why audit_structure's Check 3 cannot see it: PUSHERS is
# matched by testID only.
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Lifecycle Test Item"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "lifecycle-primary-action"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "lifecycle-primary-action"
    text: "Mark as Sold"
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
# BuyerPickerSheet opens (TASK-TX01) — never a plain confirmAlert.
- assertVisible: "Who bought this item?"
- tapOn:
    id: "buyer-row-skip"
- waitForAnimationToEnd
- tapOn: "Confirm sold"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Listing marked as sold"
    timeout: 15000
- assertVisible: "Sold"

# 4) Sold is terminal — no lifecycle primary action remains, and neither
# "Mark as Reserved" nor a "Reactivate" control exist anywhere on this
# screen (a mistaken sale is undone via the toast's own "Undo" action, or
# corrected from the Sales screen — not by reactivating the listing itself).
- assertNotVisible:
    id: "lifecycle-primary-action"
- assertNotVisible: "Reactivate"
- assertNotVisible: "Mark as Reserved"
