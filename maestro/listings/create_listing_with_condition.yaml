appId: com.hatiwal.app
---
# Create a listing with a condition set → publish → verify ConditionBadge on detail

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Add a photo first — TASK-P736 blocks Publish with zero photos.
- tapOn: "Add Photos"
- waitForAnimationToEnd
- tapOn: "Gallery"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Cover"
# Fill required fields — tap the input placeholders, not the "Title *" /
# "Price *" Labels (a Label is inert text, not focusable; tapping it would
# leave nothing focused and inputText below would silently go nowhere).
- tapOn: "What are you selling?"
- inputText: "Condition Test Laptop"
- tapOn: "Enter price"
- inputText: "8000"
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# Select condition: Like New
- tapOn: "Like New"
- waitForAnimationToEnd
# Verify chip is selected (should be highlighted)
- assertVisible: "Like New"
# TASK-P736: Publish also requires an exact map pin — drop one before
# publishing (mirrors the map-picker block in create_listing_publish_blocked.yaml).
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
- tapOn: "Search a province…"
- inputText: "Kabul"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
- assertNotVisible: "Tap to set exact location on map"
# Publish directly
- tapOn: "Publish"
- waitForAnimationToEnd
- assertVisible: "Listing posted"
# Now switch to buyer and find the listing
- launchApp:
    clearState: false
- runFlow: ../_helpers/login.yaml
- tapOn: "Bazaar"
- waitForAnimationToEnd
- tapOn: "Search listings..."
- inputText: "Condition Test Laptop"
- waitForAnimationToEnd
- tapOn: "Condition Test Laptop"
- waitForAnimationToEnd
# ConditionBadge must show "Like New" on the detail screen
- assertVisible: "Like New"
