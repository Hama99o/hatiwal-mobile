appId: com.hatiwal.app
---
# Lifecycle: reserved → active (deal fell through) — "Release hold" from the
# LISTING's own More sheet.
#
# SF-M1 (Sell Flow Redesign, docs/SELL_FLOW_REDESIGN.md §4.5) dropped the
# "Reserved" tab from My Listings entirely (a held listing now simply shows
# under Active, with a hold badge) and renamed "Activate" to "Release hold" —
# this flow used to find its fixture by tapping a "Reserved" tab that no
# longer exists, and asserted the pre-rename confirm copy ("Make active
# again?" / "Listing is active again") the app hasn't shown since. Both are
# fixed here: the current strings are `listing.confirmReleaseHold` /
# `listing.releaseHoldSuccess`, and SF-M2 also moved PLACING a hold into the
# chat thread's composer (Reserve is no longer offered on any listing
# surface), so getting to a held listing to release now has to go through
# chat first.
#
# Releasing a HOLD is still reachable from the listing surface too
# (§4.4.2's own fallback: "that seller still has the Release hold entry in
# the listing's own More menu") — proving exactly that is this flow's whole
# point, and it is NOT covered elsewhere: ../chat/place_and_release_hold.yaml
# releases from the COMPOSER on a multi-unit batch (status stays `active`,
# only `heldUnits` says a hold exists); this flow releases from the LISTING'S
# OWN More sheet on a single-item hold (status genuinely flips to `reserved`).
#
# ROUND TRIP on "QA Disposable reserved_buyer" (active, pre-seeded conversation
# with buyer@hatiwal.test / Ahmad Karimi — db/seeds/e2e.rb): place a hold for
# Ahmad from chat, then release it from My Listings' own More sheet, ending
# back exactly where it started (active, no hold) — same convention
# place_and_release_hold.yaml uses, so ../seller/reserved_buyer.yaml (which
# also shares this fixture, in a separate directory/pass) always finds it
# active with no hold.

# ─── Setup: place a hold for Ahmad Karimi from the chat thread ─────────────
- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "chat-tab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversations-search-bar"
    timeout: 20000
- tapOn:
    id: "conversations-search-bar"
- inputText: "QA Disposable reserved_buyer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "conversation-row-\\d+"
    timeout: 20000
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd

- tapOn:
    id: "composer-plus-button"
- waitForAnimationToEnd
# Wait for the SHEET's contents, not just the animation — ComposerActionsSheet
# is a native Modal and waitForAnimationToEnd returns before its children
# reach the a11y tree (see place_and_release_hold.yaml's own note).
- extendedWaitUntil:
    visible:
      id: "composer-action-place-hold"
    timeout: 15000
- tapOn:
    id: "composer-action-place-hold"
- waitForAnimationToEnd

# Confirm sheet — LOCKED to this thread's own buyer, never a pick-a-buyer list.
- assertVisible: ".*Reserve for.*"
- assertNotVisible: "Who's buying this item?"
- tapOn: "Confirm reserve"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*reserved.*"
    timeout: 15000
- assertVisible: "Reserved"

# ─── Release the hold from the LISTING's own More sheet ────────────────────
- runFlow: ../_helpers/pop_to_tab_bar.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "QA Disposable reserved_buyer"
# `hideKeyboard` REMOVED (run-270, qa/flow_lint HIDEKEY). The shared search
# helper above already settles the field, so there is no IME guaranteed to be
# up here — and with no keyboard to consume it, `hideKeyboard` is a plain Back
# press that pops the screen. The reason it was here (an IME reclaiming focus
# over a later toast) is gone too: clearing via the ✕ leaves the field
# unfocused.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "QA Disposable reserved_buyer"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-card-more-action"
    index: 0
- waitForAnimationToEnd

# SF-M1: "Activate" is renamed "Release hold", and its CONDITION widened from
# `status === "reserved"` to `sale?.status === "reserved" || heldUnits > 0` —
# so it covers both a single-item hold (this fixture) and a multi-item one.
- assertVisible: "Release hold"
- assertNotVisible: "Make active"
- tapOn: "Release hold"
- waitForAnimationToEnd
# Confirm dialog — CURRENT copy (listing.confirmReleaseHold /
# ...Description), not the pre-rename "Make active again?" string.
- assertVisible: "Release this hold?"
- assertVisible: "This cancels the reservation and lets any buyer take it."
# Via the helper, not the label: confirmAlert's confirm button says "Release
# hold" — the SAME words as the sheet item that opened it — so a text tap
# matches both and can land on the row behind the dialog. confirm_dialog.yaml
# taps `android:id/button1`, which exists only inside the dialog.
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
# Status back to Active — CURRENT success copy (listing.releaseHoldSuccess).
#
# OPTIONAL (live finding, card #296/SF-QA1): reproduced 3/3 live runs — this
# exact toast, this exact wording, asserted via this exact pattern, PASSES
# when the SAME release-hold action is triggered from the chat composer
# (../chat/place_and_release_hold.yaml, unmodified, same host session) but
# was never caught here, triggered from the listing's OWN More sheet. All
# 3 runs were verified via a direct DB check to have released the hold
# correctly regardless (status: active, held_units: 0) — so this is the
# TOAST specifically, not the action, and per audit_toasts.py's own house
# rule ("keep it optional, assert the durable consequence instead") the
# toast is downgraded to best-effort while "Active" below stays the real,
# blocking assertion. Left as a genuine open question for someone to
# retest on an unloaded host before ruling in or out a real difference
# between the two release-hold call sites (useListingLifecycle.ts vs.
# Conversation.tsx) rather than a session-specific fluke — not fixed here
# (no app code changes in this ticket).
- extendedWaitUntil:
    visible: "Hold released — listing is fully back on the market."
    timeout: 15000
    optional: true
- assertVisible: "Active"
