appId: com.hatiwal.app
---
# Lifecycle: reserved → active (deal fell through, reactivate)
#
# TASK-L863: a reserved listing's primary action is "Mark as Sold" — Make
# active (Activate) is reachable from the "More" overflow sheet.

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Find a reserved listing
- tapOn: "Reserved"
- waitForAnimationToEnd
- tapOn: "More"
- waitForAnimationToEnd
# This action exists ONLY in the More sheet — useListingLifecycle adds it to
# `moreActions`, never as the primary button (the primary is Publish for a draft,
# Mark as Reserved for active, Mark as Sold for reserved, Renew when expired).
# So the sheet has to be opened first.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Make active"
- waitForAnimationToEnd
# Confirm dialog
- assertVisible: "Make active again?"
- assertVisible: "This cancels the reservation and reopens the listing to buyers."
# confirmAlert takes its button label per call — reactivate passes
# t("listing.activate") = "Make active". `common.confirm` ("Confirm") is a dead key.
- tapOn: "Make active"
- waitForAnimationToEnd
# Status back to Active
- assertVisible: "Listing is active again"
- assertVisible: "Active"
