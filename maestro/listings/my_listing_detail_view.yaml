appId: com.hatiwal.app
---
# Owner listing detail screen
# Tests: card press → owner detail → analytics row → lifecycle action

- runFlow: ../_helpers/login_seller.yaml

# Navigate to My Listings
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"

# Tap the first listing card to open the owner detail screen
# The card itself, not one of its action buttons. A bare `tapOn: index: 0` has no
# selector: it matches every element on screen, so this tapped whatever landed at
# hierarchy position 0 — usually a header, never the card.
# The ACTIVE tab first. Analytics renders only for a published listing —
# MyListingDetail.tsx gates the whole block on `{!isDraft && ...}` with the comment
# "only for a listing that has actually been published" — and index 0 of the unfiltered
# list is frequently a draft (My Shop's first cards were "Laptop HP" and "QA Batch Edit
# Target 15", both drafts). So there was no analytics section to scroll to at all.
#
# Filtering to Active makes index 0 a published listing by construction. Adding a scroll
# alone, as I did first, was necessary but not sufficient: the section was missing, not
# merely below the fold.
- tapOn: "Active"
- waitForAnimationToEnd
# Wait for the data, not the animation. Switching tabs refires the query and
# waitForAnimationToEnd does not wait on the network, so this tap can land on a
# list that has not rendered yet. Free when the row is already cached.
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-listing-card"
    index: 0
- waitForAnimationToEnd

# Owner detail screen should be visible — verify analytics row
- assertVisible:
    id: "my-listing-detail-scroll"
# SCROLL to the analytics block. It renders well down the owner detail
# (MyListingDetail.tsx:417) — below the photo, price and description — and assertVisible
# does not scroll. listing_analytics_sparkline failed on exactly this, asserting an
# analytics element that was simply further down the page.
- scrollUntilVisible:
    element:
      id: "analytics-views"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "analytics-views"
- assertVisible:
    id: "analytics-conversations"

# Verify lifecycle action button is present (state-dependent label)
- assertVisible:
    id: "lifecycle-primary-action"

# Verify "View Conversations" link is present
- assertVisible:
    id: "view-conversations-link"

# Tap "View Conversations" and verify it navigates to listing-conversations screen
- tapOn:
    id: "view-conversations-link"
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Should be back on owner detail
- assertVisible:
    id: "analytics-views"

# Tap the lifecycle action button and dismiss the confirm dialog (cancel)
- tapOn:
    id: "lifecycle-primary-action"
- waitForAnimationToEnd
- tapOn: "Cancel"
- waitForAnimationToEnd

# Navigate back to My Listings
- back
- waitForAnimationToEnd
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
