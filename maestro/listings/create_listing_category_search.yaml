appId: com.hatiwal.app
---
# Create listing — search within category picker

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Open category picker
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- assertVisible: "Select Category"
# Search for a category
- tapOn: "Search categories..."
- inputText: "Elect"
- waitForAnimationToEnd
- assertVisible: "Electronics"
# Search something that doesn't exist
- eraseText
- inputText: "xyznotacategory"
- waitForAnimationToEnd
# Clear search and close
- eraseText
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# Category selected
- assertVisible: "Electronics"
