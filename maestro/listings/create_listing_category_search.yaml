appId: com.hatiwal.app
---
# Create listing — search within category picker

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Open category picker
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- assertVisible: "Select Category"
# Search for a category
- tapOn: "Search categories..."
- inputText: "Elect"
- waitForAnimationToEnd
- assertVisible: "Electronics"
# Search something that doesn't exist
- eraseText
- inputText: "xyznotacategory"
- waitForAnimationToEnd
# Clear search and close
- eraseText
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# Category selected
- assertVisible: "Electronics"
