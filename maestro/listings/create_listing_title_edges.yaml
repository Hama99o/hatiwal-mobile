appId: com.hatiwal.app
---
# Title EDGE CASES on create. The schema is `z.string().trim().min(1).max(150)`
# and the backend is `validates :title, presence: true, length: { maximum: 150 }`.
#
# The interesting case is whitespace: `.min(1)` on an UNTRIMMED string accepts
# "   ", while Rails `presence: true` treats it as blank. Before the trim was
# added the seller filled the form, tapped save, and got a SERVER error where an
# inline field error belonged. This flow is what stops that regressing.
#
# Covered here:
#   - whitespace-only title            -> inline "Title is required"
#   - a 150-character title            -> accepted (the boundary, inclusive)
#   - leading/trailing spaces          -> trimmed, not rejected
#
# Not covered here: the >150 case. The input carries maxLength, so the 151st
# character cannot be typed at all — there is nothing to assert beyond the field
# refusing it, and asserting "the text I typed is not there" is a weak test.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# ── Whitespace-only title is NOT a title ────────────────────────────────────
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "   "
- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertVisible: "Title is required (max 150 characters)"

# ── A title at the 150-char boundary is accepted ─────────────────────────────
# Exactly 150 characters: 15 blocks of 10 ("BulkItem01".."BulkItem15").
# Counted, not eyeballed — the first attempt at this line was 165 characters,
# which would have tested the REJECT path while claiming to test the boundary.
- tapOn: "What are you selling?"
- eraseText
- inputText: "BulkItem01BulkItem02BulkItem03BulkItem04BulkItem05BulkItem06BulkItem07BulkItem08BulkItem09BulkItem10BulkItem11BulkItem12BulkItem13BulkItem14BulkItem15"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "500"
# The title error must be GONE — that is the assertion that proves 150 is legal
# rather than merely "something happened".
- assertNotVisible: "Title is required (max 150 characters)"

# ── Leading/trailing spaces are trimmed, not rejected ───────────────────────
- tapOn: "What are you selling?"
- eraseText
- inputText: "  Padded Title Item  "
- tapOn: "Save Draft"
- waitForAnimationToEnd
- assertNotVisible: "Title is required (max 150 characters)"
# It gets as far as the NEXT blocker (category), which proves the title passed.
- assertVisible: "Please select a category"
