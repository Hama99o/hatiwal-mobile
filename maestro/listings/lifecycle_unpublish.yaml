appId: com.hatiwal.app
---
# Active → Draft (unpublish): seller takes active listing back to draft
#
# TASK-L863: an active listing's primary action is "Mark as Reserved" —
# Unpublish is reachable from the "More" overflow sheet.

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Go to Active tab
- tapOn: "Active"
- waitForAnimationToEnd
# Open "More" then tap "Unpublish" on the first active listing
- tapOn: "More"
- waitForAnimationToEnd
- tapOn: "Unpublish"
- waitForAnimationToEnd
- assertVisible: "Unpublish this listing?"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "It will be hidden from buyers.*"
- tapOn: "Unpublish"
- waitForAnimationToEnd
# Listing moved to Draft
- assertVisible: "Listing unpublished"
# Navigate to Draft tab — listing appears there
- tapOn: "Draft"
- waitForAnimationToEnd
