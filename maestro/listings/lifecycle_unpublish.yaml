appId: com.hatiwal.app
---
# Active → Draft (unpublish): seller takes active listing back to draft
#
# TASK-L863 / SF-M1: an active listing's primary action is "Mark as Sold" —
# Unpublish is reachable from the "More" overflow sheet.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Go to Active tab
# Search for THIS FLOW'S disposable listing. The seed creates one per destructive
# flow, named after it, precisely so this flow can ruin it without touching a
# fixture anything else asserts on. It used to act on "whichever listing comes
# first", which was a shared one.
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "QA Disposable lifecycle_unpublish"
- waitForAnimationToEnd
- extendedWaitUntil:
      visible: "QA Disposable lifecycle_unpublish"
      timeout: 30000
# With the search working (the API used to drop it — UI-031), the list holds
# exactly ONE card, so its own action button is unambiguous and there is no need
# to open the detail at all. Tapping the title did not navigate anyway: after
# typing, the first tap outside the field goes to dismissing the IME, so the flow
# stayed on the list and then looked for the DETAIL's `lifecycle-primary-action`.
# Verified by screenshot — header "1 listing", one card, still on My Shop.
- tapOn:
    id: "seller-card-more-action"
    index: 0
- waitForAnimationToEnd
- tapOn: "Unpublish"
- waitForAnimationToEnd
- assertVisible: "Unpublish this listing?"
# Maestro matches the FULL string as a regex, so this PREFIX of the real copy
# never matched it — the app was showing more than the flow asked for.
- assertVisible: "It will be hidden from buyers.*"
- tapOn: "Unpublish"
- waitForAnimationToEnd
# Listing moved to Draft
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing unpublished"
    timeout: 15000
# Navigate to Draft tab — listing appears there
- tapOn: "Draft"
- waitForAnimationToEnd
