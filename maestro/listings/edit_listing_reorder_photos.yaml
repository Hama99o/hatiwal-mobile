appId: com.hatiwal.app
---
# Edit listing: tap second photo to reorder it as Cover

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
# The LIST-side route. `lifecycle-more-action` exists only on MyListingDetail
# (MyListingDetail.tsx:553) and this flow never opens a listing — it goes from My Shop's
# list straight to scrolling for a detail-screen control, so the scroll burned its full
# 20s and reported "No visible element found" for something never on this screen.
# gallery/listing_edit_add_photos.yaml already had the working route from here: the
# card's own ⋮ opens the same actions, by testID rather than the word "Edit".
# TARGET A SPECIFIC LISTING, not whichever card happens to be first.
#
# run-528 proves why. This flow scrolled to `seller-listing-card` and opened the
# FIRST card's menu, which landed on listing 3317 "Laptop HP" — status DRAFT with
# exactly ONE photo. Two consequences, both fatal to what this flow is testing:
# removing its only photo empties the gallery, and on a draft the toolbar is
# [Save Draft | Publish], never the single [Save] this flow taps
# (`isPublished` = existingListing.status !== "draft", ListingForm.tsx:451). The
# end-of-flow screenshot is exactly that toolbar over an empty Photos section, so
# "Element not found: Text matching regex: Save" was the app being right.
#
# Card order is not a fixture. The database is RE-SEEDED between cycles — the
# seller's own id moved 420 -> 423 -> 426 within a few hours of this campaign —
# so whatever sorts first changes underneath the suite.
#
# "School Backpack Bulk Restock - 20 Bags" is ACTIVE with THREE photos (checked
# via the API), which is what removing and reordering both need. It is also
# referenced by NO other flow, so mutating its photos cannot disturb anyone
# else's fixture — unlike the Lenovo ThinkPad, which the seeder already uses as
# the price-drop target.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "School Backpack Bulk Restock - 20 Bags"
- extendedWaitUntil:
    visible:
      id: "seller-listing-card"
    timeout: 20000
- tapOn:
    id: "seller-card-more-action"
    index: 0
- waitForAnimationToEnd
- tapOn:
    id: "listing-action-edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# ── Guarantee there are TWO photos to swap ────────────────
# Reordering needs two tiles, and this flow edits whichever listing is first in My Shop
# — which need not have any photos at all (the first card is often a draft showing the
# "No photo" placeholder). Its sibling edit_listing_remove_photo failed for exactly that
# reason: "Element not found: listing-form-photo-remove".
# Attaching two here makes the swap below meaningful regardless of what the listing
# started with. No seeded fixture can supply this: the only photo-bearing seeded listing
# is the Lenovo, shared by eight flows and sold by two of them.
- tapOn:
      id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- waitForAnimationToEnd
- tapOn:
      id: "photos-add-button"
- waitForAnimationToEnd
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- waitForAnimationToEnd
- assertVisible:
    id: "listing-form-photo-thumb"
    index: 1
# By testID. FieldLabel renders a required field's label plus a nested
# `<Text> *</Text>`, so the node reads "Photos *" and an anchored regex on the bare
# word cannot match it.
- assertVisible:
    id: "listing-form-field-photos"

# Tap second photo thumbnail to make it Cover
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
# Reordering takes TWO taps, and this flow only ever made one.
# handleThumbPress (PhotosSection.tsx:224): with nothing selected, a tap SELECTS that
# thumb; a second tap on a DIFFERENT thumb swaps the two and clears the selection.
# So one tap changes no order at all — and "Cover" sits on the first photo either way,
# so asserting it proved nothing. The comment here claimed the tap "makes it Cover".
- tapOn:
    id: "listing-form-photo-thumb"
    index: 1
- waitForAnimationToEnd
# In select mode the hint appears (gated on selectedIdx !== -1, line 338).
- assertVisible: "Tap another photo to swap positions"

# Second tap on the FIRST thumb performs the swap, making the selected photo the cover.
- tapOn:
    id: "listing-form-photo-thumb"
    index: 0
- waitForAnimationToEnd
# The hint going away is the observable proof the swap ran: handleThumbPress sets
# selectedIdx back to -1 only on the swap branch. "Cover" alone cannot show this,
# because the badge is on whichever photo is first before and after.
- assertNotVisible: "Tap another photo to swap positions"
- assertVisible: "Cover"

# Save
# "Save", not "Save Changes". No such string exists in the locale files: editing a
# PUBLISHED listing submits through `common.save` = "Save" (ListingForm.tsx, the
# onSavePublished button). The only near neighbours are listing.form.saveDraft
# ("Save Draft") and the toast listing.form.saved ("Changes saved") — which this flow
# asserts afterwards, and which is probably where "Save Changes" came from.
- tapOn: "Save"
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST from toast.success in
# ListingForm.tsx and it lives a few seconds. A plain assert races that window and
# loses under load — which is how create_listing_draft_restore failed here, with the
# draft itself created correctly. extendedWaitUntil polls, so it can only ever wait
# longer, never less.
# ("Offer accepted"/"Offer declined" are NOT converted: those strings are also the
# offer bubble's own outcome label, so they are durable rather than transient.)
- extendedWaitUntil:
    visible: "Changes saved"
    timeout: 15000
