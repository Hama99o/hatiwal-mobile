appId: com.hatiwal.app
---
# Edit listing: tap second photo to reorder it as Cover

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"
- assertVisible: "Photos"

# Tap second photo thumbnail to make it Cover
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "listing-form-photo-thumb"
    index: 1
- waitForAnimationToEnd
# Cover label moves to tapped photo
- assertVisible: "Cover"

# Save
- tapOn: "Save Changes"
- waitForAnimationToEnd
- assertVisible: "Changes saved"
