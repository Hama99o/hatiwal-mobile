appId: com.hatiwal.app
---
# Create listing and publish directly (not save as draft)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Add a photo first — TASK-P736 blocks Publish with zero photos.
- tapOn: "Add Photos"
- waitForAnimationToEnd
# The five tolerant steps that actually get a photo in live in the helper —
# including Android's picker CONFIRM button, which a bare `tapOn: index: 0`
# never pressed. See _helpers/attach_photo_from_gallery.yaml.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"
# Fill required fields
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Samsung Galaxy S22"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "35000"
# Select category
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
# Fill description
# The description sits below the category row, and the numeric keypad from the
# price field covers the lower half of the form — so this needs a scroll, not a
# bare tap on an element that is merely off-screen (run-047).
- scrollUntilVisible:
    element:
      text: "Describe your item..."
    direction: DOWN
    timeout: 10000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Describe your item..."
- eraseText
- inputText: "Excellent condition, comes with box and charger."
# Select condition
- tapOn: "Like new"
# TASK-P736: Publish also requires an exact map pin — drop one before
# publishing (mirrors the map-picker block in create_listing_publish_blocked.yaml).
# Scroll to the map row. It sits below title, price, currency, condition,
# description and category on a form taller than the viewport, and `tapOn` never
# scrolls — publish_success and publish_from_owner_detail both failed with
# `Element not found: Tap to set exact location on map` on a form that renders it.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
# testIDs, not the placeholder + a bare index tap. "Search a province…" is the
# placeholder (browse.searchLocation) and the index tap had no selector at all,
# so it matched every element on screen instead of the suggestion row.
- tapOn:
    id: "location-search-input"
- eraseText
- inputText: "Kabul"
- extendedWaitUntil:
    visible:
      id: "location-search-result"
    timeout: 15000
- tapOn:
    id: "location-search-result"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
- assertNotVisible: "Tap to set exact location on map"
# Publish directly
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- waitForAnimationToEnd
# Location is a PUBLISH BLOCKER (getPublishBlockers, mode "publish"), so the pin
# has to exist before Publish will do anything. Without it the app correctly
# refuses and says "Location is required — buyers filter listings by area", and
# this flow then failed asserting a successful publish.
- runFlow: ../_helpers/set_listing_location.yaml

- tapOn: "Publish"
- waitForAnimationToEnd

# TASK-J952: publishing a NEW listing lands on its OWN owner detail (never
# the Browse/My Listings tab) with a one-time success sheet — share / view
# as buyer / post another.
- assertVisible: "Your listing is live!"
- assertVisible: "Share listing"
- assertVisible: "View as buyer"
- assertVisible: "Post another listing"

# Dismiss the sheet — the seller stays on their own owner detail underneath,
# now showing Active with the fresh listing's title.
- tapOn: "Done"
- waitForAnimationToEnd
- assertVisible: "Samsung Galaxy S22"
- assertVisible: "Active"
