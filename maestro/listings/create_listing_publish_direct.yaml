appId: com.hatiwal.app
---
# Create listing and publish directly (not save as draft)

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
# Add a photo first — TASK-P736 blocks Publish with zero photos.
- tapOn: "Add Photos"
- waitForAnimationToEnd
- tapOn: "Gallery"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- assertVisible: "Cover"
# Fill required fields
- tapOn: "What are you selling?"
- inputText: "Samsung Galaxy S22"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
- tapOn: "Enter price"
- inputText: "35000"
# Select category
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
# Fill description
# The description sits below the category row, and the numeric keypad from the
# price field covers the lower half of the form — so this needs a scroll, not a
# bare tap on an element that is merely off-screen (run-047).
- scrollUntilVisible:
    element:
      text: "Describe your item..."
    direction: DOWN
    timeout: 10000
- tapOn: "Describe your item..."
- inputText: "Excellent condition, comes with box and charger."
# Select condition
- tapOn: "Like new"
# TASK-P736: Publish also requires an exact map pin — drop one before
# publishing (mirrors the map-picker block in create_listing_publish_blocked.yaml).
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
- tapOn: "Search a province…"
- inputText: "Kabul"
- waitForAnimationToEnd
- tapOn:
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
- assertNotVisible: "Tap to set exact location on map"
# Publish directly
- tapOn: "Publish"
- waitForAnimationToEnd

# TASK-J952: publishing a NEW listing lands on its OWN owner detail (never
# the Browse/My Listings tab) with a one-time success sheet — share / view
# as buyer / post another.
- assertVisible: "Your listing is live!"
- assertVisible: "Share listing"
- assertVisible: "View as buyer"
- assertVisible: "Post another listing"

# Dismiss the sheet — the seller stays on their own owner detail underneath,
# now showing Active with the fresh listing's title.
- tapOn: "Done"
- waitForAnimationToEnd
- assertVisible: "Samsung Galaxy S22"
- assertVisible: "Active"
