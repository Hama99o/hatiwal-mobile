appId: com.hatiwal.app
---
# TASK-P736 — Publish readiness: block photoless listings and never let
# Publish fail silently.
#
# Two scenarios, both proving Publish is never a silent no-op:
#
#   1. Zero photos — every other field valid. Tapping Publish must NOT
#      create/publish anything; a toast names "Photos" as missing, and the
#      Photos section (already on-screen, it's the first field) shows the
#      destructive "add at least one photo" message. Adding a photo clears
#      that message immediately, and Publish then succeeds.
#   2. A missing field scrolled off-screen (Title, in this case) — with a
#      photo present. The seller scrolls all the way down to the Address
#      field (the LAST field on the form) and taps Publish from the
#      always-visible top toolbar. The toast names "Title", and the form
#      must auto-scroll back up so the inline "Title is required" error is
#      visible again WITHOUT the seller manually scrolling — proving the
#      scroll-to-first-blocker behavior actually fires.

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── 1) Zero photos blocks Publish ────────────────────────────────────────────

- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "What are you selling?"
- eraseText
- inputText: "Publish Blocked No Photo Item"
# Scroll to the price field: typing the title raises the keyboard, and on a
# landscape tablet it covers the lower half of the form — so `tapOn` fails on a
# field that exists but is hidden. Same class as the category and description
# rows below, and the sixth place in this app where a keyboard hid a control.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "9000"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# Scroll to the map row. It sits below title, price, currency, condition,
# description and category on a form taller than the viewport, and `tapOn` never
# scrolls — publish_success and publish_from_owner_detail both failed with
# `Element not found: Tap to set exact location on map` on a form that renders it.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
# testIDs, not the placeholder + a bare index tap. "Search a province…" is the
# placeholder (browse.searchLocation) and the index tap had no selector at all,
# so it matched every element on screen instead of the suggestion row.
- tapOn:
    id: "location-search-input"
- eraseText
- inputText: "Kabul"
- extendedWaitUntil:
    visible:
      id: "location-search-result"
    timeout: 15000
- tapOn:
    id: "location-search-result"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd
# WAIT for the sheet to actually close before touching the form again.
# The map has to load tiles and reverse-geocode before it will confirm, which on a
# loaded host is genuinely slow — _helpers/set_listing_location.yaml allows 45s for
# exactly this. While it is still open the form's tree is not reachable, so the next
# step failed with "Element not found: Publish" on a button that had not gone anywhere.
- extendedWaitUntil:
    notVisible:
      id: "location-confirm"
    timeout: 45000
- assertNotVisible: "Tap to set exact location on map"

# No photo added — Publish must be blocked.
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

# Toast names the missing field; the destructive photo message shows right
# there (Photos is the first section — no scroll needed to see it).
- assertVisible: "Add Photos to publish this listing"
- assertVisible: "Add at least one photo before publishing"

# Nothing was created — still on the create form, not a success sheet.
- assertNotVisible: "Your listing is live!"
- assertVisible: "Create Listing"

# Add a photo — the destructive message must clear immediately.
# Tap by testID (not the "Add Photos" text) — the blocking toast above reads
# "Add Photos to publish this listing", which also matches "Add Photos" as a
# substring, so a text-based tap here is ambiguous while the toast is still
# on screen.
- tapOn:
    id: "photos-add-button"
- waitForAnimationToEnd
# Helper: tolerant picker selectors + Android's "Add (N)" confirm button.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"
- assertNotVisible: "Add at least one photo before publishing"

# Publish again — now succeeds.
- tapOn: "Publish"
- waitForAnimationToEnd
- assertVisible: "Your listing is live!"
- assertVisible: "Publish Blocked No Photo Item"
- tapOn: "Done"
- waitForAnimationToEnd

# ── 2) A field missing off-screen still blocks + auto-scrolls back to it ────

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

- tapOn: "Add Photos"
- waitForAnimationToEnd
# Helper: tolerant picker selectors + Android's "Add (N)" confirm button.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"

# Title intentionally left blank.
# Scroll to the price field again — see the note above.
- scrollUntilVisible:
    element:
      text: "Enter price"
    direction: DOWN
    timeout: 20000
# eraseText between the tap and the typing. Maestro drops the FIRST CHARACTER
# otherwise: "Abroad Location Item" arrived as "Broad Location Item", and the
# character counter under the field proved it — 19/150 instead of 20/150. A bare
# `waitForAnimationToEnd` does NOT fix it (measured: still 19). `eraseText` does
# (measured: 20), because it forces the IME to be attached before the text is sent.
#
# Not an app bug: the field is a plain react-hook-form Controller with no remount
# or debounce, and no human types within a frame of tapping. Harmless here — every
# one of these fields is empty at this point.
- tapOn: "Enter price"
- eraseText
- inputText: "9500"

# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# EVERY top-level category has children, so tapping one DRILLS IN and never
# selects — the picker sheet stays open over the form and every step after it
# acts on a covered screen. A leaf has to be chosen (verified against the
# category tree: all 10 top-level categories have subcategories).
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# Scroll to the map row. It sits below title, price, currency, condition,
# description and category on a form taller than the viewport, and `tapOn` never
# scrolls — publish_success and publish_from_owner_detail both failed with
# `Element not found: Tap to set exact location on map` on a form that renders it.
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- assertVisible: "Pick location on map"
# testIDs, not the placeholder + a bare index tap. "Search a province…" is the
# placeholder (browse.searchLocation) and the index tap had no selector at all,
# so it matched every element on screen instead of the suggestion row.
- tapOn:
    id: "location-search-input"
- eraseText
- inputText: "Kabul"
- extendedWaitUntil:
    visible:
      id: "location-search-result"
    timeout: 15000
- tapOn:
    id: "location-search-result"
    index: 0
- waitForAnimationToEnd
- tapOn: "Confirm location"
- waitForAnimationToEnd

# Scroll all the way down to the LAST field (Address) — Title is now
# scrolled off the top of the screen.
- scrollUntilVisible:
    element: "e.g. Near Blue Mosque, Shar-e-Naw"
    direction: DOWN
- assertNotVisible: "What are you selling?"

# Publish from the always-visible top toolbar while scrolled to the bottom.
# The IME can cover a submit button, and Maestro reports the tap COMPLETED while the
# touch lands on the keyboard. `hideKeyboard` is NOT the fix on a pushed screen — it is
# Back, and it pops the screen. Scroll-then-tap is: see qa/QA_HANDBOOK.md, "hideKeyboard".
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd

# Toast names the missing field...
- assertVisible: "Add Title to publish this listing"
# ...and the form auto-scrolled back up: the inline Title error is visible
# again WITHOUT the seller scrolling manually.
- assertVisible: "Title is required \\(max 150 characters\\)"

# Still on the create form — nothing was created.
- assertNotVisible: "Your listing is live!"
- assertVisible: "Create Listing"
