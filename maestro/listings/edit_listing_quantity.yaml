appId: com.hatiwal.app
---
# Editing a batch listing's count — docs/SPIKE_LISTING_QUANTITY.md.
#
# WHY THIS EXISTS SEPARATELY FROM create_listing_multi_quantity.yaml: the bug
# that flow caught (UI-011 — quantity never appended to the multipart body, so
# the seller typed 15 and the API stored 1) was present in BOTH
# `createListingWithImages` AND `updateListingWithImages`. Only the create half
# was verified on a device. A fix confirmed on one of two identical code paths is
# half a fix.
#
# It also covers the seeding fix: reopening a batch listing must show the switch
# already ON with its number, not OFF over a hidden 15 the seller can neither see
# nor correct.
#
# SELF-CONTAINED: it creates its own batch listing and then edits that.
#
# It must not edit the SEEDED multi-unit listing, because other flows assert that
# one still has 15 units. The previous version therefore reused the draft
# create_listing_multi_quantity.yaml leaves behind — which made it depend on run
# ORDER, and the fleet runs two sessions against one database, so it failed with
# `"QA Batch Edit Target 15" is visible` whenever that flow had not run first, been
# re-run, or run on the other device.
#
# Creating its own costs about forty seconds and removes the coupling entirely.

- launchApp:
    clearState: true
- runFlow: ../_helpers/open_bundle.yaml
- runFlow: ../_helpers/goto_login.yaml
- tapOn:
    id: "login-email-input"
- inputText: "seller@hatiwal.test"
- tapOn:
    id: "login-password-input"
- inputText: "Password123!"
# Dismiss the IME before submitting. The keyboard covers the lower half of a
# form, and Maestro still reports the tap COMPLETED — it finds the element in
# the hierarchy and taps its bounds, while the touch lands on the keyboard. On
# the login screen that swallowed EVERY sign-in in the suite: no request ever
# reached the API and the flow blamed a missing tab bar 60s later.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Sign In"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 60000

- tapOn:
    id: "profile-tab"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Switch to Seller Mode"
    commands:
      - tapOn: "Switch to Seller Mode"
      - waitForAnimationToEnd

- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd

# ── Create the batch listing this flow will edit ────────────────────────────
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"
- tapOn:
    id: "listing-form-title-input"
- eraseText
- inputText: "QA Batch Edit Target 15"
- tapOn:
    id: "listing-form-price-input"
- eraseText
- inputText: "400"
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
# A LEAF: every top-level category has children, so tapping one only drills in.
- tapOn: "Electronics"
- waitForAnimationToEnd
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd
# The quantity field only exists once "I have more than one" is on — the governing
# rule of the feature is that a seller with one item is never asked.
- scrollUntilVisible:
    element:
      id: "listing-form-quantity-row"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "listing-form-quantity-row"
- waitForAnimationToEnd
# No eraseText: this field maps empty to 1 and then APPENDS, and it carries
# selectTextOnFocus, so a tap already selects the value.
- tapOn:
    id: "listing-form-quantity-input"
- inputText: "15"
- tapOn: "Save Draft"
- waitForAnimationToEnd

# ── Reopen it ───────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "QA Batch Edit Target 15"
    timeout: 30000
- tapOn: "QA Batch Edit Target 15"
- waitForAnimationToEnd

# The owner detail already states the batch, from the create round trip.
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: "15 in stock"

# ── Into the edit form ──────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "lifecycle-more-action"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "lifecycle-more-action"
- waitForAnimationToEnd
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
# NEVER SCROLL INSIDE THE MORE SHEET (run-267, and run-266's F6).
# ListingActionsSheet's backdrop dismisses on a drag, so a scroll here CLOSES the
# sheet and the rest of the timeout is spent hunting the page underneath it for a
# control that no longer exists — `No visible element found: "Edit"`, on a sheet
# that was open a moment earlier and never needed scrolling (every action fits).
# By testID and by the action's own KEY, which is identical in all three locales
# (`t("common.edit")` is "سمول"/"ویرایش" in ps/fa).
- extendedWaitUntil:
    visible:
      id: "listing-action-edit"
    timeout: 20000
- tapOn:
    id: "listing-action-edit"
- waitForAnimationToEnd

# THE SEEDING FIX: the switch reopens ON, with the saved number visible. Without
# it the row reads "off" over a hidden 15 — a value the seller can neither see
# nor change.
- scrollUntilVisible:
    element:
      id: "listing-form-quantity-row"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "listing-form-quantity-input"
    text: "15"

# ── Change it ───────────────────────────────────────────────────────────────
# Tapping selects the pre-filled value (selectTextOnFocus), so this REPLACES the
# 15 rather than appending — the same hazard that sold a whole batch in run-018.
- tapOn:
    id: "listing-form-quantity-input"
- inputText: "20"
- assertVisible:
    id: "listing-form-quantity-input"
    text: "20"

# Save Draft lives in the fixed top toolbar, so no keyboard dance is needed.
- tapOn: "Save Draft"
- waitForAnimationToEnd

# ── The count survived the UPDATE round trip ────────────────────────────────
# This is the assertion the create flow could not make: it proves
# `updateListingWithImages` puts listing[quantity] on the wire too.
- assertVisible: "QA Batch Edit Target 15"
- assertVisible:
    id: "stock-badge-owner"
- assertVisible: "20 in stock"
