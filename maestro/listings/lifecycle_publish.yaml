appId: com.hatiwal.app
---
# Lifecycle: draft → active (publish)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Find a draft listing and open it
- tapOn: "Draft"
- waitForAnimationToEnd
# Publish from the CARD, not the detail — this flow never opens a listing. Every
# draft card carries its own primary-action button reading "Publish", so a text tap
# lands on whichever card happens to be first in the hierarchy. The filter is set
# to Draft, so index 0 is a draft either way, but the testID says what is meant.
- tapOn:
    id: "seller-card-primary-action"
    index: 0
- waitForAnimationToEnd
# Confirm dialog
- assertVisible: "Publish this listing?"
- assertVisible: "Your listing will be visible to all buyers."
- tapOn: "Publish"
- waitForAnimationToEnd
# Status changed to Active
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing published!"
    timeout: 15000
- assertVisible: "Active"
