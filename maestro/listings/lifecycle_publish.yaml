appId: com.hatiwal.app
---
# Lifecycle: draft → active (publish)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Find a draft listing and open it
- tapOn: "Draft"
- waitForAnimationToEnd
# Publish from the CARD, not the detail — this flow never opens a listing. Every
# draft card carries its own primary-action button reading "Publish", so a text tap
# lands on whichever card happens to be first in the hierarchy. The filter is set
# to Draft, so index 0 is a draft either way, but the testID says what is meant.
# SEARCH for the ready-to-publish draft. Index 0 of the Draft tab is whatever a
# create/edit flow made most recently — the screenshot shows it was "QA Batch Edit
# Target 15", a draft with "No photo". Publishing is refused without a photo and a pin
# (getPublishBlockers), so the confirm dialog never opened and the failure read as a
# broken Publish button.
#
# db/seeds/e2e.rb now seeds "Ready To Publish Draft" with both, precisely so a flow can
# ask for it by name instead of hoping about ordering.
# Via the shared helper: it clears with the field's own ✕ instead of racing
# `eraseText` against `inputText` (run-270 — see search_my_shop.yaml), and it
# uses testIDs, so this step also works in ps/fa.
- runFlow:
    file: ../_helpers/search_my_shop.yaml
    env:
      QUERY: "Ready To Publish Draft"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "seller-card-primary-action"
    timeout: 20000
- tapOn:
    id: "seller-card-primary-action"
    index: 0
- waitForAnimationToEnd
# Confirm dialog
- assertVisible: "Publish this listing?"
- assertVisible: "Your listing will be visible to all buyers."
# The dialog's confirm button says "Publish" — and so does the button behind it.
# A bare text tap matched both and hit the scrim, closing the dialog without
# publishing (proven in seller/listing_actions_sheet).
- runFlow: ../_helpers/confirm_dialog.yaml
- waitForAnimationToEnd
# Status changed to Active
# extendedWaitUntil, not assertVisible: this is a TOAST. It lives ~3s, so a
# single check right after an action is a race — and any wait in front of it
# loses that race, turning a successful action red. Polling keeps the check at
# full strength while removing the timing dependency.
- extendedWaitUntil:
    visible: "Listing published!"
    timeout: 15000
- assertVisible: "Active"
