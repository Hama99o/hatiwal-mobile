appId: com.hatiwal.app
---
# Edit listing: update title, description, price, condition, category — all persisted

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# "Edit" is an item INSIDE the More sheet (useListingLifecycle `moreActions`,
# key "edit", label common.edit) — it is not on the detail screen, so scrolling
# the page cannot reach it. Open the sheet first.
# The LIST-side route. `lifecycle-more-action` exists only on MyListingDetail
# (MyListingDetail.tsx:553), and this flow never opens a listing — it goes straight
# from My Shop's list to scrolling for a detail-screen control, so the scroll ran its
# full 20s and reported "No visible element found" for something that was never on this
# screen.
#
# gallery/listing_edit_add_photos.yaml already has the working route from here, and it
# is shorter: the card's own ⋮ opens the same actions. Both taps by testID — the text
# "Edit" is one word in a sheet of similar ones.
- scrollUntilVisible:
    element:
      id: "seller-listing-card"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "seller-card-more-action"
    index: 0
- waitForAnimationToEnd
- tapOn:
    id: "listing-action-edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# Update title
# The INPUT by testID, not the label. "Title" / "Description" / "Price" are
# non-interactive Text labels above their fields, so tapping one focuses
# nothing and the inputText that follows goes nowhere. A testID also works when
# the field already HAS a value (draft restore, edit), where the placeholder is
# no longer on screen.
- tapOn:
    id: "listing-form-title-input"
- eraseText
- inputText: "Updated Title Deep Test"

# Update description
# The INPUT by testID — see the note on the title field.
- tapOn:
    id: "listing-form-description-input"
- eraseText
- inputText: "Updated description for deep test."

# Update price
# The INPUT by testID — see the note on the title field.
- tapOn:
    id: "listing-form-price-input"
- eraseText
- inputText: "99000"

# Change condition
# `listing.condition.like_new` = "Like new" — lower-case n. Maestro matching is
# case-sensitive, so the shouted version matched nothing.
- tapOn: "Like new"
- waitForAnimationToEnd

# Change category
- tapOn: "Category"
- waitForAnimationToEnd
- tapOn: "Vehicles"
- waitForAnimationToEnd

# Save
# "Save", not "Save Changes". No such string exists in the locale files: editing a
# PUBLISHED listing submits through `common.save` = "Save" (ListingForm.tsx, the
# onSavePublished button). The only near neighbours are listing.form.saveDraft
# ("Save Draft") and the toast listing.form.saved ("Changes saved") — which this flow
# asserts afterwards, and which is probably where "Save Changes" came from.
- tapOn: "Save"
- waitForAnimationToEnd
# extendedWaitUntil, not assertVisible: this is a TOAST from toast.success in
# ListingForm.tsx and it lives a few seconds. A plain assert races that window and
# loses under load — which is how create_listing_draft_restore failed here, with the
# draft itself created correctly. extendedWaitUntil polls, so it can only ever wait
# longer, never less.
# ("Offer accepted"/"Offer declined" are NOT converted: those strings are also the
# offer bubble's own outcome label, so they are durable rather than transient.)
- extendedWaitUntil:
    visible: "Changes saved"
    timeout: 15000

# Verify on detail
- assertVisible: "Updated Title Deep Test"
- assertVisible: "Updated description for deep test."
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*99,000"
# `listing.condition.like_new` = "Like new" — lower-case n. Maestro matching is
# case-sensitive, so the shouted version matched nothing.
- assertVisible: "Like new"
- assertVisible: "Vehicles"
