appId: com.hatiwal.app
---
# Edit listing: update title, description, price, condition, category — all persisted

- runFlow: ../_helpers/login_seller.yaml
- tapOn: "My Shop"
- waitForAnimationToEnd
# Open edit on first listing
# Below the fold: `tapOn` never scrolls to its target, and both the profile screen
# (stats, quick actions, settings, sign out) and a listing's owner detail (photo,
# description, views chart, action row) are taller than a phone.
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 20000
- tapOn: "Edit"
- waitForAnimationToEnd
- assertVisible: "Edit Listing"

# Update title
- tapOn: "Title"
- eraseText
- inputText: "Updated Title Deep Test"

# Update description
- tapOn: "Description"
- eraseText
- inputText: "Updated description for deep test."

# Update price
- tapOn: "Price"
- eraseText
- inputText: "99000"

# Change condition
# `listing.condition.like_new` = "Like new" — lower-case n. Maestro matching is
# case-sensitive, so the shouted version matched nothing.
- tapOn: "Like new"
- waitForAnimationToEnd

# Change category
- tapOn: "Category"
- waitForAnimationToEnd
- tapOn: "Vehicles"
- waitForAnimationToEnd

# Save
- tapOn: "Save Changes"
- waitForAnimationToEnd
- assertVisible: "Changes saved"

# Verify on detail
- assertVisible: "Updated Title Deep Test"
- assertVisible: "Updated description for deep test."
# Amounts are rendered by Intl with style:"currency", so the element text is
# "AFN 3,000" — with a NON-BREAKING space (U+00A0), seen in a device hierarchy
# dump as "AFN\xa028,000". Maestro matches an anchored regex, so a bare number
# never matches; the leading `.*` covers both the currency code and that space.
- assertVisible: ".*99,000"
# `listing.condition.like_new` = "Like new" — lower-case n. Maestro matching is
# case-sensitive, so the shouted version matched nothing.
- assertVisible: "Like new"
- assertVisible: "Vehicles"
