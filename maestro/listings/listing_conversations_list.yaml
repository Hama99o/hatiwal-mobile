appId: com.hatiwal.app
---
# Seller views all conversations for a specific listing (listing-conversations screen)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
# Tap the "chats" count link on a listing card that has conversations
# The seller home tab is labelled "My Shop" (sidebar.myListings).
- assertVisible: "My Shop"
# NOT "chats". The seller card renders listing.conversationsCount =
# "{{count}} chats", so the node reads "3 chats" and an anchored full-string match
# on the bare word matches nothing. Leading wildcard covers whatever the count is.
- tapOn:
    text: ".*chats"
    index: 0
- waitForAnimationToEnd
# Listing conversations screen opens
- assertVisible: "Messages"
# Should show conversation threads for this listing
# Tap into a conversation
# A bare `tapOn: index:` has NO selector: it matches every element on screen and
# index N is whatever lands there in hierarchy order, not the thing meant.
- tapOn:
    id: "conversation-row-\\d+"
    index: 0
- waitForAnimationToEnd
# Opens the conversation thread
- assertVisible: "Type a message..."
# Go back to listing conversations
- back
- waitForAnimationToEnd
- assertVisible: "Messages"
