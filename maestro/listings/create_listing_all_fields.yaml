appId: com.hatiwal.app
---
# Create listing: fill every field (title, desc, price, condition, category, location, photo)

- runFlow: ../_helpers/login_seller.yaml
- tapOn:
    id: "browse-tab"
- waitForAnimationToEnd
- tapOn: "Post a listing"
- waitForAnimationToEnd
- assertVisible: "Create Listing"

# Photo first
- tapOn: "Add Photos"
- waitForAnimationToEnd
# The helper carries the tolerant picker selectors plus Android's "Add (N)" confirm
# button, without which the picker never returns a photo. The bare index tap it
# replaces had no selector at all.
- runFlow: ../_helpers/attach_photo_from_gallery.yaml
- assertVisible: "Cover"

# Title
# The INPUT by testID, not the label. "Title" / "Description" / "Price" are
# non-interactive Text labels above their fields, so tapping one focuses
# nothing and the inputText that follows goes nowhere. A testID also works when
# the field already HAS a value (draft restore, edit), where the placeholder is
# no longer on screen.
- tapOn:
    id: "listing-form-title-input"
- inputText: "Samsung Galaxy S22 Used"

# Description
# The INPUT by testID — see the note on the title field.
- tapOn:
    id: "listing-form-description-input"
- inputText: "Excellent condition, minor scratches on back. All accessories included."

# Price
# The INPUT by testID — see the note on the title field.
- tapOn:
    id: "listing-form-price-input"
- inputText: "18000"

# Currency — default is AFN, switch to USD
- tapOn: "AFN"
- waitForAnimationToEnd
- tapOn: "USD"
- waitForAnimationToEnd

# Category
# The category FIELD is tapped by its placeholder, "Tap to select category"
# (listing.form.selectCategoryPlaceholder). "Category" is not a label the form
# renders, so this never opened the picker.
# The category field sits below title and price, and the numeric keypad from the
# price field covers the lower half of the form — so it needs a scroll, not a bare
# tap on an element that is merely off-screen.
- scrollUntilVisible:
    element:
      text: "Tap to select category"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to select category"
- waitForAnimationToEnd
- tapOn: "Electronics"
- waitForAnimationToEnd
# Then a LEAF. Every one of the 16 top-level categories has children, so
# tapping "Electronics" DRILLS IN and selects nothing — the picker sheet stays
# open over the form and every later step acts on a covered screen.
- tapOn: "Phones & Tablets"
- waitForAnimationToEnd

# Condition
# Conditions are brand_new / like_new / good / fair — "Used" is not one of them.
- tapOn: "Good"
- waitForAnimationToEnd

# Location
# "Location" is a non-interactive label. The row that opens the map is
# `listing.form.tapToSetLocation` = "Tap to set exact location on map".
- scrollUntilVisible:
    element:
      text: "Tap to set exact location on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Tap to set exact location on map"
- waitForAnimationToEnd
- tapOn: "Kabul"
- waitForAnimationToEnd

# Post listing
# The publish button reads "Publish" (listing.publish). "Post a listing" is the
# ENTRY POINT into the form (listing.postListing) — a different control.
# Dismiss the IME. A SCROLL DOES NOT: it moves content, and scrollUntilVisible
# stops as soon as the target is in the hierarchy, which can still be behind the
# keyboard. Maestro then reports the tap COMPLETED while the touch lands on the
# keyboard — register_duplicate_email submitted nothing at all, and the Rails log
# showed no register POST for the whole run.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Publish"
- waitForAnimationToEnd
# Publishing lands on the owner detail with PublishSuccessSheet.
# "Listing posted" was removed along with the old card (TASK-J952); this matches
# full_marketplace_cycle.yaml, which was already corrected.
- assertVisible: "Your listing is live!"

# Shows in My Listings
- assertVisible: "Samsung Galaxy S22 Used"
- assertVisible: "Active"
