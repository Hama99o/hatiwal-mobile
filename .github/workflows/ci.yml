name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jest unit/integration suite (API modules, shared components, screen logic).
  # This is the net that catches regressions like a broken save toggle before
  # they ship — 1100+ tests, MSW-mocked so no network is required.
  #
  # NOTE (tech debt, tracked separately): lint + typecheck are intentionally NOT
  # in CI yet — the repo has no ESLint config and ~7 pre-existing TypeScript
  # errors (SavedSearches / ListingForm / Profile). Add those steps once an
  # eslint.config is added and the existing type errors are cleaned up.
  test:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 20: Expo SDK 54 + Metro's toReversed() require Node >= 20.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # --legacy-peer-deps: the RN/Expo/react-native-reusables peer graph has
      # intentional version skews npm's strict peer resolver rejects.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (Jest)
        run: npm test
