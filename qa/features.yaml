# ─────────────────────────────────────────────────────────────────────────
# Hatiwal mobile — QA feature manifest
#
# The single source of truth for "what does it mean to QA feature X deeply".
# Every feature binds together all three test layers (docs/TESTING.md) plus
# the backend endpoints it depends on, so one command can prove a feature
# works end to end instead of only running YAML.
#
#   qa.sh feature chat      → deep pass on chat only
#   qa.sh smoke             → every feature's `smoke` flows (fast signal)
#   qa.sh all               → every flow of every feature
#
# `smoke` flows are the 1-3 cheapest flows that would break FIRST if the
# feature were broken at all. Keep that list short — it is the signal used
# to decide whether a deep run is even worth starting.
# ─────────────────────────────────────────────────────────────────────────

features:
  auth:
    title: "Sign up, login, logout, session persistence, guest gating"
    flows: auth
    smoke: [login, session_persist]
    jest: ["src/api/__tests__/auth*", "src/screens/shared/__tests__/*ogin*",
           "src/components/common/__tests__/ConfirmEmailBanner*"]
    api: ["/auth/sign_in", "/auth", "/auth/sign_out", "/users/me",
          "/auth/confirmation"]
    # auth flows own their login — they must NOT reuse _helpers/login.yaml
    self_login: true

  onboarding:
    title: "First-run experience"
    flows: onboarding
    smoke: [first_run]
    jest: ["src/screens/shared/onboarding/__tests__/*"]
    api: []
    self_login: true

  browse:
    # Sell Flow Redesign (docs/SELL_FLOW_REDESIGN.md, card #296/SF-QA1): a
    # `reserved` listing is no longer a dead end here — SF-B1/SF-M3 keep it in
    # search/the feed and message-able (Offer stays paused, Message does not),
    # and SF-M4 adds "N in stock · M held" transparency to a multi-unit
    # batch's stock pill. `Listing.browsable` widened, so Browse/Search/Saved
    # are in the blast radius even though nobody edited those screens.
    title: "Buyer browse, search, filters, sort, listing detail, seller profile — a reserved listing stays searchable + messageable, and a held batch shows its hold"
    flows: browse
    smoke: [browse_listings, listing_detail, search_listings]
    jest: ["src/api/__tests__/listings*", "src/screens/buyer/__tests__/*", "src/screens/shared/listing-detail/__tests__/*",
           "src/components/common/__tests__/StockBadge*", "src/components/common/__tests__/ListingStatusBanner*"]
    api: ["/listings", "/listings/:id", "/categories", "/users/:id", "/listings/:id/conversations"]

  listings:
    # SF-M1: the DB keeps 4 statuses, but the seller UI presents 3 states —
    # Draft / Live (active OR reserved, with a hold badge) / Sold. "Mark sold"
    # is the one-tap primary from ANY live listing; there is no more
    # "Mark as Reserved" step and no more "Reserved" tab in My Listings (a
    # held listing shows under Active). Reserve only exists in chat now (see
    # the `chat` feature below) — this feature owns publish / unpublish /
    # release-hold / renew / delete / the create-time quantity declaration.
    title: "Seller create/edit/delete + the 3-state lifecycle (Draft/Live/Sold) — Mark sold is always the one-tap primary, no Reserved tab"
    flows: listings
    smoke: [create_listing, my_listings_filter_tabs, lifecycle_publish]
    jest: ["src/screens/seller/listing-form/__tests__/*", "src/screens/seller/my-listings/__tests__/*",
           "src/hooks/__tests__/useListingLifecycle*", "src/components/common/__tests__/QuantityStepper*"]
    api: ["/listings", "/listings/:id", "/listings/:id/publish", "/listings/:id/reserve",
          "/listings/:id/sold", "/listings/:id/activate"]

  maps:
    title: "Location pickers — create-listing pin, Browse filter range, current location, permissions"
    flows: maps
    smoke: [filter_map_default_kabul, create_listing_map_pin]
    jest: ["src/components/common/__tests__/LocationRangePicker*"]
    api: ["/listings"]

  gallery:
    title: "Listing photo upload, carousel, reorder, empty-photo state"
    flows: gallery
    smoke: [listing_gallery_swipe]
    jest: ["src/components/common/__tests__/*allery*", "src/components/common/__tests__/*arousel*"]
    api: ["/listings/:id/images"]
    # Photo flows need a picker-seeded image on the device
    needs_media: true

  chat:
    # SF-M2: a hold is placed FROM the thread now, not the listing — the
    # composer's "+" menu grows a seller-only "Place a hold for {name}" /
    # "Release hold" pair (ComposerActionsSheet), scoped to whichever buyer
    # the seller is already talking to (BuyerPickerSheet's confirm mode, the
    # same mechanism reserveAfterAccept.ts already proved for the
    # offer-accept trigger). The pinned ListingHeader's inline pill drops its
    # old showReserve/showMarkSold toggle — it is ALWAYS "Mark Sold" for the
    # owner of a Live listing now. SF-M3: reserved is no longer a chat dead
    # end (sold-only from here on) and a held conversation is no longer
    # dimmed in the inbox.
    title: "Conversations, messages, offers, meetup arrangement, read state — mark-sold one-tap from the thread, place/release a hold with the buyer you're already talking to"
    flows: chat
    smoke: [conversations_list, send_message, start_conversation]
    jest: ["src/api/__tests__/*conversation*", "src/api/__tests__/*message*", "src/screens/chat/**/__tests__/*",
           "src/screens/chat/conversation/__tests__/ListingHeader*", "src/screens/chat/conversation/__tests__/ComposerActionsSheet*",
           "src/screens/chat/conversation/__tests__/threadAvailability*", "src/screens/chat/conversations/__tests__/ConversationRow*"]
    api: ["/conversations", "/conversations/:id/messages", "/offers", "/meetups",
          "/listings/:id/reserve", "/listings/:id/sold", "/listings/:id/activate"]

  saved:
    title: "Save / unsave a listing, saved tab, sold-while-saved"
    flows: saved
    smoke: [save_listing, saved_empty_state]
    jest: ["src/api/__tests__/*saved*"]
    api: ["/saved_listings"]

  seller:
    # SF-M1/SF-M5: "Mark sold" is the one-tap primary from any live listing —
    # never a "reserve first" step, and BuyerPickerSheet's own Confirm is the
    # confirmation (no separate dialog). The Sales ledger ("View sales") is
    # new here: every sold row is editable (quantity, buyer) and voidable,
    # stock restores on void, a reviewed sale refuses void/reassign but still
    # allows a quantity fix (422 sale_has_review), and an outside-Hatiwal sale
    # gets its own nil-safe row. Marking sold also offers an immediate "Undo"
    # on the toast — same DELETE the ledger's own row Delete calls.
    title: "One-tap Mark sold from any live listing (never reserve-first) + the Sales ledger (edit/void a row, reviewed-sale refusal, outside-buyer rows, undo-after-sold)"
    flows: seller
    smoke: [publish_success, listing_actions_sheet, sell_without_reserving]
    jest: ["src/screens/seller/__tests__/*", "src/screens/seller/listing-sales/__tests__/*",
           "src/api/__tests__/transactions*", "src/components/common/__tests__/BuyerPickerSheet*",
           "src/components/common/__tests__/SaleBuyerCard*"]
    api: ["/listings/:id/publish", "/listings/:id/sold", "/listings/:id/reserve",
          "/listings/:id/activate", "/my/transactions", "/my/transactions/:id"]

  mode:
    title: "Buyer ↔ seller mode switch, tab bar, persistence"
    flows: mode
    smoke: [mode_switcher]
    jest: ["src/stores/__tests__/*mode*", "src/hooks/__tests__/*mode*"]
    api: []

  profile:
    title: "Profile view/edit, language + theme switch, stats, blocked users"
    flows: profile
    smoke: [profile_stats_verify, edit_profile]
    jest: ["src/screens/shared/profile/__tests__/*", "src/screens/shared/user-profile/__tests__/*"]
    api: ["/users/me", "/users/:id", "/blocks"]

  report:
    title: "Report a listing or user, block, block side-effects"
    flows: report
    smoke: [report_listing, block_user]
    jest: ["src/api/__tests__/*report*", "src/api/__tests__/*block*"]
    api: ["/reports", "/blocks"]

  reviews:
    title: "Double-blind reviews after a sold transaction"
    flows: reviews
    smoke: [profile_reviews_empty_state]
    jest: ["src/api/__tests__/*review*"]
    api: ["/reviews", "/reviews/pending"]

  safety:
    title: "Safety tips on listing detail and in the meetup sheet"
    flows: safety
    smoke: [safety_tips_listing_detail]
    jest: []
    api: []

  share:
    title: "Deep links into a listing and a seller profile"
    flows: share
    smoke: [open_listing_deep_link]
    jest: ["src/lib/__tests__/*link*"]
    api: []
    # Deep links are launched via adb, not a tap — see lib/flows.sh
    deep_link: true

  pagination:
    title: "Infinite scroll across browse, search, saved, chat, my-listings"
    flows: pagination
    smoke: [browse_pagination]
    jest: ["src/api/__tests__/*pagination*", "src/hooks/__tests__/*infinite*"]
    api: ["/listings?page=", "/conversations?page="]
    # Deep-scroll flows are slow; excluded from `smoke` by design
    slow: true

  dark_mode:
    title: "Every main screen in dark theme + theme persistence"
    flows: dark_mode
    smoke: [browse_dark]
    jest: ["src/lib/__tests__/*theme*", "src/stores/__tests__/*theme*"]
    api: []
    # Cross-cutting: re-runs other features' screens under a theme change
    cross_cutting: true

  rtl:
    title: "Pashto + Dari right-to-left layout across main screens"
    flows: rtl
    smoke: [browse_rtl_pashto]
    jest: ["src/lib/__tests__/*i18n*", "src/lib/__tests__/*locale*"]
    api: []
    cross_cutting: true
